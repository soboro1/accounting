<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="160" fill="#0FA18D" opacity="0.14"/>
  <circle cx="1250" cy="660" r="210" fill="#E8543F" opacity="0.14"/>
  <circle cx="680" cy="700" r="110" fill="#2F7DE1" opacity="0.12"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="86" width="280" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="220" y="119" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">簿記1級 | 会計学</text>

  <text x="80" y="246" class="dg" font-size="100" fill="#34D1BA">棚卸資産</text>
  <text x="80" y="350" class="dg" font-size="64" fill="#FFC94A">の</text>
  <text x="150" y="350" class="dg" font-size="72" fill="#FF7A66">出る論点</text>

  <text x="80" y="418" font-size="28" font-weight="700" fill="#fff" opacity="0.95">減耗・評価損・売価還元法を図と仕訳で</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="452" width="176" height="50" rx="25" fill="#fff"/>
    <text x="168" y="485" fill="#0A6E61">箱の図で解く</text>
    <rect x="270" y="452" width="164" height="50" rx="25" fill="#fff"/>
    <text x="352" y="485" fill="#8A6000">計算問題2問</text>
    <rect x="448" y="452" width="150" height="50" rx="25" fill="#fff"/>
    <text x="523" y="485" fill="#A8205C">○×55問</text>
  </g>

  <text x="80" y="572" font-size="20" font-weight="500" fill="#fff" opacity="0.8">図解つき・登録不要の無料Webページ</text>

  <!-- 右:減耗損と評価損の箱の図 -->
  <text x="1010" y="112" text-anchor="middle" class="dg" font-size="26" fill="#fff">期末評価は「箱の図」で解く</text>

  <g filter="url(#shadow)">
    <rect x="880" y="160" width="230" height="96" fill="#D9367D"/>
    <rect x="880" y="256" width="230" height="250" fill="#0FA18D"/>
    <rect x="1110" y="160" width="84" height="346" fill="#F07C1E"/>
  </g>
  <path d="M880 140 V506 H1214" stroke="#fff" stroke-width="3" fill="none"/>

  <text x="995" y="202" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">② 商品評価損</text>
  <text x="995" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" opacity="0.92">実地数量 × 下落額</text>
  <text x="995" y="372" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">貸借対照表</text>
  <text x="995" y="402" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" opacity="0.92">実地 × 正味売却価額</text>
  <text x="1152" y="318" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">①</text>
  <text x="1152" y="350" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">減耗損</text>

  <g font-size="18" font-weight="700" fill="#fff" text-anchor="end" opacity="0.9">
    <text x="868" y="167">原価</text>
    <text x="868" y="263">正味売却価額</text>
  </g>
  <g font-size="18" font-weight="700" fill="#fff" text-anchor="middle" opacity="0.9">
    <text x="1110" y="536">実地</text>
    <text x="1194" y="536">帳簿</text>
  </g>
  <path d="M1110 506 V514 M1194 506 V514" stroke="#fff" stroke-width="3"/>

  <text x="1010" y="600" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">表示区分・洗替と切放・後入先出法の廃止</text>
</svg>
