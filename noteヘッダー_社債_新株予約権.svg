<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#fff" fill-opacity="0.8"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="160" fill="#2F7DE1" opacity="0.16"/>
  <circle cx="1250" cy="660" r="210" fill="#E8543F" opacity="0.14"/>
  <circle cx="680" cy="700" r="110" fill="#0FA18D" opacity="0.12"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="86" width="280" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="220" y="119" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">簿記1級 | 会計学</text>

  <text x="80" y="236" class="dg" font-size="96" fill="#5BA2FF">社債</text>
  <text x="286" y="236" class="dg" font-size="56" fill="#FFC94A">と</text>
  <text x="80" y="332" class="dg" font-size="84" fill="#FF7A66">新株予約権</text>

  <text x="80" y="408" font-size="28" font-weight="700" fill="#fff" opacity="0.95">の出る論点を、図と仕訳で</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="446" width="176" height="50" rx="25" fill="#fff"/>
    <text x="168" y="479" fill="#1D5DB3">償却原価法</text>
    <rect x="270" y="446" width="164" height="50" rx="25" fill="#fff"/>
    <text x="352" y="479" fill="#8A6000">計算問題2問</text>
    <rect x="448" y="446" width="150" height="50" rx="25" fill="#fff"/>
    <text x="523" y="479" fill="#A8205C">○×49問</text>
  </g>

  <text x="80" y="572" font-size="20" font-weight="500" fill="#fff" opacity="0.8">図解つき・登録不要の無料Webページ</text>

  <!-- 右:新株予約権の行き先 -->
  <text x="1000" y="112" text-anchor="middle" class="dg" font-size="26" fill="#fff">新株予約権の行き先</text>

  <g filter="url(#shadow)">
    <rect x="790" y="206" width="170" height="136" rx="18" fill="#E8543F"/>
    <rect x="1010" y="146" width="200" height="104" rx="18" fill="#2F7DE1"/>
    <rect x="1010" y="298" width="200" height="104" rx="18" fill="#E3A300"/>
  </g>
  <text x="875" y="266" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">新株予約権</text>
  <text x="875" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" opacity="0.92">純資産</text>
  <text x="875" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" opacity="0.85">（株主資本以外）</text>

  <path d="M960 250 L1004 212" stroke="#fff" stroke-opacity="0.8" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M960 298 L1004 336" stroke="#fff" stroke-opacity="0.8" stroke-width="3" fill="none" marker-end="url(#ah)"/>

  <text x="1110" y="190" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">行使</text>
  <text x="1110" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" opacity="0.95">→ 資本金・資本準備金</text>
  <text x="1110" y="342" text-anchor="middle" font-size="22" font-weight="900" fill="#1B1600">失効</text>
  <text x="1110" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1600">→ 新株予約権戻入益</text>

  <rect x="790" y="436" width="420" height="52" rx="26" fill="#fff" fill-opacity="0.10" stroke="#5BA2FF" stroke-width="2"/>
  <text x="1000" y="469" text-anchor="middle" font-size="19" font-weight="900" fill="#fff">社債の償還損益は「帳簿価額 − 支払額」</text>

  <text x="1000" y="566" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">新株予約権付社債の一括法・区分法</text>
  <text x="1000" y="598" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">ストック・オプション</text>
</svg>
