<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="160" fill="#E8543F" opacity="0.14"/>
  <circle cx="1250" cy="660" r="210" fill="#2F7DE1" opacity="0.16"/>
  <circle cx="680" cy="700" r="110" fill="#0FA18D" opacity="0.12"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="86" width="280" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="220" y="119" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">簿記1級 | 会計学</text>

  <text x="80" y="236" class="dg" font-size="84" fill="#FF7A66">ソフトウェア</text>
  <text x="80" y="332" class="dg" font-size="76" fill="#5BA2FF">研究開発費</text>

  <text x="80" y="408" font-size="28" font-weight="700" fill="#fff" opacity="0.95">の出る論点を、図と仕訳で</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="446" width="190" height="50" rx="25" fill="#fff"/>
    <text x="175" y="479" fill="#B23726">大きい方で償却</text>
    <rect x="284" y="446" width="164" height="50" rx="25" fill="#fff"/>
    <text x="366" y="479" fill="#8A6000">計算問題3問</text>
    <rect x="462" y="446" width="150" height="50" rx="25" fill="#fff"/>
    <text x="537" y="479" fill="#A8205C">○×48問</text>
  </g>

  <text x="80" y="572" font-size="20" font-weight="500" fill="#fff" opacity="0.8">図解つき・登録不要の無料Webページ</text>

  <!-- 右:製品マスターの完成で線を引く -->
  <text x="1000" y="112" text-anchor="middle" class="dg" font-size="26" fill="#fff">製品マスターの完成で線を引く</text>

  <g filter="url(#shadow)">
    <rect x="790" y="146" width="160" height="200" rx="18" fill="#2F7DE1"/>
    <rect x="1000" y="146" width="210" height="60" rx="14" fill="#E8543F"/>
    <rect x="1000" y="216" width="210" height="60" rx="14" fill="#2F7DE1"/>
    <rect x="1000" y="286" width="210" height="60" rx="14" fill="#6B7194"/>
  </g>
  <text x="870" y="232" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">完成まで</text>
  <text x="870" y="266" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" opacity="0.92">研究開発費</text>

  <path d="M975 132 V360" stroke="#FFC94A" stroke-width="5"/>
  <circle cx="975" cy="246" r="12" fill="#FFC94A"/>
  <text x="975" y="388" text-anchor="middle" font-size="17" font-weight="900" fill="#FFC94A">最初の製品マスター完成</text>

  <text x="1105" y="172" text-anchor="middle" font-size="17" font-weight="900" fill="#fff">機能の改良・強化</text>
  <text x="1105" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" opacity="0.92">→ 無形固定資産</text>
  <text x="1105" y="242" text-anchor="middle" font-size="17" font-weight="900" fill="#fff">著しい改良</text>
  <text x="1105" y="265" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" opacity="0.92">→ 研究開発費</text>
  <text x="1105" y="312" text-anchor="middle" font-size="17" font-weight="900" fill="#fff">バグ取り・機能維持</text>
  <text x="1105" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" opacity="0.92">→ 発生時の費用</text>

  <rect x="790" y="420" width="420" height="56" rx="28" fill="#fff" fill-opacity="0.10" stroke="#FF7A66" stroke-width="2"/>
  <text x="1000" y="456" text-anchor="middle" font-size="19" font-weight="900" fill="#fff">償却：見込販売数量 と 均等配分額 の大きい方</text>

  <text x="1000" y="580" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">研究開発費はすべて発生時の費用</text>
  <text x="1000" y="612" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">自社利用は定額法・5年以内</text>
</svg>
