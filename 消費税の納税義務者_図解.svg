<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5D78"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F6FEB"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; }
    .title { font-size: 44px; font-weight: 800; fill: #1F3A5F; }
    .sub { font-size: 24px; fill: #4A5D78; }
    .head { font-size: 25px; font-weight: 800; fill: #1F3A5F; }
    .bar { font-size: 23px; font-weight: 800; fill: #FFFFFF; }
    .under { font-size: 20px; font-weight: 700; fill: #1F3A5F; }
    .underSmall { font-size: 17px; fill: #4A5D78; }
    .tag { font-size: 18px; font-weight: 800; fill: #FFFFFF; }
    .q { font-size: 22px; font-weight: 700; fill: #1F3A5F; }
    .hint { font-size: 16px; fill: #4A5D78; }
    .yn { font-size: 17px; font-weight: 800; }
    .emoji { font-family: "Apple Color Emoji", sans-serif; }
    .fTitle { font-size: 25px; font-weight: 800; fill: #1F3A5F; }
    .fLine { font-size: 21px; fill: #1F3A5F; }
    .jl { font-size: 19px; font-weight: 800; }
    .mono { font-size: 21px; fill: #1F3A5F; }
  </style>

  <rect width="1600" height="900" fill="#F5F8FC"/>

  <!-- タイトル -->
  <text x="800" y="70" text-anchor="middle" class="title">消費税を納める人はだれ？ ― 「前の年の売上」で決まる</text>
  <text x="800" y="113" text-anchor="middle" class="sub">売上が小さいお店は納めなくてOK（免税事業者）。その判定は「今年」ではなく「前の年」の数字で行う</text>

  <!-- ===== タイムライン ===== -->
  <rect x="60" y="135" width="1480" height="210" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="100" y="176" class="head">いつの数字を見る？</text>

  <rect x="100" y="196" width="460" height="60" rx="14" fill="#1F6FEB"/>
  <text x="330" y="235" text-anchor="middle" class="bar">2年前 ＝ 基準期間</text>
  <rect x="580" y="196" width="220" height="60" rx="14" fill="#16A34A"/>
  <text x="690" y="235" text-anchor="middle" class="bar" style="font-size:20px">1年前の前半6か月</text>
  <rect x="806" y="196" width="214" height="60" rx="14" fill="#E2E8F0"/>
  <text x="913" y="235" text-anchor="middle" class="bar" style="font-size:20px;fill:#4A5D78">1年前の後半</text>
  <rect x="1040" y="196" width="460" height="60" rx="14" fill="#7C3AED"/>
  <text x="1270" y="235" text-anchor="middle" class="bar">今年 ＝ 判定する年</text>

  <text x="330" y="292" text-anchor="middle" class="under">質問1：この1年の売上を見る</text>
  <text x="330" y="322" text-anchor="middle" class="underSmall">個人は前々年、会社は前々事業年度</text>
  <text x="690" y="292" text-anchor="middle" class="under">質問2：特定期間</text>
  <text x="690" y="322" text-anchor="middle" class="underSmall">（個人なら1〜6月）</text>
  <text x="913" y="292" text-anchor="middle" class="underSmall">ここは使わない</text>
  <text x="1270" y="292" text-anchor="middle" class="under">納める？ 納めない？</text>
  <text x="1270" y="322" text-anchor="middle" class="underSmall">今年の売上は年末までわからないから、前の年で決めておく</text>

  <!-- ===== 判定の流れ ===== -->
  <!-- 質問1 -->
  <rect x="60" y="370" width="330" height="180" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <rect x="185" y="386" width="80" height="32" rx="16" fill="#1F3A5F"/>
  <text x="225" y="409" text-anchor="middle" class="tag">質問1</text>
  <text x="225" y="452" text-anchor="middle" class="q">2年前（基準期間）の</text>
  <text x="225" y="482" text-anchor="middle" class="q">売上は1,000万円より</text>
  <text x="225" y="512" text-anchor="middle" class="q">多い？</text>
  <text x="225" y="538" text-anchor="middle" class="hint">（税ぬきの課税売上高で見る）</text>

  <!-- 質問2 -->
  <rect x="442" y="370" width="330" height="180" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <rect x="567" y="386" width="80" height="32" rx="16" fill="#1F3A5F"/>
  <text x="607" y="409" text-anchor="middle" class="tag">質問2</text>
  <text x="607" y="452" text-anchor="middle" class="q">去年の前半6か月で</text>
  <text x="607" y="482" text-anchor="middle" class="q">売上も給料も</text>
  <text x="607" y="512" text-anchor="middle" class="q">1,000万円より多い？</text>
  <text x="607" y="538" text-anchor="middle" class="hint">（両方こえたら「はい」）</text>

  <!-- 質問3 -->
  <rect x="824" y="370" width="330" height="180" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <rect x="949" y="386" width="80" height="32" rx="16" fill="#1F3A5F"/>
  <text x="989" y="409" text-anchor="middle" class="tag">質問3</text>
  <text x="989" y="452" text-anchor="middle" class="q">自分から手をあげた？</text>
  <text x="989" y="482" text-anchor="middle" class="q">または、資本金1,000万円</text>
  <text x="989" y="512" text-anchor="middle" class="q">以上の新しい会社？</text>
  <text x="989" y="538" text-anchor="middle" class="hint">（インボイス登録・選択届出など）</text>

  <!-- 横の矢印（いいえ） -->
  <text x="416" y="446" text-anchor="middle" class="yn" fill="#16A34A" style="font-size:15px">いいえ</text>
  <line x1="392" y1="460" x2="438" y2="460" stroke="#4A5D78" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="798" y="446" text-anchor="middle" class="yn" fill="#16A34A" style="font-size:15px">いいえ</text>
  <line x1="774" y1="460" x2="820" y2="460" stroke="#4A5D78" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1180" y="446" text-anchor="middle" class="yn" fill="#16A34A" style="font-size:15px">いいえ</text>
  <line x1="1156" y1="460" x2="1202" y2="460" stroke="#4A5D78" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 下向きの矢印（はい） -->
  <line x1="225" y1="553" x2="225" y2="594" stroke="#1F6FEB" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="240" y="580" class="yn" fill="#1F6FEB">はい</text>
  <line x1="607" y1="553" x2="607" y2="594" stroke="#1F6FEB" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="622" y="580" class="yn" fill="#1F6FEB">はい</text>
  <line x1="989" y1="553" x2="989" y2="594" stroke="#1F6FEB" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="1004" y="580" class="yn" fill="#1F6FEB">はい</text>

  <!-- 課税事業者 -->
  <rect x="60" y="600" width="1094" height="90" rx="20" fill="#EEF4FF" stroke="#1F6FEB" stroke-width="3"/>
  <text x="100" y="658" class="emoji" style="font-size:38px">🧾</text>
  <text x="155" y="658" style="font-size:31px;font-weight:800;fill:#1F6FEB">課税事業者</text>
  <text x="345" y="657" style="font-size:23px;fill:#1F3A5F">＝ 消費税を計算して、申告して、<tspan font-weight="800">国に納める人</tspan></text>

  <!-- 免税事業者 -->
  <rect x="1206" y="370" width="330" height="320" rx="24" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/>
  <path d="M1206,394 a24,24 0 0 1 24,-24 h282 a24,24 0 0 1 24,24 v38 h-330 z" fill="#16A34A"/>
  <text x="1371" y="414" text-anchor="middle" style="font-size:30px;font-weight:800;fill:#FFFFFF">免税事業者</text>
  <text x="1371" y="505" text-anchor="middle" class="emoji" style="font-size:56px">🙆</text>
  <text x="1371" y="562" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#16A34A">消費税を</text>
  <text x="1371" y="598" text-anchor="middle" style="font-size:27px;font-weight:800;fill:#16A34A">納めなくてOK</text>
  <text x="1371" y="642" text-anchor="middle" class="hint" style="font-size:17px">※インボイスは出せない</text>
  <text x="1371" y="668" text-anchor="middle" class="hint" style="font-size:17px">（買った人が税を引けない）</text>

  <!-- ===== 下のカード ===== -->
  <rect x="60" y="710" width="1480" height="175" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="100" y="752" class="fTitle">数字と言葉のおぼえ方</text>
  <text x="100" y="792" class="fLine">・<tspan font-weight="800" fill="#1F6FEB">1,000万円</tspan> → 納めるかどうかの線</text>
  <text x="100" y="826" class="fLine">・<tspan font-weight="800" fill="#1F6FEB">2年前</tspan> ＝ 基準期間、<tspan font-weight="800" fill="#16A34A">去年の前半6か月</tspan> ＝ 特定期間</text>
  <text x="100" y="860" class="fLine">・<tspan font-weight="800">できたばかりの会社</tspan>も、質問2・3で課税になることがある</text>

  <line x1="890" y1="735" x2="890" y2="865" stroke="#C9D6E8" stroke-width="2"/>

  <text x="925" y="752" class="fTitle">仕訳で見ると（税こみ1,100円で売ったとき）</text>
  <text x="925" y="794" class="jl" fill="#1F6FEB">課税事業者</text>
  <text x="1060" y="794" class="mono">(借) 現金</text>
  <text x="1235" y="794" text-anchor="end" class="mono" font-weight="800">1,100</text>
  <text x="1270" y="794" class="mono">(貸) 売上</text>
  <text x="1500" y="794" text-anchor="end" class="mono" font-weight="800">1,000</text>
  <text x="1316" y="826" class="mono">仮受消費税</text>
  <text x="1500" y="826" text-anchor="end" class="mono" font-weight="800">100</text>
  <text x="925" y="862" class="jl" fill="#16A34A">免税事業者</text>
  <text x="1060" y="862" class="mono">(借) 現金</text>
  <text x="1235" y="862" text-anchor="end" class="mono" font-weight="800">1,100</text>
  <text x="1270" y="862" class="mono">(貸) 売上</text>
  <text x="1500" y="862" text-anchor="end" class="mono" font-weight="800">1,100</text>
</svg>
