<script>
// 簿記1級 本番の問題の形ごとの「解く手順」
// 1パターン = {id, sub:科目, name:問題の形, when:どんなときに出るか, steps:[[手順, くわしく]], miss:[よくあるミス]}
var PATTERNS = [
  // ===== 商業簿記 =====
  {id:'pl', sub:'商業簿記', name:'決算整理から損益計算書を作る', when:'第161回、第164回、第165回、第167回、第170回など、個別の決算の総合問題で最も多い形',
   steps:[
    ['答案用紙を先に見る', '損益計算書を全部作るのか、金額をいくつか答えるのかを確認する。答えない勘定の計算に時間を使わない'],
    ['試算表にない「未処理事項」を先に処理する', '未処理・誤処理・未達など、決算整理の前提になる修正を先に済ませる。後の計算の出発点が変わるため'],
    ['金額が連動する順番を決める', '換算 → 貸倒引当金、減価償却 → 減損、償却 → 社債の償還 のように、前の処理の結果を使うものを並べる'],
    ['決算整理を1つずつ仕訳にして、試算表の横に書き込む', '勘定ごとに増減を書き込むと、損益計算書の金額がそのまま読める'],
    ['売上原価と販売費及び一般管理費を集計する', '棚卸減耗損と商品評価損をどこに表示するかは問題の指示で決まる'],
    ['営業外損益と特別損益を集計して、税引前当期純利益を出す', '為替差損益は純額で1行にする'],
    ['法人税等と法人税等調整額を最後に計算する', '税効果は指示のある項目だけ。その他有価証券の税効果は法人税等調整額に入れない']],
   miss:['換算する前の売掛金で貸倒引当金を計算する', '減価償却をする前の帳簿価額で減損を判定する', '棚卸減耗損を売上原価に含めてしまう(指示を見落とす)']},
  {id:'bs', sub:'商業簿記', name:'決算整理から貸借対照表を作る', when:'第162回、第168回など。返金負債・契約負債・繰延税金資産の表示が問われやすい',
   steps:[
    ['答案用紙の科目と区分を見る', '流動と固定、表示する科目名(前払費用・未払費用など)を確認する'],
    ['未処理事項と決算整理を仕訳にする', '損益計算書の問題と同じ。勘定の残高を動かす処理をすべて書き出す'],
    ['資産と負債を、流動と固定に分ける', '1年基準:1年以内に期限が来る社債や長期前払費用の一部は流動に'],
    ['評価勘定と相殺を確認する', '貸倒引当金は対応する債権の下に、繰延税金資産と繰延税金負債は相殺して表示する'],
    ['純資産を計算する', '繰越利益剰余金 = 試算表の金額 + 当期純利益。その他有価証券評価差額金は税効果を引いた額'],
    ['貸借の合計が一致するかを確かめる', '一致しても仕訳の金額が正しいとは限らない。写し間違いと足し算の確認に使う']],
   miss:['1年以内に償還する社債を固定負債のままにする', '繰延税金資産と繰延税金負債を相殺せずに両方書く', '繰越利益剰余金に当期純利益を足し忘れる']},
  {id:'renketsu', sub:'商業簿記', name:'連結財務諸表を作る', when:'第171回、第173回と2回続けて出た。第158回、第167回にも一部',
   steps:[
    ['タイムテーブルを書く', '支配獲得日、追加取得・一部売却の日、当期末の資本と持分割合を1本の線に並べる'],
    ['子会社の資産・負債を時価評価する', '評価差額は税効果を引いた額にする'],
    ['開始仕訳を書く', '支配獲得日の投資と資本の相殺に、前期までの利益の配分とのれんの償却を加える'],
    ['当期の連結修正をする', 'のれんの償却、子会社の利益の配分、配当の修正、追加取得・一部売却'],
    ['内部取引と未実現利益を消去する', 'ダウンストリームは親会社が全額負担、アップストリームは非支配株主も負担。税効果も忘れない'],
    ['持分法を適用する', '関連会社の利益の持分、配当、のれん相当額、未実現利益(持分の分だけ)'],
    ['連結財務諸表に集計する', '非支配株主持分 = 期末の子会社の資本 × 持分割合 で確かめる']],
   miss:['追加取得の差額をのれんにする(資本剰余金が正しい)', '追加取得の後も前の持分割合で利益を配分する', '持分法の未実現利益を全額消去する']},
  {id:'honshiten', sub:'商業簿記', name:'本支店会計(合併財務諸表)', when:'本支店の総合問題。未達と内部利益が中心',
   steps:[
    ['未達取引を整理する', '通知が届いていない側だけで仕訳をする'],
    ['支店勘定と本店勘定の一致を確かめる', '一致しなければ、未達の整理に漏れがある'],
    ['期首と期末の内部利益を計算する', '期末は未達の商品も含める。内部利益 = 振替価格 × 利益 ÷(100 + 利益)'],
    ['本店と支店の決算整理をする', '貸倒引当金は未達の整理をしてから計算する'],
    ['本店費用の配賦をする', '合併の金額は変わらず、支店の利益だけが変わる'],
    ['内部取引を消去して、合併財務諸表に集計する', '支店へ売上と本店より仕入、支店勘定と本店勘定を相殺する'],
    ['総合損益で確かめる', '本店の利益 + 支店の利益 + 内部利益の調整 = 合併の税引前当期純利益']],
   miss:['未達の処理を両方の帳簿で行う', '未達の商品に含まれる内部利益を引き忘れる', '内部利益を振替価格の10%で計算する(原価の10%なら10/110)']},
  {id:'zaigai', sub:'商業簿記', name:'在外支店の総合問題', when:'第137回、第147回、第159回に出たと紹介されている形',
   steps:[
    ['勘定ごとに使う為替相場を書き出す', '貨幣項目は決算時、商品・固定資産は取得時、収益・費用は期中平均。例外も確認する'],
    ['支店の決算整理を外貨で行う', '仕訳はドルのまま。換算はその後'],
    ['本店との取引は本店の帳簿の金額にそろえる', '本店勘定、本店より仕入、本店仕入分の商品'],
    ['支店の損益計算書を換算する', '売上原価の期首・期末商品は取得時の相場。減価償却費は資産の取得時の相場'],
    ['支店の貸借対照表を換算し、差額から当期純利益を出す', '損益計算書の利益との差が換算差額(為替差損益)'],
    ['本店の決算整理と内部利益の計算をする', '内部利益は本店の発送額(円)で計算する'],
    ['合併財務諸表に集計する', '支店の換算差額と本店の為替差損益をまとめて1行にする']],
   miss:['減価償却費を期中平均相場で換算する', '換算差額を損益計算書だけで出そうとする', '内部利益をドルで計算する']},
  // ===== 会計学 =====
  {id:'seigo', sub:'会計学', name:'正誤問題', when:'会計学の第1問で多い形',
   steps:[
    ['文の主語(何の論点か)を確認する', '基準のどの部分の話かを先に決める'],
    ['すり替えやすい語に印をつける', '割引前/割引後、損益/純資産、原則/例外、高いほう/低いほう、含める/含めない'],
    ['正しい文を頭の中で言い直す', '印をつけた語を逆にした文と比べる'],
    ['迷ったら理由を一言で言えるかで判断する', '理由が言えない○は、もう一度読み直す'],
    ['時間をかけすぎない', '1問1分を目安に、分からないものは印をつけて後回し']],
   miss:['文の前半だけ読んで○にする', '「原則として」と「例外」を読み飛ばす', '1問に時間をかけて計算問題の時間がなくなる']},
  {id:'riron', sub:'会計学', name:'理論の穴埋め', when:'会計学の第1問・第2問、原価計算基準の穴埋め',
   steps:[

    ['入る語の種類を決める', '名詞か、金額の性質(時価・取得原価など)か、時期か'],
    ['知っている語を先に埋める', '確実なものから埋めると、残りの選択肢が絞れる'],
    ['語群がある場合は、使わない語も確認する', '同じ語を2回使えるかどうかの指示を読む'],
    ['埋めた文を通して読み、意味が通るかを確かめる', '前後の空欄どうしの関係(原則と例外など)もそろえる']],
   miss:['同じ意味の別の語(取得原価と取得価額など)を書いて減点される', '語群の指示(同じ語を何度使えるか)を読まない']},
  {id:'keisan', sub:'会計学', name:'計算の小問', when:'会計学の第2問。収益認識、連結、退職給付などの金額を答える',
   steps:[

    ['時系列を図にする', '取得日、決算日、変更日などを線に並べる'],
    ['必要な仕訳だけを書く', '答えに関係しない処理は書かない'],
    ['数字を当てはめて計算する', '端数処理の指示を確認する'],
    ['別の方法で確かめる', '累計額から前期までを引く、期末残高から逆算する など']],
   miss:['当期の費用と期末の残高を取り違える', '端数処理の指示を見落とす']},
  // ===== 工業簿記 =====
  {id:'sogo', sub:'工業簿記', name:'工程別総合原価計算(仕損・追加材料)', when:'工業簿記の総合問題で多い形',
   steps:[
    ['工程ごとに生産データのボックス図を書く', '月初・当月投入・完成・仕損・月末の数量と加工進捗度'],
    ['材料の投入点と仕損の発生点を、進捗度と見比べる', '投入点に達していない月末仕掛品には、その材料費を配分しない'],

  var qsub = 'all', cur = null, picked = [], order = [], miss = 0;
  $('qsub').innerHTML = '<option value="all">すべて(' + ALL.length + ')</option><option value="todo">まだ正解していない形</option>' + SUBS.map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + '</option>'; }).join('');
  function qpool() { return ALL.filter(function (p) { return qsub === 'all' || (qsub === 'todo' ? !st.clear[p.id] : p.sub === qsub); }); }
  function qstat() { $('qstat').textContent = '一発で正解した形 ' + Object.keys(st.clear).length + ' / ' + ALL.length; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function newQ() {
    var pool = qpool();
    qstat();
    if (!pool.length) { $('qcard').innerHTML = '<p class="qname">すべての形を一発で正解しました</p><p class="qhint">出題を「すべて」に変えると、もう一度解けます。</p>'; return; }
    var cand = pool.filter(function (p) { return !cur || p.id !== cur.id; });
    cur = (cand.length ? cand : pool)[Math.floor(Math.random() * (cand.length ? cand.length : pool.length))];
    picked = []; miss = 0;
    order = shuffle(cur.steps.map(function (s, i) { return i; }));
    drawQ('');
  }
  function drawQ(msg, cls) {
    var done = picked.length === cur.steps.length;
    var h = '<span class="tag">' + esc(cur.sub) + '</span><p class="qname">' + esc(cur.name) + '</p><p class="qhint">解く順番に、下の手順をタップしてください。</p>' +
      '<div class="picked">' + picked.map(function (i, k) { return '<div><span class="num" style="background:' + COL[k] + '">' + (k + 1) + '</span>' + esc(cur.steps[i][0]) + '</div>'; }).join('') + '</div>';
    if (!done) h += '<div class="pool">' + order.filter(function (i) { return picked.indexOf(i) < 0; }).map(function (i) { return '<button type="button" data-i="' + i + '">' + esc(cur.steps[i][0]) + '</button>'; }).join('') + '</div>';
    h += '<p class="qmsg ' + (cls || '') + '" aria-live="polite">' + esc(msg) + '</p>';
    if (done) {
      h += '<h3>手順のくわしい説明</h3>' + stepsHtml(cur) + '<h3>よくあるミス</h3><ul class="miss">' + cur.miss.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>' +
        (EXAMPLES[cur.id] ? '<p class="note">この形には例題と下書きの見本があります。「手順を読む」で確認できます。</p>' : '') +
        '<button type="button" class="next" id="nextQ">次の問題</button>';
    }
    $('qcard').innerHTML = h;
    Array.prototype.forEach.call($('qcard').querySelectorAll('.pool button'), function (b) {
      b.addEventListener('click', function () {
        var i = +b.getAttribute('data-i');
        if (i === picked.length) {
          picked.push(i);
          if (picked.length === cur.steps.length) {
            if (miss === 0) { st.clear[cur.id] = 1; save(); drawQ('全問正解! 一発で並べられました。', 'ok'); }
            else drawQ('完成しました。間違えた回数:' + miss + '回。もう一度挑戦すると一発正解に数えられます。', 'ng');
          } else drawQ('');
        } else {
          miss++;
          b.classList.add('wrong');
          var m = $('qcard').querySelector('.qmsg');
          m.className = 'qmsg ng';
          m.textContent = 'その手順はもっと後です。' + (picked.length + 1) + '番目に来るものを選びましょう。';
        }
      });
    });
    var nx = $('nextQ'); if (nx) nx.addEventListener('click', newQ);
    qstat();
  }
  $('qsub').addEventListener('change', function () { qsub = $('qsub').value; cur = null; newQ(); });

  // ===== タブ =====
  function tab(w) {
    $('tab-r').setAttribute('aria-selected', w === 'r'); $('tab-q').setAttribute('aria-selected', w === 'q');
    $('pane-r').hidden = w !== 'r'; $('pane-q').hidden = w !== 'q';
    if (w === 'q' && !cur) newQ();
  }
  $('tab-r').addEventListener('click', function () { tab('r'); });
  $('tab-q').addEventListener('click', function () { tab('q'); });
  renderList();
  if (location.hash === '#quiz') tab('q');
  else if (location.hash.indexOf('#p-') === 0) { var d = document.querySelector(location.hash); if (d) { d.open = true; d.scrollIntoView(); } }
})();
</script>
</body>
</html>
