<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>総合原価計算の応用 ランダム問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #101b2d;
    color: #f6f1e6;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .kicker { font-size: 13px; letter-spacing: 3px; color: #d4a24c; font-weight: 700; }
  h1 { font-size: 26px; font-weight: 700; margin: 4px 0 0 0; }
  .score-label { font-size: 13px; color: #9aa5b1; text-align: right; }
  .score-value { font-size: 22px; font-weight: 700; color: #d4a24c; text-align: right; }

  .topic-badge {
    display: inline-flex; align-self: flex-start;
    padding: 6px 16px; border-radius: 999px;
    background: rgba(212,162,76,0.18); border: 1px solid #d4a24c;
    font-size: 13px; font-weight: 700; color: #d4a24c; letter-spacing: 1px;
  }

  .problem-card {
    padding: 20px 24px; border: 1px solid rgba(212,162,76,0.35); border-radius: 12px;
    background: rgba(255,255,255,0.03); display: flex; flex-direction: column; gap: 6px;
  }
  .problem-line { font-size: 16px; line-height: 1.9; color: #e8e3d8; }
  .problem-line b { color: #f6f1e6; }

  .inputs-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .input-group { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 14px; color: #c7c0b0; }
  .input-group input {
    padding: 10px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid rgba(212,162,76,0.4); background: #0e1726; color: #f6f1e6; font-family: inherit;
  }
  .input-group input::placeholder { color: #6b7688; }
  .input-group input:focus { outline: none; border-color: #d4a24c; }

  .hint { font-size: 12px; color: #8b93a1; }
  .error { font-size: 13px; color: #f0997b; display: none; }

  .buttons-row { display: flex; gap: 12px; flex-wrap: wrap; }
  button { font-family: inherit; cursor: pointer; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 700; border: none; }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.95); }
  .btn-primary { color: #101b2d; background: #d4a24c; }
  .btn-secondary { color: #d4a24c; background: transparent; border: 1px solid #d4a24c; }

  .result-card { padding: 18px 22px; border-radius: 12px; border: 2px solid; display: none; flex-direction: column; gap: 8px; }
  .result-card.show { display: flex; }
  .result-title { font-size: 17px; font-weight: 700; }
  .result-explanation { font-size: 14px; line-height: 1.8; color: #e8e3d8; white-space: pre-line; }

  .footer-note { font-size: 12px; color: #6b7688; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">

  <div class="header-row">
    <div>
      <div class="kicker">BOOKKEEPING LV.1 工業簿記 ⑧ 総合原価計算の応用</div>
      <h1>総合原価計算の応用 ランダム問題</h1>
    </div>
    <div>
      <div class="score-label">スコア</div>
      <div class="score-value"><span id="score">0</span> / <span id="total">0</span></div>
    </div>
  </div>

  <div class="topic-badge" id="topicBadge"></div>

  <div class="problem-card" id="problemCard"></div>

  <div class="inputs-row">
    <div class="input-group">
      <label id="label1"></label>
      <input type="text" id="input1" autocomplete="off">
    </div>
    <div class="input-group">
      <label id="label2"></label>
      <input type="text" id="input2" autocomplete="off">
    </div>
  </div>
  <div class="hint">半角数字、カンマなしで入力してください。</div>
  <div class="error" id="errorText"></div>

  <div class="buttons-row">
    <button class="btn-primary" id="checkBtn">解答する</button>
    <button class="btn-secondary" id="nextBtn">次の問題へ</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-explanation" id="resultExplanation"></div>
  </div>

  <div class="footer-note">簿記1級 総合原価計算の応用(仕損・減損・工程別・組別)の練習用アプリ(自己採点)</div>

</div>

<script>
(function () {
  var state = { problem: null, score: 0, total: 0 };

  function randMultiple(min, max, step) {
    var n = Math.floor(Math.random() * ((max - min) / step + 1));
    return min + n * step;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fmt(n) { return n.toLocaleString('ja-JP'); }
  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
  function lcm(a, b) { return a / gcd(a, b) * b; }
  function pct(x) { return Math.round(x * 100) + '%'; }

  function baseData() {
    var D = pick([600, 700, 800, 900]);
    var W = pick([200, 300, 400]);
    var p = pick([0.4, 0.5, 0.6, 0.8]);
    var L = pick([50, 100]);
    return { D: D, W: W, p: p, w: W * p, L: L };
  }

  function prodLines(b, lossText) {
    return [
      '完成品<b>' + fmt(b.D) + '個</b>、月末仕掛品<b>' + fmt(b.W) + '個</b>(加工進捗<b>' + pct(b.p) + '</b>)、正常減損<b>' + fmt(b.L) + '個</b>(' + lossText + ')。',
      '原料は工程の始点で投入する。平均法により計算する。'
    ];
  }

  function genEndPoint() {
    var b = baseData();
    var uM = randMultiple(30, 80, 1) * 10, uP = randMultiple(20, 60, 1) * 10;
    var divM = b.D + b.W + b.L, divP = b.D + b.w + b.L;
    var Cm = uM * divM, Cp = uP * divP;
    var wip = b.W * uM + b.w * uP;
    var fin = Cm + Cp - wip;
    return {
      badge: '正常減損:終点発生(完成品のみ負担)',
      sum: Cm + Cp,
      lines: prodLines(b, '工程の<b>終点</b>で発生').concat(['原価(月初+当月の合計):原料費<b>' + fmt(Cm) + '円</b>、加工費<b>' + fmt(Cp) + '円</b>。']),
      label1: '月末仕掛品原価(円)',
      label2: '完成品原価(円)',
      ph1: '例: 222000', ph2: '例: 837000',
      answers: [wip, fin],
      explanation:
        '終点発生の減損は、月末仕掛品(進捗' + pct(b.p) + ')が通過していないので、完成品のみ負担。減損を数量に含めて単価を出す。\n' +
        '原料費の数量 = ' + fmt(b.D) + ' + ' + fmt(b.W) + ' + ' + fmt(b.L) + ' = ' + fmt(divM) + '個 → 単価 ' + fmt(Cm) + ' ÷ ' + fmt(divM) + ' = ' + fmt(uM) + '円\n' +
        '加工費の換算量 = ' + fmt(b.D) + ' + ' + fmt(b.W) + '×' + pct(b.p) + ' + ' + fmt(b.L) + '(終点なので100%)= ' + fmt(divP) + '個分 → 単価 ' + fmt(Cp) + ' ÷ ' + fmt(divP) + ' = ' + fmt(uP) + '円\n' +
        '月末仕掛品 = ' + fmt(b.W) + ' × ' + fmt(uM) + ' + ' + fmt(b.w) + ' × ' + fmt(uP) + ' = ' + fmt(wip) + '円\n' +
        '完成品 = (' + fmt(Cm) + ' + ' + fmt(Cp) + ')− ' + fmt(wip) + ' = ' + fmt(fin) + '円'
    };
  }

  function genBoth() {
    var b = baseData();
    var q = pick([0.2, 0.3]);
    var uM = randMultiple(30, 80, 1) * 10, uP = randMultiple(20, 60, 1) * 10;
    var divM = b.D + b.W, divP = b.D + b.w;
    var Cm = uM * divM, Cp = uP * divP;
    var wip = b.W * uM + b.w * uP;
    var fin = Cm + Cp - wip;
    return {
      badge: '正常減損:途中発生(完成品と月末仕掛品の両者負担)',
      sum: Cm + Cp,
      lines: prodLines(b, '工程の<b>' + pct(q) + '</b>の点で発生').concat(['原価(月初+当月の合計):原料費<b>' + fmt(Cm) + '円</b>、加工費<b>' + fmt(Cp) + '円</b>。']),
      label1: '月末仕掛品原価(円)',
      label2: '完成品原価(円)',
      ph1: '例: 243000', ph2: '例: 816000',
      answers: [wip, fin],
      explanation:
        '発生点(' + pct(q) + ')は月末仕掛品の進捗(' + pct(b.p) + ')より前で、月末仕掛品も通過済み。両者負担なので、減損を数量から除いて単価を出す。\n' +
        '原料費の数量 = ' + fmt(b.D) + ' + ' + fmt(b.W) + ' = ' + fmt(divM) + '個 → 単価 ' + fmt(Cm) + ' ÷ ' + fmt(divM) + ' = ' + fmt(uM) + '円\n' +
        '加工費の換算量 = ' + fmt(b.D) + ' + ' + fmt(b.W) + '×' + pct(b.p) + ' = ' + fmt(divP) + '個分 → 単価 ' + fmt(Cp) + ' ÷ ' + fmt(divP) + ' = ' + fmt(uP) + '円\n' +
        '月末仕掛品 = ' + fmt(b.W) + ' × ' + fmt(uM) + ' + ' + fmt(b.w) + ' × ' + fmt(uP) + ' = ' + fmt(wip) + '円\n' +
        '完成品 = (' + fmt(Cm) + ' + ' + fmt(Cp) + ')− ' + fmt(wip) + ' = ' + fmt(fin) + '円'
    };
  }

  function genCompare() {
    var b, Cm, Cp, ok = false, tries = 0;
    while (!ok && tries < 800) {
      tries++;
      b = baseData();
      var l1 = lcm(b.D + b.W + b.L, b.D + b.W);
      var l2 = lcm(b.D + b.w + b.L, b.D + b.w);
      var k1 = Math.ceil(300000 / l1) + randMultiple(0, 2, 1);
      var k2 = Math.ceil(200000 / l2) + randMultiple(0, 2, 1);
      Cm = l1 * k1; Cp = l2 * k2;
      if (Cm <= 1800000 && Cp <= 1500000) ok = true;
    }
    if (!ok) { b = { D: 800, W: 300, p: 0.5, L: 100, w: 150 }; Cm = 660000; Cp = 399000; }
    var uM1 = Cm / (b.D + b.W + b.L), uP1 = Cp / (b.D + b.w + b.L);
    var uM2 = Cm / (b.D + b.W), uP2 = Cp / (b.D + b.w);
    var wip1 = b.W * uM1 + b.w * uP1;
    var wip2 = b.W * uM2 + b.w * uP2;
    return {
      badge: '正常減損:終点発生と途中発生の比較',
      sum: 0,
      lines: prodLines(b, '発生点は下記の2通りを考える').concat(['原価(月初+当月の合計):原料費<b>' + fmt(Cm) + '円</b>、加工費<b>' + fmt(Cp) + '円</b>。',
        '① 減損が工程の<b>終点</b>で発生した場合、② 減損が工程の<b>途中(20%)</b>で発生した場合の、月末仕掛品原価をそれぞれ求める。']),
      label1: '①終点発生の月末仕掛品原価(円)',
      label2: '②途中発生の月末仕掛品原価(円)',
      ph1: '例: 222000', ph2: '例: 243000',
      answers: [wip1, wip2],
      explanation:
        '① 終点発生(完成品のみ負担:減損を数量に含める)\n' +
        '　原料単価 ' + fmt(Cm) + ' ÷ ' + fmt(b.D + b.W + b.L) + ' = ' + fmt(uM1) + '円、加工費単価 ' + fmt(Cp) + ' ÷ ' + fmt(b.D + b.w + b.L) + ' = ' + fmt(uP1) + '円\n' +
        '　月末仕掛品 = ' + fmt(b.W) + ' × ' + fmt(uM1) + ' + ' + fmt(b.w) + ' × ' + fmt(uP1) + ' = ' + fmt(wip1) + '円\n' +
        '② 途中発生(両者負担:減損を数量から除く)\n' +
        '　原料単価 ' + fmt(Cm) + ' ÷ ' + fmt(b.D + b.W) + ' = ' + fmt(uM2) + '円、加工費単価 ' + fmt(Cp) + ' ÷ ' + fmt(b.D + b.w) + ' = ' + fmt(uP2) + '円\n' +
        '　月末仕掛品 = ' + fmt(b.W) + ' × ' + fmt(uM2) + ' + ' + fmt(b.w) + ' × ' + fmt(uP2) + ' = ' + fmt(wip2) + '円\n' +
        '(途中発生のほうが、月末仕掛品も減損費を負担するので大きくなる)'
    };
  }

  function genProcess() {
    var D2 = randMultiple(4, 9, 1) * 100;
    var W2 = randMultiple(1, 4, 1) * 100;
    var Q1 = D2 + W2;
    var u1 = randMultiple(6, 24, 1) * 50;
    var C1 = Q1 * u1;
    var p2 = pick([0.4, 0.5, 0.6]);
    var w2 = W2 * p2;
    var up = randMultiple(4, 12, 1) * 50;
    var divP = D2 + w2;
    var Cp = up * divP;
    var wip = W2 * u1 + w2 * up;
    var fin = C1 + Cp - wip;
    return {
      badge: '工程別総合原価計算(累加法):第2工程',
      sum: C1 + Cp,
      lines: [
        '第1工程の完成品<b>' + fmt(Q1) + '個</b>(原価<b>' + fmt(C1) + '円</b>)を、第2工程が受け入れた(前工程費として始点で投入)。',
        '第2工程の当月加工費は<b>' + fmt(Cp) + '円</b>、完成品は<b>' + fmt(D2) + '個</b>、月末仕掛品は<b>' + fmt(W2) + '個</b>(加工進捗<b>' + pct(p2) + '</b>)。月初仕掛品はない。'
      ],
      label1: '第2工程の完成品原価(円)',
      label2: '第2工程の月末仕掛品原価(円)',
      ph1: '例: 1120000', ph2: '例: 230000',
      answers: [fin, wip],
      explanation:
        '前工程費(始点投入)の単価 = ' + fmt(C1) + ' ÷ (' + fmt(D2) + ' + ' + fmt(W2) + ')= ' + fmt(u1) + '円\n' +
        '加工費の換算量 = ' + fmt(D2) + ' + ' + fmt(W2) + '×' + pct(p2) + ' = ' + fmt(divP) + '個分 → 単価 ' + fmt(Cp) + ' ÷ ' + fmt(divP) + ' = ' + fmt(up) + '円\n' +
        '月末仕掛品 = ' + fmt(W2) + ' × ' + fmt(u1) + ' + ' + fmt(w2) + ' × ' + fmt(up) + ' = ' + fmt(wip) + '円\n' +
        '完成品 = (' + fmt(C1) + ' + ' + fmt(Cp) + ')− ' + fmt(wip) + ' = ' + fmt(fin) + '円'
    };
  }

  function genGroup() {
    var hp = pick([[300, 200], [600, 400], [500, 300], [400, 200], [700, 300]]);
    var H = randMultiple(10, 40, 1) * 12000;
    var dA = randMultiple(20, 60, 1) * 10000, dB = randMultiple(20, 60, 1) * 10000;
    var hs = hp[0] + hp[1];
    var aA = H * hp[0] / hs, aB = H - aA;
    return {
      badge: '組別総合原価計算:組間接費の配賦',
      sum: dA + dB + H,
      lines: [
        'A組・B組の2種類の製品を製造している。組直接費は、A組<b>' + fmt(dA) + '円</b>、B組<b>' + fmt(dB) + '円</b>。',
        '組間接費<b>' + fmt(H) + '円</b>を、直接作業時間(A組<b>' + fmt(hp[0]) + '時間</b>、B組<b>' + fmt(hp[1]) + '時間</b>)で配賦する。'
      ],
      label1: 'A組の製造原価(円)',
      label2: 'B組の製造原価(円)',
      ph1: '例: 494000', ph2: '例: 356000',
      answers: [dA + aA, dB + aB],
      explanation:
        'A組への配賦 = ' + fmt(H) + ' × ' + fmt(hp[0]) + '/' + fmt(hs) + ' = ' + fmt(aA) + '円\n' +
        'B組への配賦 = ' + fmt(H) + ' × ' + fmt(hp[1]) + '/' + fmt(hs) + ' = ' + fmt(aB) + '円\n' +
        'A組の製造原価 = ' + fmt(dA) + ' + ' + fmt(aA) + ' = ' + fmt(dA + aA) + '円\n' +
        'B組の製造原価 = ' + fmt(dB) + ' + ' + fmt(aB) + ' = ' + fmt(dB + aB) + '円'
    };
  }

  function genAbnormal() {
    var L2 = randMultiple(1, 8, 1) * 10;
    var q = pick([0.4, 0.5, 0.6, 0.2]);
    var uM = randMultiple(30, 80, 1) * 10, uP = randMultiple(20, 60, 1) * 10;
    var am = L2 * uM, ap = L2 * q * uP;
    return {
      badge: '異常減損の計算',
      sum: 0,
      lines: [
        '事故により、原料<b>' + fmt(L2) + '個</b>分が工程の<b>' + pct(q) + '</b>の点で異常減損した。',
        '原料費(始点投入)の単価は<b>' + fmt(uM) + '円</b>、加工費の単価は<b>' + fmt(uP) + '円</b>である。'
      ],
      label1: '異常減損費のうち原料費(円)',
      label2: '異常減損費のうち加工費(円)',
      ph1: '例: 10000', ph2: '例: 4000',
      answers: [am, ap],
      explanation:
        '異常減損費は、製品原価に含めず、営業外費用や特別損失にする。\n' +
        '原料費部分 = ' + fmt(L2) + ' × ' + fmt(uM) + ' = ' + fmt(am) + '円(始点投入なので100%)\n' +
        '加工費部分 = ' + fmt(L2) + ' × ' + pct(q) + ' × ' + fmt(uP) + ' = ' + fmt(ap) + '円(発生点までの進捗分)\n' +
        '異常減損費 = ' + fmt(am + ap) + '円\n' +
        '(仕訳)(借)異常減損損 ' + fmt(am + ap) + ' /(貸)仕掛品 ' + fmt(am + ap)
    };
  }

  function generateProblem() {
    var y = Math.random();
    if (y < 0.18) return genEndPoint();
    if (y < 0.36) return genBoth();
    if (y < 0.54) return genCompare();
    if (y < 0.74) return genProcess();
    if (y < 0.9) return genGroup();
    return genAbnormal();
  }

  function renderProblem() {
    var p = state.problem;
    document.getElementById('topicBadge').textContent = '【 ' + p.badge + ' 】';
    document.getElementById('problemCard').innerHTML = p.lines.map(function (l) {
      return '<div class="problem-line">' + l + '</div>';
    }).join('');
    document.getElementById('label1').textContent = p.label1;
    document.getElementById('label2').textContent = p.label2;
    var i1 = document.getElementById('input1');
    var i2 = document.getElementById('input2');
    i1.placeholder = p.ph1;
    i2.placeholder = p.ph2;
    i1.value = '';
    i2.value = '';
    document.getElementById('errorText').style.display = 'none';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;
  }

  function parseSigned(s) {
    if (s === undefined || s === null) return NaN;
    var t = String(s).trim().replace(/,/g, '').replace(/円/g, '').replace(/[−▲△]/g, '-');
    if (t === '' || t === '-' || t === '+') return NaN;
    return Number(t);
  }

  function handleCheck() {
    var u1 = parseSigned(document.getElementById('input1').value);
    var u2 = parseSigned(document.getElementById('input2').value);
    var errEl = document.getElementById('errorText');
    if (isNaN(u1) || isNaN(u2)) {
      errEl.textContent = '両方の欄に数値を入力してください';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    var p = state.problem;
    var isCorrect = (u1 === p.answers[0]) && (u2 === p.answers[1]);
    state.total += 1;
    if (isCorrect) state.score += 1;
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;

    var resultCard = document.getElementById('resultCard');
    var resultTitle = document.getElementById('resultTitle');
    resultTitle.textContent = isCorrect ? '正解です!' : '不正解です。もう一度見直してみましょう。';
    resultTitle.style.color = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.borderColor = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.background = isCorrect ? 'rgba(99,153,34,0.14)' : 'rgba(216,90,48,0.14)';
    document.getElementById('resultExplanation').textContent = p.explanation;
    resultCard.classList.add('show');
  }

  function handleNext() {
    state.problem = generateProblem();
    renderProblem();
  }

  document.getElementById('checkBtn').addEventListener('click', handleCheck);
  document.getElementById('nextBtn').addEventListener('click', handleNext);
  document.getElementById('input1').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });
  document.getElementById('input2').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });

  state.problem = generateProblem();
  renderProblem();
})();
</script>
</body>
