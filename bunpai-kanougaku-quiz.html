<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分配可能額 ランダム問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #101b2d;
    color: #f6f1e6;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .kicker { font-size: 13px; letter-spacing: 3px; color: #d4a24c; font-weight: 700; }
  h1 { font-size: 26px; font-weight: 700; margin: 4px 0 0 0; }
  .score-label { font-size: 13px; color: #9aa5b1; text-align: right; }
  .score-value { font-size: 22px; font-weight: 700; color: #d4a24c; text-align: right; }

  .topic-badge {
    display: inline-flex; align-self: flex-start;
    padding: 6px 16px; border-radius: 999px;
    background: rgba(212,162,76,0.18); border: 1px solid #d4a24c;
    font-size: 13px; font-weight: 700; color: #d4a24c; letter-spacing: 1px;
  }

  .problem-card {
    padding: 20px 24px; border: 1px solid rgba(212,162,76,0.35); border-radius: 12px;
    background: rgba(255,255,255,0.03); display: flex; flex-direction: column; gap: 6px;
  }
  .problem-line { font-size: 16px; line-height: 1.9; color: #e8e3d8; }
  .problem-line b { color: #f6f1e6; }

  .inputs-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .input-group { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 14px; color: #c7c0b0; }
  .input-group input {
    padding: 10px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid rgba(212,162,76,0.4); background: #0e1726; color: #f6f1e6; font-family: inherit;
  }
  .input-group input::placeholder { color: #6b7688; }
  .input-group input:focus { outline: none; border-color: #d4a24c; }

  .hint { font-size: 12px; color: #8b93a1; }
  .error { font-size: 13px; color: #f0997b; display: none; }

  .buttons-row { display: flex; gap: 12px; flex-wrap: wrap; }
  button { font-family: inherit; cursor: pointer; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 700; border: none; }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.95); }
  .btn-primary { color: #101b2d; background: #d4a24c; }
  .btn-secondary { color: #d4a24c; background: transparent; border: 1px solid #d4a24c; }

  .result-card { padding: 18px 22px; border-radius: 12px; border: 2px solid; display: none; flex-direction: column; gap: 8px; }
  .result-card.show { display: flex; }
  .result-title { font-size: 17px; font-weight: 700; }
  .result-explanation { font-size: 14px; line-height: 1.8; color: #e8e3d8; white-space: pre-line; }

  .footer-note { font-size: 12px; color: #6b7688; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">

  <div class="header-row">
    <div>
      <div class="kicker">BOOKKEEPING LV.1 商業簿記 分配可能額</div>
      <h1>分配可能額 ランダム問題</h1>
    </div>
    <div>
      <div class="score-label">スコア</div>
      <div class="score-value"><span id="score">0</span> / <span id="total">0</span></div>
    </div>
  </div>

  <div class="topic-badge" id="topicBadge"></div>

  <div class="problem-card" id="problemCard"></div>

  <div class="inputs-row">
    <div class="input-group">
      <label id="label1"></label>
      <input type="text" id="input1" autocomplete="off">
    </div>
    <div class="input-group">
      <label id="label2"></label>
      <input type="text" id="input2" autocomplete="off">
    </div>
  </div>
  <div class="hint">半角数字、カンマなしで入力(単位は千円、「千円」は不要)。解説に仕訳も出ます。</div>
  <div class="error" id="errorText"></div>

  <div class="buttons-row">
    <button class="btn-primary" id="checkBtn">解答する</button>
    <button class="btn-secondary" id="nextBtn">次の問題へ</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-explanation" id="resultExplanation"></div>
  </div>

  <div class="footer-note">簿記1級 分配可能額の練習用アプリ(自己採点)</div>

</div>

<script>
(function () {
  var state = { problem: null, score: 0, total: 0 };

  function randMultiple(min, max, step) {
    var n = Math.floor(Math.random() * ((max - min) / step + 1));
    return min + n * step;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fmt(n) {
    var s = Math.abs(Math.round(n)).toLocaleString('ja-JP');
    return (n < 0 ? '−' : '') + s;
  }
  // 共通データ(単位:千円)。caseNo = のれん等調整額のケース(1〜4)
  function bData(forceCase) {
    for (var tries = 0; tries < 20000; tries++) {
      var d = {};
      d.cap = randMultiple(4, 40, 1) * 100;
      d.capRes = randMultiple(1, 6, 1) * 50;
      d.earnRes = randMultiple(0, 6, 1) * 50;
      d.oCap = randMultiple(2, 20, 1) * 50;
      d.ret = randMultiple(10, 60, 1) * 100;
      d.tre = randMultiple(2, 12, 1) * 50;
      d.oci = randMultiple(-6, 6, 1) * 50;
      d.K = d.cap + d.capRes + d.earnRes;
      d.M = d.K + d.oCap;
      d.caseNo = forceCase || randMultiple(1, 4, 1);
      var half, def;
      if (d.caseNo === 1) {
        var adj = randMultiple(1, Math.floor(d.K / 50), 1) * 50;
        def = randMultiple(0, Math.floor(adj / 50), 1) * 50; half = adj - def;
      } else if (d.caseNo === 2) {
        var adj2 = d.K + randMultiple(1, d.oCap / 50, 1) * 50;
        def = randMultiple(0, Math.floor(adj2 / 100), 1) * 50; half = adj2 - def;
      } else if (d.caseNo === 3) {
        half = d.M - randMultiple(0, 10, 1) * 50;
        def = (d.M - half) + randMultiple(1, 10, 1) * 50;
      } else {
        half = d.M + randMultiple(1, 20, 1) * 50;
        def = randMultiple(0, 10, 1) * 50;
      }
      if (half < 0) continue;
      d.gw = half * 2; d.def = def; d.half = half; d.adj = half + def;
      if (d.caseNo === 1) d.ded = 0;
      else if (d.caseNo === 2 || d.caseNo === 3) d.ded = d.adj - d.K;
      else d.ded = d.oCap + d.def;
      // ケースの判定が条件どおりか確認
      var real = d.adj <= d.K ? 1 : (d.adj <= d.M ? 2 : (d.half <= d.M ? 3 : 4));
      if (real !== d.caseNo) continue;
      d.ociNeg = d.oci < 0 ? -d.oci : 0;
      d.surplus = d.oCap + d.ret;
      d.dist = d.surplus - d.tre - d.ded - d.ociNeg;
      if (d.dist <= 0) continue;
      return d;
    }
    return null;
  }
  function bLines(d) {
    return [
      '当期末の資料(単位:千円):資本金<b>' + fmt(d.cap) + '</b>、資本準備金<b>' + fmt(d.capRes) + '</b>、利益準備金<b>' + fmt(d.earnRes) + '</b>',
      'その他資本剰余金<b>' + fmt(d.oCap) + '</b>、繰越利益剰余金<b>' + fmt(d.ret) + '</b>、自己株式<b>△' + fmt(d.tre) + '</b>',
      'その他有価証券評価差額金<b>' + (d.oci < 0 ? '△' + fmt(-d.oci) + '(借方残高)' : fmt(d.oci) + (d.oci > 0 ? '(貸方残高)' : '')) + '</b>',
      'のれん<b>' + fmt(d.gw) + '</b>、繰延資産<b>' + fmt(d.def) + '</b>'
    ];
  }
  function norenExplain(d) {
    var s = 'のれん等調整額 = ' + fmt(d.gw) + ' × 1/2 + ' + fmt(d.def) + ' = ' + fmt(d.adj) + '\n' +
      '資本等金額 = ' + fmt(d.cap) + ' + ' + fmt(d.capRes) + ' + ' + fmt(d.earnRes) + ' = ' + fmt(d.K) + '\n' +
      '資本等金額 + その他資本剰余金 = ' + fmt(d.K) + ' + ' + fmt(d.oCap) + ' = ' + fmt(d.M) + '\n';
    if (d.caseNo === 1) s += 'のれん等調整額 ' + fmt(d.adj) + ' ≦ 資本等金額 ' + fmt(d.K) + ' → ケース1:控除額 0';
    else if (d.caseNo === 2) s += fmt(d.K) + ' < ' + fmt(d.adj) + ' ≦ ' + fmt(d.M) + ' → ケース2:控除額 = ' + fmt(d.adj) + ' − ' + fmt(d.K) + ' = ' + fmt(d.ded);
    else if (d.caseNo === 3) s += fmt(d.adj) + ' > ' + fmt(d.M) + '、のれん×1/2 ' + fmt(d.half) + ' ≦ ' + fmt(d.M) + ' → ケース3:控除額 = ' + fmt(d.adj) + ' − ' + fmt(d.K) + ' = ' + fmt(d.ded);
    else s += fmt(d.adj) + ' > ' + fmt(d.M) + '、のれん×1/2 ' + fmt(d.half) + ' > ' + fmt(d.M) + ' → ケース4:控除額 = その他資本剰余金 ' + fmt(d.oCap) + ' + 繰延資産 ' + fmt(d.def) + ' = ' + fmt(d.ded);
    return s;
  }
  function distExplain(d) {
    return '剰余金 = その他資本剰余金 ' + fmt(d.oCap) + ' + 繰越利益剰余金 ' + fmt(d.ret) + ' = ' + fmt(d.surplus) + '\n' +
      norenExplain(d) + '\n' +
      (d.ociNeg > 0 ? 'その他有価証券評価差額金は借方残高 → ' + fmt(d.ociNeg) + 'を控除\n' : 'その他有価証券評価差額金は' + (d.oci > 0 ? '貸方残高' : '0') + ' → 控除しない\n') +
      '分配可能額 = ' + fmt(d.surplus) + ' − 自己株式 ' + fmt(d.tre) + ' − ' + fmt(d.ded) + (d.ociNeg > 0 ? ' − ' + fmt(d.ociNeg) : '') + ' = ' + fmt(d.dist);
  }

  // ① のれん等調整額の控除額
  function genNoren() {
    var d = bData();
    return {
      badge: 'のれん等調整額の控除額(4つのケース)',
      check: d !== null,
      lines: bLines(d),
      label1: 'のれん等調整額(千円)',
      label2: '分配可能額から控除する額(千円)',
      ph1: '例: 1800', ph2: '例: 600',
      answers: [d.adj, d.ded],
      tol: [0, 0],
      explanation: norenExplain(d)
    };
  }

  // ② 分配可能額(期末日後の変動なし)
  function genBasic() {
    var d = bData();
    var lines = bLines(d); lines.push('期末日後の剰余金の変動はないものとする。');
    return {
      badge: '分配可能額の計算(期末日後の変動なし)',
      check: d !== null && d.dist > 0,
      lines: lines,
      label1: '剰余金の額(千円)',
      label2: '分配可能額(千円)',
      ph1: '例: 3800', ph2: '例: 2700',
      answers: [d.surplus, d.dist],
      tol: [0, 0],
      explanation: distExplain(d)
    };
  }

  // ③ 期末日後の自己株式の処分
  function genAfter() {
    var d = null, sold = 0, price = 0;
    for (var k = 0; k < 2000; k++) {
      d = bData();
      if (!d || d.tre < 100) continue;
      sold = randMultiple(1, d.tre / 50, 1) * 50;
      price = sold + randMultiple(-4, 6, 1) * 50;
      if (price <= 0 || price === sold) continue;
      if (sold - price > d.oCap) continue;
      break;
    }
    var diff = price - sold;
    var surplus2 = d.surplus + diff;
    var tre2 = d.tre - sold;
    var dist2 = surplus2 - tre2 - price - d.ded - d.ociNeg;
    var je = diff > 0
      ? '(借)現金 ' + fmt(price) + '\n(貸)自己株式 ' + fmt(sold) + '\n(貸)その他資本剰余金 ' + fmt(diff)
      : '(借)現金 ' + fmt(price) + '\n(借)その他資本剰余金 ' + fmt(-diff) + '\n(貸)自己株式 ' + fmt(sold);
    var lines = bLines(d);
    lines.push('期末日後、配当の前に、帳簿価額<b>' + fmt(sold) + '</b>の自己株式を現金<b>' + fmt(price) + '</b>で処分した(臨時決算は行わない)。');
    return {
      badge: '期末日後の自己株式の処分と分配可能額',
      check: dist2 === d.dist,
      lines: lines,
      label1: '分配時の剰余金の額(千円)',
      label2: '分配可能額(千円)',
      ph1: '例: 3850', ph2: '例: 2700',
      answers: [surplus2, dist2],
      tol: [0, 0],
      explanation:
        '【期末日後の処分の仕訳】\n' + je + '\n' +
        '処分差' + (diff > 0 ? '益 ' : '損 ') + fmt(Math.abs(diff)) + ' → その他資本剰余金を' + (diff > 0 ? '増やす' : '減らす') + '\n' +
        '【分配時の剰余金】' + fmt(d.oCap) + ' + ' + fmt(d.ret) + (diff > 0 ? ' + ' : ' − ') + fmt(Math.abs(diff)) + ' = ' + fmt(surplus2) + '\n' +
        '【控除項目】\n' +
        '分配時の自己株式 = ' + fmt(d.tre) + ' − ' + fmt(sold) + ' = ' + fmt(tre2) + '\n' +
        '期末日後に処分した自己株式の対価 = ' + fmt(price) + '\n' +
        norenExplain(d) + '\n' +
        (d.ociNeg > 0 ? '評価差額金(借方残高)' + fmt(d.ociNeg) + 'を控除\n' : '評価差額金は控除しない\n') +
        '分配可能額 = ' + fmt(surplus2) + ' − ' + fmt(tre2) + ' − ' + fmt(price) + ' − ' + fmt(d.ded) + (d.ociNeg > 0 ? ' − ' + fmt(d.ociNeg) : '') + ' = ' + fmt(dist2) + '\n' +
        '(検算)期末の数字だけで計算しても ' + fmt(d.dist) + '。期末日後の処分では分配可能額は増えない。'
    };
  }

  // ④ 配当と準備金の積立(仕訳)
  function genDividend() {
    var d = null, div = 0, gap = 0;
    for (var k = 0; k < 2000; k++) {
      d = bData();
      if (!d || d.dist < 100) continue;
      div = randMultiple(1, Math.floor(d.dist / 100), 1) * 100;
      gap = d.cap / 4 - (d.capRes + d.earnRes);
      break;
    }
    var res = Math.max(0, Math.min(div / 10, gap));
    var lines = bLines(d);
    lines.push('期末日後の変動はない。株主総会で、繰越利益剰余金を財源とする配当<b>' + fmt(div) + '</b>を決議した。');
    return {
      badge: '配当の上限チェックと利益準備金の積立',
      check: Number.isInteger(res) && div <= d.dist,
      lines: lines,
      label1: '利益準備金の積立額(千円)',
      label2: '繰越利益剰余金の減少額(千円)',
      ph1: '例: 50', ph2: '例: 1050',
      answers: [res, div + res],
      tol: [0, 0],
      explanation:
        '【上限チェック】\n' + distExplain(d) + '\n配当 ' + fmt(div) + ' ≦ 分配可能額 ' + fmt(d.dist) + ' → 配当できる\n' +
        '【準備金の積立】\n' +
        '配当 × 1/10 = ' + fmt(div / 10) + '\n' +
        '資本金 × 1/4 − (資本準備金 + 利益準備金) = ' + fmt(d.cap / 4) + ' − ' + fmt(d.capRes + d.earnRes) + ' = ' + fmt(gap) + '\n' +
        (gap <= 0 ? '→ すでに資本金の1/4に達しているので、積立は 0\n' : '→ 少ないほうの ' + fmt(res) + ' を積み立てる\n') +
        '【仕訳(決議時)】\n' +
        '(借)繰越利益剰余金 ' + fmt(div + res) + '\n(貸)未払配当金 ' + fmt(div) + (res > 0 ? '\n(貸)利益準備金 ' + fmt(res) : '') + '\n' +
        '【支払時】\n(借)未払配当金 ' + fmt(div) + '\n(貸)現金預金 ' + fmt(div)
    };
  }

  function generateProblem() {
    var y = Math.random();
    if (y < 0.25) return genNoren();
    if (y < 0.5) return genBasic();
    if (y < 0.75) return genAfter();
    return genDividend();
  }

  function renderProblem() {
    var p = state.problem;
    document.getElementById('topicBadge').textContent = '【 ' + p.badge + ' 】';
    document.getElementById('problemCard').innerHTML = p.lines.map(function (l) {
      return '<div class="problem-line">' + l + '</div>';
    }).join('');
    document.getElementById('label1').textContent = p.label1;
    document.getElementById('label2').textContent = p.label2;
    var i1 = document.getElementById('input1');
    var i2 = document.getElementById('input2');
    i1.placeholder = p.ph1;
    i2.placeholder = p.ph2;
    i1.value = '';
    i2.value = '';
    document.getElementById('errorText').style.display = 'none';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;
  }

  function parseSigned(s) {
    if (s === undefined || s === null) return NaN;
    var t = String(s).trim().replace(/,/g, '').replace(/千円/g, '').replace(/万円/g, '').replace(/円/g, '').replace(/%/g, '').replace(/回/g, '').replace(/個/g, '').replace(/[−▲△]/g, '-');
    if (t === '' || t === '-' || t === '+') return NaN;
    return Number(t);
  }

  function isClose(a, b, tol) {
    return Math.abs(a - b) <= tol + 1e-9;
  }

  function handleCheck() {
    var u1 = parseSigned(document.getElementById('input1').value);
    var u2 = parseSigned(document.getElementById('input2').value);
    var errEl = document.getElementById('errorText');
    if (isNaN(u1) || isNaN(u2)) {
      errEl.textContent = '両方の欄に数値を入力してください';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    var p = state.problem;
    var tol = p.tol || [0, 0];
    var isCorrect = isClose(u1, p.answers[0], tol[0]) && isClose(u2, p.answers[1], tol[1]);
    state.total += 1;
    if (isCorrect) state.score += 1;
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;

    var resultCard = document.getElementById('resultCard');
    var resultTitle = document.getElementById('resultTitle');
    resultTitle.textContent = isCorrect ? '正解です!' : '不正解です。もう一度見直してみましょう。';
    resultTitle.style.color = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.borderColor = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.background = isCorrect ? 'rgba(99,153,34,0.14)' : 'rgba(216,90,48,0.14)';
    document.getElementById('resultExplanation').textContent = p.explanation;
    resultCard.classList.add('show');
  }

  function handleNext() {
    state.problem = generateProblem();
    renderProblem();
  }

  document.getElementById('checkBtn').addEventListener('click', handleCheck);
  document.getElementById('nextBtn').addEventListener('click', handleNext);
  document.getElementById('input1').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });
  document.getElementById('input2').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });

  state.problem = generateProblem();
  renderProblem();
})();
</script>
</body>
</html>
