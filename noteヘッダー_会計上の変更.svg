<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="160" fill="#2F7DE1" opacity="0.16"/>
  <circle cx="1250" cy="660" r="210" fill="#E8543F" opacity="0.14"/>
  <circle cx="680" cy="700" r="110" fill="#0FA18D" opacity="0.12"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="86" width="280" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="220" y="119" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">簿記1級 | 会計学</text>

  <text x="80" y="242" class="dg" font-size="88" fill="#5BA2FF">会計上の変更</text>
  <text x="80" y="346" class="dg" font-size="64" fill="#FFC94A">の</text>
  <text x="150" y="346" class="dg" font-size="72" fill="#FF7A66">出る論点</text>

  <text x="80" y="418" font-size="28" font-weight="700" fill="#fff" opacity="0.95">遡及適用・見積りの変更・誤謬を図と仕訳で</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="452" width="176" height="50" rx="25" fill="#fff"/>
    <text x="168" y="485" fill="#1D5DB3">4つの区分</text>
    <rect x="270" y="452" width="164" height="50" rx="25" fill="#fff"/>
    <text x="352" y="485" fill="#8A6000">計算問題2問</text>
    <rect x="448" y="452" width="150" height="50" rx="25" fill="#fff"/>
    <text x="523" y="485" fill="#A8205C">○×48問</text>
  </g>

  <text x="80" y="572" font-size="20" font-weight="500" fill="#fff" opacity="0.8">図解つき・登録不要の無料Webページ</text>

  <!-- 右:さかのぼるか、さかのぼらないか -->
  <text x="1000" y="104" text-anchor="middle" class="dg" font-size="26" fill="#fff">さかのぼるか、さかのぼらないか</text>

  <text x="790" y="146" font-size="17" font-weight="900" fill="#FF7A66">過去にさかのぼる</text>
  <g filter="url(#shadow)">
    <rect x="790" y="156" width="420" height="50" rx="12" fill="#E8543F"/>
    <rect x="790" y="214" width="420" height="50" rx="12" fill="#E8543F"/>
    <rect x="790" y="272" width="420" height="50" rx="12" fill="#E8543F"/>
  </g>
  <text x="790" y="360" font-size="17" font-weight="900" fill="#62E0CC">さかのぼらない</text>
  <g filter="url(#shadow)">
    <rect x="790" y="370" width="420" height="50" rx="12" fill="#0FA18D"/>
  </g>
  <g font-size="19" font-weight="900" fill="#fff">
    <text x="812" y="188">会計方針の変更</text>
    <text x="812" y="246">表示方法の変更</text>
    <text x="812" y="304">過去の誤謬の訂正</text>
    <text x="812" y="402">会計上の見積りの変更</text>
  </g>
  <g font-size="18" font-weight="900" fill="#fff" text-anchor="end">
    <text x="1192" y="188">→ 遡及適用</text>
    <text x="1192" y="246">→ 組替え</text>
    <text x="1192" y="304">→ 修正再表示</text>
    <text x="1192" y="402">→ 当期と将来に</text>
  </g>

  <rect x="790" y="448" width="420" height="50" rx="25" fill="#fff" fill-opacity="0.10" stroke="#FFC94A" stroke-width="2"/>
  <text x="1000" y="480" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">減価償却方法の変更は見積りの変更と同じ扱い</text>

  <text x="1000" y="574" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">累積的影響額は期首の利益剰余金へ</text>
  <text x="1000" y="606" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">臨時償却はしない</text>
</svg>
