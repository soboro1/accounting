name: Instagram auto post

on:
  schedule:
    # GitHub Actions の cron は UTC。JST = UTC+9。
    - cron: "0 23 * * *"   # 08:00 JST
    - cron: "0 11 * * *"   # 20:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せずに生成だけ試す"
        type: boolean
        default: false
      scene:
        description: "シーンID（空ならランダム）"
        type: string
        default: ""

# 前の実行が終わる前に次が始まらないようにする
concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v25.0' }}
        run: |
          python -m src.main \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.scene && format('--scene {0}', inputs.scene) || '' }}

      - name: Save history
        if: success() && !inputs.dry_run
        run: |
          # 未追跡の初回分も拾うため git status で判定する
          if [ -z "$(git status --porcelain -- state/history.jsonl)" ]; then
            echo "履歴に変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.jsonl
          git commit -m "chore: log post $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Upload generated image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
