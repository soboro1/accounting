<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#fff" fill-opacity="0.75"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="160" fill="#0FA18D" opacity="0.14"/>
  <circle cx="1250" cy="660" r="210" fill="#E8543F" opacity="0.14"/>
  <circle cx="680" cy="700" r="110" fill="#2F7DE1" opacity="0.12"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="86" width="280" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="220" y="119" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">簿記1級 | 会計学</text>

  <text x="80" y="246" class="dg" font-size="100" fill="#34D1BA">リース</text>
  <text x="400" y="246" class="dg" font-size="30" fill="#fff" opacity="0.7">現行基準</text>
  <text x="80" y="350" class="dg" font-size="64" fill="#FFC94A">の</text>
  <text x="150" y="350" class="dg" font-size="72" fill="#FF7A66">出る論点</text>

  <text x="80" y="418" font-size="28" font-weight="700" fill="#fff" opacity="0.95">判定・利息法・減価償却を図と仕訳で</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="452" width="176" height="50" rx="25" fill="#fff"/>
    <text x="168" y="485" fill="#1D5DB3">90%と75%</text>
    <rect x="270" y="452" width="164" height="50" rx="25" fill="#fff"/>
    <text x="352" y="485" fill="#8A6000">計算問題2問</text>
    <rect x="448" y="452" width="150" height="50" rx="25" fill="#fff"/>
    <text x="523" y="485" fill="#A8205C">○×52問</text>
  </g>

  <text x="80" y="572" font-size="20" font-weight="500" fill="#fff" opacity="0.8">図解つき・登録不要の無料Webページ</text>

  <!-- 右:判定の流れ図 -->
  <text x="1000" y="112" text-anchor="middle" class="dg" font-size="26" fill="#fff">判定は2段階で進める</text>

  <g filter="url(#shadow)">
    <rect x="790" y="146" width="420" height="84" rx="18" fill="#FFC94A"/>
  </g>
  <text x="1000" y="182" text-anchor="middle" font-size="24" font-weight="900" fill="#1B1600">解約不能 × フルペイアウト</text>
  <text x="1000" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#1B1600" opacity="0.85">現在価値 90% ／ 期間 75%（どちらか）</text>

  <path d="M920 230 V268" stroke="#fff" stroke-opacity="0.75" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M1130 230 V268" stroke="#fff" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="6 6" fill="none" marker-end="url(#ah)"/>

  <g filter="url(#shadow)">
    <rect x="790" y="276" width="260" height="70" rx="18" fill="#2F7DE1"/>
  </g>
  <text x="920" y="320" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">ファイナンス</text>
  <rect x="1070" y="276" width="140" height="70" rx="18" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
  <text x="1140" y="306" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" opacity="0.85">オペレー</text>
  <text x="1140" y="328" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" opacity="0.85">ティング</text>

  <path d="M860 346 L835 388" stroke="#fff" stroke-opacity="0.75" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M980 346 L1060 388" stroke="#fff" stroke-opacity="0.75" stroke-width="3" fill="none" marker-end="url(#ah)"/>

  <g filter="url(#shadow)">
    <rect x="790" y="396" width="200" height="96" rx="18" fill="#F07C1E"/>
    <rect x="1010" y="396" width="200" height="96" rx="18" fill="#0FA18D"/>
  </g>
  <text x="890" y="434" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">所有権移転</text>
  <text x="890" y="466" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" opacity="0.92">経済的耐用年数で償却</text>
  <text x="1110" y="434" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">所有権移転外</text>
  <text x="1110" y="466" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" opacity="0.92">リース期間・残存ゼロ</text>

  <text x="1000" y="580" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">利息法・期首払い・貸手の3方法</text>
  <text x="1000" y="612" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">セール・アンド・リースバック</text>
</svg>
