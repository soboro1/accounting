<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デリバティブ・ヘッジ会計 ランダム問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #101b2d;
    color: #f6f1e6;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .kicker { font-size: 13px; letter-spacing: 3px; color: #d4a24c; font-weight: 700; }
  h1 { font-size: 26px; font-weight: 700; margin: 4px 0 0 0; }
  .score-label { font-size: 13px; color: #9aa5b1; text-align: right; }
  .score-value { font-size: 22px; font-weight: 700; color: #d4a24c; text-align: right; }

  .topic-badge {
    display: inline-flex; align-self: flex-start;
    padding: 6px 16px; border-radius: 999px;
    background: rgba(212,162,76,0.18); border: 1px solid #d4a24c;
    font-size: 13px; font-weight: 700; color: #d4a24c; letter-spacing: 1px;
  }

  .problem-card {
    padding: 20px 24px; border: 1px solid rgba(212,162,76,0.35); border-radius: 12px;
    background: rgba(255,255,255,0.03); display: flex; flex-direction: column; gap: 6px;
  }
  .problem-line { font-size: 16px; line-height: 1.9; color: #e8e3d8; }
  .problem-line b { color: #f6f1e6; }

  .inputs-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .input-group { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 14px; color: #c7c0b0; }
  .input-group input {
    padding: 10px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid rgba(212,162,76,0.4); background: #0e1726; color: #f6f1e6; font-family: inherit;
  }
  .input-group input::placeholder { color: #6b7688; }
  .input-group input:focus { outline: none; border-color: #d4a24c; }

  .hint { font-size: 12px; color: #8b93a1; }
  .error { font-size: 13px; color: #f0997b; display: none; }

  .buttons-row { display: flex; gap: 12px; flex-wrap: wrap; }
  button { font-family: inherit; cursor: pointer; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 700; border: none; }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.95); }
  .btn-primary { color: #101b2d; background: #d4a24c; }
  .btn-secondary { color: #d4a24c; background: transparent; border: 1px solid #d4a24c; }

  .result-card { padding: 18px 22px; border-radius: 12px; border: 2px solid; display: none; flex-direction: column; gap: 8px; }
  .result-card.show { display: flex; }
  .result-title { font-size: 17px; font-weight: 700; }
  .result-explanation { font-size: 14px; line-height: 1.8; color: #e8e3d8; white-space: pre-line; }

  .footer-note { font-size: 12px; color: #6b7688; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">

  <div class="header-row">
    <div>
      <div class="kicker">BOOKKEEPING LV.1 商業簿記 デリバティブ・ヘッジ会計</div>
      <h1>デリバティブ・ヘッジ会計 ランダム問題</h1>
    </div>
    <div>
      <div class="score-label">スコア</div>
      <div class="score-value"><span id="score">0</span> / <span id="total">0</span></div>
    </div>
  </div>

  <div class="topic-badge" id="topicBadge"></div>

  <div class="problem-card" id="problemCard"></div>

  <div class="inputs-row">
    <div class="input-group">
      <label id="label1"></label>
      <input type="text" id="input1" autocomplete="off">
    </div>
    <div class="input-group">
      <label id="label2"></label>
      <input type="text" id="input2" autocomplete="off">
    </div>
  </div>
  <div class="hint">半角数字、カンマなしで入力(単位は千円)。マイナスは先頭に「-」。解説に仕訳も出ます。</div>
  <div class="error" id="errorText"></div>

  <div class="buttons-row">
    <button class="btn-primary" id="checkBtn">解答する</button>
    <button class="btn-secondary" id="nextBtn">次の問題へ</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-explanation" id="resultExplanation"></div>
  </div>

  <div class="footer-note">簿記1級 デリバティブ・ヘッジ会計の練習用アプリ(自己採点)</div>

</div>

<script>
(function () {
  var state = { problem: null, score: 0, total: 0 };

  function randMultiple(min, max, step) {
    var n = Math.floor(Math.random() * ((max - min) / step + 1));
    return min + n * step;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fmt(n) {
    var s = Math.abs(Math.round(n)).toLocaleString('ja-JP');
    return (n < 0 ? '−' : '') + s;
  }
  function pr(p) { return (Math.round(p * 10) / 10).toString(); }
  function sg(n) { return (n > 0 ? '+' : '') + fmt(n); }
  // 評価差額の仕訳(先物)。gain>0:先物取引差金/先物損益、gain<0:逆
  function futJE(gain, creditName) {
    var c = creditName || '先物損益';
    if (gain > 0) return '(借)先物取引差金 ' + fmt(gain) + '\n(貸)' + c + ' ' + fmt(gain);
    if (gain < 0) return '(借)' + c + ' ' + fmt(-gain) + '\n(貸)先物取引差金 ' + fmt(-gain);
    return '仕訳なし(評価差額0)';
  }

  // ① 先物(ヘッジなし):期末評価と翌期の先物損益
  function genFutures() {
    var buy = Math.random() < 0.5;
    var dir = buy ? 1 : -1;
    var N = randMultiple(5, 50, 1) * 1000;
    var p0 = randMultiple(190, 210, 1) / 2;
    var p1 = p0 + randMultiple(-8, 8, 1) / 2;
    if (p1 === p0) p1 = p0 + 1;
    var p2 = p0 + randMultiple(-8, 8, 1) / 2;
    if (p2 === p1) p2 = p1 + 0.5;
    var dep = randMultiple(1, 10, 1) * 100;
    var v1 = Math.round(N * (p1 - p0) / 100) * dir;
    var settle = Math.round(N * (p2 - p0) / 100) * dir;
    var next = -v1 + settle;
    var side = buy ? '買建て' : '売建て';
    return {
      badge: '先物取引(ヘッジなし):期末評価と翌期の損益',
      check: Number.isInteger(v1) && Number.isInteger(next) && v1 + next === settle,
      lines: [
        '国債先物(額面<b>' + fmt(N) + '千円</b>)を<b>@' + pr(p0) + '</b>で<b>' + side + '</b>、証拠金<b>' + fmt(dep) + '千円</b>を現金で差し入れた。',
        '期末の先物価格は<b>@' + pr(p1) + '</b>、翌期に<b>@' + pr(p2) + '</b>で反対売買して決済した。洗替法による。'
      ],
      label1: '期末の評価差額(利益は+、損失は−、千円)',
      label2: '翌期の先物損益の合計(利益は+、千円)',
      ph1: '例: 100 / -300', ph2: '例: 150',
      answers: [v1, next],
      tol: [0, 0],
      explanation:
        '評価差額 = 額面 ×(価格の差)÷ 100。' + (buy ? '買建ては値上がりで利益' : '売建ては値下がりで利益') + '\n' +
        '期末:' + fmt(N) + ' ×(' + pr(p1) + ' − ' + pr(p0) + ')÷ 100' + (buy ? '' : ' × (−1)') + ' = ' + sg(v1) + '\n' +
        '翌期の決済差額:' + fmt(N) + ' ×(' + pr(p2) + ' − ' + pr(p0) + ')÷ 100' + (buy ? '' : ' × (−1)') + ' = ' + sg(settle) + '\n' +
        '翌期の先物損益 = 洗替 ' + sg(-v1) + ' + 決済 ' + sg(settle) + ' = ' + sg(next) + '\n' +
        '【仕訳】\n契約時:(借)差入証拠金 ' + fmt(dep) + '\n　　　(貸)現金預金 ' + fmt(dep) + '\n' +
        '期末:\n' + futJE(v1) + '\n' +
        '翌期首(洗替):\n' + futJE(-v1) + '\n' +
        '決済時:\n' + (settle >= 0 ? '(借)現金預金 ' + fmt(settle) + '\n(貸)先物損益 ' + fmt(settle) : '(借)先物損益 ' + fmt(-settle) + '\n(貸)現金預金 ' + fmt(-settle)) + '\n' +
        '証拠金の返還:(借)現金預金 ' + fmt(dep) + '\n　　　(貸)差入証拠金 ' + fmt(dep) + '\n' +
        '(検算)当期 ' + sg(v1) + ' + 翌期 ' + sg(next) + ' = ' + sg(settle) + ' = 決済差額'
    };
  }

  // ヘッジの共通データ:その他有価証券(国債)を先物売建てでヘッジ
  function hedgeData() {
    var C = randMultiple(5, 50, 1) * 1000;
    var dV = randMultiple(-8, 8, 1);
    if (dV === 0) dV = -3;
    var V = C + C * dV / 100;
    var dF = Math.random() < 0.6 ? dV : dV + randMultiple(-2, 2, 1);
    if (dF === 0) dF = dV;
    var gainF = -C * dF / 100;  // 売建て:価格が下がると利益
    return { C: C, V: V, diffV: V - C, p1: 100 + dF, gainF: gainF };
  }
  function hedgeLines(d, tax) {
    return [
      'その他有価証券として保有する国債(取得原価<b>' + fmt(d.C) + '千円</b>)の値下がりに備えて、国債先物(額面<b>' + fmt(d.C) + '千円</b>)を<b>@100</b>で売建てた。',
      '期末の国債の時価は<b>' + fmt(d.V) + '千円</b>、先物価格は<b>@' + pr(d.p1) + '</b>である。' + (tax ? '税効果会計を適用し、税率は<b>30%</b>とする。' : '税効果は考えない。')
    ];
  }

  // ② 繰延ヘッジ(税効果あり・なし)
  function genDeferred() {
    var d = hedgeData();
    var tax = Math.random() < 0.5;
    var g = d.gainF, dv = d.diffV;
    var gNet = tax ? Math.round(g * 0.7) : g, gTax = g - gNet;
    var vNet = tax ? Math.round(dv * 0.7) : dv, vTax = dv - vNet;
    var jeV, jeF;
    if (dv >= 0) jeV = '(借)投資有価証券 ' + fmt(dv) + (tax ? '\n(貸)繰延税金負債 ' + fmt(vTax) : '') + '\n(貸)その他有価証券評価差額金 ' + fmt(vNet);
    else jeV = '(借)その他有価証券評価差額金 ' + fmt(-vNet) + (tax ? '\n(借)繰延税金資産 ' + fmt(-vTax) : '') + '\n(貸)投資有価証券 ' + fmt(-dv);
    if (g >= 0) jeF = '(借)先物取引差金 ' + fmt(g) + (tax ? '\n(貸)繰延税金負債 ' + fmt(gTax) : '') + '\n(貸)繰延ヘッジ損益 ' + fmt(gNet);
    else jeF = '(借)繰延ヘッジ損益 ' + fmt(-gNet) + (tax ? '\n(借)繰延税金資産 ' + fmt(-gTax) : '') + '\n(貸)先物取引差金 ' + fmt(-g);
    return {
      badge: '繰延ヘッジ(ヘッジ手段の損益を純資産に繰り延べる)' + (tax ? '・税効果あり' : ''),
      check: Number.isInteger(gNet) && Number.isInteger(vNet),
      lines: hedgeLines(d, tax),
      label1: '先物の評価差額(利益は+、千円)',
      label2: '繰延ヘッジ損益(貸方残高は+、借方残高は−、千円)',
      ph1: '例: 300 / -200', ph2: '例: 210 / -140',
      answers: [g, gNet],
      tol: [0, 0],
      explanation:
        '国債の評価差額 = ' + fmt(d.V) + ' − ' + fmt(d.C) + ' = ' + sg(dv) + '\n' +
        '先物(売建て)の評価差額 = ' + fmt(d.C) + ' ×(100 − ' + pr(d.p1) + ')÷ 100 = ' + sg(g) + '\n' +
        (tax ? '税効果:繰延ヘッジ損益 = ' + sg(g) + ' × (1 − 30%) = ' + sg(gNet) + '\n' : '') +
        '【仕訳】\n国債(全部純資産直入法):\n' + jeV + '\n先物(繰延ヘッジ):\n' + jeF + '\n' +
        '→ どちらも純資産の部に入り、当期の損益には影響しない。' + (dv + g !== 0 ? '(ヘッジが完全ではないので、差額 ' + sg(dv + g) + ' が純資産に残る)' : '')
    };
  }

  // ③ 時価ヘッジ:当期の損益への影響
  function genFairValue() {
    var d = hedgeData();
    var dv = d.diffV, g = d.gainF, net = dv + g;
    var jeV = dv >= 0 ? '(借)投資有価証券 ' + fmt(dv) + '\n(貸)投資有価証券評価損益 ' + fmt(dv) : '(借)投資有価証券評価損益 ' + fmt(-dv) + '\n(貸)投資有価証券 ' + fmt(-dv);
    return {
      badge: '時価ヘッジ(ヘッジ対象の評価差額を損益にする)',
      check: Number.isInteger(net),
      lines: hedgeLines(d, false).concat(['時価ヘッジを適用する。']),
      label1: '投資有価証券評価損益(利益は+、千円)',
      label2: '当期の損益への影響額の合計(利益は+、千円)',
      ph1: '例: -300', ph2: '例: 0 / 50',
      answers: [dv, net],
      tol: [0, 0],
      explanation:
        '国債の評価差額 = ' + fmt(d.V) + ' − ' + fmt(d.C) + ' = ' + sg(dv) + ' → 投資有価証券評価損益(損益)\n' +
        '先物(売建て)の評価差額 = ' + fmt(d.C) + ' ×(100 − ' + pr(d.p1) + ')÷ 100 = ' + sg(g) + ' → 先物損益(損益)\n' +
        '損益への影響 = ' + sg(dv) + ' + ' + sg(g) + ' = ' + sg(net) + '\n' +
        '【仕訳】\n国債:\n' + jeV + '\n先物:\n' + futJE(g) + '\n' +
        '→ 損と益が損益計算書の中で打ち消し合う。' + (net !== 0 ? '(ヘッジが完全ではないので差額が残る)' : '')
    };
  }

  function generateProblem() {
    var y = Math.random();
    if (y < 0.4) return genFutures();
    if (y < 0.75) return genDeferred();
    return genFairValue();
  }

  function renderProblem() {
    var p = state.problem;
    document.getElementById('topicBadge').textContent = '【 ' + p.badge + ' 】';
    document.getElementById('problemCard').innerHTML = p.lines.map(function (l) {
      return '<div class="problem-line">' + l + '</div>';
    }).join('');
    document.getElementById('label1').textContent = p.label1;
    document.getElementById('label2').textContent = p.label2;
    var i1 = document.getElementById('input1');
    var i2 = document.getElementById('input2');
    i1.placeholder = p.ph1;
    i2.placeholder = p.ph2;
    i1.value = '';
    i2.value = '';
    document.getElementById('errorText').style.display = 'none';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;
  }

  function parseSigned(s) {
    if (s === undefined || s === null) return NaN;
    var t = String(s).trim().replace(/,/g, '').replace(/千円/g, '').replace(/万円/g, '').replace(/円/g, '').replace(/%/g, '').replace(/回/g, '').replace(/個/g, '').replace(/[−▲△]/g, '-');
    if (t === '' || t === '-' || t === '+') return NaN;
    return Number(t);
  }

  function isClose(a, b, tol) {
    return Math.abs(a - b) <= tol + 1e-9;
  }

  function handleCheck() {
    var u1 = parseSigned(document.getElementById('input1').value);
    var u2 = parseSigned(document.getElementById('input2').value);
    var errEl = document.getElementById('errorText');
    if (isNaN(u1) || isNaN(u2)) {
      errEl.textContent = '両方の欄に数値を入力してください';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    var p = state.problem;
    var tol = p.tol || [0, 0];
    var isCorrect = isClose(u1, p.answers[0], tol[0]) && isClose(u2, p.answers[1], tol[1]);
    state.total += 1;
    if (isCorrect) state.score += 1;
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;

    var resultCard = document.getElementById('resultCard');
    var resultTitle = document.getElementById('resultTitle');
    resultTitle.textContent = isCorrect ? '正解です!' : '不正解です。もう一度見直してみましょう。';
    resultTitle.style.color = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.borderColor = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.background = isCorrect ? 'rgba(99,153,34,0.14)' : 'rgba(216,90,48,0.14)';
    document.getElementById('resultExplanation').textContent = p.explanation;
    resultCard.classList.add('show');
  }

  function handleNext() {
    state.problem = generateProblem();
    renderProblem();
  }

  document.getElementById('checkBtn').addEventListener('click', handleCheck);
  document.getElementById('nextBtn').addEventListener('click', handleNext);
  document.getElementById('input1').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });
  document.getElementById('input2').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });

  state.problem = generateProblem();
  renderProblem();
})();
</script>
</body>
</html>
