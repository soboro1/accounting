<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F5F8FC"/>
  <foreignObject x="0" y="0" width="1600" height="900">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Hiragino Sans','Noto Sans CJK JP',sans-serif;color:#1F3A5F;width:1600px;height:900px;box-sizing:border-box;padding:34px 56px 0;">
      <style>
        .ttl{font-size:38px;font-weight:800;margin:0;letter-spacing:1px}
        .sub{font-size:18px;color:#4A5D78;margin:6px 0 16px}
        .grid{display:grid;grid-template-columns:64px 1fr 1fr;grid-template-rows:44px 300px 300px;gap:12px}
        .hd{border-radius:14px;color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:4px}
        .rl{background:#1F3A5F;color:#fff;border-radius:14px;font-size:22px;font-weight:800;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;letter-spacing:6px}
        .cell{background:#fff;border:2px solid #C9D6E8;border-radius:24px;padding:16px 22px 10px;box-sizing:border-box}
        .badge{display:inline-block;font-size:19px;font-weight:800;color:#fff;border-radius:999px;padding:3px 16px;margin-bottom:8px}
        ul{margin:0;padding-left:1.1em}
        li{font-size:18px;line-height:1.5;margin:0 0 8px;color:#2A3B55}
        li b{color:#1F3A5F}
        .n{color:#7C8BA3;font-size:14px;white-space:nowrap}
        .usp{margin-top:14px;background:#1F3A5F;border-radius:20px;color:#fff;padding:14px 26px;display:flex;align-items:center;gap:18px}
        .usp .k{background:#16A34A;border-radius:999px;font-weight:800;font-size:18px;padding:4px 16px;white-space:nowrap}
        .usp .t{font-size:20px;font-weight:700;line-height:1.5}
      </style>
      <p class="ttl">Netflix（日本）のSWOT分析</p>
      <p class="sub">3C分析の30項目をもとに整理（［ ］内は3C分析の項目番号）　※ 解釈によって分類は変わります</p>
      <div class="grid">
        <div></div>
        <div class="hd" style="background:#1F6FEB">ポジティブ</div>
        <div class="hd" style="background:#7C3AED">ネガティブ</div>

        <div class="rl">内部要因</div>
        <div class="cell">
          <span class="badge" style="background:#1F6FEB">S　強み</span>
          <ul>
            <li><b>認知度と接点</b>（会員700万人超、リモコンのNetflixボタン）<span class="n">［1・6］</span></li>
            <li><b>独自コンテンツ</b>（『今際の国のアリス』など、アニメ独占契約）<span class="n">［2・3］</span></li>
            <li><b>視聴体験の質</b>（日本人向けレコメンド、高精度な吹替・字幕）<span class="n">［4・8］</span></li>
            <li><b>作り手と体験への投資</b>（クリエイター育成、ポップアップストア）<span class="n">［9・10］</span></li>
          </ul>
        </div>
        <div class="cell">
          <span class="badge" style="background:#7C3AED">W　弱み</span>
          <ul>
            <li><b>共有制限への反発</b>（共有の有料化にSNSで一部反発）<span class="n">［7］</span></li>
            <li><b>低価格プランの副作用</b>（広告付き790円でプレミアム感が低下）<span class="n">［5］</span></li>
            <li><b>国内作品の網羅性</b>（国内作品数はU-NEXTなどに劣ることも）<span class="n">［12］</span></li>
          </ul>
        </div>

        <div class="rl">外部要因</div>
        <div class="cell">
          <span class="badge" style="background:#1F6FEB">O　機会</span>
          <ul>
            <li><b>日本アニメの世界的人気</b>（海外でのヒットが国内に逆輸入される）<span class="n">［25］</span></li>
            <li><b>視聴スタイルの変化</b>（スマホで個人視聴、タイパ重視の倍速）<span class="n">［22・24］</span></li>
            <li><b>新しい利用層</b>（シニアのスマホ普及、語学学習、推し活）<span class="n">［27・28・29］</span></li>
            <li><b>SNSのリアルタイムの盛り上がり</b>（WBCのような話題づくりに追い風）<span class="n">［26］</span></li>
          </ul>
        </div>
        <div class="cell">
          <span class="badge" style="background:#7C3AED">T　脅威</span>
          <ul>
            <li><b>競合の攻勢</b>（アマプラの普及率、U-NEXTの作品数、Disney+のアニメ、DMM TVの550円）<span class="n">［11・12・13・20］</span></li>
            <li><b>無料サービスとの時間の奪い合い</b>（TVer・YouTube等）<span class="n">［14・15・16］</span></li>
            <li><b>サブスクの選別</b>（物価高で「1つに絞る」、キャリアのセット販売）<span class="n">［19・23］</span></li>
            <li><b>市場の縮小</b>（人口減少・少子高齢化）<span class="n">［21］</span></li>
          </ul>
        </div>
      </div>
      <div class="usp">
        <span class="k">USP（案）</span>
        <span class="t">ここでしか見られない日本発のヒット作と世界の話題作を、リモコンのボタンひとつで、高品質な吹替・字幕で楽しめる</span>
      </div>
    </div>
  </foreignObject>
</svg>
