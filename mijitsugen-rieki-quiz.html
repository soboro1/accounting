<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未実現利益 ランダム問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #101b2d;
    color: #f6f1e6;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .kicker { font-size: 13px; letter-spacing: 3px; color: #d4a24c; font-weight: 700; }
  h1 { font-size: 26px; font-weight: 700; margin: 4px 0 0 0; }
  .score-label { font-size: 13px; color: #9aa5b1; text-align: right; }
  .score-value { font-size: 22px; font-weight: 700; color: #d4a24c; text-align: right; }

  .topic-badge {
    display: inline-flex; align-self: flex-start;
    padding: 6px 16px; border-radius: 999px;
    background: rgba(212,162,76,0.18); border: 1px solid #d4a24c;
    font-size: 13px; font-weight: 700; color: #d4a24c; letter-spacing: 1px;
  }

  .problem-card {
    padding: 20px 24px; border: 1px solid rgba(212,162,76,0.35); border-radius: 12px;
    background: rgba(255,255,255,0.03); display: flex; flex-direction: column; gap: 6px;
  }
  .problem-line { font-size: 16px; line-height: 1.9; color: #e8e3d8; }
  .problem-line b { color: #f6f1e6; }

  .inputs-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .input-group { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 14px; color: #c7c0b0; }
  .input-group input {
    padding: 10px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid rgba(212,162,76,0.4); background: #0e1726; color: #f6f1e6; font-family: inherit;
  }
  .input-group input::placeholder { color: #6b7688; }
  .input-group input:focus { outline: none; border-color: #d4a24c; }

  .hint { font-size: 12px; color: #8b93a1; }
  .error { font-size: 13px; color: #f0997b; display: none; }

  .buttons-row { display: flex; gap: 12px; flex-wrap: wrap; }
  button { font-family: inherit; cursor: pointer; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 700; border: none; }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.95); }
  .btn-primary { color: #101b2d; background: #d4a24c; }
  .btn-secondary { color: #d4a24c; background: transparent; border: 1px solid #d4a24c; }

  .result-card { padding: 18px 22px; border-radius: 12px; border: 2px solid; display: none; flex-direction: column; gap: 8px; }
  .result-card.show { display: flex; }
  .result-title { font-size: 17px; font-weight: 700; }
  .result-explanation { font-size: 14px; line-height: 1.8; color: #e8e3d8; white-space: pre-line; }

  .footer-note { font-size: 12px; color: #6b7688; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">

  <div class="header-row">
    <div>
      <div class="kicker">BOOKKEEPING 連結会計 未実現利益</div>
      <h1>未実現利益 ランダム問題</h1>
    </div>
    <div>
      <div class="score-label">スコア</div>
      <div class="score-value"><span id="score">0</span> / <span id="total">0</span></div>
    </div>
  </div>

  <div class="topic-badge" id="topicBadge"></div>

  <div class="problem-card" id="problemCard"></div>

  <div class="inputs-row">
    <div class="input-group">
      <label id="label1"></label>
      <input type="text" id="input1" autocomplete="off">
    </div>
    <div class="input-group">
      <label id="label2"></label>
      <input type="text" id="input2" autocomplete="off">
    </div>
  </div>
  <div class="hint">半角数字、カンマなしで入力(単位は千円)。マイナスは先頭に「-」。税効果は考えない。解説に仕訳も出ます。</div>
  <div class="error" id="errorText"></div>

  <div class="buttons-row">
    <button class="btn-primary" id="checkBtn">解答する</button>
    <button class="btn-secondary" id="nextBtn">次の問題へ</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-explanation" id="resultExplanation"></div>
  </div>

  <div class="footer-note">連結会計 未実現利益の消去の練習用アプリ(自己採点)</div>

</div>

<script>
(function () {
  var state = { problem: null, score: 0, total: 0 };

  function randMultiple(min, max, step) {
    var n = Math.floor(Math.random() * ((max - min) / step + 1));
    return min + n * step;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fmt(n) {
    var s = Math.abs(Math.round(n)).toLocaleString('ja-JP');
    return (n < 0 ? '−' : '') + s;
  }
  function sg(n) { return (n > 0 ? '+' : '') + fmt(n); }
  function je(dr, cr) {
    // dr, cr: [[科目, 金額], ...]
    return dr.map(function (x) { return '(借)' + x[0] + ' ' + fmt(x[1]); }).join('\n') + '\n' +
           cr.map(function (x) { return '(貸)' + x[0] + ' ' + fmt(x[1]); }).join('\n');
  }

  // 利益率(売価基準)か付加率(原価基準)か。在庫額と未実現利益(10の倍数)を作る
  function rateSpec() {
    if (Math.random() < 0.5) {
      var r = pick([10, 15, 20, 25, 30, 40]);
      return {
        text: '売上総利益率<b>' + r + '%</b>(売価の' + r + '%が利益)',
        inv: function () { var E = randMultiple(2, 20, 1) * 1000; return { E: E, UP: E * r / 100 }; },
        calc: function (E, UP) { return fmt(E) + ' × ' + r + '% = ' + fmt(UP); },
        note: '利益率は売価に対する割合なので、在庫(売価)にそのまま掛ける。'
      };
    }
    var m = pick([10, 20, 25, 50]);
    return {
      text: '原価に<b>' + m + '%</b>の利益を加算(付加率' + m + '%)',
      inv: function () { var t = randMultiple(2, 16, 1) * 10; return { E: (100 + m) * t, UP: m * t }; },
      calc: function (E, UP) { return fmt(E) + ' × ' + m + '/' + (100 + m) + ' = ' + fmt(UP); },
      note: '付加率は原価に対する割合。在庫は売価なので「' + m + '/' + (100 + m) + '」を掛ける(' + m + '%を掛けるのは誤り)。'
    };
  }

  // ① ダウンストリーム:棚卸資産と連結売上原価
  function genDownInventory() {
    var rs = rateSpec();
    var own = pick([60, 70, 80, 100]);
    var Sint = randMultiple(30, 90, 1) * 1000;
    var end = rs.inv();
    var hasBeg = Math.random() < 0.6;
    var beg = hasBeg ? rs.inv() : { E: 0, UP: 0 };
    var Pc = randMultiple(100, 250, 1) * 1000;
    var Sc = Sint + randMultiple(10, 60, 1) * 1000;
    var cons = Pc + Sc - Sint + end.UP - beg.UP;
    var lines = [
      'P社(親会社)はS社(子会社、P社の持分<b>' + own + '%</b>)に商品を販売しており、利益の付け方は' + rs.text + 'である。',
      '当期のP社からS社への売上高は<b>' + fmt(Sint) + '千円</b>。',
      (hasBeg ? 'S社の期首商品のうちP社から仕入れた分は<b>' + fmt(beg.E) + '千円</b>、' : 'S社の期首商品にP社から仕入れた分はない。') +
        '期末商品のうちP社から仕入れた分は<b>' + fmt(end.E) + '千円</b>。',
      '個別P/Lの売上原価はP社<b>' + fmt(Pc) + '千円</b>、S社<b>' + fmt(Sc) + '千円</b>である。'
    ];
    var ex =
      'ダウンストリーム(親会社→子会社)なので、非支配株主がいても未実現利益は全額親会社の負担になる。\n' +
      rs.note + '\n' +
      '期末の未実現利益 = ' + rs.calc(end.E, end.UP) + '\n' +
      (hasBeg ? '期首の未実現利益 = ' + rs.calc(beg.E, beg.UP) + '(当期に外部へ売れて実現する)\n' : '') +
      '連結売上原価 = ' + fmt(Pc) + ' + ' + fmt(Sc) + ' − 内部取引 ' + fmt(Sint) + ' + 期末 ' + fmt(end.UP) +
        (hasBeg ? ' − 期首 ' + fmt(beg.UP) : '') + ' = ' + fmt(cons) + '\n' +
      '【仕訳】\n内部取引の相殺:\n' + je([['売上高', Sint]], [['売上原価', Sint]]) + '\n' +
      (hasBeg ? '期首分(開始仕訳):\n' + je([['利益剰余金当期首残高', beg.UP]], [['商品', beg.UP]]) + '\n' +
                '期首分(実現):\n' + je([['商品', beg.UP]], [['売上原価', beg.UP]]) + '\n' : '') +
      '期末分(消去):\n' + je([['売上原価', end.UP]], [['商品', end.UP]]);
    return {
      badge: '棚卸資産・ダウンストリーム(親→子)',
      lines: lines,
      label1: '期末商品に含まれる未実現利益(千円)',
      label2: '連結P/Lの売上原価(千円)',
      ph1: '例: 1200', ph2: '例: 185000',
      answers: [end.UP, cons],
      explanation: ex
    };
  }

  // ② アップストリーム:非支配株主への配分
  function genUpInventory() {
    var rs = rateSpec();
    var own = pick([60, 70, 80]);
    var n = 100 - own;
    var Sint = randMultiple(30, 90, 1) * 1000;
    var end = rs.inv();
    var hasBeg = Math.random() < 0.6;
    var beg = hasBeg ? rs.inv() : { E: 0, UP: 0 };
    var nEnd = end.UP * n / 100, nBeg = beg.UP * n / 100;
    var effect = -(end.UP - beg.UP) * own / 100;
    var lines = [
      'S社(子会社、P社の持分<b>' + own + '%</b>)はP社(親会社)に商品を販売しており、利益の付け方は' + rs.text + 'である。',
      '当期のS社からP社への売上高は<b>' + fmt(Sint) + '千円</b>。',
      (hasBeg ? 'P社の期首商品のうちS社から仕入れた分は<b>' + fmt(beg.E) + '千円</b>、' : 'P社の期首商品にS社から仕入れた分はない。') +
        '期末商品のうちS社から仕入れた分は<b>' + fmt(end.E) + '千円</b>。'
    ];
    var ex =
      'アップストリーム(子会社→親会社)なので、利益を出したのはS社。消去額を非支配株主にも' + n + '%負担させる。\n' +
      rs.note + '\n' +
      '期末の未実現利益 = ' + rs.calc(end.E, end.UP) + '、非支配株主の負担 = ' + fmt(end.UP) + ' × ' + n + '% = ' + fmt(nEnd) + '\n' +
      (hasBeg ? '期首の未実現利益 = ' + rs.calc(beg.E, beg.UP) + '、非支配株主の負担 = ' + fmt(nBeg) + '(当期に実現)\n' : '') +
      '親会社株主に帰属する当期純利益への影響 = −(' + fmt(end.UP) + (hasBeg ? ' − ' + fmt(beg.UP) : '') + ')× ' + own + '% = ' + sg(effect) + '\n' +
      '【仕訳】\n内部取引の相殺:\n' + je([['売上高', Sint]], [['売上原価', Sint]]) + '\n' +
      (hasBeg ?
        '期首分(開始仕訳):\n' + je([['利益剰余金当期首残高', beg.UP]], [['商品', beg.UP]]) + '\n' +
        je([['非支配株主持分当期首残高', nBeg]], [['利益剰余金当期首残高', nBeg]]) + '\n' +
        '期首分(実現):\n' + je([['商品', beg.UP]], [['売上原価', beg.UP]]) + '\n' +
        je([['非支配株主に帰属する当期純利益', nBeg]], [['非支配株主持分当期変動額', nBeg]]) + '\n' : '') +
      '期末分(消去):\n' + je([['売上原価', end.UP]], [['商品', end.UP]]) + '\n' +
      je([['非支配株主持分当期変動額', nEnd]], [['非支配株主に帰属する当期純利益', nEnd]]);
    return {
      badge: '棚卸資産・アップストリーム(子→親)',
      lines: lines,
      label1: '期末商品に含まれる未実現利益(千円)',
      label2: '親会社株主に帰属する当期純利益への影響額(減少は−、千円)',
      ph1: '例: 1200', ph2: '例: -560',
      answers: [end.UP, effect],
      explanation: ex
    };
  }

  // ③ 土地(非償却資産)
  function genLand() {
    var down = Math.random() < 0.5;
    var own = pick([60, 70, 80]);
    var n = 100 - own;
    var Lb = randMultiple(20, 80, 1) * 1000;
    var g = randMultiple(2, 20, 1) * 1000;
    var Lp = Lb + g;
    var seller = down ? 'P社(親会社)' : 'S社(子会社)';
    var buyer = down ? 'S社(子会社)' : 'P社(親会社)';
    var ng = g * n / 100;
    var dirText = down ? 'ダウンストリームなので全額親会社の負担。' : 'アップストリームなので非支配株主にも' + n + '%(' + fmt(ng) + ')負担させる。';
    var ncEntry = function (realize) {
      if (down) return '';
      return realize ? je([['非支配株主に帰属する当期純利益', ng]], [['非支配株主持分当期変動額', ng]]) + '\n'
                     : je([['非支配株主持分当期変動額', ng]], [['非支配株主に帰属する当期純利益', ng]]) + '\n';
    };
    var base = [
      'S社はP社の子会社で、P社の持分は<b>' + own + '%</b>である。',
      seller + 'は帳簿価額<b>' + fmt(Lb) + '千円</b>の土地を' + buyer + 'に<b>' + fmt(Lp) + '千円</b>で売却した。'
    ];
    if (Math.random() < 0.5) {
      var effect = down ? -g : -g * own / 100;
      return {
        badge: '土地・' + (down ? 'ダウンストリーム' : 'アップストリーム') + '(売却した年度)',
        lines: base.concat([buyer + 'は期末現在、この土地を保有している。']),
        label1: '消去する未実現利益(千円)',
        label2: '親会社株主に帰属する当期純利益への影響額(減少は−、千円)',
        ph1: '例: 5000', ph2: '例: -3500',
        answers: [g, effect],
        explanation:
          '未実現利益 = 売却価額 ' + fmt(Lp) + ' − 帳簿価額 ' + fmt(Lb) + ' = ' + fmt(g) + '\n' +
          '土地は償却しないので、グループ外に売るまで未実現利益はずっと残る。\n' + dirText + '\n' +
          '親会社株主に帰属する当期純利益への影響 = ' + (down ? '−' + fmt(g) : '−' + fmt(g) + ' × ' + own + '%') + ' = ' + sg(effect) + '\n' +
          '【仕訳】\n' + je([['固定資産売却益', g]], [['土地', g]]) + '\n' + ncEntry(false)
      };
    }
    var X = Lp + randMultiple(-8, 15, 1) * 1000;
    var indiv = X - Lp, cons = X - Lb;
    return {
      badge: '土地・' + (down ? 'ダウンストリーム' : 'アップストリーム') + '(外部へ売却した年度)',
      lines: [
        'S社はP社の子会社で、P社の持分は<b>' + own + '%</b>である。',
        '前期に、' + seller + 'は帳簿価額<b>' + fmt(Lb) + '千円</b>の土地を' + buyer + 'に<b>' + fmt(Lp) + '千円</b>で売却した。',
        '当期に、' + buyer + 'はこの土地をグループ外の会社に<b>' + fmt(X) + '千円</b>で売却した。'
      ],
      label1: buyer.slice(0, 2) + 'の個別P/Lの土地売却損益(利益は+、千円)',
      label2: '連結P/Lの土地売却損益(利益は+、千円)',
      ph1: '例: 3000 / -2000', ph2: '例: 9000',
      answers: [indiv, cons],
      explanation:
        '個別:売却価額 ' + fmt(X) + ' − 取得価額 ' + fmt(Lp) + ' = ' + sg(indiv) + '\n' +
        '連結:グループとしての取得原価は' + seller.slice(0, 2) + 'の帳簿価額 ' + fmt(Lb) + ' なので、' + fmt(X) + ' − ' + fmt(Lb) + ' = ' + sg(cons) + '\n' +
        '前期に消した未実現利益 ' + fmt(g) + ' が、外部に売れた当期にまとめて実現する。\n' + dirText + '\n' +
        '【仕訳】\n開始仕訳:\n' + je([['利益剰余金当期首残高', g]], [['土地', g]]) + '\n' +
        (down ? '' : je([['非支配株主持分当期首残高', ng]], [['利益剰余金当期首残高', ng]]) + '\n') +
        '実現:\n' + je([['土地', g]], [['固定資産売却損益', g]]) + '\n' + ncEntry(true)
    };
  }

  // 共通:スマートカートの前提
  function cartBase() {
    var c = pick([60, 80, 100, 120]);
    var m = pick([20, 25, 50]);
    var u = c * (100 + m) / 100;
    return { c: c, u: u, m: m };
  }

  // ④ 償却資産(スマートカート):償却費の修正と残高
  function genCartDep() {
    var b = cartBase();
    var L, N, UP;
    for (var t = 0; t < 30; t++) {
      L = pick([4, 5, 6]);
      N = randMultiple(1, 20, 1) * 1000;
      UP = N * (b.u - b.c);
      if (UP % (12 * L) === 0) break;
    }
    var mo = pick([[12, '4月1日'], [9, '7月1日'], [6, '10月1日'], [3, '1月1日']]);
    var y = pick([1, 2, 3]);
    var monthly = UP / (12 * L);
    var cur = y === 1 ? mo[0] : 12;
    var cum = mo[0] + 12 * (y - 1);
    var curAdj = monthly * cur, prior = monthly * (cum - cur), remain = UP - monthly * cum;
    var sDep = N * b.u * cur / (12 * L);
    var shortcut = Number.isInteger(sDep)
      ? '(近道)S社の当期償却費 ' + fmt(sDep) + ' × 利益率 ' + (b.u - b.c) + '/' + b.u + ' = ' + fmt(curAdj) + '\n' : '';
    var ex =
      '未実現利益 = ' + fmt(N) + '台 ×(' + b.u + ' − ' + b.c + ')= ' + fmt(UP) + '\n' +
      'S社は' + fmt(N * b.u) + 'で償却しているが、グループの取得原価は' + fmt(N * b.c) + '。差額の分だけ償却費が多すぎる。\n' +
      '1か月あたりの修正 = ' + fmt(UP) + ' ÷(' + L + '年 × 12か月)= ' + fmt(monthly) + '\n' +
      '第' + y + '年度の修正 = ' + fmt(monthly) + ' × ' + cur + 'か月 = ' + fmt(curAdj) + '\n' + shortcut +
      '期末までの使用月数 = ' + cum + 'か月 → 実現した累計 = ' + fmt(monthly * cum) + '\n' +
      '期末の未実現利益の残高 = ' + fmt(UP) + ' − ' + fmt(monthly * cum) + ' = ' + fmt(remain) + '\n' +
      '【仕訳】\n' +
      (y === 1
        ? '内部取引と未実現利益の消去(P社は製品として売っているので売上高・売上原価を相殺):\n' +
          je([['売上高', N * b.u]], [['売上原価', N * b.c], ['備品', UP]]) + '\n'
        : '開始仕訳(取得時の消去):\n' + je([['利益剰余金当期首残高', UP]], [['備品', UP]]) + '\n' +
          '開始仕訳(前期までの償却修正):\n' + je([['減価償却累計額', prior]], [['利益剰余金当期首残高', prior]]) + '\n') +
      '当期の償却修正:\n' + je([['減価償却累計額', curAdj]], [['減価償却費', curAdj]]);
    return {
      badge: '償却資産(スマートカート)・ダウンストリーム',
      check: Number.isInteger(monthly),
      lines: [
        'P社(親会社、スマートカートのメーカー)はS社(子会社、スーパーを運営)に、スマートカート<b>' + fmt(N) + '台</b>を1台<b>' + b.u + '千円</b>で販売した。P社の製造原価は1台<b>' + b.c + '千円</b>である。',
        'S社は第1年度の<b>' + mo[1] + '</b>に取得して店舗で使っており、耐用年数<b>' + L + '年</b>・残存価額ゼロ・定額法(月割)で償却している。会計期間は4月1日〜3月31日。',
        '<b>第' + y + '年度</b>の連結修正について答えなさい。'
      ],
      label1: '第' + y + '年度の減価償却費の修正額(千円)',
      label2: '第' + y + '年度末の未実現利益の残高(千円)',
      ph1: '例: 12500', ph2: '例: 37500',
      answers: [curAdj, remain],
      explanation: ex
    };
  }

  // ⑤ スマートカートの廃棄・外部売却
  function genCartDispose() {
    var b = cartBase();
    var L = pick([4, 5]);
    var N = randMultiple(5, 20, 1) * 1000;
    var k = randMultiple(2, L - 1, 1);
    var nn = randMultiple(1, 10, 1) * 100;
    var lotUP = nn * (b.u - b.c);
    var annual = lotUP / L;
    var prior = annual * (k - 1);
    var remain = lotUP - annual * k;
    var bvS = nn * b.u * (L - k) / L, bvC = nn * b.c * (L - k) / L;
    var sell = Math.random() < 0.5;
    var common = [
      'P社(親会社、スマートカートのメーカー)はS社(子会社)に、スマートカート<b>' + fmt(N) + '台</b>を1台<b>' + b.u + '千円</b>で販売した。P社の製造原価は1台<b>' + b.c + '千円</b>である。',
      'S社は第1年度の4月1日に取得し、耐用年数<b>' + L + '年</b>・残存価額ゼロ・定額法で償却している。'
    ];
    var head =
      'このロット' + fmt(nn) + '台の未実現利益 = ' + fmt(nn) + ' ×(' + b.u + ' − ' + b.c + ')= ' + fmt(lotUP) + '\n' +
      '1年あたりの実現 = ' + fmt(lotUP) + ' ÷ ' + L + ' = ' + fmt(annual) + '、' + k + '年分で ' + fmt(annual * k) + ' が実現済み\n' +
      '残りの未実現利益 = ' + fmt(lotUP) + ' − ' + fmt(annual * k) + ' = ' + fmt(remain) + ' → グループ外に出たので一気に実現\n' +
      'S社の帳簿価額 = ' + fmt(nn * b.u) + ' ×(' + L + ' − ' + k + ')/' + L + ' = ' + fmt(bvS) + '\n' +
      'グループの帳簿価額 = ' + fmt(nn * b.c) + ' ×(' + L + ' − ' + k + ')/' + L + ' = ' + fmt(bvC) + '(差額 ' + fmt(bvS - bvC) + ' = 残りの未実現利益)\n';
    var jeHead =
      '【仕訳】(廃棄・売却した' + fmt(nn) + '台分)\n開始仕訳:\n' + je([['利益剰余金当期首残高', lotUP]], [['備品', lotUP]]) + '\n' +
      je([['減価償却累計額', prior]], [['利益剰余金当期首残高', prior]]) + '\n' +
      '当期の償却修正:\n' + je([['減価償却累計額', annual]], [['減価償却費', annual]]) + '\n';
    if (!sell) {
      return {
        badge: '償却資産(スマートカート)・廃棄',
        lines: common.concat(['<b>第' + k + '年度末</b>(当期の償却後)に、S社は故障した<b>' + fmt(nn) + '台</b>を廃棄した。']),
        label1: '廃棄によって実現する未実現利益(千円)',
        label2: '連結P/Lの固定資産除却損(千円)',
        ph1: '例: 5000', ph2: '例: 20000',
        answers: [remain, bvC],
        explanation: head +
          'S社の個別の除却損は ' + fmt(bvS) + '。連結では ' + fmt(remain) + ' 減らして ' + fmt(bvC) + '\n' + jeHead +
          '廃棄(備品の修正を消し、残りを除却損で調整):\n' +
          je([['備品', lotUP]], [['減価償却累計額', annual * k], ['固定資産除却損', remain]])
      };
    }
    var s = randMultiple(1, Math.max(2, Math.round(b.u * (L - k) / L / 5)), 1) * 5;
    var indiv = nn * s - bvS, cons = nn * s - bvC;
    return {
      badge: '償却資産(スマートカート)・外部へ売却',
      lines: common.concat(['<b>第' + k + '年度末</b>(当期の償却後)に、S社は<b>' + fmt(nn) + '台</b>をグループ外の会社に1台<b>' + s + '千円</b>で売却した。']),
      label1: '売却によって実現する未実現利益(千円)',
      label2: '連結P/Lの固定資産売却損益(利益は+、千円)',
      ph1: '例: 5000', ph2: '例: 3000 / -2000',
      answers: [remain, cons],
      explanation: head +
        '売却価額 = ' + fmt(nn) + ' × ' + s + ' = ' + fmt(nn * s) + '\n' +
        'S社の個別:' + fmt(nn * s) + ' − ' + fmt(bvS) + ' = ' + sg(indiv) + '\n' +
        '連結:' + fmt(nn * s) + ' − ' + fmt(bvC) + ' = ' + sg(cons) + '(個別より ' + fmt(remain) + ' 有利)\n' + jeHead +
        '売却(備品の修正を消し、残りを売却損益で調整):\n' +
        je([['備品', lotUP]], [['減価償却累計額', annual * k], ['固定資産売却損益', remain]])
    };
  }

  function generateProblem() {
    for (var i = 0; i < 50; i++) {
      var y = Math.random(), p;
      if (y < 0.25) p = genDownInventory();
      else if (y < 0.45) p = genUpInventory();
      else if (y < 0.6) p = genLand();
      else if (y < 0.82) p = genCartDep();
      else p = genCartDispose();
      if (p.check !== false && p.answers.every(Number.isInteger)) return p;
    }
    return genDownInventory();
  }

  function renderProblem() {
    var p = state.problem;
    document.getElementById('topicBadge').textContent = '【 ' + p.badge + ' 】';
    document.getElementById('problemCard').innerHTML = p.lines.map(function (l) {
      return '<div class="problem-line">' + l + '</div>';
    }).join('');
    document.getElementById('label1').textContent = p.label1;
    document.getElementById('label2').textContent = p.label2;
    var i1 = document.getElementById('input1');
    var i2 = document.getElementById('input2');
    i1.placeholder = p.ph1;
    i2.placeholder = p.ph2;
    i1.value = '';
    i2.value = '';
    document.getElementById('errorText').style.display = 'none';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;
  }

  function parseSigned(s) {
    if (s === undefined || s === null) return NaN;
    var t = String(s).trim().replace(/,/g, '').replace(/千円/g, '').replace(/円/g, '').replace(/[−▲△]/g, '-');
    if (t === '' || t === '-' || t === '+') return NaN;
    return Number(t);
  }

  function handleCheck() {
    var u1 = parseSigned(document.getElementById('input1').value);
    var u2 = parseSigned(document.getElementById('input2').value);
    var errEl = document.getElementById('errorText');
    if (isNaN(u1) || isNaN(u2)) {
      errEl.textContent = '両方の欄に数値を入力してください';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    var p = state.problem;
    var isCorrect = u1 === p.answers[0] && u2 === p.answers[1];
    state.total += 1;
    if (isCorrect) state.score += 1;
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;

    var resultCard = document.getElementById('resultCard');
    var resultTitle = document.getElementById('resultTitle');
    resultTitle.textContent = isCorrect ? '正解です!' : '不正解です。正解は ' + fmt(p.answers[0]) + ' / ' + fmt(p.answers[1]) + '(千円)';
    resultTitle.style.color = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.borderColor = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.background = isCorrect ? 'rgba(99,153,34,0.14)' : 'rgba(216,90,48,0.14)';
    document.getElementById('resultExplanation').textContent = p.explanation;
    resultCard.classList.add('show');
  }

  function handleNext() {
    state.problem = generateProblem();
    renderProblem();
  }

  document.getElementById('checkBtn').addEventListener('click', handleCheck);
  document.getElementById('nextBtn').addEventListener('click', handleNext);
  document.getElementById('input1').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });
  document.getElementById('input2').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });

  state.problem = generateProblem();
  renderProblem();
})();
</script>
</body>
</html>
