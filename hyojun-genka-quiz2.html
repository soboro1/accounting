<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>標準原価計算(総合) ランダム問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #101b2d;
    color: #f6f1e6;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .kicker { font-size: 13px; letter-spacing: 3px; color: #d4a24c; font-weight: 700; }
  h1 { font-size: 26px; font-weight: 700; margin: 4px 0 0 0; }
  .score-label { font-size: 13px; color: #9aa5b1; text-align: right; }
  .score-value { font-size: 22px; font-weight: 700; color: #d4a24c; text-align: right; }

  .topic-badge {
    display: inline-flex; align-self: flex-start;
    padding: 6px 16px; border-radius: 999px;
    background: rgba(212,162,76,0.18); border: 1px solid #d4a24c;
    font-size: 13px; font-weight: 700; color: #d4a24c; letter-spacing: 1px;
  }

  .problem-card {
    padding: 20px 24px; border: 1px solid rgba(212,162,76,0.35); border-radius: 12px;
    background: rgba(255,255,255,0.03); display: flex; flex-direction: column; gap: 6px;
  }
  .problem-line { font-size: 16px; line-height: 1.9; color: #e8e3d8; }
  .problem-line b { color: #f6f1e6; }

  .inputs-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .input-group { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 14px; color: #c7c0b0; }
  .input-group input {
    padding: 10px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid rgba(212,162,76,0.4); background: #0e1726; color: #f6f1e6; font-family: inherit;
  }
  .input-group input::placeholder { color: #6b7688; }
  .input-group input:focus { outline: none; border-color: #d4a24c; }

  .hint { font-size: 12px; color: #8b93a1; }
  .error { font-size: 13px; color: #f0997b; display: none; }

  .buttons-row { display: flex; gap: 12px; flex-wrap: wrap; }
  button { font-family: inherit; cursor: pointer; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 700; border: none; }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.95); }
  .btn-primary { color: #101b2d; background: #d4a24c; }
  .btn-secondary { color: #d4a24c; background: transparent; border: 1px solid #d4a24c; }

  .result-card { padding: 18px 22px; border-radius: 12px; border: 2px solid; display: none; flex-direction: column; gap: 8px; }
  .result-card.show { display: flex; }
  .result-title { font-size: 17px; font-weight: 700; }
  .result-explanation { font-size: 14px; line-height: 1.8; color: #e8e3d8; white-space: pre-line; }

  .footer-note { font-size: 12px; color: #6b7688; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">

  <div class="header-row">
    <div>
      <div class="kicker">BOOKKEEPING LV.1 工業簿記 標準原価計算</div>
      <h1>標準原価計算(総合) ランダム問題</h1>
    </div>
    <div>
      <div class="score-label">スコア</div>
      <div class="score-value"><span id="score">0</span> / <span id="total">0</span></div>
    </div>
  </div>

  <div class="topic-badge" id="topicBadge"></div>

  <div class="problem-card" id="problemCard"></div>

  <div class="inputs-row">
    <div class="input-group">
      <label id="label1"></label>
      <input type="text" id="input1" autocomplete="off">
    </div>
    <div class="input-group">
      <label id="label2"></label>
      <input type="text" id="input2" autocomplete="off">
    </div>
  </div>
  <div class="hint">半角数字、カンマなしで入力。不利差異はマイナス(先頭に「-」)、有利差異はプラスで入力してください。</div>
  <div class="error" id="errorText"></div>

  <div class="buttons-row">
    <button class="btn-primary" id="checkBtn">解答する</button>
    <button class="btn-secondary" id="nextBtn">次の問題へ</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-explanation" id="resultExplanation"></div>
  </div>

  <div class="footer-note">簿記1級 標準原価計算(配合差異・歩留差異・四分法など)の練習用アプリ(自己採点)</div>

</div>

<script>
(function () {
  var state = { problem: null, score: 0, total: 0 };

  function randMultiple(min, max, step) {
    var n = Math.floor(Math.random() * ((max - min) / step + 1));
    return min + n * step;
  }
  function randNonZero(min, max, step) {
    var v = 0;
    while (v === 0) { v = randMultiple(min, max, step); }
    return v;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fmt(n) {
    var s = Math.abs(n).toLocaleString('ja-JP');
    return (n < 0 ? '−' : '') + s;
  }
  function sgn(n) { return (n >= 0 ? '+' : '−') + Math.abs(n).toLocaleString('ja-JP'); }
  function fav(n) { return n > 0 ? '有利' : (n < 0 ? '不利' : ''); }

  function genMixYield() {
    var pair = pick([[5, 3], [3, 1], [3, 2], [7, 3]]);
    var a = pair[0], b = pair[1], s = a + b;
    var pA = randMultiple(5, 20, 1) * 10;
    var pB = pA;
    while (pB === pA) { pB = randMultiple(5, 30, 1) * 10; }
    var N = randMultiple(5, 30, 5) * 100;
    var k = N + randNonZero(-10, 10, 1) * 10;
    var actA = a * k + randNonZero(-20, 20, 5) * 10;
    var actB = k * s - actA;
    var mix = (a * k - actA) * (pA - pB);
    var yld = (N - k) * (a * pA + b * pB);
    var qty = (N * a - actA) * pA + (N * b - actB) * pB;
    var avg = (a * pA + b * pB) / s;
    return {
      badge: '材料の配合差異・歩留差異',
      check: qty,
      lines: [
        '材料Aと材料Bを<b>' + a + ':' + b + '</b>の割合で配合して製品を作る(製品1個あたり標準消費量 A ' + a + 'kg・B ' + b + 'kg)。標準価格は A <b>@' + pA + '円</b>・B <b>@' + pB + '円</b>。',
        '当月の投入換算量は<b>' + fmt(N) + '個分</b>。実際消費量は A <b>' + fmt(actA) + 'kg</b>・B <b>' + fmt(actB) + 'kg</b>(合計' + fmt(actA + actB) + 'kg)であった。'
      ],
      label1: '配合差異(円)',
      label2: '歩留差異(円)',
      ph1: '例: 14000', ph2: '例: -30000',
      answers: [mix, yld],
      explanation:
        '標準消費量:A ' + fmt(N * a) + 'kg、B ' + fmt(N * b) + 'kg(合計' + fmt(N * s) + 'kg)\n' +
        '実際総消費量 ' + fmt(k * s) + 'kg を標準配合(' + a + ':' + b + ')で混ぜた場合:A ' + fmt(a * k) + 'kg、B ' + fmt(b * k) + 'kg\n' +
        '配合差異 = (標準配合での消費量 − 実際消費量)× 標準価格\n' +
        '　A:(' + fmt(a * k) + ' − ' + fmt(actA) + ')× ' + pA + ' = ' + fmt((a * k - actA) * pA) + '円\n' +
        '　B:(' + fmt(b * k) + ' − ' + fmt(actB) + ')× ' + pB + ' = ' + fmt((b * k - actB) * pB) + '円\n' +
        '　配合差異 = ' + fmt(mix) + '円(' + fav(mix) + ')\n' +
        '標準平均単価 = (' + a + ' × ' + pA + ' + ' + b + ' × ' + pB + ')÷ ' + s + ' = ' + avg + '円/kg\n' +
        '歩留差異 =(標準総消費量 − 実際総消費量)× 標準平均単価 =(' + fmt(N * s) + ' − ' + fmt(k * s) + ')× ' + avg + ' = ' + fmt(yld) + '円(' + fav(yld) + ')\n' +
        '(検算)配合差異 + 歩留差異 = ' + fmt(mix + yld) + '円 = 数量差異'
    };
  }

  function genPrice() {
    var pS = randMultiple(10, 40, 1) * 10;
    var pAct = pS + randNonZero(-5, 5, 1) * 5;
    var Qp = randMultiple(20, 100, 10) * 100;
    var inv = randMultiple(1, 9, 1) * 100;
    var Qc = Qp - inv;
    var buy = (pS - pAct) * Qp;
    var use = (pS - pAct) * Qc;
    return {
      badge: '材料の価格差異(購入時把握 vs 消費時把握)',
      lines: [
        '材料の標準価格は<b>@' + pS + '円</b>、実際購入単価は<b>@' + pAct + '円</b>である。',
        '当月の購入量は<b>' + fmt(Qp) + 'kg</b>、消費量は<b>' + fmt(Qc) + 'kg</b>(差の' + fmt(inv) + 'kgは期末材料)であった。'
      ],
      label1: '購入時把握の価格差異(円)',
      label2: '消費時把握の価格差異(円)',
      ph1: '例: -40000', ph2: '例: -36500',
      answers: [buy, use],
      explanation:
        '購入時把握 =(標準価格 − 実際価格)× 購入量 =(' + pS + ' − ' + pAct + ')× ' + fmt(Qp) + ' = ' + fmt(buy) + '円(' + fav(buy) + ')\n' +
        '消費時把握 =(標準価格 − 実際価格)× 消費量 =(' + pS + ' − ' + pAct + ')× ' + fmt(Qc) + ' = ' + fmt(use) + '円(' + fav(use) + ')\n' +
        '差額 ' + fmt(buy - use) + '円は、期末材料 ' + fmt(inv) + 'kg に含まれる差異(購入時把握では在庫分もその期の差異になる)'
    };
  }

  function genLabor() {
    var D = randMultiple(5, 20, 1) * 100;
    var W = randMultiple(1, 8, 1) * 100;
    var p = pick([0.2, 0.4, 0.5, 0.6]);
    var h = pick([2, 3, 4, 5]);
    var rStd = randMultiple(10, 20, 1) * 100;
    var SH = (D + W * p) * h;
    var AH = SH + randNonZero(-10, 10, 1) * 10;
    var rAct = rStd + randNonZero(-5, 5, 1) * 10;
    var wages = AH * rAct;
    var wrv = (rStd - rAct) * AH;
    var tv = rStd * (SH - AH);
    return {
      badge: '直接労務費差異(月末仕掛品あり)',
      lines: [
        '当月の完成品は<b>' + fmt(D) + '個</b>、月末仕掛品は<b>' + fmt(W) + '個</b>(加工進捗<b>' + Math.round(p * 100) + '%</b>)、月初仕掛品はない。',
        '標準作業時間は1個あたり<b>' + h + '時間</b>、標準賃率は<b>@' + fmt(rStd) + '円</b>。',
        '実際作業時間は<b>' + fmt(AH) + '時間</b>、実際賃金総額は<b>' + fmt(wages) + '円</b>であった。'
      ],
      label1: '賃率差異(円)',
      label2: '作業時間差異(円)',
      ph1: '例: -98000', ph2: '例: -150000',
      answers: [wrv, tv],
      explanation:
        '加工費換算量 = ' + fmt(D) + ' + ' + fmt(W) + ' × ' + Math.round(p * 100) + '% = ' + fmt(D + W * p) + '個分\n' +
        '標準作業時間 = ' + fmt(D + W * p) + ' × ' + h + ' = ' + fmt(SH) + '時間\n' +
        '実際賃率 = ' + fmt(wages) + ' ÷ ' + fmt(AH) + ' = ' + fmt(rAct) + '円\n' +
        '賃率差異 =(標準賃率 − 実際賃率)× 実際時間 =(' + fmt(rStd) + ' − ' + fmt(rAct) + ')× ' + fmt(AH) + ' = ' + fmt(wrv) + '円(' + fav(wrv) + ')\n' +
        '作業時間差異 = 標準賃率 ×(標準時間 − 実際時間)= ' + fmt(rStd) + ' ×(' + fmt(SH) + ' − ' + fmt(AH) + ')= ' + fmt(tv) + '円(' + fav(tv) + ')'
    };
  }

  function ohBase() {
    var B = randMultiple(30, 60, 1) * 100;
    var fr = pick([500, 800, 1000, 1200]);
    var v = pick([200, 300, 400]);
    var F = fr * B;
    var SH = B + randNonZero(-5, 3, 1) * 100;
    var AH = SH + randNonZero(-5, 5, 1) * 20;
    var allow = v * AH + F;
    var AC = allow + randNonZero(-10, 10, 1) * 5000;
    return { B: B, fr: fr, v: v, F: F, SH: SH, AH: AH, allow: allow, AC: AC };
  }

  function ohLines(o) {
    return [
      '製造間接費は直接作業時間を配賦基準とする。変動費率は<b>@' + o.v + '円/時間</b>、固定費予算は月<b>' + fmt(o.F) + '円</b>、基準操業度は月<b>' + fmt(o.B) + '時間</b>。',
      '当月の標準作業時間は<b>' + fmt(o.SH) + '時間</b>、実際作業時間は<b>' + fmt(o.AH) + '時間</b>、製造間接費の実際発生額は<b>' + fmt(o.AC) + '円</b>であった。'
    ];
  }

  function genOverheadA() {
    var o = ohBase();
    var bud = o.allow - o.AC;
    var vol = o.fr * (o.AH - o.B);
    return {
      badge: '製造間接費差異(四分法):予算差異・操業度差異',
      lines: ohLines(o),
      label1: '予算差異(円)',
      label2: '操業度差異(円)',
      ph1: '例: -50000', ph2: '例: -100000',
      answers: [bud, vol],
      explanation:
        '固定費率 = ' + fmt(o.F) + ' ÷ ' + fmt(o.B) + ' = ' + fmt(o.fr) + '円/時間\n' +
        '予算許容額 = ' + o.v + ' × ' + fmt(o.AH) + ' + ' + fmt(o.F) + ' = ' + fmt(o.allow) + '円\n' +
        '予算差異 = 予算許容額 − 実際発生額 = ' + fmt(o.allow) + ' − ' + fmt(o.AC) + ' = ' + fmt(bud) + '円(' + fav(bud) + ')\n' +
        '操業度差異 = 固定費率 ×(実際時間 − 基準操業度)= ' + fmt(o.fr) + ' ×(' + fmt(o.AH) + ' − ' + fmt(o.B) + ')= ' + fmt(vol) + '円(' + fav(vol) + ')'
    };
  }

  function genOverheadB() {
    var o = ohBase();
    var ve = o.v * (o.SH - o.AH);
    var fe = o.fr * (o.SH - o.AH);
    return {
      badge: '製造間接費差異(四分法):変動費能率差異・固定費能率差異',
      lines: ohLines(o),
      label1: '変動費能率差異(円)',
      label2: '固定費能率差異(円)',
      ph1: '例: -30000', ph2: '例: -100000',
      answers: [ve, fe],
      explanation:
        '固定費率 = ' + fmt(o.F) + ' ÷ ' + fmt(o.B) + ' = ' + fmt(o.fr) + '円/時間\n' +
        '変動費能率差異 = 変動費率 ×(標準時間 − 実際時間)= ' + o.v + ' ×(' + fmt(o.SH) + ' − ' + fmt(o.AH) + ')= ' + fmt(ve) + '円(' + fav(ve) + ')\n' +
        '固定費能率差異 = 固定費率 ×(標準時間 − 実際時間)= ' + fmt(o.fr) + ' ×(' + fmt(o.SH) + ' − ' + fmt(o.AH) + ')= ' + fmt(fe) + '円(' + fav(fe) + ')\n' +
        '(参考)三分法の能率差異 = ' + fmt(ve + fe) + '円'
    };
  }

  function genWip() {
    var D = randMultiple(5, 20, 1) * 100;
    var W = randMultiple(2, 8, 1) * 100;
    var p = pick([0.2, 0.4, 0.5, 0.6]);
    var m = randMultiple(4, 20, 1) * 100;
    var c = randMultiple(20, 80, 1) * 100;
    var done = (m + c) * D;
    var wipMat = m * W;
    var wipProc = c * W * p;
    return {
      badge: '完成品・月末仕掛品の標準原価',
      lines: [
        '製品1個あたりの標準原価は、直接材料費<b>' + fmt(m) + '円</b>(工程の始点で投入)、加工費(労務費+製造間接費)<b>' + fmt(c) + '円</b>である。',
        '当月の完成品は<b>' + fmt(D) + '個</b>、月末仕掛品は<b>' + fmt(W) + '個</b>(加工進捗<b>' + Math.round(p * 100) + '%</b>)、月初仕掛品はない。'
      ],
      label1: '完成品の標準原価(円)',
      label2: '月末仕掛品の標準原価(円)',
      ph1: '例: 12400000', ph2: '例: 2720000',
      answers: [done, wipMat + wipProc],
      explanation:
        '完成品 = (' + fmt(m) + ' + ' + fmt(c) + ')× ' + fmt(D) + ' = ' + fmt(done) + '円\n' +
        '月末仕掛品の材料費 = ' + fmt(m) + ' × ' + fmt(W) + ' = ' + fmt(wipMat) + '円(始点投入なので進捗100%)\n' +
        '月末仕掛品の加工費 = ' + fmt(c) + ' × ' + fmt(W) + ' × ' + Math.round(p * 100) + '% = ' + fmt(wipProc) + '円\n' +
        '月末仕掛品 = ' + fmt(wipMat + wipProc) + '円'
    };
  }

  function genTotal() {
    var vs = [randNonZero(-30, 30, 1) * 1000, randNonZero(-30, 30, 1) * 1000, randNonZero(-30, 30, 1) * 1000, randNonZero(-30, 30, 1) * 1000, randNonZero(-30, 30, 1) * 1000];
    var names = ['材料価格差異', '材料数量差異', '賃率差異', '作業時間差異', '製造間接費差異'];
    var total = vs.reduce(function (a, b) { return a + b; }, 0);
    if (total === 0) return genTotal();
    return {
      badge: '原価差異の合計と売上原価への賦課',
      lines: ['当月の原価差異は次のとおりである(有利差異はプラス、不利差異はマイナス)。',
        names.map(function (n, i) { return n + ' <b>' + fmt(vs[i]) + '円</b>'; }).join('、') + '。',
        '原価差異はすべて売上原価に賦課する。'],
      label1: '原価差異の合計(円)',
      label2: '売上原価に加算する金額(減算ならマイナス、円)',
      ph1: '例: -561500', ph2: '例: 561500',
      answers: [total, -total],
      explanation:
        '原価差異の合計 = ' + vs.map(fmt).join(' + ') + ' = ' + fmt(total) + '円(' + fav(total) + ')\n' +
        (total < 0 ? '不利差異(実際原価が標準原価より大きい)なので、売上原価に加算する。\n(仕訳)(借)売上原価 ' + fmt(-total) + ' /(貸)各原価差異 ' + fmt(-total) : '有利差異(実際原価が標準原価より小さい)なので、売上原価から減算する。\n(仕訳)(借)各原価差異 ' + fmt(total) + ' /(貸)売上原価 ' + fmt(total)) + '\n' +
        '売上原価に加算する金額 = ' + fmt(-total) + '円'
    };
  }

  function generateProblem() {
    var y = Math.random();
    if (y < 0.22) return genMixYield();
    if (y < 0.34) return genPrice();
    if (y < 0.52) return genLabor();
    if (y < 0.66) return genOverheadA();
    if (y < 0.8) return genOverheadB();
    if (y < 0.9) return genWip();
    return genTotal();
  }

  function renderProblem() {
    var p = state.problem;
    document.getElementById('topicBadge').textContent = '【 ' + p.badge + ' 】';
    document.getElementById('problemCard').innerHTML = p.lines.map(function (l) {
      return '<div class="problem-line">' + l + '</div>';
    }).join('');
    document.getElementById('label1').textContent = p.label1;
    document.getElementById('label2').textContent = p.label2;
    var i1 = document.getElementById('input1');
    var i2 = document.getElementById('input2');
    i1.placeholder = p.ph1;
    i2.placeholder = p.ph2;
    i1.value = '';
    i2.value = '';
    document.getElementById('errorText').style.display = 'none';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;
  }

  function parseSigned(s) {
    if (s === undefined || s === null) return NaN;
    var t = String(s).trim().replace(/,/g, '').replace(/円/g, '').replace(/[−▲△]/g, '-');
    if (t === '' || t === '-' || t === '+') return NaN;
    return Number(t);
  }

  function handleCheck() {
    var u1 = parseSigned(document.getElementById('input1').value);
    var u2 = parseSigned(document.getElementById('input2').value);
    var errEl = document.getElementById('errorText');
    if (isNaN(u1) || isNaN(u2)) {
      errEl.textContent = '両方の欄に数値を入力してください';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    var p = state.problem;
    var isCorrect = (u1 === p.answers[0]) && (u2 === p.answers[1]);
    state.total += 1;
    if (isCorrect) state.score += 1;
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;

    var resultCard = document.getElementById('resultCard');
    var resultTitle = document.getElementById('resultTitle');
    resultTitle.textContent = isCorrect ? '正解です!' : '不正解です。もう一度見直してみましょう。';
    resultTitle.style.color = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.borderColor = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.background = isCorrect ? 'rgba(99,153,34,0.14)' : 'rgba(216,90,48,0.14)';
    document.getElementById('resultExplanation').textContent = p.explanation;
    resultCard.classList.add('show');
  }

  function handleNext() {
    state.problem = generateProblem();
    renderProblem();
  }

  document.getElementById('checkBtn').addEventListener('click', handleCheck);
  document.getElementById('nextBtn').addEventListener('click', handleNext);
  document.getElementById('input1').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });
  document.getElementById('input2').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });

  state.problem = generateProblem();
  renderProblem();
})();
</script>
</body>
</html>
