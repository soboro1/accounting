<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="160" fill="#2F7DE1" opacity="0.16"/>
  <circle cx="1250" cy="660" r="210" fill="#E8543F" opacity="0.14"/>
  <circle cx="680" cy="700" r="110" fill="#0FA18D" opacity="0.12"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="86" width="300" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="230" y="119" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">税理士試験 | 消費税法</text>

  <text x="80" y="238" class="dg" font-size="92" fill="#5BA2FF">消費税法</text>
  <text x="80" y="318" class="dg" font-size="56" fill="#FFC94A">の</text>
  <text x="150" y="318" class="dg" font-size="68" fill="#FF7A66">基礎を図解</text>

  <text x="80" y="398" font-size="28" font-weight="700" fill="#fff" opacity="0.95">小学生にもわかる言葉で、しくみから簡易課税まで</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="432" width="150" height="50" rx="25" fill="#fff"/>
    <text x="155" y="465" fill="#1D5DB3">図解5枚</text>
    <rect x="244" y="432" width="150" height="50" rx="25" fill="#fff"/>
    <text x="319" y="465" fill="#8A6000">仕訳つき</text>
    <rect x="408" y="432" width="210" height="50" rx="25" fill="#fff"/>
    <text x="513" y="465" fill="#A8205C">試験の言葉つき</text>
  </g>

  <text x="80" y="556" font-size="20" font-weight="500" fill="#fff" opacity="0.8">保存して、スマホで見返せる1枚絵</text>

  <!-- 右:5枚の図 -->
  <text x="985" y="104" text-anchor="middle" class="dg" font-size="26" fill="#fff">5枚の図で全体がつかめる</text>

  <g filter="url(#shadow)">
    <rect x="760" y="130" width="450" height="70" rx="16" fill="#2F7DE1"/>
    <rect x="760" y="210" width="450" height="70" rx="16" fill="#E8543F"/>
    <rect x="760" y="290" width="450" height="70" rx="16" fill="#0FA18D"/>
    <rect x="760" y="370" width="450" height="70" rx="16" fill="#7C5CE0"/>
    <rect x="760" y="450" width="450" height="70" rx="16" fill="#D98A00"/>
  </g>
  <g font-weight="900" fill="#fff">
    <text x="782" y="174" font-size="22">① しくみ</text>
    <text x="1190" y="174" font-size="17" text-anchor="end">あずかって、国にとどける</text>
    <text x="782" y="254" font-size="22">② 4つの区分</text>
    <text x="1190" y="254" font-size="17" text-anchor="end">課税・非課税・免税・不課税</text>
    <text x="782" y="334" font-size="22">③ 納税義務者</text>
    <text x="1190" y="334" font-size="17" text-anchor="end">2年前の売上で決まる</text>
    <text x="782" y="414" font-size="22">④ 仕入税額控除</text>
    <text x="1190" y="414" font-size="17" text-anchor="end">個別対応と一括比例</text>
    <text x="782" y="494" font-size="22">⑤ 簡易課税</text>
    <text x="1190" y="494" font-size="17" text-anchor="end">みなし仕入率 90〜40%</text>
  </g>

  <rect x="760" y="548" width="450" height="52" rx="26" fill="#fff" fill-opacity="0.10" stroke="#FFC94A" stroke-width="2"/>
  <text x="985" y="581" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">あずかった税 − はらった税 ＝ 納める税</text>
</svg>
