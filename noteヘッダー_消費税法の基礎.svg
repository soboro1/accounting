      <rect x="136" y="474" width="2" height="30" fill="#1F2A2E"/>
      <rect x="142" y="474" width="2" height="30" fill="#1F2A2E"/>
      <rect x="146" y="474" width="6" height="30" fill="#1F2A2E"/>
      <rect x="154" y="474" width="6" height="30" fill="#1F2A2E"/>
      <rect x="164" y="474" width="4" height="30" fill="#1F2A2E"/>
      <rect x="170" y="474" width="2" height="30" fill="#1F2A2E"/>
      <rect x="174" y="474" width="6" height="30" fill="#1F2A2E"/>
      <rect x="182" y="474" width="3" height="30" fill="#1F2A2E"/>
      <rect x="188" y="474" width="2" height="30" fill="#1F2A2E"/>
      <rect x="194" y="474" width="2" height="30" fill="#1F2A2E"/>
      <rect x="200" y="474" width="3" height="30" fill="#1F2A2E"/>
      <rect x="207" y="474" width="2" height="30" fill="#1F2A2E"/>
      <rect x="211" y="474" width="6" height="30" fill="#1F2A2E"/>
      <rect x="221" y="474" width="2" height="30" fill="#1F2A2E"/>
      <rect x="226" y="474" width="2" height="30" fill="#1F2A2E"/>
      <rect x="232" y="474" width="2" height="30" fill="#1F2A2E"/>
      <rect x="238" y="474" width="2" height="30" fill="#1F2A2E"/>
      <rect x="244" y="474" width="2" height="30" fill="#1F2A2E"/>
      <rect x="249" y="474" width="6" height="30" fill="#1F2A2E"/>
      <rect x="258" y="474" width="3" height="30" fill="#1F2A2E"/>
      <rect x="264" y="474" width="6" height="30" fill="#1F2A2E"/>
      <rect x="273" y="474" width="3" height="30" fill="#1F2A2E"/>
      <rect x="279" y="474" width="2" height="30" fill="#1F2A2E"/>
