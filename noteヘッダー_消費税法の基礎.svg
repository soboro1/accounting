      <rect x="339" y="474" width="3" height="30" fill="#1F2A2E"/>
      <rect x="344" y="474" width="4" height="30" fill="#1F2A2E"/>

    <!-- はんこ -->
    <g transform="rotate(14 362 40)">
      <circle cx="362" cy="40" r="36" fill="none" stroke="#D9483B" stroke-width="4"/>
      <circle cx="362" cy="40" r="29" fill="none" stroke="#D9483B" stroke-width="1.5"/>
      <text x="362" y="49" text-anchor="middle" class="dg" font-size="24" fill="#D9483B">図解</text>
    </g>
  </g>
</svg>
