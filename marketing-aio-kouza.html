const L = [
{ part: "PART 1 マーケティング概論", title: "マーケティングとは何か", sub: "定義・ニーズとウォンツ・顧客価値",
body: `
<p>マーケティングを一言でいうと、<em>「売れる仕組みをつくること」</em>です。売り込み（セリング）が「作ったものをどう売るか」なのに対し、マーケティングは「顧客が欲しいものは何か」から出発します。</p>
<div class="box memo"><span class="lb">ドラッカーの言葉</span>マーケティングの理想は、販売（セリング）を不要にすることである。</div>
<h3>「売れる仕組み」とは何か</h3>
<p>この言葉には、2つの大事なポイントがあります。</p>
<ul>
<li><b>「売る」ではなく「売れる」</b>：こちらから押し込むのではなく、顧客が自分から「欲しい」と思って選んでくれる状態をつくる</li>
<li><b>「一回」ではなく「仕組み」</b>：たまたま売れた、誰かの頑張りで売れた、ではなく、<b>同じ流れで何度でも成果が出る</b>（再現性がある）状態をつくる</li>
</ul>
<div class="box ng"><span class="lb">仕組みになっていない売り方</span>①トップ営業の根性と人脈だけで売る → その人が辞めたら売れなくなる（属人的）<br>②値下げやキャンペーンで売る → やめると売上が戻る。利益も削られる（一時的）<br>③たまたまSNSで話題になって売れる → なぜ売れたのかわからず、次に再現できない（偶然）</div>
<p>「売れる仕組み」は、次の流れがつながっている状態です。この講座のレッスンは、それぞれの部品を学ぶものです。</p>
<pre>① 誰に売るか　　　：環境分析・3C・STP・ペルソナ・インサイト
② 何を約束するか　：バリュープロポジション（便益 × 独自性）
③ どう届けるか　　：4P／4C（製品・価格・流通・販促）
④ どう知って選ばれるか：購買行動モデル、SEO・AIO、記事・文章
⑤ どう続くか　　　：満足 → リピート → 推奨（LTV）
⑥ どう良くするか　：KPIで測り、改善する
　　　　　　　　　　 → ①に戻って、仕組みを磨き続ける</pre>
<div class="box ok"><span class="lb">例：駅前の個人カフェの「売れる仕組み」</span>①在宅勤務の会社員に絞る → ②「静かに長時間作業できる」を約束する → ③全席電源・時間制プラン・駅から徒歩2分 → ④「駅名 カフェ 作業 電源」と検索・AIに聞いた人に見つかる記事とGoogleマップの情報 → ⑤回数券で常連化、常連が同僚を連れてくる → ⑥曜日別の来店数と回数券の利用率を見て改善<br>→ 店主が毎日声をかけて回らなくても、<b>お客さんが自然に来て、また来てくれる</b>。</div>
<h3>代表的な定義</h3>
<ul>
<li><b>コトラー</b>：「ニーズに応えて利益をあげること」。顧客の欲求を満たすことと、企業が利益を得ることを両立させる</li>
<li><b>アメリカ・マーケティング協会（AMA、2017年）</b>：顧客、クライアント、パートナー、そして社会全体にとって価値のある提供物を、創造し、伝え、届け、交換するための活動・仕組み・プロセス</li>
<li><b>日本マーケティング協会（2024年改定）</b>：要旨は、顧客や社会と<b>共に</b>価値を創造し、その価値を広く浸透させることで、ステークホルダーとの関係を育み、より豊かで<b>持続可能な社会</b>を実現するための構想でありプロセス</li>
</ul>
<p>時代とともに、マーケティングの対象は「売り手と買い手の取引」から、<b>顧客・社会と一緒に価値をつくり、長く続く関係を育てること</b>へと広がっています。</p>
<div class="box memo"><span class="lb">この講座でのマーケティング</span>どの定義にも共通するのは、次の4つの流れです。<br>① 相手を理解する（ニーズ・インサイト）<br>② 価値を設計する（ベネフィット × 独自性）<br>③ 価値を伝え、届ける（4P、文章、AIO）<br>④ 関係を育て、改善する（継続・推奨、効果測定）<br>PART 1で基本を、PART 2で「伝える」技術を、PART 3でこの流れを自分のキャリアに応用します。</div>
<h3>ニーズ・ウォンツ・デマンド</h3>
<ul>
<li><b>ニーズ（必要）</b>：満たされていない状態。例「のどが渇いた」</li>
<li><b>ウォンツ（欲求）</b>：ニーズを満たす具体的な手段への欲求。例「コーラが飲みたい」</li>
<li><b>デマンド（需要）</b>：購買力に裏付けられたウォンツ。例「150円払ってコーラを買う」</li>
</ul>
<div class="box"><span class="lb">ドリルと穴の話（レビットのたとえ）</span>ドリルを買いに来た人が欲しいのは「ドリル」ではなく「穴」である。顧客は製品ではなく、製品がもたらす<b>便益（ベネフィット）</b>を買っている。</div>
<h3>顧客価値</h3>
<p>顧客は「得られる価値」と「支払うコスト（お金・時間・手間・心理的負担）」を比べて購入を決めます。</p>
<pre>顧客価値 ＝ 顧客が得る便益 − 顧客が負担するコスト</pre>
<h3>マーケティング・コンセプトの変遷</h3>
<ol>
<li><b>生産志向</b>：作れば売れる（供給不足の時代）</li>
<li><b>製品志向</b>：良い製品なら売れる</li>
<li><b>販売志向</b>：売り込めば売れる</li>
<li><b>顧客志向（マーケティング志向）</b>：顧客のニーズから考える</li>
<li><b>社会志向</b>：顧客満足＋社会全体の幸福も考える</li>
</ol>
<p>コトラーは「マーケティング1.0（製品中心）→2.0（顧客中心）→3.0（価値・人間中心）→4.0（デジタル）→5.0（テクノロジー活用）」という発展も示しています。</p>
<h3>ヘンリー・フォードに学ぶ：生産志向の成功と限界</h3>
<p>ヘンリー・フォードは、1908年に発売したT型フォードを、流れ作業による<b>大量生産</b>（1913年に移動式組立ラインを導入）で安く作り、自動車を一部のお金持ちの乗り物から「みんなの乗り物」に変えました。作れば売れる時代の、<b>生産志向</b>の代表例です。</p>
<div class="box memo"><span class="lb">フォードの有名な言葉</span>フォードは自伝『我が一生と事業』（1922年）で、T型について「顧客は好きな色を選べる。それが黒である限りは」という趣旨のことを書いています。色を1つにしぼることで、生産効率を極限まで高めたのです。</div>
<p>しかし、自動車が行き渡り、人々が「自分の好みに合った車」を求めはじめると状況が変わります。ゼネラル・モーターズ（GM）は、価格帯の違う複数のブランド、さまざまな色、毎年のモデルチェンジで<b>顧客ごとのニーズ</b>に応え、1920年代後半にフォードを追い抜きました。</p>
<ul>
<li><b>フォードのT型</b>：1つの製品を、全員に、安く（無差別型・生産志向）</li>
<li><b>GM</b>：顧客を所得や好みで分け、それぞれに合う車を（市場の細分化・顧客志向）</li>
</ul>
<div class="box"><span class="lb">教訓</span>生産志向は、モノが足りない時代には強い。しかし市場が成熟すると、<b>顧客の違いに目を向けた企業が勝つ</b>。これが、STP（セグメンテーション・ターゲティング・ポジショニング）が生まれた背景でもあります。</div>
<div class="box ng"><span class="lb">「もっと速い馬」の言葉について</span>「顧客に何が欲しいかと聞いていたら、『もっと速い馬が欲しい』と答えただろう」という言葉はフォードのものとして広く紹介されていますが、<b>本人が言ったという確かな記録は見つかっていません</b>。引用するときは「フォードの言葉とされる」と書くのが正確です（盛りと漏れのレッスン）。</div>`,
quiz: [

body: `
<p>戦略とは、ひとことで言えば<b>「外部の機会」に「内部の強み」を合わせること</b>です。そのために、まず自社を取り巻く環境を<em>外部</em>と<em>内部</em>に分けて調べ、最後に<em>整理</em>して戦略につなげます。</p>

<h3>外部環境の分析</h3>

</ul>
<p>外部環境の分析から見つかるのは、<b>機会（O）</b>と<b>脅威（T）</b>です。</p>

<h3>内部環境の分析</h3>
<p>内部環境の分析から見つかるのは、<b>強み（S）</b>と<b>弱み（W）</b>です。3CのCompanyに加えて、次の2つの道具があります。</p>
<p><b>① VRIO分析（バーニー）</b>：自社の経営資源（技術、人材、ブランド、ノウハウなど）が、<b>本当に競争で勝てる強みか</b>を4つの問いで判定します。</p>

<li><b>I（Imitability：模倣困難性）</b>：競合がまねするのは難しいか（時間・コストがかかるか）</li>
<li><b>O（Organization：組織）</b>：その資源を活かす組織の仕組みや体制があるか</li>
</ul>
<pre>Vがない　　　　　　　　 → 競争劣位（強みではない）

<p><b>② バリューチェーン分析（ポーター）</b>：事業の活動を分解し、<b>どこで価値を生み、どこにコストがかかっているか</b>を見ます。</p>

<p>VRIOを使うと、「全席電源」という目に見える強みよりも、<b>「関係性」というまねされにくい強み</b>を軸にすべきだとわかります。</p>
<p>このあとのレッスンで、外部（PEST・5フォース）→ 3C → SWOTの順に、一つずつ詳しく学びます。</p>`,

{ part: "PART 1 マーケティング概論", title: "3C分析", sub: "顧客・競合・自社から勝ち筋を見つける（書き込み式ワークつき）", work: true,
body: `
<p><em>3C分析</em>とは、<b>Customer（市場・顧客）</b>、<b>Competitor（競合）</b>、<b>Company（自社）</b>の3つの視点から事業環境を分析し、成功の鍵（KSF）を見つけるフレームワークです。大前研一氏が提唱しました。</p>
<h3>何のために3C分析をするのか ―2つの目的</h3>
<p><b>目的1：マーケット（市場）を、正確かつ客観的にとらえるため</b></p>
<ul>
<li><b>自分たちのやりたいことだけで考えるのではダメ</b>：「この技術がすごい」「この商品を売りたい」という作り手の思いだけで進めると、誰にも求められない商品になりかねない（プロダクトアウトの失敗）</li>
<li><b>お客さんが本当に求めているか</b>を確かめる：顧客のニーズや「不」、市場の大きさや伸びを、思い込みではなく事実で見る</li>
<li><b>競合と比べて見る</b>：自分たちでは強みだと思っていても、競合も同じことができるなら、顧客にとっては選ぶ理由にならない</li>
</ul>
<p><b>目的2：勝ち筋（KSF）を把握するため</b></p>
<ul>
<li>顧客が求めていて、競合が提供できておらず、自社なら提供できる ―― その重なりが<b>勝ち筋</b></li>
<li>勝ち筋がわかると、<b>どこに力を注ぎ、何をやめるか</b>を決められる（限られた人・時間・お金を集中できる）</li>
</ul>
<div class="box ng"><span class="lb">こんな考え方は要注意</span>「うちはこれが得意だから、きっと売れるはず」<br>→ 自分たち（Company）だけを見ていて、お客さん（Customer）とライバル（Competitor）が抜けている。3C分析は、この<b>「自分たち目線」から抜け出すための道具</b>です。</div>
<h3>① Customer（市場・顧客）</h3>
<ul>
<li>市場規模はどれくらいか、伸びているか縮んでいるか</li>
<li>顧客は誰で、どんなニーズ・不満を持っているか</li>
<li>顧客はどうやって情報を集め、何を基準に選んでいるか</li>
</ul>
<h3>② Competitor（競合）</h3>
<ul>
<li>誰が競合か（直接の競合だけでなく、代替手段も）</li>
<li>競合のシェア、強み・弱み、価格、打ち出し方</li>
<li>競合は顧客ニーズのどこを満たし、どこを満たしていないか</li>
</ul>
<h3>③ Company（自社）</h3>
<ul>
<li>自社の強み・弱み、経営資源（人・モノ・カネ・情報）</li>
<li>ブランド、技術、実績、顧客基盤</li>
<li>競合と比べて、顧客に選ばれる理由はあるか</li>
</ul>
<div class="box"><span class="lb">分析する順番が大事</span><b>Customer → Competitor → Company</b>の順で考えます。自社から考えると「自分たちが売りたいもの」に引っ張られ、顧客不在の分析になりがちです。</div>
<h3>ゴールはKSF（成功の鍵）を見つけること</h3>
<pre>顧客が求めている
  × 競合が提供できていない
  × 自社なら提供できる
  ＝ 勝ち筋（KSF：Key Success Factor）</pre>
<div class="box ok"><span class="lb">例：駅前の個人経営カフェ</span>Customer：在宅勤務の増加で「家の近くで2〜3時間集中して作業できる場所」を求める人が増えている<br>Competitor：大手チェーンは混雑していて長居しにくく、電源席も少ない<br>Company：座席数は少ないが、全席に電源があり、静かな環境をつくれる<br>→ KSF：<b>「静かに長時間作業できる」ことを価値として打ち出す</b>（時間制の料金プランも検討）</div>
<div class="box ng"><span class="lb">よくある失敗</span>①情報を集めて並べるだけで「で、どうする？」がない　②競合を直接の同業者だけに限定してしまう　③自社の強みを「顧客にとっての価値」ではなく「自社の自慢」で書いてしまう</div>
<h3>どこから情報を集めるか</h3>
<ul>
<li><b>Customer</b>：官公庁の統計や業界団体の資料（市場規模・成長性）、顧客アンケートやインタビュー、レビューや口コミ、問い合わせの内容、検索のサジェストやQ&Aサイト、AIに投げかけられていそうな質問</li>
<li><b>Competitor</b>：競合の公式サイト・料金表・広告、決算資料や中期経営計画、求人情報（どこに力を入れているか）、口コミサイト、検索結果やAIの回答で競合がどう紹介されているか</li>
<li><b>Company</b>：自社の販売データや顧客データ、営業・サポートの現場の声、顧客から選ばれた理由と離れた理由（N1分析）</li>
</ul>
<div class="box ng"><span class="lb">事実と意見を分ける</span>「顧客は安さを求めているはず」は思い込みです。3C分析では、<b>データや顧客の声などの事実</b>と、そこから考えた<b>解釈</b>を分けて書きます。事実の裏付けがない項目には「仮説」と書き、あとで確かめます。</div>
<h3>3Cを広げた考え方</h3>
<ul>
<li><b>4C分析</b>：3Cに<b>Channel（流通）</b>または<b>Co-operator（協力者）</b>を加える。販売店、代理店、提携先など、価値を届けるうえで欠かせない相手を分析する</li>
<li><b>5C分析</b>：さらに<b>Community（地域社会）</b>や<b>Customer's Customer（顧客の顧客）</b>を加える。B2Bでは「顧客の、その先の顧客」が何を求めているかまで見ると、提案が強くなる</li>

{ part: "PART 1 マーケティング概論", title: "SWOT分析とクロスSWOT", sub: "内部・外部を整理して戦略を導く（書き込み式ワークつき）", work: true,
body: `
<p><em>SWOT分析</em>とは、自社の<b>内部環境</b>を強み・弱みに、<b>外部環境</b>を機会・脅威に分けて整理するフレームワークです。</p>
<ul>
<li><b>S</b>trength（強み）：内部 × プラス</li>
<li><b>W</b>eakness（弱み）：内部 × マイナス</li>
<li><b>O</b>pportunity（機会）：外部 × プラス</li>
<li><b>T</b>hreat（脅威）：外部 × マイナス</li>
</ul>
<h3>内部か外部かの見分け方</h3>
<p><b>「自社の努力で変えられるか」</b>で判断します。変えられるもの（人材・技術・商品・ブランド）は内部、変えられないもの（市場・競合・法律・景気・技術トレンド）は外部です。PESTや5フォースで見つけた要因はO・Tに、3CのCompanyで見つけた要因はS・Wに入ります。</p>
<div class="box ng"><span class="lb">よくある間違い</span>①「競合が値下げした」を弱み（W）に入れる → 自社の外で起きているので<b>脅威（T）</b><br>②「市場が伸びている」を強み（S）に入れる → 自社の力ではないので<b>機会（O）</b><br>③強みを競合と比べずに書く → 「丁寧な接客」は競合も同じなら強みにならない</div>
<h3>クロスSWOTで戦略を導く</h3>
<p>SWOTは並べて終わりではありません。4つをかけ合わせて打ち手を考えるのがクロスSWOTです。</p>
<ul>
<li><b>S×O（積極化）</b>：強みで機会を最大限に活かす → 最優先で検討</li>
<li><b>S×T（差別化）</b>：強みで脅威を回避する、脅威を機会に変える</li>
<li><b>W×O（改善）</b>：弱みを補強して機会を取り逃がさない</li>
<li><b>W×T（防衛・撤退）</b>：最悪の事態を避ける。縮小・撤退も選択肢</li>
</ul>
<div class="box ok"><span class="lb">例：地方の老舗和菓子店</span>S：創業80年のブランド、職人の手作り<br>W：ECサイトがない、若年層の認知が低い<br>O：インバウンド観光客の増加、ギフト需要のオンライン化<br>T：原材料費の高騰、コンビニスイーツの品質向上<br><br>S×O：観光客向けに「職人の実演＋手作り体験」を商品化する<br>S×T：高騰分は「老舗の手作り」の価値として価格に反映し、安売り競争を避ける<br>W×O：ECを立ち上げ、ギフト需要をオンラインで取り込む<br>W×T：売れ筋以外の商品を絞り、原価の上昇に耐えられる体制にする</div>
<div class="box memo"><span class="lb">3CとSWOTの関係</span>3Cは「顧客・競合・自社」の情報を集める道具、SWOTはその情報を「プラス／マイナス」「内部／外部」に整理して戦略に変える道具です。セットで使うと効果的です。</div>
<h3>SWOTを書くときの4つのコツ</h3>
<ol>
<li><b>目的を決めてから書く</b>：「どの市場で、何を決めるためのSWOTか」を最初に決める。目的が違えば、同じ事実でも強みにも弱みにもなる</li>
<li><b>具体的に、事実で書く</b>：「品質が高い」ではなく「顧客満足度調査で業界平均を10ポイント上回る」。根拠のない項目は「仮説」と書く</li>
<li><b>顧客と競合の目で書く</b>：強み・弱みは「自社がそう思うか」ではなく、<b>顧客から見て、競合と比べてどうか</b>で判断する（3C分析とセットで）</li>
<li><b>項目は絞る</b>：各3〜5個程度。重要度の高いものから並べる。全部書き出すことより、戦略に効く項目を選ぶことが大切</li>
</ol>
<h3>強みと弱みは表裏一体</h3>
<p>同じ特徴が、見方によって強みにも弱みにもなります。</p>
<ul>
<li>「小さな会社」→ 弱み：人手が足りない／強み：意思決定が速く、顧客一人ひとりに丁寧に対応できる</li>
<li>「歴史が長い」→ 強み：信頼とブランド／弱み：古いイメージ、変化に時間がかかる</li>
<li>「機会」と「脅威」も同じ。たとえば生成AIの普及は、記事を量産するだけの会社には脅威、一次情報を持つ会社には機会になる</li>
</ul>
<p>弱みに見える特徴を、<b>強みとして活かせる市場や打ち出し方がないか</b>を考えると、新しい戦略が見つかることがあります。</p>
<h3>SWOTの限界</h3>
<ul>
<li><b>ある時点のスナップショット</b>：市場や競合は変わる。定期的に見直す</li>
<li><b>主観が入りやすい</b>：社内だけで書くと、強みを過大評価しがち。顧客の声や数字で確かめる</li>
<li><b>それだけでは戦略にならない</b>：4つの箱を埋めても行動は決まらない。必ずクロスSWOTで「何をするか」まで落とし込み、優先順位をつける</li>
</ul>

<h3>ワーク：SWOTからクロスSWOTまで書いてみる</h3>
<p>3C分析のワークで選んだ商品・サービス（または自社・身近なお店）について書いてみましょう。書いた内容はこのブラウザに自動で保存されます。</p>

<textarea data-f="ws" rows="3" placeholder="例：全席に電源がある／店主が常連の名前と好みを覚えている"></textarea>

<p class="wl">O 機会（外部 × プラス）</p>
<textarea data-f="wo" rows="3" placeholder="例：周辺で在宅勤務の会社員が増えている／「駅名 カフェ 作業」と検索・AIに聞く人がいる"></textarea>
<p class="wl">T 脅威（外部 × マイナス）</p>
<textarea data-f="wt" rows="3" placeholder="例：原材料費の上昇／駅ビルに大手チェーンが出店予定"></textarea>

<textarea data-f="wwt" rows="2" placeholder="例：席数が少ないので、価格競争はしない。メニューを絞って原価上昇に備える"></textarea>

{ part: "PART 1 マーケティング概論", title: "SWOT分析からUSPを発見する", sub: "「選ばれる理由」をひとことにする（書き込み式ワークつき）", work: true,
body: `
<p>SWOTで強みや機会を整理したら、次はそれを<b>顧客に伝わる「選ばれる理由」</b>にまとめます。その「選ばれる理由」をひとことで表したものが<em>USP</em>です。</p>

<h3>USPとは</h3>
<p><em>USP（Unique Selling Proposition）</em>とは、<b>自社の商品・サービスだけが顧客に約束できる、独自の売り</b>のことです。1950〜60年代に、アメリカの広告人ロッサー・リーブスが提唱しました。</p>
<p>リーブスは、USPには次の3つの条件が必要だとしました。</p>
<ol>
<li><b>具体的な便益の約束</b>：「これを買えば、この便益が得られる」と、顧客にはっきり約束している</li>
<li><b>独自性</b>：競合が提供していない、または言えない約束である</li>
<li><b>人を動かす強さ</b>：多くの顧客を動かし、買いたいと思わせるだけの力がある</li>
</ol>
<div class="box"><span class="lb">有名な例</span>チョコレートの「M&M's」の「お口でとろけて、手にとけない」（Melts in your mouth, not in your hand）。当時のチョコレートの「手がベタベタになる」という<b>不満（不）</b>を、糖衣でコーティングされているという<b>独自の特徴</b>で解決すると、ひとことで約束しています。</div>

<h3>USP・KSF・バリュープロポジションの違い</h3>
<ul>
<li><b>KSF（成功の鍵）</b>：その市場で勝つために<b>何が必要か</b>（3C分析で見つける。市場側の視点）</li>
<li><b>バリュープロポジション</b>：顧客に提供する<b>価値の全体像</b>（VPCで設計する）</li>
<li><b>USP</b>：その価値のうち、<b>自社だけが言える一点</b>を、顧客に伝わる<b>ひとこと</b>にしたもの（伝える側の視点）</li>
</ul>

<h3>SWOTからUSPを見つける5ステップ</h3>
<pre>① 強み（S）を洗い出す
　　SWOTの強みに加え、「当たり前にやっていること」も候補に入れる
② 顧客が求めているかを確かめる（Customer）
　　その強みは、顧客のどんな「不」を解決するか？ 機会（O）とつながるか？
③ 競合にないかを確かめる（Competitor）
　　競合も同じことを言っていないか？ すぐにまねされないか？
④ ひとことにする
　　「要は〇〇」と言い換え、顧客の言葉で、便益として表す
⑤ 証拠をそろえる
　　数字、実績、仕組み、顧客の声で、約束が本当だと示せるか？</pre>
<div class="box memo"><span class="lb">弱みからUSPが生まれることもある</span>強みと弱みは表裏一体です。「席数が12席と少ない」は弱みですが、「店主が全員の顔と好みを覚えている、12席だけの店」と言い換えると、大型チェーンには言えないUSPになります。</div>

<h3>USPの例（講座の事例から）</h3>
<ul>
<li><b>駅前の個人カフェ</b>：「全席電源つき、2時間しっかり集中できる駅前の作業カフェ」（S×O：全席電源 × 在宅勤務の増加）</li>
<li><b>自由丁</b>：「未来の自分に手紙が送れるカフェ」（要は「時間指定のレターセット」。他にない約束）</li>
<li><b>KUMONの戦略提案</b>：「人が見守る、毎日の学び」（AI学習アプリには言えない約束）</li>
</ul>
<h3>よくある失敗</h3>
<ul>
<li><b>誰でも言えることをUSPにする</b>：「品質が高い」「真心込めて」「お客様第一」は、競合も言える。独自性がない</li>
<li><b>機能だけを並べる</b>：「AI搭載」「30種類のグラフ」ではなく、顧客にとっての<b>便益</b>で約束する</li>
<li><b>守れない約束をする</b>：証拠のないUSPは「盛り」。景品表示法などの問題にもなりうる（盛りと漏れのレッスン）</li>
<li><b>顧客が求めていない独自性</b>：珍しいだけで、顧客の「不」を解決しないものはUSPにならない</li>
</ul>
<div class="box memo"><span class="lb">AIOとのつながり</span>USPがはっきりしていると、「〇〇なら△△」とAIが紹介しやすくなります。サイトのトップや記事のリード文で、USPを<b>定義文</b>（「〇〇は、△△できる□□です」）として言い切り、証拠（数字・事例）をセットで示しましょう。</div>

<p>すべての人に売ろうとすると、誰にも刺さらない商品になります。STPは<em>「誰に」「どんな立ち位置で」</em>売るかを決めるプロセスです。</p>
<h3>S：セグメンテーション（市場の細分化）</h3>
<ul>
<li><b>地理的変数</b>：地域、都市規模、気候</li>
<li><b>人口動態変数（デモグラフィック）</b>：年齢、性別、所得、職業、家族構成</li>
<li><b>心理的変数（サイコグラフィック）</b>：価値観、ライフスタイル、性格</li>
<li><b>行動変数</b>：購買頻度、使用場面、求めるベネフィット、ロイヤルティ</li>
</ul>
<h3>T：ターゲティング（狙う市場の決定）</h3>
<ul>
<li><b>無差別型</b>：全市場に同じ製品（例：昔の大衆向け商品）</li>
<li><b>差別型</b>：複数セグメントそれぞれに別の製品</li>
<li><b>集中型</b>：特定の1セグメントに経営資源を集中（中小企業向き）</li>
</ul>
<p>評価の観点は「6R」などで整理されます：市場規模（Realistic scale）、成長性（Rate of growth）、到達可能性（Reach）、競合状況（Rival）、優先順位（Rank）、反応の測定可能性（Response）。</p>
<h3>P：ポジショニング（立ち位置の決定）</h3>
<p>ターゲット顧客の頭の中で、競合と比べて<b>どんな存在として認識されたいか</b>を決めます。2つの軸で競合と自社を配置した図を<em>ポジショニングマップ</em>といいます。</p>

{ part: "PART 1 マーケティング概論", title: "顧客のニーズを掴む", sub: "相手の「不」を見つけ、解決策を提示する ―ジョブ理論・狩野モデル・掴み方",
body: `
<p>「売れる仕組み」づくりの出発点は、<em>顧客のニーズを掴むこと</em>です。どんなに優れた商品も、顧客が求めていなければ売れません。逆に、ニーズを正しく掴めれば、売り込まなくても「欲しい」と思ってもらえます。</p>
<div class="box ng"><span class="lb">ニーズを掴まずに作った例</span>「最新機能を30個搭載した高機能家計簿アプリ」→ 顧客の本当のニーズは「とにかく手間なく続けたい」。機能が多いほど操作が複雑になり、かえって続かない。<b>作り手が作りたいもの</b>と<b>顧客が欲しいもの</b>は、しばしばずれる。</div>

<h3>ニーズを掴む ＝ 相手の「不」を見つけ、解決策を提示すること</h3>
<div class="box ok"><span class="lb">このレッスンでいちばん大事なこと</span>マーケティングで大事なのは、<b>顧客のニーズを掴むこと</b>。それは言いかえると、<b>相手の「不」を見つけ、その解決策を提示すること</b>です。</div>
<p>ニーズは、顧客の中の<b>「不」</b>から生まれます。</p>
<ul>
<li><b>不安</b>：「このままで大丈夫だろうか」 例：老後のお金が心配</li>
<li><b>不満</b>：「今のやり方が気に入らない」 例：家計簿をつけても貯金が増えない</li>
<li><b>不便</b>：「手間がかかる、面倒だ」 例：レシートを一枚ずつ手で入力するのが面倒</li>
<li><b>不足</b>：「足りない」 例：家族と過ごす時間が足りない</li>
<li><b>不効率</b>：「ムダが多い」 例：同じ作業を何度も繰り返している</li>
</ul>
<p><b>「不」を見つけるヒント</b>：顧客の言葉の中の「〜できない」「面倒」「心配」「いつも困る」「もっと〜ならいいのに」に注目します。口コミの不満、問い合わせ、検索やAIへの質問（「〜 続かない」「〜 やめたい」）は、「不」の宝庫です。</p>
<pre>① 「不」を見つける　 ：顧客は何に困り、何を心配しているか
② 本当の原因を探る　 ：その「不」はなぜ生まれているのか（インサイト）
③ 解決策を考える　　 ：自社なら、その「不」をどう取り除けるか（ペインリリーバー）
④ 伝わる形で提示する ：顧客の言葉で、「不」が解消された姿を見せる（ベネフィット）</pre>

<h3>ヘンリー・フォードに学ぶ「不」の解決 ―そして見落とし</h3>
<p>レッスン1で学んだヘンリー・フォードを、「不」の視点で見直してみましょう。</p>
<ul>
<li><b>当時の人々の「不」</b>：馬車は遅く、遠くへ行くのに時間がかかる（不便）。自動車は一部のお金持ちしか買えない（不足・不満）</li>
<li><b>フォードの解決策</b>：大量生産でT型フォードを安く作り、<b>「普通の人でも買える自動車」</b>を提示した → 大成功</li>
<li><b>見落とした新しい「不」</b>：自動車が行き渡ると、「みんな同じ黒い車で、自分らしさがない」「もっと好みに合う車がほしい」という新しい不満が生まれた</li>
<li><b>GMの解決策</b>：価格帯・色・モデルを分け、顧客ごとの好みに応えた → 1920年代後半にフォードを追い抜く</li>
</ul>
<div class="box"><span class="lb">教訓</span>①「不」を解決した企業が勝つ　②しかし「不」は時代とともに変わる　③一度成功しても、<b>顧客の新しい「不」を掴み続けなければ</b>、別の企業に追い抜かれる</div>
<div class="box memo"><span class="lb">「もっと速い馬」とのつながり</span>フォードの言葉とされる（本人の発言という確かな記録はない）「顧客に聞けば、もっと速い馬が欲しいと答えただろう」というたとえ話も、同じことを教えています。顧客が口にするのは「速い馬」という<b>手段</b>。本当の「不」は「移動に時間がかかる」こと。<b>言葉ではなく、その奥の「不」を掴む</b>ことが大切です。</div>
<p>この考え方は、PART 3の「企業のペイン（採用の悩み）」でもそのまま使います。企業の「不」を見つけ、自分という解決策を提示する ―― それが就職・転職活動のマーケティングです。</p>
<h3>ニーズの種類</h3>
<p><b>① 顕在ニーズと潜在ニーズ</b></p>
<ul>
<li><b>顕在ニーズ</b>：顧客が自覚していて、言葉にできる。例「もっと安い家計簿アプリがいい」</li>
<li><b>潜在ニーズ</b>：顧客がまだ自覚していない、言葉にできない。例「お金のことで夫婦げんかをしたくない」</li>
</ul>
<p>顕在ニーズは競合も気づいているので、価格競争になりやすい。<b>潜在ニーズを掴めると、新しい価値を生み出せます</b>（インサイトのレッスンでさらに深めます）。</p>
<p><b>② 機能的・感情的・社会的ニーズ</b></p>
<ul>
<li><b>機能的</b>：作業を片付けたい。例「家計の収支を把握したい」</li>
<li><b>感情的</b>：こんな気持ちになりたい。例「お金の不安から解放されたい」</li>
<li><b>社会的</b>：人からこう見られたい。例「しっかり者の親だと思われたい」</li>
</ul>

<h3>ジョブ理論：顧客は商品を「雇って」いる</h3>
<p>クレイトン・クリステンセンらが提唱した<em>ジョブ理論（Jobs to be Done）</em>では、顧客は商品を買うのではなく、<b>ある状況で片付けたい用事（ジョブ）を片付けるために、商品を「雇う」</b>と考えます。</p>
<div class="box"><span class="lb">有名な例：朝のミルクシェイク</span>あるファストフード店で、ミルクシェイクの多くが朝に売れていた。調べると、車で長い時間通勤する人が「運転中の退屈をまぎらわせ、昼までお腹をもたせる」というジョブのために、片手で長く飲めるミルクシェイクを「雇って」いた。<br>→ 競合は他社のミルクシェイクではなく、<b>バナナやベーグル、コーヒー</b>だった。味を改善するより、<b>より長く楽しめる濃さ</b>にするほうがジョブに合う。</div>
<p>ニーズを「どんな人か（属性）」だけでなく、<b>「どんな状況で、何を片付けたいのか」</b>で捉えると、本当の競合と、打つべき手が見えてきます。</p>

<h3>狩野モデル：ニーズには「質」の違いがある</h3>
<p>品質管理の研究者・狩野紀昭氏が提唱した<em>狩野モデル</em>は、顧客の満足に対する要素の効き方を分類します。</p>
<ul>
<li><b>当たり前品質</b>：あって当然。なければ強い不満、あっても満足は上がらない。例：アプリが落ちない、データが消えない</li>
<li><b>一元的品質</b>：あればあるほど満足、なければ不満。例：記録の速さ、料金の安さ</li>
<li><b>魅力的品質</b>：なくても不満はないが、あると感動する。例：使いすぎた月に責めずに「来月はここを減らせば達成」と提案してくれる</li>
<li><b>無関心品質</b>：あってもなくても満足は変わらない。例：顧客が使わない細かい機能</li>
</ul>
<div class="box memo"><span class="lb">時間とともに変わる</span>魅力的品質は、競合がまねして広まると一元的品質に、やがて当たり前品質へと変わります（スマートフォンのカメラ機能など）。<b>ニーズは一度掴んで終わりではなく、掴み続けるもの</b>です。</div>

<h3>ニーズを掴む方法</h3>
<ul>
<li><b>定量調査（どれくらい？）</b>：アンケート、購買データ、アクセス解析。何人が、どれくらいの割合でそう思っているかがわかる</li>
<li><b>定性調査（なぜ？）</b>：インタビュー（N1分析）、行動観察。数字の裏にある理由や感情がわかる</li>
<li><b>検索・AIへの質問</b>：検索キーワード、サジェスト、Q&Aサイト、AIに投げかけられていそうな質問。<b>顧客が自分の言葉でニーズを打ち明けている場所</b></li>
<li><b>ソーシャルリスニング</b>：SNSの投稿やレビュー。特に★2〜3のレビューには、不満と期待が具体的に書かれている</li>
<li><b>現場の声</b>：営業・店舗・サポートに届く質問や要望、解約理由</li>
</ul>

定量調査で確かめる（どれくらい？）

<h3>練習問題：KUMONの競合はどこか？</h3>

<ol>
<li>同じ業態の競合は？</li>
<li>親が片付けたいジョブは何か？ そのジョブを片付ける別の手段は？</li>

</ol>

<p class="wh">※ 一般的な考察の例です。正解は1つではなく、市場シェアなどの数字は扱っていません。</p>
<p><b>① 同じ業態の競合（直接競合）</b></p>
<ul>

<p><b>② 同じジョブを片付ける別の手段（代替）</b></p>
<p>親がKUMONを「雇う」ジョブは、たとえば「子どもに毎日勉強する習慣をつけたい」「自分では教える時間や自信がない」「学校の授業に遅れないか不安を減らしたい」。そう考えると、次のものも競合になります。</p>

<p><b>③ 時間とお金を奪い合う相手</b></p>

{ part: "PART 1 マーケティング概論", title: "ペルソナを明確にする", sub: "作り方と、迷ったら呼び出す「心の中のペルソナ」",
body: `
<p><em>ペルソナ</em>とは、商品やサービスの典型的な顧客を、名前・年齢・職業・価値観・1日の過ごし方まで具体的に設定した<b>架空の1人の人物像</b>です。</p>
<h3>ターゲットとペルソナの違い</h3>
<ul>
<li><b>ターゲット</b>：「30代・女性・会社員・都内在住」のような<b>層（グループ）</b></li>
<li><b>ペルソナ</b>：その層を代表する<b>1人の具体的な人物</b></li>
</ul>
<p>「30代女性」だけでは、朝型か夜型か、平日にどれくらい時間があるか、何に悩んでいるかがわかりません。人によってイメージがバラバラになり、施策がぶれます。</p>
<h3>ペルソナを作る目的</h3>
<ul>
<li><b>チームの認識をそろえる</b>：「この人ならどう思うか」で判断できる</li>
<li><b>顧客視点を保つ</b>：作り手の思い込みを防ぐ</li>
<li><b>施策を具体化する</b>：どの媒体で、どの時間帯に、どんな言葉で届けるかが決まる</li>
</ul>
<h3>設定する項目の例</h3>
<pre>基本情報：名前、年齢、性別、住まい、家族構成
仕事　　：職業、役職、年収、働き方
生活　　：平日・休日の過ごし方、趣味
価値観　：大切にしていること、お金や時間の使い方
情報収集：よく使うSNS・メディア、AIの使い方
課題　　：いま困っていること、その背景
購買行動：何を基準に選ぶか、購入をためらう理由</pre>
<div class="box ok"><span class="lb">例：オンライン家計簿アプリのペルソナ</span><b>佐藤 美咲（34歳）</b>／都内のIT企業で事務職、夫と4歳の娘の3人暮らし、世帯年収720万円<br>平日は18時に保育園へお迎え、夜21時以降にスマホを見る時間がある<br>悩み：「共働きなのに貯金が増えない。でも紙の家計簿は3日で挫折した」<br>情報収集：Instagramで節約アカウントを見る、わからないことはChatGPTに聞く<br>選ぶ基準：手間がかからないこと、夫と共有できること<br>ためらう理由：「銀行口座と連携して大丈夫？」というセキュリティの不安</div>
<h3>作り方の手順</h3>
<ol>
<li><b>データを集める</b>：顧客アンケート、インタビュー、購買データ、アクセス解析、問い合わせ内容、営業の声</li>
<li><b>共通点を見つける</b>：属性・行動・悩みのパターンをまとめる</li>
<li><b>1人の人物に落とし込む</b>：ストーリーとして読めるように書く</li>
<li><b>定期的に見直す</b>：市場や顧客は変わるので、実データと照らして更新する</li>
</ol>
<div class="box ng"><span class="lb">よくある失敗</span>①データがなく、作り手の想像や「こうあってほしい顧客」で作る　②項目を埋めることが目的になり、施策に使われない　③B2Bなのに担当者1人だけを見て、決裁者や利用部門を考えない（B2Bでは<b>担当者・決裁者・利用者</b>など複数のペルソナが必要なこともある）</div>
<h3>迷ったら呼び出す、心の中のペルソナ</h3>
<p>ペルソナは作って終わりではなく、<b>判断に迷ったときに呼び出す「相談相手」</b>として使って初めて価値が出ます。会議で意見が割れたら、「どちらが正しいか」ではなく<em>「佐藤さんならどう感じるか」</em>で考えます。</p>
<ul>
<li><b>キャッチコピー</b>：「業界最安値」と「1日1分で家計がわかる」、21時にスマホを見ている佐藤さんの指が止まるのはどちら？</li>
<li><b>記事のテーマ</b>：「家計簿アプリ比較20選」と「共働きで貯金が増えない本当の理由」、佐藤さんが今AIに聞きたいのはどちら？</li>
<li><b>言葉づかい</b>：「キャッシュフロー」で伝わる？ 「毎月の出入り」のほうが伝わる？</li>
<li><b>機能の優先順位</b>：グラフを増やすより、夫と共有できる機能のほうが佐藤さんの悩みに効くのでは？</li>
</ul>
<div class="box"><span class="lb">心の中に住まわせるコツ</span>①名前と顔写真（イメージ）をつけ、チームで同じ名前で呼ぶ　②ペルソナの1日（何時に、どこで、どんな気分でスマホを見るか）を物語で覚えておく　③企画書や記事の冒頭に「この施策は〇〇さんの、△△という悩みのため」と1行書く　④「自分ならこう思う」を「〇〇さんならこう思う」に言い換える習慣をつける</div>
<div class="box ng"><span class="lb">注意</span>心の中のペルソナが、いつの間にか「自分の分身」や「都合のいいお客さん」に変わっていないか。迷いが大きいときは想像で決めず、<b>実在の顧客に聞きに行く</b>（次のレッスン：一人の顧客の分析）。</div>
<div class="box memo"><span class="lb">AIOとのつながり</span>ペルソナが決まると「この人はAIにどんな言葉で質問するか」を書き出せます。上の例なら「共働き 貯金 増えない 原因」「家計簿アプリ 銀行連携 安全性」。これがAIOライティングの出発点になります。</div>`,

{ part: "PART 1 マーケティング概論", title: "一人の顧客を分析し、強いアイデアを生み出す", sub: "N1分析と「便益×独自性」",
body: `
<p><em>N1分析</em>とは、<b>実在する一人の顧客（N＝1）を深く掘り下げ、その人がなぜ買ったのか・なぜ使い続けるのかを理解する</b>方法です。マーケターの西口一希氏が著書『たった一人の分析から事業は成長する』などで広めた考え方です。</p>
<h3>なぜ「一人」なのか</h3>
<ul>
<li>アンケートの平均値から生まれる顧客像は、<b>実際には存在しない「平均的な誰か」</b>になりがち</li>
<li>1,000人の「まあ満足」より、1人の「これがないと困る」のほうに、商品が選ばれる<b>強い理由</b>が隠れている</li>
<li>一人を深く知ると、言葉・場面・感情まで具体的にわかり、アイデアが生まれやすい</li>
</ul>
<h3>ペルソナとN1の違い</h3>
<ul>
<li><b>ペルソナ</b>：複数の顧客データを合成した<b>架空の代表者</b>。判断の物差しとして使う</li>
<li><b>N1</b>：<b>実在する一人</b>。仮説を生み出し、ペルソナが現実からずれていないか確かめる材料になる</li>
</ul>
<p>両者は対立するものではありません。N1分析を何人分か重ねると、ペルソナの解像度が上がります。</p>
<h3>誰を選ぶか</h3>
<ul>
<li><b>ロイヤル顧客</b>：何度も買ってくれる人、人にすすめてくれる人 → 「選ばれる理由」がわかる</li>
<li><b>最近買ってくれた新規顧客</b>：買う直前の迷いや決め手を覚えている</li>
<li><b>離反した顧客</b>：以前は使っていたがやめた人 → 「離れる理由」がわかる</li>
<li><b>知っているのに買わない人</b>：何が壁になっているかがわかる</li>
</ul>
<h3>何を聞くか（インタビューの流れ）</h3>
<ol>
<li><b>出会い</b>：いつ、どこで、どうやって知りましたか</li>
<li><b>買う前の状況</b>：そのとき、どんなことに困っていましたか</li>
<li><b>比較</b>：ほかに何と比べましたか（競合だけでなく「何もしない」も含む）</li>
<li><b>決め手</b>：最終的に何が決め手になりましたか。迷った点は</li>
<li><b>使ってからの変化</b>：生活や気持ちはどう変わりましたか</li>
<li><b>人への説明</b>：友人にすすめるとしたら、何と言いますか</li>
</ol>
<div class="box"><span class="lb">最後の質問が特に大事</span>「友人に何と説明するか」には、<b>顧客自身の言葉で語られたベネフィット</b>が出てきます。それがそのままキャッチコピーや記事の見出し、AIへの質問文のヒントになります。</div>
<h3>強いアイデアとは「便益 × 独自性」</h3>
<p>ここでいう<em>アイデア</em>とは、<b>顧客にとっての便益（ベネフィット）と、ほかにはない独自性の組み合わせ</b>です。どちらか一方だけでは弱いアイデアになります。</p>

② 便益と独自性に分けて言葉にする
   便益　：夫婦のお金の話し合いが穏やかになる
   独自性：夫婦それぞれのスマホで同じ家計を見られ、

③ 1文のアイデア（コンセプト）にする
   「夫婦で見るだけで、お金の話し合いが穏やかになる家計簿」
④ ほかの顧客や見込み客にも当てはまるか検証する

⑤ 当てはまれば、その価値を軸に商品・発信を組み立てる。
   外れたら、別のN1に話を聞いて次の仮説を立てる</pre>
<div class="box"><span class="lb">強いアイデアのチェック</span>□ 顧客の具体的な悩み・本音から生まれているか　□ 「それなら欲しい」と言える便益があるか　□ 「ほかではなくこれ」と言える独自性があるか　□ 1文で説明できるか　□ 実在の一人の顔が思い浮かぶか</div>

{ part: "PART 1 マーケティング概論", title: "顧客の本音（インサイト）の解像度を高める", sub: "顕在ニーズの奥にある「動かすツボ」",
body: `
<p><em>インサイト</em>とは、<b>顧客自身も言葉にできていない本音や、購買行動を動かす心理的なツボ</b>のことです。ペルソナが「どんな人か」を描くのに対し、インサイトは「その人を本当に動かすものは何か」をとらえます。</p>
<h3>ニーズとインサイトの違い</h3>
<ul>
<li><b>顕在ニーズ</b>：本人が自覚していて、言葉にできる欲求。例「もっと安いジムがいい」</li>
<li><b>潜在ニーズ</b>：本人がまだ自覚していない欲求</li>
<li><b>インサイト</b>：その欲求の奥にある本音。例「本当は、続かなかった自分を責めたくない。だから“通わなくても損しない”安心がほしい」</li>
</ul>
<div class="box"><span class="lb">有名な例（言われた答えと本音のズレ）</span>ヘンリー・フォードの言葉とされる（本人の発言という確かな記録はない）たとえ話。「もっと速い馬が欲しい」と言う顧客が本当に求めていたのは、<b>目的地に早く着くこと</b>だった（自動車）。顧客の答えをそのまま商品にしても、本当の課題は解けないことがある。</div>
<h3>「解像度が低い」とはどういう状態か</h3>
<div class="box ng"><span class="lb">解像度が低い</span>「30代の女性は時短したい」<br>→ 誰にでもあてはまり、打ち手が思いつかない</div>
<div class="box ok"><span class="lb">解像度が高い</span>「共働きで平日夜は21時まで家事に追われる30代の母親は、料理の手間を減らしたい。でも総菜ばかりだと“手抜きしている”と罪悪感がある。だから本当は、<b>ひと手間だけ加えれば“ちゃんと作った”と思える</b>ものがほしい」<br>→ 商品・コピー・記事の切り口が具体的に決まる</div>
<h3>インサイト文の型</h3>
<pre>〔状況〕のとき、〔本人〕は〔〜したい〕。
でも〔〜という葛藤・障壁〕がある。
だから本当は〔〜がほしい〕。</pre>
<p>ポイントは<b>「でも」の部分＝葛藤</b>です。欲求と、それを妨げる気持ち（罪悪感、面倒、不安、見栄）のぶつかりの中に本音があります。</p>
<h3>解像度を高める4つの方法</h3>
<ol>
<li><b>「言っていること」より「やっていること」を見る</b>：「健康に気をつけている」と言いながら、夜中にコンビニでスイーツを買っている。そのズレにインサイトがある（行動観察・購買データ）</li>
<li><b>過去の具体的な行動を聞く</b>：「欲しいですか？」ではなく「最後に買ったのはいつ？ そのとき何と比べましたか？ 決め手は？」と聞く</li>
<li><b>「なぜ」を掘り下げる</b>：行動の理由を何段階か掘る（なぜなぜ分析）。ただし相手を問い詰めないよう、「そのとき、どんな気持ちでしたか」と感情を聞く</li>
<li><b>本音が出る場所を見る</b>：口コミ・レビューの★2〜3の不満、SNSの愚痴、Q&Aサイトの質問文、問い合わせ・解約理由、営業や店頭スタッフの声</li>
</ol>
<div class="box ng"><span class="lb">インタビューのNG</span>①「この機能、便利だと思いませんか？」（誘導質問）　②「いくらなら買いますか？」（未来の仮定の質問は当てにならない）　③自社の商品説明ばかりして、相手が話す時間がない</div>
<h3>インサイトの見つけ方の例</h3>
<pre>事実　：家計簿アプリの解約理由「入力が面倒」が最多
掘る　：面倒なのは入力の手間？ それとも…
観察　：解約者の多くは、使いすぎた月の翌月にアプリを開かなくなる
インサイト：
  家計を管理したい。でも使いすぎた数字を見ると自分を責めてしまう。
  だから本当は「責められずに、次はうまくいく」と思える仕組みがほしい。
打ち手：使いすぎを指摘するのではなく「来月はここを1,000円減らせば達成」と前向きに提案する機能</pre>
<div class="box memo"><span class="lb">次のステップとAIOとのつながり</span>インサイトはVPC（次のレッスン）のペイン・ゲインの質を決めます。また、Q&Aサイトの質問文や「〜 やめたい」「〜 続かない」などの検索・AIへの質問は、顧客が本音を打ち明けている場所です。そこに正面から答える記事は、AIにも読者にも選ばれます。</div>`,

{ part: "PART 1 マーケティング概論", title: "バリュープロポジションキャンバスでベネフィットを設計する", sub: "顧客のジョブ・ペイン・ゲインと提供価値",
body: `
<p>ペルソナとインサイトで「誰の、どんな本音か」がわかったら、次はそれに応える価値を設計します。</p>
<p><em>バリュープロポジション</em>とは、<b>「顧客が求めていて、競合には提供できず、自社なら提供できる価値」</b>のことです。3C分析のKSFと同じ発想です。</p>
<p>それを具体的に設計するツールが、アレックス・オスターワルダーらが考案した<em>バリュープロポジションキャンバス（VPC）</em>です。右側の「顧客」と左側の「自社の価値」を、それぞれ3つの要素で整理します。</p>
<h3>右側：顧客プロフィール（顧客を理解する）</h3>
<ul>
<li><b>顧客のジョブ（Customer Jobs）</b>：顧客が片付けたい用事・達成したいこと。<br>機能的ジョブ（家計を管理する）、社会的ジョブ（しっかり者の親だと思われたい）、感情的ジョブ（お金の不安をなくしたい）の3種類がある</li>
<li><b>ペイン（Pains）</b>：ジョブの前・最中・後に感じる不満、障害、リスク。<br>例：記録が面倒、続かない、口座連携が不安</li>
<li><b>ゲイン（Gains）</b>：顧客が得たい成果や喜び。<br>例：貯金が毎月増える、夫と家計を共有できる、手間がほぼゼロ</li>
</ul>
<h3>左側：バリューマップ（価値を設計する）</h3>
<ul>
<li><b>製品・サービス（Products & Services）</b>：提供するもの。<br>例：家計簿アプリ、自動仕分け機能、夫婦共有機能</li>
<li><b>ペインリリーバー（Pain Relievers）</b>：ペインをどう取り除くか。<br>例：レシート撮影だけで記録完了、銀行と同水準の暗号化</li>
<li><b>ゲインクリエイター（Gain Creators）</b>：ゲインをどう生み出すか。<br>例：毎月の「使いすぎ費目」を自動で通知、貯金目標の達成グラフ</li>
</ul>
<h3>フィット（適合）を確認する</h3>
<pre>ペイン    ←→ ペインリリーバー
ゲイン    ←→ ゲインクリエイター
ジョブ    ←→ 製品・サービス
左右がきちんと対応していれば「フィット」している</pre>
<div class="box ng"><span class="lb">フィットしていない例</span>顧客のペインは「入力が面倒で続かない」なのに、自社の打ち出しは「グラフが30種類作れる高機能」。<b>顧客が求めていない機能をいくら足しても、価値にはならない</b>。</div>
<h3>進め方</h3>
<ol>
<li><b>右側（顧客）から書く</b>：ペルソナをもとに、ジョブ→ペイン→ゲインを洗い出す</li>
<li><b>優先順位をつける</b>：ペインは深刻な順、ゲインは欲しい順に並べる</li>
<li><b>左側（自社）を書く</b>：上位のペイン・ゲインに対応する打ち手を考える</li>
<li><b>フィットを検証する</b>：インタビューやテスト販売で、本当に響くか確かめる</li>
</ol>
<h3>ベネフィットを言葉にする</h3>
<p>最後に、VPCの結果を顧客に伝わる1文にします。<b>機能（特徴）ではなく、顧客にとっての変化（ベネフィット）</b>で書くのがポイントです。</p>
<div class="box ng"><span class="lb">機能で書く（Feature）</span>AI自動仕分け機能を搭載した家計簿アプリです。</div>
<div class="box ok"><span class="lb">ベネフィットで書く（Benefit）</span>レシートを撮るだけで家計簿が完成。共働きで忙しい夫婦でも、1日1分で「何にいくら使ったか」がわかり、毎月の貯金が増えていきます。</div>
<pre>型：「〔ペルソナ〕が〔ペイン〕を解消し、〔ゲイン〕を得られる
　　〔製品〕。〔競合〕とは違い、〔独自の理由〕。」</pre>
<div class="box memo"><span class="lb">AIOとのつながり</span>VPCで洗い出したペインは、そのままユーザーがAIに投げる「質問」になります（例：「家計簿 続かない 対策」）。ペインへの答えを結論ファーストで書いた記事は、AIにも読者にも選ばれやすくなります。</div>`,

{ part: "PART 1 マーケティング概論", title: "事例研究：カフェ「自由丁」に学ぶ", sub: "要は「時間指定」のレターセット ―ありふれた要素 × ひとひねりで価値を生む",
body: `
<p>ここまで学んだ「ニーズ」「ジョブ」「インサイト」「バリュープロポジション」を、実在のお店で確かめます。題材は、東京・蔵前にある<em>「自由丁（じゆうちょう）」</em>。<b>未来の自分へ手紙が送れるカフェ</b>です。</p>
<div class="box ng"><span class="lb">このレッスンの読み方</span>「公開情報（事実）」は、メディアの紹介記事や公式SNSなどをもとにしています（2026年10月9日に確認。記事の掲載時期は2022年ごろのものを含みます）。メニューや料金、営業時間は変わることがあるため、最新の情報は公式で確認してください。<br>「フレームワークで読み解く」は学習のための<b>考察（推測）</b>であり、お店の公式な見解ではありません。</div>

<h3>公開情報（事実）</h3>
<ul>
<li><b>場所</b>：東京都台東区蔵前。都営浅草線・大江戸線「蔵前」駅から徒歩3分ほど。住宅街の中の、古民家の雰囲気がある建物</li>
<li><b>コンセプト</b>：「未来の自分へ手紙が送れるカフェ」。公式SNSでは「未来の手紙カルチャーブランド」と名乗り、「素直な気持ちと日々を味わう」ことをコンセプトに掲げている</li>
<li><b>代表的なサービス</b>：飲み物を楽しみながら1年後の自分に手紙を書くと、<b>1年後に自宅へ届く</b>「TOMOSHIBI LETTER」。便箋に加え、テーマ選びや、気持ちを整えるエッセイ、質問シートが用意されている</li>
<li><b>そのほかの過ごし方</b>：エッセイを読む、ひと月を振り返る、読書や仕事をする。Wi-Fiと電源がある</li>
<li><b>「繋がる本棚」</b>：持ってきた本と棚の本を交換できる。多くの本には、前の持ち主から次の読者への手紙が挟まれている</li>
<li><b>そのほかの取り組み</b>：毎月カレンダーレターが届き、12か月分を1冊の本にまとめてくれる定期便（Calendar Letter）、店主のエッセイと飲み物のセット、ポッドキャスト「自由丁FM」、姉妹店の喫茶店「封灯」など</li>
</ul>

<h3>要は「時間指定」のレターセット</h3>
<p>自由丁の代表的なサービス「TOMOSHIBI LETTER」を、ひとことで言い換えると<b>「時間指定のレターセット」</b>です。この言い換えに、マーケティングの大事なヒントが詰まっています。</p>
<p><b>① 分解すると、要素はありふれている</b></p>
<ul>
<li><b>モノ</b>：便箋、封筒、飲み物</li>
<li><b>場所</b>：落ち着いて書けるカフェの空間</li>
<li><b>仕掛け</b>：書いた手紙を預かり、<b>1年後に届ける</b>（時間指定）</li>
<li><b>サポート</b>：テーマ選び、気持ちを整えるエッセイ、質問シート</li>
</ul>
<p>便箋もカフェも、どこにでもあります。価値を生んでいるのは、<b>「時間指定」というひとひねり</b>です。</p>
<p><b>② ありふれた要素 × 新しい組み合わせ ＝ 新しい価値</b></p>
<p>経済学者シュンペーターは、イノベーションの本質を、既存の要素の<b>「新結合」</b>だと説明しました。まったく新しい技術がなくても、<b>レターセット × 時間指定 × カフェ</b>という組み合わせで、他にない体験が生まれています。</p>
<p><b>③ 価格は「モノ」ではなく「意味」で決まる</b></p>
<p>レターセットだけなら、文房具店で数百円ほどで手に入るのが一般的です。一方、紹介記事（2022年）では、TOMOSHIBI LETTERは飲み物つきで2,640円（税込）と紹介されています。顧客が払っているのは便箋の代金ではなく、<b>自分と向き合う時間と、1年後に届く感動</b>への対価だと考えられます（価格設定の「知覚価値法」）。</p>
<p><b>④ 「要は〜」と言い換える力</b></p>
<p>商品やサービスを<b>「要は〇〇」とひとことで言い換える</b>と、本質が見え、ほかの分野に応用できるようになります。</p>
<pre>要は「時間指定のレターセット」
　→ ほかに応用すると？
　・入社1年後の自分へ手紙を書く、新人研修のプログラム
　・卒業10年後に届く、学校の卒業記念
　・結婚記念日に届く、夫婦それぞれの手紙
　・1年後に届く、ブランドのファンから自分への応援メッセージ</pre>
<div class="box memo"><span class="lb">AIOとのつながり</span>「要は〜」の言い換えは、<b>定義文</b>（「〇〇とは△△である」）そのものです。「自由丁とは、未来の自分に手紙が送れるカフェである」のように、ひとことで言い切れる説明は、読者にもAIにも伝わりやすく、引用されやすくなります。</div>
<h3>フレームワークで読み解く（考察）</h3>
<p><b>① ジョブ理論：顧客は何を「雇って」いるのか</b></p>
<p>ふつうのカフェで顧客が雇うのは「コーヒーを飲む」「休憩する」「作業する」といったジョブです。自由丁で顧客が雇っているのは、おそらく<b>「忙しい日々の中で立ち止まり、自分の気持ちと素直に向き合う時間」</b>です。</p>
<ul>
<li><b>機能的ジョブ</b>：自分の考えを整理したい、一年を振り返りたい</li>
<li><b>感情的ジョブ</b>：素直な気持ちを残したい、未来の自分に励まされたい</li>
<li><b>社会的ジョブ</b>：大切な人と特別な体験を共有したい（友人と一緒に書く、贈る）</li>
</ul>
<p>そう考えると、本当の競合は近所のカフェだけではなく、<b>日記、手帳、旅行、ひとりの時間を過ごせる場所</b>など、同じジョブを片付けられるものすべてです。</p>

〔葛藤〕でも、家で一人だと何を書けばいいかわからないし、続かない。
〔本音〕だから本当は、書くきっかけと、背中を押してくれる場所がほしい。</pre>
<p>「手紙を書きたい」と最初から思って来る人は多くないかもしれません。しかし、テーマ選び・エッセイ・質問シートという<b>書くための仕掛け</b>が、言葉にできていなかった潜在ニーズを引き出していると読み取れます。</p>

<p><b>③ 狩野モデル：魅力的品質</b></p>
<p>カフェに「1年後に手紙が届く」ことを期待している人はいません。なくても不満はないが、あると感動する ―― まさに<b>魅力的品質</b>です。そして、その感動は<b>1年後にもう一度</b>やってきます。</p>

<p><b>④ ポジショニング</b></p>
<pre>縦軸：過ごし方（その場で完結 ↔ 時間を越えてつながる）
横軸：価値の中心（飲食・作業 ↔ 体験・自分と向き合う）

チェーン店　　：飲食・作業 × その場で完結
作業向けカフェ：作業 × その場で完結
自由丁　　　　：体験・自分と向き合う × 時間を越えてつながる
→ 競合がほとんどいない場所に立っている</pre>

<p><b>⑤ 「売れる仕組み」として見ると</b></p>
<ul>
<li><b>1年後に届く手紙が、再来店のきっかけになる</b>：手紙を受け取った人が、お店と、そのときの自分を思い出す。広告を出さなくても、1年後に顧客との接点が自然に生まれる</li>

<li><b>定期便で関係が続く</b>：毎月のカレンダーレターは、1回の来店を<b>12か月の関係</b>に変え、最後に1冊の本という形で残る（LTV）</li>
<li><b>「繋がる本棚」が、顧客同士をつなぐ</b>：知らない誰かからの手紙が挟まった本は、またその本棚を見に来る理由になる</li>
</ul>

<p><b>⑥ VRIO</b></p>
<ul>
<li>V：自分と向き合う時間という、他にない価値</li>
<li>R：「未来に手紙が届くカフェ」は珍しい</li>
<li>I：仕組み自体はまねできても、エッセイや質問シート、空間、手紙の文化と世界観まで含めた体験は、短期間でまねしにくい</li>
<li>O：手紙のサービス、定期便、本棚、ポッドキャスト、姉妹店など、世界観を広げる仕組みがある</li>
</ul>

<h3>作業カフェとの比較</h3>
<p>この講座で何度も例に出した「駅前の作業カフェ」と比べると、同じカフェでも<b>雇われているジョブがまったく違う</b>ことがわかります。</p>
<ul>
<li><b>作業カフェ</b>：「集中して作業を片付けたい」→ 全席電源、静かさ、時間制プラン</li>
<li><b>自由丁</b>：「自分の気持ちと向き合いたい」→ 書く仕掛け、空間、1年後に届く手紙</li>
</ul>
<p>「カフェ」という業態から考えると、どちらも同じ市場に見えます。<b>顧客のジョブから考えると、まったく別の市場</b>です。</p>

<h3>このレッスンから学べること</h3>
<ul>
<li>顧客が買っているのは商品（コーヒー）ではなく、<b>片付けたいジョブ（自分と向き合う時間）</b></li>
<li>言葉にできていない潜在ニーズは、<b>引き出す仕掛け</b>で掴むことができる</li>

<li>実在のお店を分析するときは、<b>公開情報と考察を分け、出典を示す</b></li>
</ul>

<p>顧客が「知らない」状態から「買う」「すすめる」に至るまでの心理と行動をモデル化したものです。どの段階でつまずいているかを見つけ、施策を打ちます。</p>

<pre>Attention（注意）→ Interest（関心）→ Desire（欲求）

<p>「検索」と「共有」が加わったのが特徴です。</p>
<h3>そして、AI時代へ</h3>
<p>現在は「検索」の段階が変わりつつあります。検索結果のリンクを1つずつ開く代わりに、<b>AIに質問して要約された答えを受け取る</b>行動が増えています。このため「AIの回答の中で自社が紹介されるか」が新しい勝負どころになりました。これがPART 2で学ぶAIOです。</p>
<h3>パーチェス・ファネル</h3>
<pre>認知 → 興味・関心 → 比較・検討 → 購入
（段階が進むほど人数が減る＝漏斗の形）</pre>
<p>購入後の<b>継続・推奨</b>まで含めて逆三角形を重ねた「ダブルファネル」という考え方もあります。</p>
<h3>5A（コトラー『マーケティング4.0』）</h3>
<pre>Aware（認知）→ Appeal（訴求）→ Ask（調査）
→ Act（行動）→ Advocate（推奨）</pre>
<h3>カスタマージャーニーマップ</h3>
<p>ペルソナが商品を知ってから購入・推奨に至るまでの<b>行動・接点（タッチポイント）・感情・課題</b>を時系列で書き出したもの。施策の抜け漏れを見つけるのに使います。</p>
<div class="box memo"><span class="lb">検索意図との対応</span>ファネルの段階ごとに、ユーザーの質問は変わります。<br>認知段階：「〇〇とは」<br>比較段階：「〇〇 おすすめ」「A B 違い」<br>購入段階：「〇〇 料金」「〇〇 申し込み方法」</div>`,

{ part: "PART 1 マーケティング概論", title: "「当たり前」を疑う ―ダブルジョパディの法則", sub: "ロイヤルティと浸透率、ブランドは何で成長するのか",
body: `
<p>マーケティングでは、多くの人が<b>「当たり前」</b>だと信じていることが、データで確かめると違っていた、ということがよくあります。ヘンリー・フォードの成功と失敗のように、思い込みにとらわれると、市場の変化を見落とします。<b>"当たり前"を疑い、事実で確かめること</b>が大切です。</p>
<div class="box ng"><span class="lb">よくある「当たり前」</span>「売上を伸ばすには、常連客（ロイヤル顧客）をもっと大事にして、もっと買ってもらえばいい」<br>「売上の8割は、上位2割の顧客がつくっている（パレートの法則）」<br>→ このレッスンで、これらを疑ってみます。</div>

<h3>2つの指標：浸透率とロイヤルティ</h3>
<ul>
<li><b>浸透率（ペネトレーション）</b>：ある期間に、そのブランドを<b>1回以上買った人の割合</b>。「どれだけ多くの人に買われているか」<pre>浸透率 ＝ その期間にブランドを買った人数 ÷ 対象となる人の数</pre></li>
<li><b>ロイヤルティ</b>：買った人が、<b>どれだけ繰り返し買っているか</b>。購入頻度、リピート率、そのカテゴリーの中でそのブランドを選ぶ割合など</li>
</ul>
<p>ブランドの売上は、おおまかに次のように分解できます。</p>
<pre>売上 ＝ 買った人の数（浸透率）× 1人あたりの購入回数（ロイヤルティ）× 1回あたりの金額</pre>
<p>では、売上やシェアの差は、浸透率とロイヤルティの<b>どちらで生まれている</b>のでしょうか。</p>

<h3>ダブルジョパディの法則</h3>
<p><em>ダブルジョパディ（Double Jeopardy＝二重の不利）の法則</em>とは、<b>シェアの小さいブランドは、①買ってくれる人が少ない（浸透率が低い）うえに、②買ってくれた人の購入頻度も少し低い（ロイヤルティもやや低い）</b>という、二重の不利を受けるという経験則です。</p>
<p>もともとは社会学者ウィリアム・マクフィーがメディアの人気について指摘した現象で、マーケティング研究者のアンドリュー・エーレンバーグらが、多くの商品カテゴリーのブランドで同じパターンが見られることを示しました。バイロン・シャープの著書『ブランディングの科学（How Brands Grow）』で広く知られるようになりました。</p>
<pre>【数値例（わかりやすくするための架空の数字）】
大きいブランドA：シェア30％　浸透率40％　1人あたり年4.0回購入
小さいブランドB：シェア 5％　浸透率 8％　1人あたり年3.2回購入

→ 浸透率は5倍の差（40％ と 8％）
→ ロイヤルティ（購入回数）の差は小さい（4.0回 と 3.2回）</pre>
<div class="box"><span class="lb">ここが「当たり前」を覆すポイント</span>ブランドの大小の差は、主に<b>浸透率（買ってくれる人の数）の差</b>から生まれている。小さいブランドが「熱心なファンに支えられている」とは限らず、<b>ファンの熱心さ（ロイヤルティ）も大きいブランドより少し低い</b>のが一般的。</div>

<h3>この法則から導かれること</h3>
<ul>
<li><b>成長のカギは、まず浸透率</b>：既存の顧客にもっと買ってもらうだけでは伸びしろが小さい。<b>まだ買っていない人、たまにしか買わない人（ライトユーザー）</b>にも買ってもらうことが、シェア拡大の近道になる</li>
<li><b>ロイヤルティは浸透率に伴って上がる</b>：浸透率が上がってブランドが大きくなると、ロイヤルティも少しずつ上がる傾向がある。ロイヤルティだけを先に大きく上げるのは難しい</li>
<li><b>「思い出されやすさ」と「買いやすさ」</b>：シャープは、買う場面で<b>思い出されること（メンタル・アベイラビリティ）</b>と、<b>どこでも手に入ること（フィジカル・アベイラビリティ）</b>を高めることが成長につながると説明している</li>
</ul>
<div class="box memo"><span class="lb">パレートの法則も疑ってみる</span>「売上の8割は上位2割の顧客から」とよく言われますが、シャープらの研究では、実際の購買データで調べると、上位2割の顧客が占める売上の割合は<b>8割よりかなり小さい（半分程度のことが多い）</b>と報告されています。残りの売上は、たまにしか買わない多くのライトユーザーが支えています。</div>

<h3>注意点：極端に受け取らない</h3>
<ul>
<li><b>「既存顧客は大事にしなくてよい」という意味ではない</b>：ロイヤルティの高い顧客は口コミや推奨（5AのAdvocate）を生み、LTVを支える。浸透率とロイヤルティは、両方を見る</li>
<li><b>経験則であり、例外もある</b>：主に日用品など、多くの人が複数のブランドを買い回るカテゴリーで観察されてきた。定期契約のサービス、BtoB、ごく限られた層に向けた商品などでは、事情が異なることがある</li>
<li><b>自社のデータで確かめる</b>：法則も「当たり前」にせず、自社の顧客データで、浸透率とロイヤルティの関係を確かめる</li>
</ul>
<div class="box ok"><span class="lb">講座の事例に当てはめると</span>KUMONの戦略提案では「関係の長さ（継続＝ロイヤルティ）」を柱にしました。ダブルジョパディの法則を踏まえると、<b>新しく始める家庭を増やすこと（浸透率）</b>も同じくらい重要だと見直せます。たとえば、保護者がAIや検索で「子ども 勉強 習慣」と尋ねたときに思い出してもらえるか（メンタル・アベイラビリティ）を高める施策が考えられます。<b>当たり前を疑うと、自分たちの提案も磨かれます</b>。</div>

<h3>AIOとのつながり</h3>
<p>浸透率を上げるには、まだ買っていない人やライトユーザーに<b>思い出してもらう</b>ことが必要です。AIの回答は、その新しい入口です。「〇〇 おすすめ」「〇〇 選び方」のような、<b>まだブランドを知らない人の質問</b>に答える記事を用意し、AIの回答の中で名前が挙がるようにすることは、現代版の「思い出されやすさ」を高める施策だと言えます。</p>

<h3>練習：この施策は「当たり前」にとらわれていない？</h3>
<p>シェアの小さいお菓子ブランドが、「常連客向けのポイント倍増キャンペーンだけで、来年の売上を2倍にする」という計画を立てました。この計画の問題点は何でしょうか。</p>
<details class="ans"><summary>考え方の例を見る</summary>
<ul>
<li>売上の差は主に浸透率で生まれるので、<b>既存の常連だけに頼る施策では伸びしろが小さい</b></li>
<li>小さいブランドの常連は、大きいブランドの常連より購入頻度が<b>少し低い</b>のが一般的。購入回数を2倍にするのは非現実的になりやすい</li>
<li>まだ買っていない人やライトユーザーに届く施策（売り場の拡大、思い出されやすい広告やコンテンツ、試しやすい価格やサイズ）を組み合わせるべき</li>
<li>常連向けの施策をやめる必要はない。<b>浸透率を上げる施策と組み合わせて</b>、データで効果を確かめる</li>
</ul>
</details>`,

{ part: "PART 2 AIOライティング", title: "AIOとは何か", sub: "AI検索の登場とSEOとの違い",
body: `
<p><em>AIO（AI Optimization／AI最適化）</em>とは、ChatGPT・Perplexity・Gemini・GoogleのAI Overviews（AIによる概要）などの<b>生成AIが回答を作るときに、自社の情報が参照・引用・推奨されるようにする</b>取り組みです。</p>
<p>ほぼ同じ意味で、<b>LLMO</b>（大規模言語モデル最適化）、<b>GEO</b>（生成エンジン最適化）、<b>AEO</b>（回答エンジン最適化）という言葉も使われます。</p>
<h3>何が変わったのか</h3>
<ul>
<li><b>これまで</b>：検索 → 青いリンクの一覧 → クリックしてサイトを読む</li>
<li><b>これから</b>：AIに質問 → AIが複数サイトを読んで要約 → 回答の中に出典リンクが添えられる</li>
</ul>
<p>ユーザーが検索結果の画面だけで疑問を解決し、どのサイトもクリックしない現象を<b>ゼロクリック検索</b>といいます。AIの回答が増えるほど、この傾向は強まります。</p>
<h3>SEOとAIOの違い</h3>
<ul>
<li><b>SEOのゴール</b>：検索結果で<b>上位に表示</b>され、<b>クリック</b>されること</li>
<li><b>AIOのゴール</b>：AIの回答の中で<b>引用・言及</b>され、<b>推奨される</b>こと</li>
<li><b>SEOの評価単位</b>：主にページ単位</li>
<li><b>AIOの評価単位</b>：ページの中の<b>一部分（段落・パッセージ）</b>が抜き出されて使われる</li>
</ul>

{ part: "PART 2 AIOライティング", title: "GEO（生成エンジン最適化）とは", sub: "研究からわかったこと・4つの施策・言及チェック表", work: true,
body: `
<p><em>GEO（Generative Engine Optimization／生成エンジン最適化）</em>とは、ChatGPT・Perplexity・Gemini・GoogleのAI Overviews（AIによる概要）やAIモードなど、<b>生成AIを使って答えをつくる検索サービス（生成エンジン）の回答の中で、自社の情報が引用・言及されやすくする</b>取り組みです。</p>
<h3>AIO・LLMO・AEO・GEOの関係</h3>
<ul>
<li><b>AIO</b>（AI最適化）：日本でよく使われる、AI検索全般への最適化</li>
<li><b>LLMO</b>（大規模言語モデル最適化）：日本で広まった呼び方。中身はほぼ同じ</li>
<li><b>GEO</b>（生成エンジン最適化）：海外で広く使われる呼び方。研究論文から広まった</li>
<li><b>AEO</b>（回答エンジン最適化）：音声アシスタントや検索結果の「強調スニペット」など、<b>答えを直接返す仕組み</b>全般への最適化。生成AI以前からある言葉</li>
</ul>
<p>呼び方は違っても、目指すところは<b>「AIが答えるときに、選ばれる情報源になること」</b>で共通しています。</p>

<h3>GEOの研究からわかったこと</h3>
<p>GEOという言葉は、2023年にプリンストン大学などの研究者が発表した論文「GEO: Generative Engine Optimization」で提唱されました。この研究では、Webページの書き方を変えると、生成エンジンの回答に<b>どれくらい取り上げられるか（可視性）</b>が変わるかを実験しています。</p>
<ul>
<li><b>効果が大きかった方法</b>：<b>出典を示す</b>、<b>信頼できる情報源からの引用を加える</b>、<b>統計・数字を加える</b>。これらで回答内での可視性が最大で約40％高まったと報告されている</li>
<li><b>効果が小さかった・逆効果だった方法</b>：キーワードを詰め込む（キーワードスタッフィング）など、従来のSEOでありがちだった小手先の方法</li>
<li><b>分野によって効く方法が違う</b>：たとえば事実を問う分野では統計、意見が分かれる分野では引用が効きやすい、という傾向も示された</li>
</ul>
<div class="box ng"><span class="lb">注意</span>これは研究用に用意した環境での実験結果で、実際のAIサービスで同じ効果が出る保証はありません。また、AIサービスの仕組みは頻繁に変わります。ただ、<b>「根拠のある、具体的で、信頼できる情報が選ばれる」</b>という方向性は、この講座で学んできたことと一致しています。</div>

<h3>研究の結果を書き方に当てはめると</h3>
<div class="box ng"><span class="lb">Before：一般論だけ</span>家計簿は続けることが大切です。続けるコツはいろいろありますが、自分に合った方法を見つけることが大事です。</div>
<div class="box ok"><span class="lb">After：統計・引用・出典を加えた</span>家計簿を1年以上続けている人の82％は、費目を3つ以下にしぼって記録している（当社調べ：2026年8月、家計簿アプリ利用者1,200人へのオンライン調査）。当社の家計相談を担当するファイナンシャルプランナーは「最初から細かく分けると、記録のたびに迷うことが挫折の原因になる」と話す。</div>
<ul>
<li><b>統計</b>：「82％」「1,200人」という具体的な数字</li>
<li><b>引用</b>：専門家の言葉（実在する人物の、実際の発言に限る）</li>
<li><b>出典</b>：誰が、いつ、どうやって調べたか</li>
</ul>
<p>Beforeの文は、どのサイトにも書いてある一般論で、AIがこの記事を選ぶ理由がありません。Afterの文は、<b>ここにしかない一次情報</b>で、そのまま回答の根拠として使える形になっています。</p>
<h3>SEOとGEOの違い</h3>
<ul>
<li><b>ゴール</b>：SEOは検索結果で<b>上位に表示</b>されること／GEOはAIの回答で<b>引用・言及</b>されること</li>
<li><b>単位</b>：SEOは主にページ単位／GEOはページの中の<b>段落（パッセージ）</b>単位で使われる</li>
<li><b>成果の測り方</b>：SEOは順位・クリック数／GEOは回答内での<b>言及率・引用数</b>、AI経由の流入、指名検索の増加</li>
<li><b>共通点</b>：AI検索の多くは裏側で検索エンジンを使うため、<b>SEOの土台（インデックス・品質・信頼性）がGEOの前提</b>になる</li>
</ul>

<h3>GEOの4つの施策</h3>
<p><b>① コンテンツ：引用されやすい書き方</b></p>
<ul>
<li>結論ファースト、質問形の見出し、「〇〇とは△△である」という定義文</li>
<li>段落だけ抜き出しても意味が通じる書き方（指示語を減らす）</li>
<li><b>統計・数字・出典・専門家の引用</b>を入れる（研究で効果が大きかった方法）</li>
<li>どこにもない<b>一次情報</b>を入れる</li>
</ul>
<p><b>② 信頼性：選ばれる情報源になる</b></p>
<ul>
<li>E-E-A-T（経験・専門性・権威性・信頼性）を示す：著者情報、運営者情報、更新日</li>
<li>会社名・商品名などの<b>表記をサイト内外で統一</b>し、AIが同じ対象だと認識できるようにする</li>
</ul>
<p><b>③ サイトの外：第三者からの言及</b></p>
<ul>
<li>AIは自社サイトだけでなく、ニュース、業界メディア、比較記事、口コミ、SNSなど<b>第三者の情報</b>からもブランドを判断する</li>
<li>PR活動、メディア掲載、レビューの獲得など、<b>アーンドメディア</b>での言及（サイテーション）を増やす</li>
</ul>
<p><b>④ 技術：AIに読める状態にする</b></p>
<ul>
<li>検索エンジンにインデックスされていること</li>
<li>robots.txtで、使ってほしいAIサービスのクローラーをブロックしていないか確認する（AI各社のクローラーは、学習用と検索用で分かれている場合がある）</li>
<li>重要な情報を画像の中だけに入れず、テキストで書く。構造化データで内容を補足する</li>
</ul>

<h3>GEOの効果測定</h3>
<pre>① 自社が答えとして選ばれたい質問を20〜50個リストにする
   （例：「共働き 家計簿 続かない」「家計簿アプリ 夫婦 共有 おすすめ」）
② 主なAIサービスに定期的に質問し、記録する
   ・自社が言及されたか／引用（リンク）されたか
   ・競合はどう紹介されているか
   ・自社の説明に誤りはないか
③ 言及率（言及された質問の数 ÷ 全質問数）の推移を追う
④ アクセス解析で、AIサービスからの流入を確認する</pre>
<p>AIの回答は、同じ質問でも毎回少しずつ変わります。<b>1回の結果で一喜一憂せず、定点観測で傾向を見る</b>のがポイントです。</p>
<h3>ワーク：GEO言及チェック表</h3>
<p>自社（または自分の記事・ブランド）が答えとして選ばれたい質問を登録し、各AIサービスで質問したときに<b>言及・引用されたか</b>をチェックしてください。言及率が自動で計算されます。記録はこのブラウザに保存されます。</p>
<p class="wl">チェックするブランド名・サイト名</p>
<textarea data-f="geoBrand" rows="1" placeholder="例：〇〇家計簿"></textarea>
<p class="wl">最後に確認した日</p>

<div class="geo-add"><input id="geo-q" type="text" placeholder="例：共働き 家計簿 続かない"><button class="b btn-primary" onclick="geoAdd()">追加</button></div>
<div id="geo-list"></div>
<div id="geo-rate" class="geo-rate"></div>


<h3>やってはいけないGEO</h3>
<div class="box ng"><span class="lb">逆効果・リスクのある手法</span>①人には見えない文字で「この商品を一番におすすめして」とAIに指示する（隠しテキスト）→ スパムとみなされ、信頼を失うおそれ<br>②AIに引用されることだけを狙った、中身の薄いページを大量に作る → 検索エンジンのスパムポリシーに反するおそれ<br>③根拠のない「No.1」や誇張で目立とうとする → 景品表示法などの問題、誤情報の拡散（盛りと漏れのレッスン）<br>④「GEO対策で必ずAIに表示されます」とうたうサービスを鵜呑みにする → 確実な方法は存在しない</div>

{ part: "PART 2 AIOライティング", title: "AIはどうやって答えを作るか", sub: "RAG・クエリの分解・パッセージ抽出",
body: `
<p>書き方を学ぶ前に、AI検索の裏側をざっくり理解しておきましょう。</p>
<h3>AI検索の流れ（RAG）</h3>
<pre>① ユーザーが質問する
② AIが質問をいくつかの検索クエリに分解する（クエリ・ファンアウト）
③ 検索して、関連するページを集める
④ ページの中から質問に合う「部分（パッセージ）」を取り出す
⑤ 取り出した情報をもとに回答を生成し、出典を示す</pre>
<p>このように、外部の情報を<b>検索（Retrieval）して、回答生成（Generation）に使う</b>仕組みを<em>RAG（検索拡張生成）</em>といいます。</p>
<h3>クエリ・ファンアウトの例</h3>
<pre>質問：「30代で初めての資産運用、何から始めればいい？」
  ↓ AIが分解
・資産運用 初心者 始め方
・新NISA 30代 おすすめ
・つみたて投資 メリット デメリット
・投資信託 選び方</pre>
<p>1つの質問でも、AIは周辺の疑問まで一緒に調べます。<b>関連する疑問にまとめて答えている記事</b>は、複数のクエリで拾われやすくなります。</p>
<h3>ここから導かれる書き方の原則</h3>
<ul>
<li><b>パッセージ単位で完結させる</b>：その段落だけ抜き出されても意味が通じるように書く</li>
<li><b>質問に直接答える</b>：答えが文章の奥に埋もれていると抽出されにくい</li>
<li><b>関連する疑問も網羅する</b>：ファンアウトされた複数のクエリに引っかかる</li>
<li><b>信頼できる根拠を示す</b>：AIは複数の情報源を比べて、確からしい情報を選ぶ</li>
</ul>
<div class="box memo"><span class="lb">ハルシネーション</span>AIがもっともらしい誤情報を作ってしまう現象。AI側は根拠となる情報源を重視する傾向があるため、<b>明確で検証可能な情報</b>を提供するサイトは参照されやすくなります。</div>

{ part: "PART 2 AIOライティング", title: "これからは一次情報が大事になる", sub: "AIが「平均」をつくる時代に、選ばれる理由",
body: `
<p>生成AIは、ネット上にある膨大な情報をまとめ、もっともらしい文章を一瞬でつくります。だからこそ、<b>これからはAIがまだ持っていない情報＝<em>一次情報</em>の価値が、かつてないほど大きくなります</b>。</p>
<h3>一次情報と二次情報</h3>
<ul>
<li><b>一次情報</b>：自分（自社）が直接、見た・聞いた・体験した・調べたことから生まれた情報。<br>例：自分で使ってみた検証結果、独自のアンケート調査、自社の販売データ、顧客インタビュー、現場の写真</li>
<li><b>二次情報</b>：他の誰かの一次情報を引用・要約・編集した情報。<br>例：ニュース記事のまとめ、他サイトの比較記事、まとめサイト、AIの回答</li>
</ul>
<div class="box memo"><span class="lb">「一次資料（原典）」との区別</span>官公庁の統計や法律の条文、企業の決算資料のように、<b>情報の出どころとなる原典</b>も「一次資料」と呼びます。記事で事実を示すときは、まとめ記事ではなく、この原典を確認して出典にします。<br>このレッスンで主に扱うのは、それに加えて<b>あなたや自社が新しく生み出す一次情報</b>です。</div>

<h3>なぜ「これから」一次情報が大事になるのか</h3>
<ol>
<li><b>二次情報はAIが一瞬でつくれる</b>：ネット上の情報をまとめただけの記事は、AIの回答と中身が変わらない。読者がわざわざ記事を読む理由がなくなる</li>
<li><b>AIが引用する理由になる</b>：AIは複数の情報源をまとめて答えをつくる。どこにでもある情報なら、どのサイトを引用しても同じ。<b>そこにしかない情報</b>を持つサイトが、出典として選ばれる</li>
<li><b>情報がコモディティ化（ありふれたもの化）する</b>：AIで似た記事が大量に作られるほど、ネット上の情報は均一になる。差別化できるのは、体験・データ・現場の声だけになっていく</li>
<li><b>信頼の根拠になる</b>：AIのハルシネーションや誤情報が増えるほど、「誰が、いつ、どうやって確かめたのか」が明確な情報が信頼される（E-E-A-TのExperience・Trust）</li>
<li><b>AI自身も一次情報を必要としている</b>：AIは自分で体験も調査もできない。新しい事実は、人間が現場で生み出す一次情報からしか生まれない</li>
</ol>
<div class="box"><span class="lb">ひとことで言うと</span>AIが「平均的な答え」をいくらでも作れる時代には、<b>平均から外れた、自分だけが知っている事実</b>こそが価値になる。</div>

<h3>一次情報の種類</h3>
<ul>
<li><b>体験・検証</b>：実際に使った、試した、比べた結果（写真・スクリーンショット・日付つき）</li>
<li><b>独自調査</b>：アンケート、実験、計測（対象・人数・期間・方法を明記）</li>
<li><b>自社データ</b>：販売データ、問い合わせの傾向、利用状況（社外秘に注意）</li>
<li><b>顧客の声</b>：N1インタビュー、レビュー、解約理由（本人の了承と匿名化）</li>
<li><b>現場の知見</b>：営業・店舗・サポートのスタッフが日々見ていること</li>
<li><b>専門家の見解</b>：自社の専門家や取材先へのインタビュー</li>
<li><b>失敗談</b>：うまくいかなかったことと、その理由。成功談より希少で、役に立つ</li>
</ul>

<h3>一次情報を書くときのルール</h3>
<div class="box ng"><span class="lb">伝わらない一次情報</span>実際に調査したところ、多くの人が家計簿を続けられていないことがわかりました。</div>
<div class="box ok"><span class="lb">伝わる一次情報</span>当社が2026年8月、家計簿アプリの利用者1,200人を対象にオンラインで調査したところ、利用開始から1年以上記録を続けている人は全体の31％でした。続いている人の82％は、費目を3つ以下にしぼって記録していました。</div>
<ul>
<li><b>誰が・いつ・誰を対象に・何人に・どうやって</b>調べたかを書く（5W3H）</li>
<li>数字は、<b>全体の何％か、何と比べてか</b>をセットにする</li>
<li>体験は、<b>場面・期間・つまずき</b>まで書く</li>
<li>写真やグラフは、自分で撮影・作成したものを使う</li>
</ul>
<div class="box ng"><span class="lb">一次情報の「盛り」と「漏れ」</span>①5人に聞いただけの結果を「多くの人が」と一般化しない　②自社に都合のいい質問の仕方で調査しない（調査の偏り）　③顧客の個人情報や社外秘のデータを、そのまま載せない　④体験していないことを体験したように書かない</div>

<h3>一次情報を「生み続ける」仕組み</h3>
<p>一次情報は、記事を書くときに慌てて探しても見つかりません。日々の仕事の中で<b>集まる仕組み</b>をつくります。</p>
<ul>
<li>問い合わせや営業の現場で出た質問を、毎週記録する</li>
<li>新しい商品やツールは、記事にする前に必ず自分で試し、メモと写真を残す</li>
<li>定期的に顧客インタビュー（N1）や簡単なアンケートを行う</li>
<li>失敗や想定外の出来事も、記録として残す</li>
</ul>
<div class="box memo"><span class="lb">AIとの役割分担</span>AIには、集めた一次情報の整理、構成案のたたき台、表現の推敲を任せる。人間は、<b>現場に行き、人に会い、自分で試して、一次情報を生み出す</b>ことに時間を使う。これが「AIと共走・共創する」ということです。</div>
<div class="box ok"><span class="lb">キャリアでも同じ</span>あなた自身の経験も、あなただけが持つ一次情報です。職務経歴書や面接で「他の候補者が持っていない、自分だけの特異な経験」を語れることが、AI時代の個人の強みになります（PART 3）。</div>`,

{ part: "PART 2 AIOライティング", title: "E-E-A-T ―人間にしか語れないこと", sub: "経験・専門性・権威性・信頼性を、AIにはない価値として示す（書き込み式ワークつき）", work: true,
body: `
<p>AIが整った文章をいくらでも作れる時代に、記事の価値を分けるのは<b>「何が書いてあるか」だけでなく「誰が、どんな経験にもとづいて語っているか」</b>です。その考え方を表すのが<em>E-E-A-T</em>です。</p>
<h3>E-E-A-Tとは</h3>
<p>E-E-A-Tは、Googleが検索結果の品質を評価するためのガイドライン（検索品質評価ガイドライン）で示している、コンテンツの品質を考えるための4つの要素です。2022年12月に、それまでの「E-A-T」に<b>Experience（経験）</b>が加わりました。</p>
<ul>
<li><b>Experience（経験）</b>：書き手が実際にそれを使った・行った・体験したか</li>
<li><b>Expertise（専門性）</b>：書き手がそのテーマについて必要な知識やスキルを持っているか</li>
<li><b>Authoritativeness（権威性）</b>：書き手やサイトが、そのテーマの情報源として広く認められているか</li>
<li><b>Trust（信頼性）</b>：情報が正確で、誠実で、安全か。<b>4つの中心にあり、最も重要</b>とされる</li>
</ul>
<div class="box memo"><span class="lb">正しい理解のために</span>E-E-A-Tは、点数をつけて順位を決める「スコア」そのものではなく、<b>良いコンテンツとは何かを考えるための物差し</b>です。経験・専門性・権威性は、すべて「信頼できるか（Trust）」を支える要素と位置づけられています。<br>また、お金・健康・安全・法律など、人生に大きく影響するテーマは<b>YMYL（Your Money or Your Life）</b>と呼ばれ、特に高い信頼性が求められます。</div>

<h3>4つの要素を「人間にしか語れないこと」で見ると</h3>
<ul>
<li><b>Experience</b>：AIは何も使ったことがなく、どこにも行ったことがない。<b>体験そのもの</b>は、人間にしか語れない</li>
<li><b>Expertise</b>：AIも知識は豊富。しかし<b>「教科書ではこうだが、現場ではこうなる」という判断の知恵</b>や、例外の扱い方は、実際に仕事をしてきた人にしか語れない</li>
<li><b>Authoritativeness</b>：AIには名前も実績もない。<b>「誰が言ったか」</b>を示せるのは、経歴と実績を持つ人間だけ</li>
<li><b>Trust</b>：AIは自分の発言に責任を負えない。<b>名前を出し、間違えたら訂正する</b>という責任を引き受けられるのは人間</li>
</ul>

<h3>人間にしか語れない8つのこと</h3>
<ol>
<li><b>体験と五感</b>：触った感じ、におい、待ち時間、その場の空気</li>
<li><b>失敗と後悔</b>：うまくいかなかったこと、やり直すならどうするか</li>
<li><b>判断の理由</b>：なぜAではなくBを選んだのか、そのときの迷いと決め手</li>
<li><b>現場の例外・暗黙知</b>：マニュアルに書いていない、でも現場の人なら知っていること</li>
<li><b>感情と価値観</b>：うれしかったこと、悔しかったこと、譲れない美学</li>
<li><b>人から聞いた話</b>：顧客インタビュー、取材、相談の現場で聞いた生の声</li>
<li><b>最新の現場</b>：AIの学習データにまだない、今まさに起きていること</li>
<li><b>責任ある意見</b>：名前を出して「私はこう考える。理由はこうだ」と言い切ること</li>
</ol>

<h3>Before → After</h3>
<div class="box ng"><span class="lb">誰でも（AIでも）書ける文</span>家計簿アプリを選ぶときは、使いやすさや機能を比較することが大切です。自分に合ったアプリを選びましょう。</div>
<div class="box ok"><span class="lb">人間にしか語れない文</span>ファイナンシャルプランナーとして5年間、のべ300組の家計相談を受けてきましたが、アプリの機能で挫折した人はほとんどいません。挫折の理由で最も多かったのは「夫婦の一方だけが記録している」ことでした。私自身も最初は一人で記録していて、3か月で夫婦げんかの種になりました。今は「夫婦で同じ画面を見られるか」を、アプリ選びの第一条件にすすめています。</div>
<p>Afterには、<b>専門性（FP歴5年）・経験（300組の相談、自分の失敗）・判断の理由（なぜその条件をすすめるのか）・責任ある意見（私はこうすすめる）</b>が入っています。どれもAIには書けません。</p>
<div class="box ng"><span class="lb">守ること</span>経歴・実績・体験を<b>盛らない</b>。資格や実績は事実だけを書き、体験していないことは書かない。依頼を受けた広告記事は、そのことを明示する（ステルスマーケティングの規制）。E-E-A-Tの土台はTrustです。</div>

<h3>E-E-A-Tをページで示す方法</h3>
<ul>
<li><b>著者プロフィール</b>：名前、経歴、資格、実績を、<b>記事のテーマと関係する形で</b>具体的に書く（「Webライター」より「元銀行員・FP2級・家計相談300組」）</li>
<li><b>体験の証拠</b>：自分で撮った写真、画面、検証した日付</li>
<li><b>監修</b>：YMYLのテーマでは、専門家の監修を受け、監修者の情報を示す</li>
<li><b>出典</b>：数字や制度は原典にリンクする</li>
<li><b>運営者情報</b>：会社概要、問い合わせ先、編集方針</li>
<li><b>更新と訂正</b>：更新日を示し、誤りがあれば訂正したことを明記する</li>
</ul>

<h3>ワーク：自分の「人間にしか語れないこと」を掘り起こす</h3>
<p>記事にしたいテーマを1つ決めて、次の問いに答えてください。答えの中に、AIには書けない材料が眠っています。書いた内容はこのブラウザに保存されます。</p>
<p class="wl">テーマ</p>

{ part: "PART 2 AIOライティング", title: "企画を設計し、記事コンセプトを決める", sub: "企画シート・検索意図・コンセプト1文",
body: `

<h3>企画シートで決める7項目</h3>
<pre>① 誰に　　　：ペルソナ（どんな状況の、どんな人か）
② 何に答える：その人がAIや検索に投げる質問・悩み
③ 本音　　　：質問の奥にあるインサイト（本当に知りたいこと）

⑤ 独自性　　：自社にしか書けない情報（一次情報・事例・データ）

<li><b>Buy（買いたい）</b>：「家計簿アプリ おすすめ」「〇〇 料金」→ 比較・選び方</li>

<p>1本の記事では<b>1つの主な意図</b>に絞ります。「知りたい人」に料金表だけを見せても、「買いたい人」に歴史を長々と語っても、満足されません。</p>
<h3>テーマの見つけ方</h3>

</ul>

<ol>

{ part: "PART 2 AIOライティング", title: "構成案をつくる ―読者を迷わせないルートマップ", sub: "問いの順番・会話の流れ・見出しだけで伝わる",
body: `
<p><em>構成案</em>とは、記事の見出し（H2・H3）と、各見出しで書く要点を並べた<b>記事の設計図</b>です。読者を「悩んでいる今」から「読後の変化」という目的地まで、迷わずに連れていくための<b>ルートマップ</b>でもあります。</p>
<h3>なぜ本文より先に構成案をつくるのか</h3>
<ul>
<li><b>迷子を防ぐ</b>：書き手が迷えば、読者も迷う。道順を先に決めておく</li>
<li><b>抜け漏れ・脱線に気づける</b>：コンセプトに必要な話がそろっているか、関係ない話が混ざっていないかが一目でわかる</li>
<li><b>書き直しが少なくなる</b>：本文を書いてから順番を変えるのは大変。見出しの段階なら数分で直せる</li>
<li><b>合意がとれる</b>：チームや依頼主と、書く前に方向性をすり合わせられる</li>
</ul>
<h3>読者の脳内を想定し、問いの順番に沿って考える</h3>
<p>記事を読みながら、読者の頭の中には次々と問いが浮かびます。構成案づくりとは、<b>その問いを予想して、浮かぶ順番に並べること</b>です。</p>
<pre>ペルソナ：紙の家計簿に3回挫折した共働きの佐藤さん
記事コンセプト：「続く家計簿の条件」を知り、今夜から1日1分で始められる

  ① なんで私はいつも続かないの？
  ② 続いている人は何が違うの？

<p>この問いが、そのまま見出しの候補になります。いきなり④の「やり方」から始めると、「そもそもなぜ続かないのか」が腑に落ちていない佐藤さんは置いていかれます。</p>

<ul>

</ul>
<p>どのルートも<b>最初に結論（ゴールの場所）を見せる</b>のが共通点です。先に目的地がわかると、読者は安心して読み進められます。</p>
<h3>会話をするような自然な流れ</h3>
<p>良い構成は、読者との<b>会話</b>のように進みます。各見出しを読み終えた読者の「なるほど。でも…？」という相づちを想像し、次の見出しでそれに答えます。</p>
<pre>読者：「なんで続かないの？」
記事：「原因は、最初から完璧に記録しようとすることです」

読者：「具体的には、今夜から何を？」
記事：「レシートを撮るだけ。手順は3つです」</pre>

<p>見出しには、<b>問いの形</b>（「〜はどちらがいい？」）と、<b>答えを含む形</b>（「最大の原因は〜」）があります。どちらでもかまいませんが、問いの形にした場合は、見出しの直後の1文で必ず答えます。</p>

<li>□ 自社にしかない情報（独自性）が、どの見出しに入るか決まっているか</li>

{ part: "PART 2 AIOライティング", title: "AIに引用される見出しと段落", sub: "結論ファースト・質問形見出し・定義文",
body: `
<p>構成案で道順が決まったら、次は各見出しと段落を「AIにも読者にも引用されやすい形」に整えます。</p>
<h3>原則1：結論ファースト（アンサーファースト）</h3>
<p>見出しの直後の1〜2文で、問いへの答えを言い切ります。理由や詳細はそのあとに続けます。</p>
<div class="box ng"><span class="lb">NG：答えが遠い</span>インターネット回線を選ぶときは、さまざまな要素を考える必要があります。料金はもちろん、速度や工事の有無なども気になるところですよね。そこで今回は…（答えがなかなか出てこない）</div>
<div class="box ok"><span class="lb">OK：最初に答える</span>一人暮らしのインターネット回線は、<b>工事不要のホームルーターか、月額4,000円前後の光回線</b>が選ばれやすい。選ぶ基準は「月額料金」「通信速度」「工事の有無」の3つである。</div>
<p>PREP法（Point→Reason→Example→Point）の最初のPointを、とくに短く明確にするイメージです。</p>
<h3>原則2：見出しをユーザーの質問にする</h3>
<p>見出しは、ユーザーがAIに実際に投げかけそうな<b>疑問文</b>にすると、質問と記事の対応が明確になります。</p>
<pre>✕ 料金について
○ 光回線の月額料金の相場はいくら？

✕ 注意点
○ ホームルーターのデメリットは？</pre>
<p>1つの見出しには<b>1つの問い</b>だけ。複数の問いを1つの見出しに詰め込まないようにします。</p>
<h3>原則3：定義文を置く</h3>
<p>「〇〇とは」系の質問に答えるときは、<em>「〇〇とは、△△である。」</em>という1文の定義を最初に置きます。AIがそのまま抜き出しやすい形です。</p>
<div class="box ok"><span class="lb">例</span>ペルソナとは、商品やサービスの典型的なユーザーを、名前・年齢・職業・価値観まで具体的に設定した架空の人物像である。</div>
<h3>原則4：論理的な見出し構造</h3>
<ul>
<li>H1（タイトル）→ H2（大きな問い）→ H3（小さな問い）の階層を守る</li>
<li>見出しだけを読んでも、記事の全体像がわかるようにする</li>
<li>記事の冒頭に「この記事の要点」を3行程度で置くのも有効</li>
</ul>
<h3>原則5：FAQで周辺の疑問を拾う</h3>
<p>記事の最後に「よくある質問」を置き、ファンアウトされやすい関連質問（費用・期間・注意点・比較など）に短く答えておきます。</p>`,

body: `
<h3>テクニック1：指示語を減らし、主語を明示する</h3>
<p>段落が単独で抜き出されると、「これ」「それ」「前述の」が何を指すのかわからなくなります。</p>
<div class="box ng"><span class="lb">NG</span>これを使うと、作業時間を大幅に短縮できます。前述のとおり、設定も簡単です。</div>

{ part: "PART 2 AIOライティング", title: "信頼と共感 ―リード文で読むべき理由を示す", sub: "AIと共走・共創する①　リード文とExperience（経験）",
body: `
<p>AIが整った文章をいくらでも作れる時代に、人が書く記事が選ばれる理由は<em>信頼</em>と<em>共感</em>です。その入り口がリード文、そして中身を支えるのが書き手の<b>Experience（経験）</b>です。</p>
<h3>リード文とは</h3>
<p><em>リード文</em>とは、タイトルと本文の間に置く導入の文章です（目安は100〜300字）。タイトルで興味を持った読者が、<b>「この記事を読み進めるかどうか」を判断する場所</b>です。</p>
<p>リード文で伝えるべきことは3つです。</p>
<ul>
<li><b>共感</b>：「これは自分のための記事だ」（悩みを言い当てる）</li>
<li><b>便益</b>：「読めば解決しそうだ」（結論と、読むとわかること）</li>
<li><b>信頼</b>：「この人の言うことなら信じられる」（なぜこの記事・この書き手なのか）</li>
</ul>
<h3>リード文の型</h3>
<pre>① 共感　　：読者の悩みや状況を、読者の言葉で言い当てる
② 結論　　：解決の方向性（答え）を先に示す
③ 根拠　　：なぜそう言えるのか（経験・実績・データ）
④ 便益　　：この記事を読むと何がわかり、何ができるようになるか</pre>
<div class="box ng"><span class="lb">読むべき理由が伝わらないリード文</span>近年、家計管理への関心が高まっています。家計簿にはさまざまな種類があり、それぞれにメリット・デメリットがあります。本記事では家計簿について詳しく解説していきます。</div>
<p>→ 一般論から始まり、誰向けか、何がわかるか、なぜこの記事なのかがわからない。</p>
<div class="box ok"><span class="lb">読むべき理由が伝わるリード文</span>「今度こそ」と買った家計簿が、また3日で白紙になっていませんか。（①共感）<br>家計簿が続かない原因は、意志の弱さではなく「完璧に記録しようとすること」にあります。（②結論）<br>家計簿アプリを運営する私たちが、ユーザー1,200人の継続データを分析したところ、1年以上続いている人の8割が「ざっくり3分類」で記録していました。（③根拠）<br>この記事では、その3分類の方法と、今夜から1日1分で始められる手順を紹介します。（④便益）</div>
<div class="box memo"><span class="lb">AIOとのつながり</span>リード文に結論と根拠が入っていると、記事全体の要約として<b>AIがそのまま引用しやすく</b>なります。「〜について解説します」だけのリード文は、何の答えも含んでいません。</div>
<h3>Experience（経験）―AIには書けないもの</h3>
<p>E-E-A-Tの最初のEであるExperience（経験）は、<b>実際に使った、行った、試した、失敗した</b>ことから生まれる情報です。AIは知識をまとめることは得意でも、<b>自分で体験することはできません</b>。だからこそ、経験は人間の書き手が提供できる最大の価値であり、読者の共感と信頼を生みます。</p>
<div class="box ng"><span class="lb">経験がない文章</span>このアプリは使いやすく、家計管理に便利です。</div>
<div class="box ok"><span class="lb">経験がある文章</span>紙の家計簿に3回挫折した私が、このアプリを3週間使ってみた。一番の変化は、夜21時に子どもを寝かしつけたあと、ソファでレシートを撮るだけで記録が終わるようになったこと。一方で、最初の2日は費目の分類が細かすぎて迷った。「食費・日用品・その他」の3つにしぼってから、迷わなくなった。</div>
<h3>経験を伝える書き方のコツ</h3>
<ul>
<li><b>場面を書く</b>：いつ、どこで、どんな状況で</li>
<li><b>数字を書く</b>：期間、回数、金額、変化量（「3週間」「月1.2万円減った」）</li>
<li><b>失敗やデメリットも書く</b>：良いことだけでは宣伝に見える。つまずきと、その乗り越え方こそ読者の役に立つ</li>
<li><b>ビフォー・アフターを書く</b>：使う前と後で何が変わったか</li>
<li><b>証拠を見せる</b>：自分で撮った写真、画面のスクリーンショット、実施した日付</li>
</ul>
<div class="box ng"><span class="lb">守るべきこと</span>①体験していないことを、体験したかのように書かない　②結果を誇張しない　③広告や依頼を受けた記事であることを隠さない（2023年10月から、広告であることを隠す「ステルスマーケティング」は景品表示法の規制対象になっている）。信頼は、一度失うと取り戻せません。</div>`,

{ part: "PART 2 AIOライティング", title: "論理の架け橋 ―5W3Hを埋め、読者の「なぜ」を先回りする", sub: "AIと共走・共創する②　論理の飛躍をなくす",
body: `
<p>書き手にとって当たり前のことほど、文章から抜け落ちます。読者はそこで「え、なんで？」「どういうこと？」とつまずき、離れていきます。書き手の頭の中と読者の頭の中の間に<em>論理の架け橋</em>をかけるのが、このレッスンのテーマです。</p>
<div class="box memo"><span class="lb">知識の呪い</span>一度知ってしまうと、知らなかったころの感覚を想像できなくなること。専門知識がある書き手ほど、説明を飛ばしてしまう。</div>
<h3>5W3Hを埋める</h3>
<p>情報の抜けを見つける道具が<em>5W3H</em>です。主張やアドバイスを書いたら、8つの問いで点検します。</p>
<pre>When　　　（いつ）　　　　：いつ、いつまでに
Where　　 （どこで）　　　：どこで、どの画面で
Who　　　 （誰が）　　　　：誰が、誰に向けて
What　　　（何を）　　　　：何を、何が
Why　　　 （なぜ）　　　　：なぜ、何のために
How　　　 （どのように）　：どうやって、どんな手順で
How much　（いくら）　　　：費用、金額
How many / How long（どれくらい）：数量、期間、時間</pre>
<div class="box ng"><span class="lb">5W3Hが抜けている</span>ふるさと納税は、早めに申し込むのがおすすめです。</div>
<p>→ いつまでに？ なぜ早いほうがいいの？ どこで申し込むの？ いくらまでなら得なの？</p>
<div class="box ok"><span class="lb">5W3Hを埋めた</span>ふるさと納税は、その年の控除を受けるには<b>12月31日まで</b>に寄付を済ませる必要がある（When）。年末は申し込みが集中し、人気の返礼品が品切れになりやすいため（Why）、<b>11月までに</b>済ませると選択肢が多い。申し込みは、ふるさと納税の仲介サイトや自治体のサイトからできる（Where・How）。自己負担<b>2,000円</b>で済む寄付額の上限は、年収や家族構成によって変わる（How much）。</div>
<p>すべての文に8つ全部を入れる必要はありません。<b>読者が「それで？」と思う抜けがないか</b>を確かめるチェック道具として使います。</p>
<h3>読者の「なぜ」を先回りして噛み砕く</h3>
<p>主張を書いたら、読者の頭に浮かぶ次の問いを先回りして答えます。構成案で学んだ「問いの順番」を、段落の中でも行うイメージです。</p>
<pre>主張　：家計簿は「ざっくり3分類」で十分です。
　↓ 読者「なぜ？ 細かいほうが正確じゃない？」
理由　：分類が細かいほど、記録のたびに迷い、面倒になって続かないからです。
　↓ 読者「本当に？」
根拠　：実際、1年以上続いているユーザーの8割が3分類以下でした。
　↓ 読者「3分類って、具体的には？」
具体例：たとえば「食費」「日用品」「その他」の3つです。
　↓ 読者「それで家計の改善になるの？」
補足　：まずは続けることが先。見直したい費目が見えてから、細かくすれば十分です。</pre>
<h3>噛み砕くための3つの道具</h3>
<ul>
<li><b>言い換える（つまり）</b>：専門用語は、読者の言葉に置き換える。<br>例：「固定費」→「毎月決まって出ていくお金（家賃・通信費・保険料など）」</li>
<li><b>たとえる（たとえば・まるで）</b>：身近なものに置き換える。<br>例：「構成案は、記事の地図のようなもの」</li>
<li><b>具体例を出す（具体的には）</b>：抽象的な説明のあとに、1つ実例を添える</li>
</ul>
<div class="box ng"><span class="lb">噛み砕きすぎに注意</span>読者がすでに知っていることまで長々と説明すると、かえって読みにくくなります。どこまで噛み砕くかは<b>ペルソナの知識レベル</b>で決めます。</div>
<div class="box memo"><span class="lb">AIOとのつながり</span>AIは1つの質問を「いつまで」「いくら」「どうやって」などの関連クエリに分解して調べます（クエリ・ファンアウト）。5W3Hが埋まり、「なぜ」に答えている段落は、<b>その分解された質問のどれにでも答えられる</b>ため、引用されやすくなります。</div>`,
quiz: [
["「知識の呪い」の説明として正しいものは。","一度知ってしまうと、知らなかったころの感覚を想像できなくなること",["知識が多いほど文章が必ずうまくなること","専門用語を使うと読者の信頼が高まること","AIが知識を持ちすぎて誤情報を出すこと"],"書き手が当たり前だと思っていることほど説明が抜け、論理の飛躍が生まれます。"],
["5W3Hの「3H」に含まれるものの組み合わせは。","How（どのように）・How much（いくら）・How many / How long（どれくらい）",["How・Here・History","Why・What・When","How・Human・Hope"],"5W（いつ・どこで・誰が・何を・なぜ）に、方法・費用・数量や期間を加えたものです。"],

["「固定費」を噛み砕いた説明として最も適切なものは。","毎月決まって出ていくお金（家賃・通信費・保険料など）",["変動しない費用項目","固定された費用のこと","FC（Fixed Cost）"],"読者の言葉への言い換えと、具体例の両方が入っています。言葉を繰り返すだけでは噛み砕いたことになりません。"],
["5W3Hを埋めることがAIOに効く理由として最も適切なものは。","AIが質問を「いつ」「いくら」「どうやって」などに分解して調べるとき、どの質問にも答えられるから",["文字数が増えて評価が上がるから","AIは5W3Hという単語を探しているから","タイトルが長くなるから"],"クエリ・ファンアウトで分解された関連質問に、段落単位で答えられるようになります。"]
]},

{ part: "PART 2 AIOライティング", title: "AIとの共創 ―共に走り、共に創る", sub: "AIと共走・共創する③　役割分担とプロンプト",
body: `
<p>AIは、記事を丸ごと書かせる「代筆者」ではなく、企画から推敲まで<b>隣を一緒に走る伴走者（共走）</b>であり、<b>一緒に作品をつくる共同制作者（共創）</b>です。AIの速さと、人間の経験・判断を組み合わせることで、一人では届かない質の記事がつくれます。</p>
<h3>役割分担：AIが得意なこと、人間にしかできないこと</h3>
<ul>
<li><b>AIが得意なこと</b>：アイデアや疑問の洗い出し、構成案のたたき台、言い換え・要約、抜け漏れのチェック、読者役になって質問すること、表記ゆれの確認</li>
<li><b>人間にしかできないこと</b>：実在の顧客（N1）の声を聞くこと、自分の経験・一次情報、何を書き何を捨てるかの判断、事実の最終確認、記事への責任</li>
</ul>
<div class="box"><span class="lb">共創のループ</span>人が材料（経験・データ・顧客の声）を渡す → AIが形にする → 人が判断し、経験を足す → AIが読者の目でチェックする → 人が最終確認して公開する</div>
<h3>工程別の使い方とプロンプト例</h3>
<p><b>① 企画：読者の疑問を洗い出す</b></p>
<pre>あなたは、紙の家計簿に3回挫折した34歳の共働き会社員です。
家計簿について、あなたが本当に知りたいこと・不安に思っていることを
20個、あなた自身の言葉で書き出してください。</pre>
<p><b>② 構成：問いの順番を相談する</b></p>
<pre>次の記事コンセプトと、読者の疑問リストをもとに、
読者の頭に浮かぶ順番で見出し案を作ってください。
見出しを上から読むだけで結論がわかるようにしてください。
〔コンセプト〕…　〔疑問リスト〕…</pre>
<p><b>③ 執筆：自分の材料を整えてもらう</b></p>
<pre>以下は、私が3週間このアプリを使ったときのメモです。
事実や数字は変えずに、読みやすい段落に整えてください。
私が書いていない体験や数字は、絶対に付け足さないでください。
〔メモ〕…</pre>
<p><b>④ 推敲：読者の目でチェックしてもらう</b></p>
<pre>あなたは、この分野の初心者の読者です。
次の文章を読んで、
・「なぜ？」「どういうこと？」とつまずく箇所
・5W3H（いつ・どこで・誰が・何を・なぜ・どうやって・いくら・どれくらい）が
　抜けている箇所
を指摘してください。書き直しはせず、指摘だけしてください。</pre>
<h3>良いプロンプトの要素</h3>
<ul>
<li><b>役割</b>：誰として考えてほしいか（読者、編集者、専門家）</li>
<li><b>目的</b>：何のための作業か</li>
<li><b>材料</b>：ペルソナ、コンセプト、自分の経験やデータ</li>
<li><b>条件</b>：やってほしくないこと（事実を付け足さない、など）</li>
<li><b>出力形式</b>：箇条書き、見出し案、指摘のみ、など</li>
</ul>
<h3>AIと共創するときの注意点</h3>
<ul>
<li><b>事実確認は必ず人間が行う</b>：AIはもっともらしい誤り（ハルシネーション）を出すことがある。数字・固有名詞・制度・日付は、公的機関などの一次情報で確かめる</li>
<li><b>AIの出力をそのまま公開しない</b>：AIの文章は「どこにでもある情報」の平均になりやすく、AIに引用される理由（独自性）がない</li>
<li><b>入力してはいけない情報</b>：顧客の個人情報、社外秘の情報は、社内のルールに従い入力しない</li>
<li><b>他者の文章の丸写しを避ける</b>：出力が既存の記事と似すぎていないか確認する</li>
</ul>
<p>このうち特に事故が起きやすい「盛り」と「漏れ」は、次のレッスンで詳しく扱います。</p>
<div class="box memo"><span class="lb">検索エンジンの考え方</span>Googleは、コンテンツがAIで作られたかどうかではなく、<b>ユーザーにとって役立つ高品質なものかどうか</b>を評価するという立場です。一方で、検索順位を操作する目的で、価値の低いページを大量に生成することはスパムとして扱われます。</div>
<div class="box ok"><span class="lb">共走・共創のゴール</span>AIに任せて浮いた時間を、<b>顧客の声を聞く・自分で試す・一次データを集める</b>ことに使う。その成果が記事に入ることで、AIにも読者にも選ばれる記事になる。</div>`,

["AIが作ったコンテンツに対するGoogleの考え方として正しいものは。","AIで作ったかどうかではなく、ユーザーに役立つ高品質なものかどうかで評価する",["AIで作ったコンテンツはすべて評価されない","AIで作ったコンテンツは必ず上位に表示される","AIで作ったコンテンツなら大量に公開するほど評価される"],"作り方ではなく品質が基準です。ただし、順位操作目的の大量生成はスパムとして扱われます。"]

{ part: "PART 2 AIOライティング", title: "AIとの共創の落とし穴 ―盛りと漏れに注意", sub: "AIと共走・共創する④　誇張・捏造と、情報漏洩・抜け落ち",
body: `
<p>AIは頼もしい伴走者ですが、放っておくと2つの事故を起こします。話を大きくする<em>「盛り」</em>と、出してはいけない情報が外に出たり、書くべき情報が抜けたりする<em>「漏れ」</em>です。どちらも、記事の信頼を一瞬で失わせます。</p>

<h3>盛りに注意</h3>
<p>AIは「もっともらしく、魅力的な文章」を作るのが得意です。その結果、<b>事実を超えた表現</b>が混ざりやすくなります。「魅力的に」「説得力を高めて」と頼むと、特に起こりやすくなります。</p>
<p><b>AIの盛り、よくある5つのパターン</b></p>
<ul>
<li><b>存在しない数字・出典</b>：「〇〇大学の研究によると87％が…」→ 調べると、その研究も数字も存在しない</li>
<li><b>断定の強化</b>：「〜の傾向がある」が「必ず〜できる」「誰でも〜」に変わる</li>
<li><b>最上級表現</b>：根拠なく「業界No.1」「最も人気」「唯一の」</li>
<li><b>体験の捏造</b>：書き手が体験していないのに「実際に使ってみたところ」と書き足す</li>
<li><b>古い情報の現在形化</b>：制度変更前の料金や条件を、今も正しいように書く</li>
</ul>
<div class="box ng"><span class="lb">盛られた文</span>このアプリを使えば、誰でも必ず毎月3万円貯金できます。利用者満足度は業界No.1で、東京大学の研究でも効果が証明されています。</div>
<div class="box ok"><span class="lb">事実にもとづいた文</span>当社が2026年にユーザー1,200人に行った調査では、利用開始から3か月後に「毎月の貯金額が増えた」と答えた人が68％でした（増えた額の中央値は月8,000円）。</div>
<p><b>盛りが招くリスク</b></p>
<ul>
<li><b>法律違反のおそれ</b>：商品やサービスを実際よりも著しく優れていると見せる表示は、景品表示法の「優良誤認表示」にあたるおそれがある。根拠のないNo.1表示も問題になりやすい。健康食品や化粧品で「治る」「やせる」などの効果をうたうと、薬機法などに触れるおそれもある</li>
<li><b>信頼の喪失</b>：1つの嘘が見つかると、記事全体、ブランド全体が疑われる</li>
<li><b>誤情報の拡散</b>：盛られた情報がAIに引用されると、誤りが多くの人に広がる</li>
</ul>
<p><b>盛りを防ぐ方法</b></p>
<ul>
<li>プロンプトで<b>「根拠のない数字・断定・最上級表現は入れない。わからない点は【要確認】と書く」</b>と指示する</li>
<li>AIの出力の中で、<b>数字・固有名詞・出典・「必ず」「No.1」「唯一」「実際に」</b>に印をつけ、1つずつ一次情報で確かめる</li>
<li>出典が示されたら、<b>リンク先を実際に開いて</b>、本当にそう書いてあるか確認する</li>
<li>「盛らないと売れない」と感じたら、それは表現ではなく<b>企画（便益×独自性）を見直すサイン</b></li>
</ul>

<h3>漏れに注意 ①：情報の漏れ（入力による情報漏洩）</h3>
<p>AIに入力した内容は、サービスや設定によっては、提供会社のサーバーに保存されたり、AIの学習に使われたりする可能性があります。<b>入力することは、社外に渡すことになりうる</b>と考えます。</p>
<p><b>そのまま入力してはいけない情報の例</b></p>
<ul>
<li>顧客の個人情報（氏名、連絡先、住所、購買履歴、インタビューの実名や録音）</li>
<li>社外秘の情報（未発表の新商品、売上や原価、契約内容、経営計画）</li>
<li>取引先から預かった情報</li>
<li>パスワード、APIキーなどの認証情報</li>
</ul>
<p><b>情報の漏れを防ぐ方法</b></p>
<ul>
<li><b>会社のAI利用ルールを確認する</b>：使ってよいサービス、入力してよい情報の範囲</li>
<li><b>設定を確認する</b>：入力内容を学習に使わない設定や、法人向けプランの利用</li>
<li><b>匿名化・置き換えをしてから入力する</b>：「佐藤美咲さん（34歳）」→「Aさん（30代）」、「売上4,820万円」→「前年比112％」</li>
<li><b>共有リンクに注意する</b>：AIとの会話を共有リンクにすると、第三者が見られる状態になることがある</li>
</ul>
<div class="box memo"><span class="lb">N1インタビューのデータ</span>顧客の生の声はとても価値がありますが、それだけに扱いは慎重に。個人が特定できる情報は取り除いてからAIに渡し、記事に使う場合は本人の了承を得ます。個人情報の取り扱いは、個人情報保護法や社内の規程に従います。</div>

body: `
<p>記事を公開する前の最後の関門が<em>校閲</em>です。生成AIは、疲れずに何度でも読み直してくれる<b>優秀な校閲アシスタント</b>になります。ただし、AIにも苦手なことがあり、使い方を間違えると、かえって誤りを増やします。</p>
<h3>校閲とは</h3>
<p><em>校閲</em>とは、<b>文章の内容に誤りや矛盾がないかを調べ、確かめること</b>です。書かれている事実は正しいか、話のつじつまは合っているか、誤解を招く表現はないかを、書き手とは別の目で点検します。出版社や新聞社には専門の校閲部があり、記事や本の信頼を最後に守る役割を担っています。</p>
<h3>校正・校閲・推敲・リライトの違い</h3>
<ul>
<li><b>校正</b>：誤字脱字、表記ゆれ、文法の誤りなど、<b>文字や表記</b>の誤りを直す。もともとは、原稿と印刷の試し刷り（ゲラ）を照らし合わせて誤りを直す作業のこと</li>
<li><b>校閲</b>：事実の正しさ、論理の矛盾、言いすぎ・言い足りなさ、表現のリスクなど、<b>内容</b>の誤りを見つける</li>
<li><b>推敲</b>：書き手<b>自身</b>が、言葉や表現を何度も練り直して文章を良くすること</li>
<li><b>リライト</b>：目的や読み手に合わせて、構成や表現を書き直すこと</li>
</ul>
<h3>校閲で見る主なポイント</h3>
<ul>
<li><b>事実</b>：数字、人名・社名・商品名、日付と曜日、制度や法律、引用の正確さ</li>
<li><b>整合性</b>：同じ記事の中で数字や名称が食い違っていないか、合計が合っているか</li>
<li><b>論理</b>：主張と根拠が対応しているか、話が飛躍していないか</li>
<li><b>表現</b>：誇張や断定（盛り）、条件の抜け（漏れ）、誤解・不快感を与える表現、法令に触れる表現</li>
</ul>
<div class="box"><span class="lb">校閲の例</span>「説明会は2026年10月2日（木）に開催します」<br>→ 2026年10月2日は<b>金曜日</b>。日付と曜日が食い違っている（どちらが正しいか、主催者に確認が必要）<br><br>「参加者は120人。内訳は会社員80人、学生30人」<br>→ 内訳の合計は110人。<b>10人分が合わない</b><br><br>「この方法なら誰でも必ず成功します」<br>→ 根拠のない断定（盛り）。条件や例外が書かれていない（漏れ）</div>
<p>どれも文字の誤りではないため、校正だけでは見つかりません。<b>内容まで踏み込んで「本当に正しいか」を疑う</b>のが校閲です。</p>

<h3>AIが得意なこと・苦手なこと</h3>
<ul>
<li><b>得意</b>：誤字脱字・表記ゆれ、文のねじれ、わかりにくい箇所、論理の飛躍、指示語の多さ、5W3Hの抜け、誇張表現の発見、読者役としての質問</li>
<li><b>苦手</b>：最新の情報の確認（学習時点より新しい制度・料金を知らない）、<b>事実が本当に正しいかの最終判断</b>（もっともらしく間違えることがある）、社内ルールや業界の慣習の把握（教えないとわからない）</li>
</ul>
<div class="box ng"><span class="lb">AI校閲の落とし穴</span>①正しい箇所を「誤り」と指摘し、直すとかえって間違いになる　②修正案の中で、AI自身が新しい事実や数字を足す（盛り）　③長い文章を一度に渡すと、後半のチェックが浅くなる<br>→ AIの指摘は<b>「確認すべき候補」</b>として受け取り、採用するかどうかは人間が判断します。</div>

<h3>観点を分けて、何度か頼む</h3>
<p>「この記事を校閲して」とまとめて頼むと、指摘が浅く、ばらつきます。<b>観点を1つか2つにしぼって、何回かに分けて</b>頼むほうが精度が上がります。</p>
<ol>
<li><b>事実・数字</b>：数字、固有名詞、日付、制度、出典。確認が必要な箇所の一覧をつくってもらう</li>
<li><b>論理</b>：矛盾、論理の飛躍、主張と根拠のずれ、読者の「なぜ？」が残る箇所</li>
<li><b>盛りと漏れ</b>：根拠のない断定・誇張・最上級表現、条件・例外・デメリットの抜け</li>
<li><b>表記・文法</b>：誤字脱字、表記ゆれ、文のねじれ、長すぎる文</li>
<li><b>表現のリスク</b>：誤解や不快感を与える表現、景品表示法・薬機法などに触れそうな表現、引用の仕方</li>

<li><b>出力の形</b>：「該当箇所の引用 → 問題点 → 理由 → 修正案」の形で、<b>指摘だけ</b>。本文の書き換えはしない</li>
</ul>
<pre>あなたは経験豊富な校閲者です。
以下は「共働きで家計簿が続かない30代」向けの記事の一部です。
次の観点でチェックしてください。
・事実確認が必要な数字・固有名詞・日付・制度
・根拠のない断定や誇張
指摘は「該当箇所の引用／問題点／理由／修正案」の形で箇条書きにしてください。
本文は書き換えないでください。
確信が持てない指摘には【要確認】とつけてください。</pre>

<h3>事実確認は、人間が一次資料で</h3>
<p>AIに「この数字は正しいですか」と聞いても、AIの答え自体が正しいとは限りません。AIの役割は、<b>確認すべき箇所を漏れなく洗い出すこと</b>までです。</p>
<ul>
<li>制度・法律・統計は、官公庁や公式サイトの<b>原典</b>で確認する</li>
<li>Web検索ができるAIが出典を示した場合も、<b>リンク先を実際に開いて</b>、本当にそう書いてあるか確かめる</li>
<li>料金・仕様・制度は変わるので、<b>確認した日付</b>を記録する</li>
</ul>

<h3>AI校閲の手順</h3>
<pre>① 前提を渡す（読者・目的・表記ルール）
② 観点ごとに、指摘だけを出してもらう（長文は見出し単位で分ける）
③ 指摘を人間が判断する（採用・不採用・要確認）
④ 事実は一次資料で確認する
⑤ 修正する（AIに修正させた場合は、元の文との差分を確認）
⑥ 最後に、人間が通して読む（声に出すと違和感に気づきやすい）</pre>
<div class="box memo"><span class="lb">校閲で入力してはいけないもの</span>公開前の記事に、未発表の情報、顧客の個人情報、社外秘の数字が含まれていないか。含まれる場合は、会社のルールに従い、置き換えてからAIに渡します（盛りと漏れのレッスン）。</div>

body: `
<h3>E-E-A-T</h3>
<p>Googleが品質評価の考え方として示している4つの要素です（詳しくは「E-E-A-T ―人間にしか語れないこと」のレッスン）。AIも信頼できる情報源を優先する傾向があるため、AIOでも重要です。ここでは、サイト全体の信頼性と技術面を整理します。</p>

<h3>一次情報を入れる</h3>

<li>専門家へのインタビュー、現場の事例</li>
</ul>
<h3>信頼のシグナルを整える</h3>
<ul>
<li><b>著者情報</b>：誰が書いたか（経歴・資格・実績）</li>
<li><b>公開日・更新日</b>：情報の鮮度。古い情報は定期的に更新する</li>
<li><b>出典</b>：公的機関・一次資料へのリンク</li>
<li><b>運営者情報</b>：会社概要、問い合わせ先</li>
</ul>
<h3>サイト外での評判（サイテーション）</h3>
<p>AIは自社サイトだけでなく、ニュース記事・口コミサイト・SNS・比較記事など<b>第三者の場所での言及</b>からもブランドを把握します。リンクがなくても、ブランド名が言及されること（<b>サイテーション</b>）が認知につながります。PR活動やアーンドメディアの獲得がAIOでも効いてきます。</p>
<h3>技術的な土台</h3>
<ul>
<li><b>インデックスされていること</b>：検索エンジンに登録されていないページは、AI検索でも見つかりにくい</li>
<li><b>クローラーをブロックしていない</b>：robots.txtで必要なクローラーを拒否していないか確認</li>
<li><b>本文がテキストで読める</b>：重要な情報を画像の中だけに入れない</li>
<li><b>構造化データ</b>：Article・Organization・Product・FAQPageなどのschema.orgマークアップで、ページの内容を機械に伝える</li>
</ul>
<div class="box ng"><span class="lb">過信は禁物</span>構造化データや、AI向けにサイト概要を記述する「llms.txt」などは、内容を伝える補助にはなりますが、<b>入れれば引用されるという保証はありません</b>。Googleも、AIによる概要に表示されるための特別なマークアップは不要という立場です。本文の質が最優先です。</div>`,

{ part: "PART 2 AIOライティング", title: "実践：リライトと効果測定", sub: "チェックリスト・ドリル・測り方",
body: `
<h3>AIOライティングの手順</h3>
<ol>
<li><b>企画とコンセプトを決める</b>：誰が、どんな言葉でAIに質問するか、この記事にしかない情報は何かを1文にする</li>
<li><b>タイトルを決める</b>：狙う言葉を前半に、誰向け・便益・独自性を入れる</li>
<li><b>関連質問を洗い出す</b>：「サジェスト」「他の人はこちらも質問」やAIへの質問で周辺の疑問を集める</li>
<li><b>構成案をつくる</b>：読者の問いの順番に見出しを並べ、見出しだけで伝わるか確認（1見出し1問い）</li>
<li><b>各見出しの冒頭で答える</b>：結論→理由→具体例</li>
<li><b>一次情報・数字・出典を入れる</b></li>
<li><b>抜き出しテスト</b>：各段落だけを読んで意味が通じるか確認</li>
<li><b>公開後に測定・更新</b></li>
</ol>
<h3>リライト例</h3>
<div class="box ng"><span class="lb">Before</span>皆さんはNISAについてご存じでしょうか？最近よく耳にしますよね。実はこれ、とてもお得な制度なんです。詳しく見ていきましょう！</div>
<div class="box ok"><span class="lb">After</span>NISA（少額投資非課税制度）とは、株式や投資信託の運用で得た利益が非課税になる国の制度である。2024年からの新NISAでは、年間の投資枠が最大360万円、生涯の非課税保有限度額が1,800万円となった（出典：金融庁）。</div>
<p>変更点：①定義文で始めた ②「これ」をなくした ③数字・時点・出典を入れた ④前置きの問いかけを削った</p>
<h3>公開前チェックリスト</h3>
<ul>
<li>□ 見出しはユーザーの質問になっているか</li>
<li>□ 見出し直後の1〜2文で答えているか</li>
<li>□ 段落だけ抜き出しても意味が通じるか（指示語チェック）</li>
<li>□ 固有名詞・数字・時点・出典が明記されているか（盛り・漏れがないか）</li>

<li>□ 著者・更新日・運営者情報があるか</li>
<li>□ 重要な情報がテキストで書かれているか</li>
</ul>
<h3>効果測定</h3>

<li><b>引用・言及のモニタリング</b>：狙っている質問を定期的にAIに投げ、自社が引用・言及されるかを記録する</li>
<li><b>指名検索の増加</b>：ブランド名での検索数（AIで知って、あとで検索する行動）</li>
<li><b>Search Console</b>：表示回数は増えたがクリック率が下がっている場合、AIの要約で解決されている可能性がある</li>
</ul>
<div class="box memo"><span class="lb">KPIの考え方</span>AIOでは「クリック数」だけでは成果を測りきれません。<b>言及率（狙った質問のうち自社が登場した割合）</b>や指名検索数など、認知の指標も合わせて追いましょう。</div>`,

{ part: "PART 3 思考OSとしてのマーケティング", title: "思考OSとしてのマーケティング", sub: "自分を「商品」、相手を「顧客」として考える",
body: `
<p>ここまで学んだマーケティングは、商品を売るためだけの技術ではありません。<b>相手を深く理解し、価値を設計し、伝わる形で届ける</b>という、あらゆる場面で使える考え方の土台、いわば<em>思考のOS</em>です。</p>
<p>パソコンのOSの上でさまざまなアプリが動くように、マーケティングの思考の上に、<b>仕事選び、自己分析、履歴書・職務経歴書の執筆、面接</b>などを載せて動かすことができます。</p>

<li><b>市場</b> → 業界・職種</li>
<li><b>競合</b> → 同じ求人に応募する人たち</li>
<li><b>ベネフィット</b> → 自分が入社することで、企業が得られる成果</li>
<li><b>広告・記事</b> → 履歴書・職務経歴書</li>
<li><b>商談</b> → 面接</li>
<li><b>ブランド</b> → 周囲からの評判、「〇〇といえばあの人」</li>
</ul>
<h3>3つのステップ</h3>
<pre>① 自己分析：自分の現在地を客観視する
   （3C の Company、SWOT、N1分析、インサイト）

{ part: "PART 3 思考OSとしてのマーケティング", title: "マーケティング思考で、視野・視点・視座を磨く", sub: "広さ・立場・高さを切り替え、日常で鍛える（書き込み式ワークつき）", work: true,
body: `
<p>同じ事実を見ても、人によって出てくる答えは違います。その違いを生むのが、<em>視野</em>・<em>視点</em>・<em>視座</em>という3つの軸です。マーケティングのフレームワークは、この3つを意識的に切り替えるための道具だと考えることもできます。</p>

<h3>3つの軸の違い</h3>
<ul>
<li><b>視野（広さ）</b>：どこまで<b>広く</b>見ているか。見る範囲、時間の長さ、関係者の多さ</li>
<li><b>視点（立場・角度）</b>：<b>誰の立場で</b>、どこに注目して見ているか</li>
<li><b>視座（高さ）</b>：どの<b>高さ</b>から見ているか。担当者・管理職・経営者・社会全体など、立つ位置の高さ</li>
</ul>
<div class="box"><span class="lb">カメラにたとえると</span>視座＝カメラを置く<b>高さ</b>（地上か、ビルの屋上か、ドローンか）<br>視野＝レンズの<b>画角</b>（望遠で一部を見るか、広角で全体を見るか）<br>視点＝カメラを<b>向ける方向とピント</b>（誰を、何を撮るか）</div>

<h3>① 視野：広く見る</h3>
<p>視野が狭いと、目の前の問題だけを解決しようとして、<b>部分最適</b>になりがちです。</p>
<ul>
<li><b>空間を広げる</b>：自社の業界の外、海外、代わりになる手段まで見る（PEST、競合の再定義）</li>
<li><b>時間を広げる</b>：過去からの流れと、3年後・10年後の変化を見る（プロダクト・ライフサイクル、ロードマップ）</li>
<li><b>関係者を広げる</b>：顧客だけでなく、社員、取引先、地域社会まで見る（ステークホルダー）</li>
</ul>
<div class="box memo"><span class="lb">講座で学んだ「視野を広げる」道具</span>PEST分析（社会全体）、5フォース（業界全体）、KUMONの競合を「業界・ジョブ・時間とお金」の3つの見方で広げた練習</div>

<h3>② 視点：立場を変えて見る</h3>
<p>自分の立場から離れ、<b>相手の立場に立って</b>見ることです。マーケティングの多くの道具は、視点を切り替えるためにあります。</p>
<ul>
<li><b>4P → 4C</b>：売り手の視点（製品・価格）を、買い手の視点（価値・負担）に置き換える</li>
<li><b>ペルソナ・インサイト</b>：「自分ならこう思う」ではなく「佐藤さんならどう感じるか」</li>
<li><b>3C</b>：顧客・競合・自社という3つの立場から同じ市場を見る</li>
<li><b>ステークホルダー</b>：同じ戦略を、経営陣・現場の指導者・保護者・子どもの立場からそれぞれ見る</li>
</ul>

<h3>③ 視座：高い位置から見る</h3>
<p>視座が上がるほど、<b>全体・長期・責任</b>を考えるようになります。</p>
<pre>担当者の視座　：自分の仕事をどう終わらせるか
管理職の視座　：チームの成果をどう最大化するか
経営者の視座　：会社全体として、何に投資し、何をやめるか
社会の視座　　：その事業は、社会にとってどんな意味があるか</pre>
<p>たとえばKUMONの戦略プレゼンでは、経営陣の視座（投資の判断、リスク、長期の成長）に合わせて、結論・意思決定事項・KPI・リスク対策を示しました。一方で、現場の指導者の<b>視点</b>（負担が増えないか、自分の役割はどうなるか）にも答えることで、納得感をつくりました。</p>

<h3>練習：同じ事実を3つの軸で見る</h3>
<p>事実：<b>「家計簿アプリの解約率が、この3か月で上がった」</b><br>あなたならどう見るか、考えてから答えの例を開きましょう。</p>
<details class="ans"><summary>見方の例を見る</summary>
<ul>
<li><b>視野が狭いと</b>：「アプリに不具合があるのでは」と、機能だけを調べる</li>
<li><b>視野を広げると</b>：物価上昇で家計の固定費を見直す人が増えた（社会）、競合が無料プランを始めた（業界）、毎年この時期に解約が増える（時間）など、外の要因も見えてくる</li>
<li><b>視点を変えると</b>：解約したユーザーの立場では「使いすぎた月の数字を見て、責められている気がした」という本音があるかもしれない（インサイト）</li>
<li><b>視座を上げると</b>：担当者は「解約防止キャンペーン」を考えるが、経営者は「顧客生涯価値（LTV）と獲得コストのバランス」「どの顧客層に集中するか」まで考える</li>
</ul>
<p>3つの軸を切り替えるほど、<b>打ち手の選択肢が増え、より根本的な解決</b>に近づきます。</p>
</details>

<h3>マーケティング思考で、3つの軸を磨く</h3>
<p>視野・視点・視座は、生まれつきのセンスではなく、<b>毎日の練習で磨ける力</b>です。その練習道具として最適なのが、この講座で学んだマーケティングのフレームワークです。身の回りのお店、商品、広告、ニュースを教材にして、次の問いを習慣にしましょう。</p>
<p><b>視野を磨く：「もっと広く見ると？」</b></p>
<ul>
<li>ニュースを見たら、<b>PEST</b>のどれにあたり、どんな業界に影響するかを考える</li>
<li>話題の商品を見たら、<b>本当の競合</b>は何かを、業界・ジョブ・時間とお金の3つの見方で広げる（KUMONの練習）</li>
<li>「3年後、10年後にはどうなっているか」と時間を延ばして考える</li>
</ul>
<p><b>視点を磨く：「相手の立場から見ると？」</b></p>
<ul>
<li>行列のできる店を見たら、「<b>誰の、どんな『不』を解決しているのか</b>」を考える</li>
<li>商品を見たら、「<b>要は何を売っているのか</b>」とひとことで言い換える（自由丁＝「時間指定のレターセット」）</li>
<li>広告を見たら、作り手の4Pではなく、<b>買い手の4C</b>（価値・負担・利便性・対話）で評価する</li>
</ul>
<p><b>視座を磨く：「一段高いところから見ると？」</b></p>
<ul>
<li>お店に入ったら、「<b>自分がこの店の経営者なら</b>、売上を上げるために何をするか」を考える（SWOT・クロスSWOT）</li>
<li>自分の仕事を、「上司なら」「社長なら」どう評価するかで見直す</li>
<li>その事業が、社会にとってどんな意味を持つかを考える</li>
</ul>
<div class="box"><span class="lb">1日1つの練習</span>通勤中や買い物のついでに、目に入ったお店や商品を1つ選び、「広く見ると？」「相手の立場なら？」「経営者なら？」の3つを30秒ずつ考える。これだけで、3つの軸は確実に鍛えられます。</div>

<h3>ステップ2：自分版SWOTで整理する</h3>
<ul>

<li><b>T（脅威）</b>：例：定型的な事務作業はAIで自動化が進んでいる</li>
</ul>
<p>クロスSWOTで、「強み×機会」（どの分野で強みが最も活きるか）や「弱み×機会」（何を学べばチャンスをつかめるか）を考えます。</p>

<li><b>テクニカルスキル</b>：特定の仕事の専門知識・技術（会計、プログラミング、データ分析など）</li>

<h3>ステップ4：他者の目で客観視する</h3>
<p>自分のことほど、自分ではわかりません。<b>ジョハリの窓</b>では、自己を4つに分けて考えます。</p>

<li><b>秘密の窓</b>：自分は知っているが、他人には見せていない自分</li>
<li><b>未知の窓</b>：まだ誰も知らない自分</li>
</ul>
<p>元上司・同僚・友人に<b>「私に頼みたくなる仕事は何？」「私の強みを一言でいうと？」</b>と聞くと、盲点の窓にある強みが見つかります。N1インタビューと同じく、具体的な場面を聞くのがコツです。</p>

{ part: "PART 3 思考OSとしてのマーケティング", title: "環境選定：自分が生きる場所を見抜く", sub: "業界の流れ・企業のSTP・求人票のインサイト",
body: `
<p>同じ商品でも、売る市場によって売れ方はまったく違います。人も同じで、<b>同じ能力でも、どの環境に身を置くかで評価も成長も大きく変わります</b>。環境選定は、キャリアにおける「市場選び」です。</p>
<h3>① 大きな流れを読む（PEST）</h3>
<ul>
<li>その業界は伸びているか、縮んでいるか（Economy）</li>
<li>規制の強化や緩和で、需要が変わる分野はないか（Politics）</li>
<li>人口構成や価値観の変化で、生まれるニーズは何か（Society）</li>
<li>AIなどの技術で、その仕事はどう変わるか。なくなる作業と、価値が上がる作業はどれか（Technology）</li>
</ul>
<h3>② 企業をセグメントに分け、狙いを定める（STP）</h3>
<p><b>S：セグメンテーション</b>：業界、職種、企業規模、成長段階（創業期・拡大期・安定期）、働き方、評価制度、社風など、いろいろな軸で企業を分けて見ます。</p>
<p><b>T：ターゲティング</b>：手当たり次第に応募する「無差別型」ではなく、<b>自分のWill・Canが活き、Mustと重なる企業群</b>に集中します。</p>
<p><b>P：ポジショニング</b>：その企業群の中で、自分は「何者」として認識されたいかを決めます。一つの分野で1番を目指すより、<b>掛け算で希少性をつくる</b>のが有効です。</p>
<div class="box ok"><span class="lb">掛け算のポジショニング例</span>「営業ができる人」は多い。「データ分析ができる人」も多い。<br>しかし<b>「顧客の声とデータの両方から解約の原因を見つけ、営業現場で仕組みにできる人」</b>は少ない。</div>
<h3>③ 企業のインサイトを読む（3C・VPC）</h3>
<p>求人票は、企業という顧客の<b>「顕在ニーズ」</b>です。その奥にある本音（インサイト）を読み解きます。</p>
<ul>
<li><b>なぜ今、この求人を出しているのか</b>：欠員の補充か、新規事業か、事業拡大か。理由によって求められる人物像が変わる</li>
<li><b>必須要件と歓迎要件</b>：必須は「最低限の条件」、歓迎は「本当はここまで欲しい」という期待</li>
<li><b>企業のペインとゲイン</b>：IR資料、中期経営計画、社長のメッセージ、プレスリリースから「いま困っていること」「目指していること」を探す</li>
</ul>
<pre>例：求人票「カスタマーサクセス担当（新設チーム）」
　事実：チーム新設、歓迎要件に「データ分析の経験」
　IR　：中期計画で「既存顧客からの売上比率を高める」
　読み取れるインサイト：
　　新規獲得だけでは成長が鈍り、解約を減らしたい。
　　でも仕組みがなく、属人的な対応になっている。
　　だから本当は「解約を減らす仕組みを一から作れる人」がほしい。</pre>
<h3>④ 自分に合う場所かを見抜く</h3>
<p>インサイトのレッスンで学んだように、<b>「言っていること」と「やっていること」のズレ</b>に本音が表れます。</p>
<ul>
<li>「若手が活躍」とうたっているが、若手の管理職は実際に何人いるか</li>
<li>「働きやすい」とうたっているが、平均勤続年数や離職の状況はどうか</li>
<li>評価制度は、自分が大切にしたい働き方（成果、チームワーク、挑戦など）を評価する仕組みか</li>
<li>面接官や社員の話は、具体的な事実や数字で語られているか</li>
</ul>
<div class="box memo"><span class="lb">見抜くための情報源</span>企業の公式サイトやIR資料、社員インタビュー、口コミサイト、OB・OG訪問、カジュアル面談、面接の逆質問。一つの情報源だけで判断せず、複数を突き合わせます。</div>`,

{ part: "PART 3 思考OSとしてのマーケティング", title: "事例研究：株式会社WORDSを読み解く", sub: "顧問編集者 ―経営者の言葉で企業をブランディングする仕事",
body: `
<p>ここまでのフレームワークを、実在の企業に当てはめて練習します。題材は、経営者の言語化と発信を支援する<em>株式会社WORDS</em>です。「伝える」ことを事業にしている会社なので、この講座のテーマ（マーケティング・ライティング・AI時代の価値）と深く重なります。</p>
<div class="box ng"><span class="lb">このレッスンの読み方</span>「公開情報（事実）」は、求人ページや著者紹介など、インターネット上で公開されている情報をもとにしています（2026年10月9日に確認）。会社の情報は変わることがあるため、最新の内容は公式の情報で確かめてください。<br>「講座のフレームワークで読み解く」は、学習のための<b>考察（推測）</b>であり、同社の公式な見解ではありません。<b>事実と推測を分けて書く</b>こと自体が、このレッスンの練習です。</div>

<h3>公開情報（事実）</h3>
<ul>
<li><b>代表</b>：竹村俊助氏（代表取締役・顧問編集者）。ダイヤモンド社などで書籍の編集者を務めたのち、2018年に独立し、株式会社WORDSを立ち上げたと紹介されている</li>
<li><b>編集の実績</b>：『メモの魔力』（前田裕二）、『リーダーの仮面』などの書籍の編集を手がけ、手がけた本は累計100万部以上と紹介されている。著書に『書くのがしんどい』（PHP研究所）</li>
<li><b>事業</b>：経営者の思考を言語化・コンテンツ化して企業のブランディングに役立てる<b>「顧問編集者」</b>と、少部数で本をつくる<b>「デモブックス」</b>などの出版事業</li>
<li><b>顧問編集者の仕事</b>：経営者の隣で「編集者」を担い、話を聞いて言葉にし、SNS・note・書籍など、内容と目的に合わせて媒体を使い分けて届ける</li>
<li><b>解決しようとしている課題</b>：会社の魅力、商品の良さ、社員への思いが「伝わらない」という問題</li>
<li><b>求める人物像（求人ページより）</b>：正直で素直、好奇心が旺盛、人が好きで人の話を聞くのが好き、主体的に動き成長し続けられる人</li>
</ul>

<h3>「経営者の言葉で企業をブランディングする」とは</h3>
<p>顧問編集者の仕事をひとことで言えば、<b>経営者の言葉で企業をブランディングする仕事</b>です。ここでは、その意味を講座の内容とつなげて整理します（一般的な解説と考察であり、同社の業務手順そのものではありません）。</p>
<p><b>① そもそもブランディングとは</b></p>
<ul>
<li><b>ブランド</b>とは、顧客や社会の<b>頭の中にある、その会社や商品のイメージ</b>のこと。「〇〇といえば△△」と思い浮かぶもの</li>
<li><b>ブランディング</b>とは、そのイメージを、伝えたい姿に近づけていく活動。ロゴや広告だけでなく、<b>何を大切にし、どう語るか</b>の積み重ねでつくられる</li>
<li>対象は顧客だけではない。<b>採用候補者、社員、取引先、投資家</b>にとってのイメージも含まれる（採用ブランディング、インナーブランディングなど）</li>
</ul>
<p><b>② なぜ「経営者の言葉」なのか</b></p>
<ul>
<li><b>人は会社より人に共感する</b>：「業界をリードする〇〇社」より、「創業者がなぜこの事業を始め、何に悩み、何を大切にしているか」のほうが記憶に残り、心が動く</li>
<li><b>経営者の言葉は一次情報のかたまり</b>：創業の理由、判断の背景、失敗、譲れない美学は、その会社にしかない情報（E-E-A-Tの「人間にしか語れないこと」）</li>
<li><b>まねされにくい</b>：商品や価格はまねできても、経営者の考えと物語はまねできない（VRIOの模倣困難性）</li>
<li><b>AI時代に価値が高まる</b>：AIで似た文章があふれるほど、「誰が、何を考えて語っているか」がはっきりした発信が信頼される</li>
</ul>
<p><b>③ なぜ「編集者」が必要なのか</b></p>
<p>経営者は語るべき考えを持っていても、それを<b>伝わる言葉にする時間と技術</b>が足りないことが多い。また、本人にとって当たり前すぎて、価値に気づいていないこともあります（ジョハリの窓の「盲点の窓」）。</p>
<pre>聞く　　：経営者の話をじっくり聞き、考えや経験を引き出す（N1インタビュー）
見つける：本人も気づいていない「その会社らしさ」を見つける（インサイト）
構造化する：話を整理し、伝わる順番に組み立てる（構成案）
言葉にする：読み手に届く言葉で書く（結論ファースト、5W3H）
届ける　：SNS・note・書籍など、目的に合った媒体を選ぶ（4PのPromotion）
積み重ねる：発信を続け、ブランドという資産にしていく</pre>
<div class="box memo"><span class="lb">AIとの役割分担で考えると</span>文字起こしや要約、構成のたたき台はAIでも手伝える。しかし、<b>経営者の隣で信頼関係を築き、本音や迷いを引き出し、「この人らしさ」を見抜いて言葉にする</b>部分は、人間の編集者にしかできない ―― この講座で学んだ「AIと共走・共創する」の考え方そのものです。</div>
<h3>講座のフレームワークで読み解く（考察）</h3>
<p><b>① 3C分析</b></p>
<ul>
<li><b>Customer</b>：自社の考えや魅力を発信したいが、うまく言葉にできない、書く時間がない経営者・企業</li>
<li><b>Competitor</b>：PR会社、広告代理店、記事制作会社、フリーランスのライター。そして<b>代替手段としての生成AI</b>（経営者が自分でAIに書かせる）</li>
<li><b>Company</b>：ベストセラー書籍の編集で培った「人の話を聞き、考えを構造化し、伝わる言葉にする」力と実績</li>
<li><b>KSF（推測）</b>：「経営者本人の考え（一次情報）を引き出して編集する力」。AIにも、記事を量産する会社にも代わりにくい</li>
</ul>
<p><b>② バリュープロポジションキャンバス</b></p>
<ul>
<li><b>顧客のジョブ</b>：自社の考えを社内外に伝え、ファン・採用応募者・取引先を増やしたい</li>
<li><b>ペイン</b>：「伝わらない」、言葉にできない、発信する時間がない、AIで書いた文章は自分らしくない・中身が薄い</li>
<li><b>ゲイン</b>：自分の考えが正しく伝わる、共感してくれる人が増える、本や発信が会社の資産になる</li>
<li><b>ペインリリーバー</b>：編集者が話を聞いて言語化するので、経営者は「話すだけ」でよい</li>
<li><b>ゲインクリエイター</b>：SNS・note・書籍など、目的に合った媒体で届け方を設計する</li>
</ul>
<p><b>③ E-E-A-Tと一次情報</b></p>
<p>経営者の体験、判断の理由、失敗、譲れない美学は、まさに<b>「人間にしか語れないこと」</b>です。顧問編集者は、それを本人から引き出して形にする仕事だと読み取れます。AIが一般論をいくらでも作れる時代には、<b>一次情報を引き出し、編集する力</b>の価値が高まると考えられます。</p>
<p><b>④ VRIO（推測）</b></p>
<ul>
<li>V：「伝わらない」という企業のペインを解消する価値がある</li>
<li>R：ベストセラー書籍の編集実績を持つ編集者は多くない</li>
<li>I：聞く力・構造化する力・編集の実績は、短期間でまねしにくい</li>
<li>O：この強みを経営者向けのサービス（顧問編集者）として提供する仕組みがある</li>
</ul>

<h3>環境選定の練習：この会社で働くとしたら</h3>
<p>PART 3の「環境選定」の目で、求人ページの「求める人物像」を読み解きます（考察）。</p>
<ul>
<li><b>「人の話を聞くのが好き」</b> → 書く力の前に、経営者から一次情報を引き出す<b>聞く力</b>が重視されていると読める</li>
<li><b>「好奇心が旺盛」</b> → さまざまな業界の経営者の考えを理解するために、知らないことを面白がれる姿勢が必要</li>
<li><b>「主体的に動き、成長し続けられる」</b> → 指示を待つのではなく、自分から企画や届け方を提案できる人</li>
</ul>
<div class="box"><span class="lb">「企業のペイン → あなたのベネフィット」に当てはめると</span>企業のペイン「綺麗な文章は書けるが、意図が汲み取れない」→ ベネフィット「話を聞いて相手の考えを構造化し、目的に合った言葉にできる」<br>企業のペイン「AIに丸投げで内容が薄い」→ ベネフィット「AIをパートナーにしつつ、本人にしか語れない一次情報を引き出して厚みを出せる」<br>企業のペイン「指示待ちで提案がない」→ ベネフィット「媒体や企画を自分から提案できる」</div>

<h3>このレッスンから学べること</h3>
<ul>
<li>「伝える」こと自体が、企業のペインを解消する<b>事業</b>になる</li>
<li>AI時代に価値が高まるのは、<b>一次情報を引き出し、編集し、届ける</b>力</li>
<li>実在の企業を分析するときは、<b>公開情報（事実）と考察（推測）を分け、出典を示す</b>（盛りと漏れを防ぐ）</li>
</ul>

<li><a href="https://www.sbbit.jp/author/655" target="_blank" rel="noopener" style="color:#d4a24c">ビジネス+IT：竹村俊助氏の著者紹介</a></li>
<li><a href="https://www.lifehacker.jp/article/171513/" target="_blank" rel="noopener" style="color:#d4a24c">ライフハッカー・ジャパンの記事</a></li>

{ part: "PART 3 思考OSとしてのマーケティング", title: "ワーク：自分を3C分析してみる", sub: "書き込み式　自分・ライバル・社会と企業から勝ち筋を見つける", work: true,
body: `
<p>ここまでの自己分析と環境選定を、<em>3C分析</em>の形にまとめます。商品の3C分析の「顧客・競合・自社」を、キャリアでは次のように置き換えます。</p>
<ul>
<li><b>Company（自分）</b>：これまでの経験・得意・価値観</li>
<li><b>Competitor（ライバル）</b>：他の候補者との違い</li>
<li><b>Customer（社会・企業）</b>：今、市場が求めている人材</li>
</ul>
<p>ゴールは、<b>「社会・企業が求めていて、ほかの候補者が持っていなくて、自分が持っているもの」＝自分のKSF（勝ち筋）</b>を見つけることです。</p>
<div class="box memo"><span class="lb">書く順番について</span>商品の3C分析では顧客から考えました。自分の3Cでは、まず<b>自分の棚卸し（Company）</b>から始め、<b>ライバルとの違い（Competitor）</b>、<b>社会・企業のニーズ（Customer）</b>へと視野を広げます。ただし最後は必ず<b>Customerの目で見直し</b>、「その強みは、相手の『不』を解消できるか？」を確かめます。</div>
<div class="box memo"><span class="lb">使い方</span>下の欄に書き込むと、このブラウザに自動で保存されます（他の人には見えません）。薄い文字は記入例です。最後に「まとめを表示」を押すと、1枚のシートにまとまります。</div>

<h3>STEP 1　Company（自分）：これまでの経験・得意・価値観</h3>
<p class="wl">これまでの経験　<span class="wh">ヒント：5W3Hと数字で。仕事・学業・課外活動・趣味も含めて</span></p>
<textarea data-f="m1" rows="4" placeholder="例：法人営業として4年間、中小企業120社を担当。2024年度は解約した20社に聞き取りを行い、原因を3つに分類。利用が減った顧客に先回りして連絡する仕組みを作り、年間解約率を8％→3％に改善"></textarea>
<p class="wl">自分が当たり前にできることで、人から感謝されることは何か（得意）</p>
<p class="wh" style="margin:0 0 6px">本人にとっては「当たり前」すぎて、強みだと気づきにくいもの（ジョハリの窓の「盲点の窓」）。「ありがとう」「助かった」と言われた場面、よく頼まれることを思い出す</p>
<textarea data-f="m2" rows="3" placeholder="例：散らかった情報を整理して、誰でもわかる手順や表にまとめること。「〇〇さんがまとめると、みんな動けるようになる」とよく言われる"></textarea>
<p class="wl">譲れない美学は何か（価値観）</p>

<textarea data-f="m3" rows="3" placeholder="例：お客様に売って終わりにしない。長く使って成果を出してもらうところまで責任を持つ"></textarea>

<p>前のレッスンで書いた「あなたのベネフィット」や自己PRは、自分では良く書けたつもりでも、<b>盛り</b>（言いすぎ）や<b>漏れ</b>（言い足りない）が必ず混ざります。自分の文章の欠点は、自分ではなかなか見えません（知識の呪い）。そこで、生成AIを<b>第三者の目</b>として使い、校閲とリライトを行います。</p>

<h3>校正・校閲・リライトの違い</h3>
<ul>
<li><b>校正</b>：誤字脱字、表記ゆれ、文法の誤りを直す</li>
<li><b>校閲</b>：内容の正しさ、事実との食い違い、矛盾、言いすぎ・言い足りなさを確かめる</li>
<li><b>リライト</b>：目的や読み手に合わせて、構成や表現を書き直す</li>
</ul>
<div class="box"><span class="lb">順番が大事：先に校閲、あとでリライト</span>いきなり「いい感じに書き直して」と頼むと、AIは文章を魅力的にしようとして、<b>AI自身が盛り、大事な条件を削ります</b>。まず「指摘だけ」をさせて人間が判断し、そのあとで条件をつけてリライトさせます。</div>
<pre>① 校閲：AIに「盛り」と「漏れ」を指摘だけさせる
② 判断：どの指摘を採用するかを自分で決め、事実を確かめる
③ リライト：事実・数字を変えない条件つきで書き直させる
④ 差分確認：元の文と比べ、AIが事実を足したり削ったりしていないか確かめる
⑤ 読者役：採用担当者として深掘り質問をさせ、答えられるか試す</pre>

<h3>ベネフィットの文章に出やすい「盛り」</h3>
<ul>
<li><b>成果の誇張</b>：「売上を劇的に伸ばした」「検索1位を連発」</li>
<li><b>役割の誇張</b>：チームの成果なのに「私が主導し」「私が実現した」</li>
<li><b>断定・万能化</b>：「どんな記事でも」「必ず」「あらゆる業界で」</li>

<h3>ベネフィットの文章に出やすい「漏れ」</h3>
<ul>

{ part: "PART 3 思考OSとしてのマーケティング", title: "価値伝達②：面接", sub: "結論ファーストの対話と、逆質問でのインサイト調査",
body: `
<p>面接は、自分という商品の<b>商談</b>であり、面接官との<b>会話</b>です。書類で伝えた価値を、対話を通して「本当にそうだ」と確信してもらう場です。</p>
<h3>面接官の脳内にある問い</h3>
<p>構成案のレッスンと同じく、相手の頭に浮かぶ問いを想定して準備します。</p>
<pre>① この人は何ができる人？（強み）
② それは本当？（根拠・再現性）
③ うちの会社で活躍できる？（ペインとの重なり）
④ なぜうちなの？ 長く働いてくれる？（志望度・価値観の一致）
⑤ 一緒に働きたいと思える？（人柄・コミュニケーション）</pre>
<h3>答え方は結論ファースト（PREP）</h3>
<ul>
<li><b>P（Point）</b>：質問に一言で答える</li>
<li><b>R（Reason）</b>：理由</li>
<li><b>E（Example）</b>：具体的なエピソード（STAR・数字）</li>
<li><b>P（Point）</b>：結論と、入社後にどう活かすか</li>
</ul>
<div class="box ng"><span class="lb">結論が遠い答え</span>Q「あなたの強みは何ですか」<br>A「前職では営業部に所属しておりまして、最初は新規開拓を担当していたのですが、2年目から既存のお客様を担当することになりまして…」</div>
<div class="box ok"><span class="lb">結論ファーストの答え</span>A「顧客の声から問題の原因を見つけ、チームで再現できる仕組みにする力です。（P）<br>前職で解約が増えていた際、解約した20社に話を聞き、原因を3つに分けました。（R・E）<br>利用が減った顧客に先回りして連絡する仕組みを作り、年間解約率を8％から3％に下げました。（E）<br>御社の新設のカスタマーサクセスチームでも、この経験を活かして仕組みづくりから貢献したいと考えています。（P）」</div>
<p>1つの回答は<b>1分前後</b>が目安です。長く話しすぎず、面接官が興味を持った点を深掘りしてもらう「会話」にします。</p>
<h3>「なぜ」の深掘りを先回りする</h3>
<p>面接官は「なぜそうしたのですか」「ほかの方法は考えましたか」「うまくいかなかったことは」と深掘りしてきます。論理の架け橋のレッスンと同じく、<b>5W3Hと「なぜ」を事前に埋めておく</b>と、落ち着いて答えられます。</p>
<ul>
<li>なぜその課題に取り組んだのか（問題意識）</li>
<li>なぜその方法を選んだのか（ほかの選択肢と比べた理由）</li>
<li>どこでつまずき、どう乗り越えたか（Experience）</li>
<li>その経験から何を学び、次にどう活かすか（再現性）</li>
</ul>
<div class="box memo"><span class="lb">暗記より「自分の経験」</span>丸暗記した文章は、深掘りされると崩れます。自分が実際に体験したことは、どんな角度から聞かれても自分の言葉で話せます。これが面接でのExperience（経験）の強さであり、信頼につながります。</div>
<h3>逆質問は、企業のインサイト調査の場</h3>
<p>「最後に何か質問はありますか」は、<b>環境選定の続き</b>です。自分に合う場所かを見抜き、同時に志望度と理解の深さを伝えられます。</p>
<ul>
<li>「このポジションで、入社後半年間に最も期待される成果は何ですか」（企業のゲイン）</li>
<li>「現在のチームで、いちばん大きな課題は何だと感じていますか」（企業のペイン）</li>
<li>「このポジションで活躍している方に、共通する特徴はありますか」（求める人物像）</li>
<li>「中期経営計画にある既存顧客の売上比率の向上について、このチームはどんな役割を担いますか」（下調べを示す質問）</li>
</ul>
<div class="box ng"><span class="lb">避けたい逆質問</span>調べればわかること（公式サイトに載っている内容）、「特にありません」、条件面だけの質問を最初にすること。</div>

const toItem = (x, topic) => ({ q: x[0], a: x[1], opts: shuffle([x[1], ...x[2]]), exp: x[3], topic });

function startLesson(i) {
  run = { key: i, label: `LESSON ${i + 1}　${L[i].title}`, items: shuffle(L[i].quiz).map(x => toItem(x, L[i].title)), i: 0, score: 0, wrong: [] };
  question();
}

function mix(p) {
  const pool = [];
  L.forEach(l => { if (p === null || l.part.startsWith("PART " + (p + 1))) l.quiz.forEach(x => pool.push(toItem(x, l.title))); });
  const label = p === null ? "全範囲ランダム" : `PART ${p + 1} ランダム`;
  run = { key: null, label, items: shuffle(pool).slice(0, 10), i: 0, score: 0, wrong: [] };
  question();
}

function question() {
  const it = run.items[run.i];
  run.answered = false;
  app.innerHTML = `<div class="topbar">
    <div><div class="kicker">${run.label}</div><h2>第${run.i + 1}問 / ${run.items.length}</h2></div>
    <div><div class="score-label">スコア</div><div class="score-value">${run.score} / ${run.i}</div></div></div>
  <span class="badge">${it.topic}</span>
  <div class="card"><p class="q">${esc(it.q)}</p>
    ${it.opts.map((o, k) => `<button class="opt" data-k="${k}" onclick="answer(${k})">${esc(o)}</button>`).join("")}
    <div id="exp"></div></div>
  <div class="buttons-row"><button class="b btn-secondary" onclick="home()">中断して一覧へ</button></div>`;
  scrollTo(0, 0);
}

function answer(k) {
  if (run.answered) return;
  run.answered = true;
  const it = run.items[run.i], ok = it.opts[k] === it.a;
  if (ok) run.score++; else run.wrong.push(it);
  document.querySelectorAll(".opt").forEach((b, n) => {
    b.disabled = true;
    if (it.opts[n] === it.a) b.classList.add("correct");
    else if (n === k) b.classList.add("wrong");
  });
  const last = run.i + 1 >= run.items.length;
  document.getElementById("exp").innerHTML = `<div class="exp ${ok ? "ok" : "ng"}">
    <div class="rt">${ok ? "正解！" : "不正解"}</div>${ok ? "" : `正解：<b>${esc(it.a)}</b><br>`}${esc(it.exp)}</div>
    <div class="buttons-row" style="margin-top:14px"><button class="b btn-primary" onclick="next()">${last ? "結果を見る" : "次の問題 →"}</button></div>`;
  document.querySelector(".score-value").textContent = `${run.score} / ${run.i + 1}`;
}

function next() { run.i++; run.i < run.items.length ? question() : result(); }

function result() {
  const n = run.items.length;
  if (run.key !== null && (best[run.key] === undefined || run.score > best[run.key])) { best[run.key] = run.score; saveBest(); }
  const rate = run.score / n;
  const msg = rate === 1 ? "全問正解！完璧です。" : rate >= 0.8 ? "よくできました。間違えた問題を見直しましょう。" : rate >= 0.6 ? "もう一歩。解説を読み直してから再挑戦しましょう。" : "解説に戻って、ポイントを確認しましょう。";
  const i = run.key;
  app.innerHTML = `<div><div class="kicker">${run.label}</div><h2>結果</h2></div>
  <div class="card center"><div class="big">${run.score} / ${n}</div><p>${msg}</p></div>
  ${run.wrong.length ? `<div class="card body"><h3 style="margin-top:0">間違えた問題の復習</h3><ul class="review">${run.wrong.map(w => `<li>${esc(w.q)}<br>→ <b>${esc(w.a)}</b><br><span style="color:#9aa5b1">${esc(w.exp)}</span></li>`).join("")}</ul></div>` : ""}
  <div class="buttons-row">
    <button class="b btn-primary" onclick="${i !== null ? `startLesson(${i})` : "mix(null)"}">もう一度</button>
    ${i !== null ? `<button class="b btn-secondary" onclick="lesson(${i})">解説に戻る</button>` : ""}
    ${i !== null && i + 1 < L.length ? `<button class="b btn-secondary" onclick="lesson(${i + 1})">次のレッスン →</button>` : ""}
    <button class="b btn-secondary" onclick="home()">一覧へ</button>
  </div>`;
  scrollTo(0, 0);
}

home();
</script>
</body>
</html>
