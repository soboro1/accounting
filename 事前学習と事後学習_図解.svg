<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F5F8FC"/>

  <!-- Title -->
  <text x="800" y="86" text-anchor="middle" font-size="50" font-weight="800" fill="#1F3A5F">事前学習と事後学習</text>
  <text x="800" y="134" text-anchor="middle" font-size="26" fill="#4A5D78">「物知り」になってから、「使いやすいアシスタント」になる2段階</text>

  <!-- Card 1: pre-training -->
  <rect x="60" y="180" width="700" height="480" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <circle cx="120" cy="240" r="34" fill="#1F6FEB"/>
  <text x="120" y="253" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF">1</text>
  <text x="175" y="252" font-size="36" font-weight="800" fill="#1F3A5F">事前学習</text>
  <text x="345" y="252" font-size="22" fill="#4A5D78">Pre-training</text>

  <rect x="100" y="298" width="120" height="50" rx="12" fill="#E6F0FF" stroke="#1F6FEB" stroke-width="2"/>
  <text x="160" y="331" text-anchor="middle" font-size="24" font-weight="700" fill="#1F3A5F">本</text>
  <rect x="235" y="298" width="120" height="50" rx="12" fill="#E6F0FF" stroke="#1F6FEB" stroke-width="2"/>
  <text x="295" y="331" text-anchor="middle" font-size="24" font-weight="700" fill="#1F3A5F">Web</text>
  <rect x="370" y="298" width="120" height="50" rx="12" fill="#E6F0FF" stroke="#1F6FEB" stroke-width="2"/>
  <text x="430" y="331" text-anchor="middle" font-size="24" font-weight="700" fill="#1F3A5F">論文</text>
  <rect x="505" y="298" width="120" height="50" rx="12" fill="#E6F0FF" stroke="#1F6FEB" stroke-width="2"/>
  <text x="565" y="331" text-anchor="middle" font-size="24" font-weight="700" fill="#1F3A5F">コード</text>
  <text x="660" y="331" font-size="26" fill="#4A5D78">…</text>

  <path d="M360 356 L360 392" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="380" y="381" font-size="21" font-weight="700" fill="#1F6FEB">「次の言葉」を当てる練習</text>

  <rect x="100" y="398" width="560" height="62" rx="14" fill="#1F6FEB"/>
  <text x="380" y="438" text-anchor="middle" font-size="25" font-weight="800" fill="#FFFFFF">素のモデル（物知りだが、指示は苦手）</text>

  <text x="100" y="520" font-size="23" fill="#1F3A5F"><tspan font-weight="800" fill="#1F6FEB">目的　</tspan>知識と言葉のつながりを広く身につける</text>
  <text x="100" y="562" font-size="23" fill="#1F3A5F"><tspan font-weight="800" fill="#1F6FEB">規模　</tspan>数か月・巨大な計算設備・非常に高い費用</text>
  <text x="100" y="604" font-size="23" fill="#1F3A5F"><tspan font-weight="800" fill="#1F6FEB">たとえ　</tspan>新入社員の「大学時代」</text>

  <!-- arrow between cards -->
  <path d="M766 420 L794 420" stroke="#1F3A5F" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Card 2: post-training -->
  <rect x="800" y="180" width="740" height="480" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <circle cx="860" cy="240" r="34" fill="#16A34A"/>
  <text x="860" y="253" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF">2</text>
  <text x="915" y="252" font-size="36" font-weight="800" fill="#1F3A5F">事後学習</text>
  <text x="1085" y="252" font-size="22" fill="#4A5D78">Post-training</text>

  <rect x="840" y="296" width="660" height="66" rx="14" fill="#F5F0FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="866" y="327" font-size="25" font-weight="800" fill="#1F3A5F">指示チューニング（SFT）</text>
  <text x="866" y="352" font-size="20" fill="#4A5D78">質問と、お手本の答えのセットを学ぶ</text>

  <rect x="840" y="372" width="660" height="66" rx="14" fill="#E6F0FF" stroke="#1F6FEB" stroke-width="2"/>
  <text x="866" y="403" font-size="25" font-weight="800" fill="#1F3A5F">人のフィードバック（RLHF）</text>
  <text x="866" y="428" font-size="20" fill="#4A5D78">人が答えを比べて、「良い方」を教える</text>

  <rect x="840" y="448" width="660" height="66" rx="14" fill="#E3F7EA" stroke="#16A34A" stroke-width="2"/>
  <text x="866" y="479" font-size="25" font-weight="800" fill="#1F3A5F">安全性の調整</text>
  <text x="866" y="504" font-size="20" fill="#4A5D78">危険な依頼や不適切な答えを避けるようにする</text>

  <path d="M1170 520 L1170 548" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrowP)"/>
  <rect x="940" y="552" width="460" height="52" rx="14" fill="#7C3AED"/>
  <text x="1170" y="587" text-anchor="middle" font-size="26" font-weight="800" fill="#FFFFFF">使いやすいアシスタント</text>

  <text x="1170" y="640" text-anchor="middle" font-size="23" fill="#1F3A5F"><tspan font-weight="800" fill="#16A34A">たとえ　</tspan>入社後の研修と、先輩の指導</text>

  <!-- Bottom band -->
  <rect x="60" y="700" width="1480" height="150" rx="24" fill="#1F3A5F"/>
  <text x="110" y="750" font-size="30" font-weight="800" fill="#FFD166">2つの違い</text>
  <text x="1490" y="748" text-anchor="end" font-size="20" fill="#C9D6E8">Gem や NotebookLM は、AIを学習し直さず、毎回指示や資料を読ませているだけ</text>
  <text x="110" y="796" font-size="26" fill="#FFFFFF">事前学習は「広く知識を身につける」段階。量が多く、費用も大きい。</text>
  <text x="110" y="835" font-size="26" fill="#FFFFFF">事後学習は「使いやすい振る舞いを教える」段階。量は少なく、目的がはっきりしている。</text>
</svg>
