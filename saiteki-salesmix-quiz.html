<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最適セールスミックス ランダム問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #101b2d;
    color: #f6f1e6;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .kicker { font-size: 13px; letter-spacing: 3px; color: #d4a24c; font-weight: 700; }
  h1 { font-size: 26px; font-weight: 700; margin: 4px 0 0 0; }
  .score-label { font-size: 13px; color: #9aa5b1; text-align: right; }
  .score-value { font-size: 22px; font-weight: 700; color: #d4a24c; text-align: right; }

  .topic-badge {
    display: inline-flex; align-self: flex-start;
    padding: 6px 16px; border-radius: 999px;
    background: rgba(212,162,76,0.18); border: 1px solid #d4a24c;
    font-size: 13px; font-weight: 700; color: #d4a24c; letter-spacing: 1px;
  }

  .problem-card {
    padding: 20px 24px; border: 1px solid rgba(212,162,76,0.35); border-radius: 12px;
    background: rgba(255,255,255,0.03); display: flex; flex-direction: column; gap: 6px;
  }
  .problem-line { font-size: 16px; line-height: 1.9; color: #e8e3d8; }
  .problem-line b { color: #f6f1e6; }

  .inputs-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .input-group { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 14px; color: #c7c0b0; }
  .input-group input {
    padding: 10px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid rgba(212,162,76,0.4); background: #0e1726; color: #f6f1e6; font-family: inherit;
  }
  .input-group input::placeholder { color: #6b7688; }
  .input-group input:focus { outline: none; border-color: #d4a24c; }

  .hint { font-size: 12px; color: #8b93a1; }
  .error { font-size: 13px; color: #f0997b; display: none; }

  .buttons-row { display: flex; gap: 12px; flex-wrap: wrap; }
  button { font-family: inherit; cursor: pointer; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 700; border: none; }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.95); }
  .btn-primary { color: #101b2d; background: #d4a24c; }
  .btn-secondary { color: #d4a24c; background: transparent; border: 1px solid #d4a24c; }

  .result-card { padding: 18px 22px; border-radius: 12px; border: 2px solid; display: none; flex-direction: column; gap: 8px; }
  .result-card.show { display: flex; }
  .result-title { font-size: 17px; font-weight: 700; }
  .result-explanation { font-size: 14px; line-height: 1.8; color: #e8e3d8; white-space: pre-line; }

  .footer-note { font-size: 12px; color: #6b7688; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">

  <div class="header-row">
    <div>
      <div class="kicker">BOOKKEEPING LV.1 工業簿記 ⑮ 最適セールスミックス</div>
      <h1>最適セールスミックス ランダム問題</h1>
    </div>
    <div>
      <div class="score-label">スコア</div>
      <div class="score-value"><span id="score">0</span> / <span id="total">0</span></div>
    </div>
  </div>

  <div class="topic-badge" id="topicBadge"></div>

  <div class="problem-card" id="problemCard"></div>

  <div class="inputs-row">
    <div class="input-group">
      <label id="label1"></label>
      <input type="text" id="input1" autocomplete="off">
    </div>
    <div class="input-group">
      <label id="label2"></label>
      <input type="text" id="input2" autocomplete="off">
    </div>
  </div>
  <div class="hint">半角数字、カンマなしで入力してください(単位の「円」「個」は不要)。</div>
  <div class="error" id="errorText"></div>

  <div class="buttons-row">
    <button class="btn-primary" id="checkBtn">解答する</button>
    <button class="btn-secondary" id="nextBtn">次の問題へ</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-explanation" id="resultExplanation"></div>
  </div>

  <div class="footer-note">簿記1級 最適セールスミックス(制約条件つきの意思決定)の練習用アプリ(自己採点)</div>

</div>

<script>
(function () {
  var state = { problem: null, score: 0, total: 0 };

  function randMultiple(min, max, step) {
    var n = Math.floor(Math.random() * ((max - min) / step + 1));
    return min + n * step;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fmt(n) {
    var s = Math.abs(Math.round(n)).toLocaleString('ja-JP');
    return (n < 0 ? '−' : '') + s;
  }
  var RES = [['機械時間', '時間'], ['直接作業時間', '時間'], ['材料の使用量', 'kg']];

  // 制約が1つの共通データ(pri = 優先される製品、oth = 後回しの製品)
  function singleData() {
    var res = pick(RES);
    var ap = randMultiple(1, 6, 1), ao = randMultiple(1, 6, 1);
    var ro = randMultiple(5, 30, 1) * 10;
    var rp = ro + randMultiple(1, 10, 1) * 10;
    var cmp = rp * ap, cmo = ro * ao;
    var dp = randMultiple(1, 10, 1) * 100;
    var qo = randMultiple(1, 9, 1) * 50;
    var dO = qo + randMultiple(1, 5, 1) * 50;
    var cap = dp * ap + qo * ao;
    var priIsA = Math.random() < 0.5;
    return { res: res, ap: ap, ao: ao, rp: rp, ro: ro, cmp: cmp, cmo: cmo, dp: dp, qo: qo, dO: dO, cap: cap, priIsA: priIsA };
  }
  function singleLines(d) {
    var A = d.priIsA ? { cm: d.cmp, a: d.ap, dem: d.dp } : { cm: d.cmo, a: d.ao, dem: d.dO };
    var B = d.priIsA ? { cm: d.cmo, a: d.ao, dem: d.dO } : { cm: d.cmp, a: d.ap, dem: d.dp };
    var u = d.res[1];
    return [
      d.res[0] + 'の上限は月<b>' + fmt(d.cap) + u + '</b>である(制約条件はこれだけとする)。',
      '製品A:貢献利益<b>' + fmt(A.cm) + '円/個</b>、' + d.res[0] + '<b>' + A.a + u + '/個</b>、需要上限<b>' + fmt(A.dem) + '個</b>',
      '製品B:貢献利益<b>' + fmt(B.cm) + '円/個</b>、' + d.res[0] + '<b>' + B.a + u + '/個</b>、需要上限<b>' + fmt(B.dem) + '個</b>'
    ];
  }
  function singleExplain(d) {
    var P = d.priIsA ? 'A' : 'B', O = d.priIsA ? 'B' : 'A', u = d.res[1];
    var total = d.dp * d.cmp + d.qo * d.cmo;
    return '1' + u + 'あたり貢献利益:製品' + P + ' = ' + fmt(d.cmp) + ' ÷ ' + d.ap + ' = ' + fmt(d.rp) + '円、製品' + O + ' = ' + fmt(d.cmo) + ' ÷ ' + d.ao + ' = ' + fmt(d.ro) + '円 → 製品' + P + 'が優先\n' +
      '製品' + P + ':需要上限の' + fmt(d.dp) + '個を生産(' + fmt(d.dp) + '×' + d.ap + ' = ' + fmt(d.dp * d.ap) + u + ')\n' +
      '残り ' + fmt(d.cap) + ' − ' + fmt(d.dp * d.ap) + ' = ' + fmt(d.cap - d.dp * d.ap) + u + ' → 製品' + O + ':' + fmt(d.cap - d.dp * d.ap) + ' ÷ ' + d.ao + ' = ' + fmt(d.qo) + '個(需要上限' + fmt(d.dO) + '個以内)\n' +
      '貢献利益 = ' + fmt(d.dp) + '×' + fmt(d.cmp) + ' + ' + fmt(d.qo) + '×' + fmt(d.cmo) + ' = ' + fmt(total) + '円';
  }

  // ① 制約1単位あたりの貢献利益
  function genRate() {
    var d = singleData();
    var rA = d.priIsA ? d.rp : d.ro, rB = d.priIsA ? d.ro : d.rp;
    var cA = d.priIsA ? d.cmp : d.cmo, cB = d.priIsA ? d.cmo : d.cmp;
    var aA = d.priIsA ? d.ap : d.ao, aB = d.priIsA ? d.ao : d.ap;
    var u = d.res[1];
    return {
      badge: '制約1単位あたりの貢献利益(優先順位の判定)',
      check: Number.isInteger(rA) && Number.isInteger(rB),
      lines: singleLines(d),
      label1: '製品Aの1' + u + 'あたり貢献利益(円)',
      label2: '製品Bの1' + u + 'あたり貢献利益(円)',
      ph1: '例: 200', ph2: '例: 150',
      answers: [rA, rB],
      tol: [0, 0],
      explanation:
        '製品A:' + fmt(cA) + ' ÷ ' + aA + u + ' = ' + fmt(rA) + '円\n' +
        '製品B:' + fmt(cB) + ' ÷ ' + aB + u + ' = ' + fmt(rB) + '円\n' +
        '→ 製品' + (rA > rB ? 'A' : 'B') + 'を優先して生産する。' +
        ((rA > rB) !== (cA > cB) ? '1個あたり貢献利益は製品' + (cA > cB ? 'A' : 'B') + 'のほうが大きいが、順位は逆になる点に注意。' : '')
    };
  }

  // ② 制約が1つ:最適な組み合わせ
  function genSingle() {
    var d = singleData();
    var qA = d.priIsA ? d.dp : d.qo;
    var total = d.dp * d.cmp + d.qo * d.cmo;
    return {
      badge: '最適セールスミックス(制約条件が1つ)',
      check: Number.isInteger(total),
      lines: singleLines(d),
      label1: '製品Aの生産量(個)',
      label2: '貢献利益の合計(円)',
      ph1: '例: 600', ph2: '例: 360000',
      answers: [qA, total],
      tol: [0, 0],
      explanation: singleExplain(d)
    };
  }

  // ③ 正しい順位 vs 1個あたりで選んだ場合
  function genTrap() {
    var d = null, tries = 0;
    while (tries < 3000) { tries++; d = singleData(); if (d.cmo > d.cmp) break; }
    var total = d.dp * d.cmp + d.qo * d.cmo;
    // 1個あたり貢献利益の大きい製品(oth)を先に作った場合
    var q1 = Math.min(d.dO, Math.floor(d.cap / d.ao));
    var rem = d.cap - q1 * d.ao;
    var q2 = Math.min(d.dp, Math.floor(rem / d.ap));
    var wrong = q1 * d.cmo + q2 * d.cmp;
    var O = d.priIsA ? 'B' : 'A', P = d.priIsA ? 'A' : 'B';
    return {
      badge: 'ひっかけ:1個あたり貢献利益で選ぶと損をする',
      check: Number.isInteger(wrong) && wrong < total,
      lines: singleLines(d),
      label1: '最適な組み合わせの貢献利益(円)',
      label2: '1個あたり貢献利益の大きい製品を優先した場合の貢献利益(円)',
      ph1: '例: 360000', ph2: '例: 320000',
      answers: [total, wrong],
      tol: [0, 0],
      explanation:
        '【正しい解き方】\n' + singleExplain(d) + '\n\n' +
        '【1個あたりで選んだ場合】製品' + O + '(1個' + fmt(d.cmo) + '円)を優先\n' +
        '製品' + O + ':' + fmt(q1) + '個(' + fmt(q1 * d.ao) + d.res[1] + ')、残り' + fmt(rem) + d.res[1] + ' → 製品' + P + ':' + fmt(q2) + '個\n' +
        '貢献利益 = ' + fmt(q1) + '×' + fmt(d.cmo) + ' + ' + fmt(q2) + '×' + fmt(d.cmp) + ' = ' + fmt(wrong) + '円\n' +
        '差額 ' + fmt(total - wrong) + '円の損。制約1単位あたりで比べるのが正解。'
    };
  }

  // ④ 制約が2つ:線形計画法
  function genLP() {
    var res = null, tries = 0;
    while (!res && tries < 5000) {
      tries++;
      var xs = randMultiple(1, 10, 1) * 50, ys = randMultiple(1, 10, 1) * 50;
      var a1 = randMultiple(1, 4, 1), b1 = randMultiple(1, 4, 1), a2 = randMultiple(1, 4, 1), b2 = randMultiple(1, 4, 1);
      if (a1 * b2 <= a2 * b1) continue; // 工程1のほうが傾きが急
      var C1 = a1 * xs + b1 * ys, C2 = a2 * xs + b2 * ys;
      var px = randMultiple(1, 20, 1) * 50, py = randMultiple(1, 20, 1) * 50;
      // 最適解が交点になる条件:a2/b2 < px/py < a1/b1
      if (!(px * b2 > py * a2 && px * b1 < py * a1)) continue;
      var xInt = Math.min(C1 / a1, C2 / a2), yInt = Math.min(C1 / b1, C2 / b2);
      if (!Number.isInteger(xInt) || !Number.isInteger(yInt)) continue;
      if (xInt !== C1 / a1 || yInt !== C2 / b2) continue;
      var vx = px * xInt, vy = py * yInt, vs = px * xs + py * ys;
      if (!(vs > vx && vs > vy)) continue;
      res = { xs: xs, ys: ys, a1: a1, b1: b1, a2: a2, b2: b2, C1: C1, C2: C2, px: px, py: py, xInt: xInt, yInt: yInt, vx: vx, vy: vy, vs: vs };
    }
    var d = res;
    function term(c, v) { return (c === 1 ? '' : c) + v; }
    return {
      badge: '最適セールスミックス(制約条件が2つ・線形計画法)',
      check: d.a1 * d.xs + d.b1 * d.ys === d.C1 && d.a2 * d.xs + d.b2 * d.ys === d.C2,
      lines: [
        '製品X:貢献利益<b>' + fmt(d.px) + '円/個</b>、工程1で<b>' + d.a1 + '時間/個</b>、工程2で<b>' + d.a2 + '時間/個</b>',
        '製品Y:貢献利益<b>' + fmt(d.py) + '円/個</b>、工程1で<b>' + d.b1 + '時間/個</b>、工程2で<b>' + d.b2 + '時間/個</b>',
        '工程1の上限は<b>' + fmt(d.C1) + '時間</b>、工程2の上限は<b>' + fmt(d.C2) + '時間</b>である(需要の上限はないものとする)。'
      ],
      label1: '製品Xの生産量(個)',
      label2: '貢献利益の最大値(円)',
      ph1: '例: 400', ph2: '例: 160000',
      answers: [d.xs, d.vs],
      tol: [0, 0],
      explanation:
        '目的関数:' + fmt(d.px) + 'x + ' + fmt(d.py) + 'y → 最大化\n' +
        '工程1:' + term(d.a1, 'x') + ' + ' + term(d.b1, 'y') + ' ≦ ' + fmt(d.C1) + '\n' +
        '工程2:' + term(d.a2, 'x') + ' + ' + term(d.b2, 'y') + ' ≦ ' + fmt(d.C2) + '\n' +
        '端点(' + fmt(d.xInt) + ', 0):' + fmt(d.vx) + '円\n' +
        '端点(0, ' + fmt(d.yInt) + '):' + fmt(d.vy) + '円\n' +
        '2つの制約式の交点:連立方程式を解いて x = ' + fmt(d.xs) + '、y = ' + fmt(d.ys) + ' → ' + fmt(d.px) + '×' + fmt(d.xs) + ' + ' + fmt(d.py) + '×' + fmt(d.ys) + ' = ' + fmt(d.vs) + '円\n' +
        '→ 最大は交点。製品X ' + fmt(d.xs) + '個、製品Y ' + fmt(d.ys) + '個で貢献利益 ' + fmt(d.vs) + '円'
    };
  }

  function generateProblem() {
    var y = Math.random();
    if (y < 0.2) return genRate();
    if (y < 0.5) return genSingle();
    if (y < 0.7) return genTrap();
    return genLP();
  }

  function renderProblem() {
    var p = state.problem;
    document.getElementById('topicBadge').textContent = '【 ' + p.badge + ' 】';
    document.getElementById('problemCard').innerHTML = p.lines.map(function (l) {
      return '<div class="problem-line">' + l + '</div>';
    }).join('');
    document.getElementById('label1').textContent = p.label1;
    document.getElementById('label2').textContent = p.label2;
    var i1 = document.getElementById('input1');
    var i2 = document.getElementById('input2');
    i1.placeholder = p.ph1;
    i2.placeholder = p.ph2;
    i1.value = '';
    i2.value = '';
    document.getElementById('errorText').style.display = 'none';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;
  }

  function parseSigned(s) {
    if (s === undefined || s === null) return NaN;
    var t = String(s).trim().replace(/,/g, '').replace(/万円/g, '').replace(/円/g, '').replace(/%/g, '').replace(/回/g, '').replace(/個/g, '').replace(/[−▲△]/g, '-');
    if (t === '' || t === '-' || t === '+') return NaN;
    return Number(t);
  }

  function isClose(a, b, tol) {
    return Math.abs(a - b) <= tol + 1e-9;
  }

  function handleCheck() {
    var u1 = parseSigned(document.getElementById('input1').value);
    var u2 = parseSigned(document.getElementById('input2').value);
    var errEl = document.getElementById('errorText');
    if (isNaN(u1) || isNaN(u2)) {
      errEl.textContent = '両方の欄に数値を入力してください';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    var p = state.problem;
    var tol = p.tol || [0, 0];
    var isCorrect = isClose(u1, p.answers[0], tol[0]) && isClose(u2, p.answers[1], tol[1]);
    state.total += 1;
    if (isCorrect) state.score += 1;
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;

    var resultCard = document.getElementById('resultCard');
    var resultTitle = document.getElementById('resultTitle');
    resultTitle.textContent = isCorrect ? '正解です!' : '不正解です。もう一度見直してみましょう。';
    resultTitle.style.color = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.borderColor = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.background = isCorrect ? 'rgba(99,153,34,0.14)' : 'rgba(216,90,48,0.14)';
    document.getElementById('resultExplanation').textContent = p.explanation;
    resultCard.classList.add('show');
  }

  function handleNext() {
    state.problem = generateProblem();
    renderProblem();
  }

  document.getElementById('checkBtn').addEventListener('click', handleCheck);
  document.getElementById('nextBtn').addEventListener('click', handleNext);
  document.getElementById('input1').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });
  document.getElementById('input2').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });

  state.problem = generateProblem();
  renderProblem();
})();
</script>
</body>
</html>
