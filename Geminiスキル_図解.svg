<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F5F8FC"/>
  <text x="800" y="86" text-anchor="middle" font-size="50" font-weight="800" fill="#1F3A5F">Gemini スキルの仕組み</text>
  <text x="800" y="134" text-anchor="middle" font-size="26" fill="#4A5D78">保存した手順を、必要なときに呼び出して使い回す</text>

  <rect x="60" y="170" width="1480" height="340" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <circle cx="116" cy="222" r="30" fill="#1F6FEB"/>
  <text x="116" y="234" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">1</text>
  <text x="162" y="234" font-size="32" font-weight="800" fill="#1F3A5F">基本の流れ（Gemini アプリ）</text>

  <rect x="110" y="262" width="420" height="220" rx="18" fill="#E6F0FF" stroke="#1F6FEB" stroke-width="3"/>
  <text x="134" y="306" font-size="30" font-weight="800" fill="#1F6FEB">① スキルを作る</text>
  <text x="134" y="350" font-size="23" fill="#1F3A5F">名前と指示を保存しておく</text>
  <rect x="134" y="372" width="372" height="56" rx="12" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="2"/>
  <text x="320" y="408" text-anchor="middle" font-size="22" font-weight="800" fill="#1F3A5F">「専門用語に説明を添える」</text>
  <text x="134" y="460" font-size="20" fill="#4A5D78">（登録する指示の例）</text>
  <path d="M536 372 L584 372" stroke="#1F3A5F" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="590" y="262" width="420" height="220" rx="18" fill="#F5F0FF" stroke="#7C3AED" stroke-width="3"/>
  <text x="614" y="306" font-size="30" font-weight="800" fill="#7C3AED">② 呼び出す</text>
  <rect x="614" y="330" width="64" height="64" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
  <text x="646" y="377" text-anchor="middle" font-size="40" font-weight="800" font-family="Menlo, monospace" fill="#7C3AED">/</text>
  <text x="698" y="358" font-size="22" fill="#1F3A5F">チャットで「/」を入力して</text>
  <text x="698" y="388" font-size="22" fill="#1F3A5F">名前を選ぶ</text>
  <text x="614" y="440" font-size="22" font-weight="800" fill="#7C3AED">関係するスキルは自動で適用</text>
  <text x="614" y="470" font-size="20" fill="#4A5D78">（Gemini が選んで使う）</text>
  <path d="M1016 372 L1064 372" stroke="#1F3A5F" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1070" y="262" width="420" height="220" rx="18" fill="#E3F7EA" stroke="#16A34A" stroke-width="3"/>
  <text x="1094" y="306" font-size="30" font-weight="800" fill="#16A34A">③ 回答が整う</text>
  <text x="1094" y="352" font-size="23" fill="#1F3A5F">保存した手順どおりに回答</text>
  <text x="1094" y="392" font-size="23" fill="#1F3A5F">複数のスキルを組み合わせて</text>
  <text x="1094" y="432" font-size="23" fill="#1F3A5F">使うこともできる</text>

  <circle cx="90" cy="558" r="26" fill="#E8590C"/>
  <text x="90" y="569" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF">2</text>
  <text x="132" y="568" font-size="30" font-weight="800" fill="#1F3A5F">スキルが使える4つの場所</text>

  <rect x="60" y="596" width="340" height="212" rx="20" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="3"/>
  <rect x="80" y="614" width="140" height="36" rx="18" fill="#E6F0FF" stroke="#1F6FEB" stroke-width="2"/>
  <text x="150" y="639" text-anchor="middle" font-size="20" font-weight="800" fill="#1F6FEB">個人向け</text>
  <text x="80" y="690" font-size="26" font-weight="800" fill="#1F3A5F">Gemini アプリ</text>
  <text x="80" y="726" font-size="20" fill="#1F3A5F">「/」で呼び出す</text>
  <text x="80" y="756" font-size="20" fill="#1F3A5F">Gem の後継とされる</text>
  <text x="80" y="786" font-size="20" fill="#1F3A5F">同時に有効: 100個まで*</text>
  <rect x="440" y="596" width="340" height="212" rx="20" fill="#FFFFFF" stroke="#E8590C" stroke-width="3"/>
  <rect x="460" y="614" width="140" height="36" rx="18" fill="#FFF0E6" stroke="#E8590C" stroke-width="2"/>
  <text x="530" y="639" text-anchor="middle" font-size="20" font-weight="800" fill="#E8590C">ブラウザ</text>
  <text x="460" y="690" font-size="26" font-weight="800" fill="#1F3A5F">Gemini in Chrome</text>
  <text x="460" y="726" font-size="20" fill="#1F3A5F">プロンプトを保存して</text>
  <text x="460" y="756" font-size="20" fill="#1F3A5F">再入力を省く</text>
  <text x="460" y="786" font-size="20" fill="#1F3A5F">「/」か「+」で呼び出す</text>
  <rect x="820" y="596" width="340" height="212" rx="20" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
  <rect x="840" y="614" width="140" height="36" rx="18" fill="#F5F0FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="910" y="639" text-anchor="middle" font-size="20" font-weight="800" fill="#7C3AED">法人向け</text>
  <text x="840" y="690" font-size="26" font-weight="800" fill="#1F3A5F">Gemini Enterprise</text>
  <text x="840" y="726" font-size="20" fill="#1F3A5F">SKILL.md を含む</text>
  <text x="840" y="756" font-size="20" fill="#1F3A5F">パッケージで管理</text>
  <text x="840" y="786" font-size="20" fill="#1F3A5F">スクリプトも入れられる</text>
  <rect x="1200" y="596" width="340" height="212" rx="20" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/>
  <rect x="1220" y="614" width="140" height="36" rx="18" fill="#E3F7EA" stroke="#16A34A" stroke-width="2"/>
  <text x="1290" y="639" text-anchor="middle" font-size="20" font-weight="800" fill="#16A34A">開発者向け</text>
  <text x="1220" y="690" font-size="26" font-weight="800" fill="#1F3A5F">Gemini CLI</text>
  <text x="1220" y="726" font-size="20" fill="#1F3A5F">必要なときだけ</text>
  <text x="1220" y="756" font-size="20" fill="#1F3A5F">読み込まれる手順</text>
  <text x="1220" y="786" font-size="20" fill="#1F3A5F">（GEMINI.md は常時）</text>
  <text x="800" y="852" text-anchor="middle" font-size="20" fill="#4A5D78">* 上限や対象プランは、解説記事などの報道にもとづく情報です。最新の仕様は公式ヘルプで確認してください。</text>
</svg>
