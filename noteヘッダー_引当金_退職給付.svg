<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="160" fill="#2F7DE1" opacity="0.16"/>
  <circle cx="1250" cy="660" r="210" fill="#E8543F" opacity="0.14"/>
  <circle cx="680" cy="700" r="110" fill="#0FA18D" opacity="0.12"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="86" width="280" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="220" y="119" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">簿記1級 | 会計学</text>

  <text x="80" y="236" class="dg" font-size="88" fill="#5BA2FF">引当金</text>
  <text x="80" y="332" class="dg" font-size="88" fill="#FF7A66">退職給付</text>

  <text x="80" y="408" font-size="28" font-weight="700" fill="#fff" opacity="0.95">の出る論点を、図と仕訳で</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="446" width="190" height="50" rx="25" fill="#fff"/>
    <text x="175" y="479" fill="#1D5DB3">4要件と5要素</text>
    <rect x="284" y="446" width="164" height="50" rx="25" fill="#fff"/>
    <text x="366" y="479" fill="#8A6000">計算問題2問</text>
    <rect x="462" y="446" width="150" height="50" rx="25" fill="#fff"/>
    <text x="537" y="479" fill="#A8205C">○×50問</text>
  </g>

  <text x="80" y="572" font-size="20" font-weight="500" fill="#fff" opacity="0.8">図解つき・登録不要の無料Webページ</text>

  <!-- 右:退職給付費用の積み上げ -->
  <text x="1000" y="112" text-anchor="middle" class="dg" font-size="26" fill="#fff">退職給付費用は5つの要素</text>

  <g filter="url(#shadow)">
    <rect x="790" y="248" width="72" height="192" rx="6" fill="#E8543F"/>
    <rect x="877" y="200" width="72" height="48" rx="6" fill="#E8543F"/>
    <rect x="964" y="200" width="72" height="43" rx="6" fill="#0FA18D"/>
    <rect x="1051" y="219" width="72" height="24" rx="6" fill="#E3A300"/>
    <rect x="1138" y="219" width="72" height="221" rx="6" fill="#2F7DE1"/>
  </g>
  <path d="M862 248 H877 M949 200 H964 M1036 243 H1051 M1123 219 H1138" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M776 440 H1224" stroke="#fff" stroke-width="3"/>

  <g text-anchor="middle" font-weight="900" fill="#fff">
    <text x="826" y="350" font-size="17">＋800</text>
    <text x="913" y="230" font-size="16">＋200</text>
    <text x="1000" y="228" font-size="16">−180</text>
    <text x="1087" y="210" font-size="16">＋100</text>
    <text x="1174" y="336" font-size="20">920</text>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#fff" font-size="15" opacity="0.9">
    <text x="826" y="464">勤務費用</text>
    <text x="913" y="464">利息費用</text>
    <text x="1000" y="464">期待運用</text>
    <text x="1000" y="484">収益</text>
    <text x="1087" y="464">差異の</text>
    <text x="1087" y="484">処理額</text>
    <text x="1174" y="464">退職給付</text>
    <text x="1174" y="484">費用</text>
  </g>

  <rect x="790" y="508" width="420" height="52" rx="26" fill="#fff" fill-opacity="0.10" stroke="#FFC94A" stroke-width="2"/>
  <text x="1000" y="541" text-anchor="middle" font-size="19" font-weight="900" fill="#fff">年金資産から支払ったら「仕訳なし」</text>

  <text x="1000" y="612" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">連結は全額を退職給付に係る負債に</text>
</svg>
