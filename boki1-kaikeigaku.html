<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簿記1級 会計学トレーナー</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--sub:#667085;--ac:#2f5bd8;--ok:#1c8f4e;--ng:#d03a3a;--bd:#dfe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#141821;--card:#1d2330;--tx:#e8ecf3;--sub:#98a2b3;--ac:#6f95ff;--ok:#4cc27f;--ng:#ff7a7a;--bd:#2d3546}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 4px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer}
.unit{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.unit:last-child{border:0}
.unit label{flex:1}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;width:90px}
.bar i{display:block;height:100%;background:var(--ok)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;width:100%;font-weight:600}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:8px}
.q{font-size:17px;margin:8px 0 16px}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--ac);text-align:center;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 15%,transparent)}
.exp{border-left:4px solid var(--ac);padding:8px 12px;margin:12px 0;font-size:14px}
.exp.why{border-color:var(--ng)}
.exp.more{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.exp.th{border-color:#8a5cf6}
.exp.ex{border-color:#e0a100;background:color-mix(in srgb,#e0a100 8%,transparent)}
.exp.pt{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 6%,transparent)}
details{margin:8px 0;font-size:14px}
summary{cursor:pointer;color:var(--ac);padding:6px 0}
.btn{margin-top:8px}
.tag{font-size:12px;color:var(--sub)}
.res{font-size:28px;font-weight:700;text-align:center}
</style>
</head>

// 詳細解説: Qと同じ順序。[誤答1の理由, 誤答2の理由, 誤答3の理由, 関連論点・覚え方]（誤答の順序はQの誤答配列と対応）
const EX=[
/*0*/["その他の包括利益は、その他有価証券の評価差額などが経由する区分です。売買目的有価証券は短期の売却で利益を得ることが目的なので、値上がり・値下がりをその期の業績として損益計算書に出します。","資本剰余金は株主からの払込みなど資本取引で生じる項目です。時価の変動は資本取引ではないので、ここには入りません。","繰延資産は、支出した費用を将来に繰り延べる資産（創立費・開業費など）で、有価証券の評価とは無関係です。","【比較】売買目的＝時価・損益　満期保有目的＝償却原価　子会社・関連会社株式＝取得原価　その他有価証券＝時価・純資産直入。\n【仕訳】時価が上がったとき：（借）有価証券　×××／（貸）有価証券評価益　×××。損益計算書では営業外損益に表示します。"],
/*1*/["時価評価するのは売買目的有価証券とその他有価証券です。子会社・関連会社株式は事業の支配や影響力を目的として保有し、すぐに売却して現金化する前提がないため、時価変動を評価しません。","償却原価は満期保有目的の債券に用いる評価方法です。株式には満期がないため適用対象外です。","「市場価格の平均値」という評価方法は基準にありません。時価は期末の市場価格に基づく価額です。","【論点】子会社株式等は、時価が著しく下落し回復の見込みがない場合や、実質価額（発行会社の財政状態に基づく価額）が著しく低下した場合に、相当の減額（減損処理）を行い、評価差額は当期の損失とします。市場価格のない株式は取得原価が原則です。"],
/*2*/["当期の損益にするのは売買目的有価証券です。その他有価証券は、売却の意思決定に事業上の制約があるため、時価の変動を業績として扱いません。","損益計算書に出すのは、減損処理を行った場合の評価損（特別損失）などです。通常の評価差額は純資産直入で、損益計算書には出しません。","評価差額は差益でも差損でも純資産の部に入ります。負債の部には表示しません。税効果を認識する場合は、繰延税金資産・負債がそれぞれ資産・負債の部に出ます。","【方法】全部純資産直入法（差益も差損も純資産）と部分純資産直入法（差益は純資産、差損は当期の損失）があります。洗替え方式で、翌期首に元の帳簿価額に戻して処理します。【減損】時価が著しく下落し回復の見込みがなければ、評価差額を当期の損失とします。"],
/*3*/["リスク・経済価値アプローチは、金融資産のリスクと経済価値のほとんどが移転したときに消滅を認識する考え方です。金融商品会計基準は、これより「支配の移転」を重視する財務構成要素アプローチを採用しています。","「資産負債アプローチ」は、収益費用アプローチと対比される利益観・会計観の名称で、金融資産の消滅認識の方法ではありません。","「収益費用アプローチ」も利益観の名称であり、消滅認識の方法ではありません。","【考え方】金融資産を、それぞれの構成要素（キャッシュ・フローを受け取る権利など）に分けて支配の移転を判定し、支配が移転した部分は消滅を認識、残る部分は存続を認識します。消滅の要件は、①法的に保全されている、②譲受人が契約上の権利を直接・間接に通常の方法で享受できる、③譲渡人が買戻す権利・義務を実質的に持たない、の3つです。"],
/*4*/["繰延ヘッジ損益は、資産ではなく純資産（評価・換算差額等）に表示します。ヘッジ手段の評価差額を資産計上すると、資産の実在性がなくなります。","繰延ヘッジ利益を負債とする考え方もありましたが、現行基準では負債としません。ヘッジ手段の損益は返済義務を伴わないためです。","特別損益に計上すると、ヘッジ対象の損益とのタイミングがずれます。それを避けるために繰延べるのが繰延ヘッジの趣旨です。","【趣旨】ヘッジ手段（デリバティブ）とヘッジ対象の損益を同じ期間に認識し、経済的実態を反映します。時価ヘッジ（ヘッジ対象も時価評価して両方を当期損益にする方法）は例外的処理です。【表示】繰延ヘッジ損益として税効果調整後の額を純資産の部に計上します。"],
/*5*/["割引前将来キャッシュ・フロー総額が帳簿価額を上回るなら、投資額を回収できる見込みなので、減損損失は認識しません。","「等しい」場合も帳簿価額を回収できるため、認識の要件（総額が帳簿価額を「下回る」）を満たしません。","「2倍以上」のような数値基準はありません。判定は、割引前の総額が帳簿価額を下回るかどうかだけです。","【減損処理の流れ】①減損の兆候→②減損損失の認識の判定（割引前CF総額と帳簿価額を比較）→③減損損失の測定（回収可能価額まで減額）の3段階です。認識の判定に割引前CF、測定に回収可能価額（割引後の使用価値または正味売却価額）を使う点をセットで覚えます。割引前CFの見積期間は、20年と資産の経済的残存使用年数のいずれか短い方です。"],
/*6*/["取得原価まで減額すると、減損損失を全く認識しないことになります。減額する先は、回収が見込まれる金額（回収可能価額）です。","正味売却価額は回収可能価額を構成する2つのうちの1つです。使用価値のほうが高ければ、そちらが回収可能価額になります。","割引前将来キャッシュ・フローは「認識の判定」に使います。「測定」では、割引後の使用価値を使います。","【回収可能価額】正味売却価額（時価−処分費用見込額）と使用価値（継続使用と使用後の処分で生じる将来CFの現在価値）の高い方です。減損損失は特別損失に計上し、原則として帳簿価額から直接控除します（減損損失累計額を設ける方法も可）。"],
/*7*/["日本基準では戻入れを認めません。減損損失の戻入れを認めると、収益を操作する余地が生じ、また実務上の事務負担も増えるためです。","「一定期間経過後」に戻し入れる規定はありません。","「使用価値が回復した場合」でも戻入れはしません。減損後の帳簿価額を新たな取得原価とみなすため、取得原価基準の枠内で処理します。","【IFRSとの比較】IFRS（IAS 36）は、のれん以外の資産について減損損失の戻入れを認めています。日本基準との違いとして出題されやすい論点です。"],
/*8*/["除去費用は、資産除去債務の負債計上と同時に、その資産の帳簿価額に加算します。一度に費用処理しません。","負債の部で繰り延べるという処理はありません。繰り延べるなら資産側（有形固定資産の帳簿価額）です。","除去費用の総額を特別損失にするのではなく、減価償却を通じて耐用年数にわたって配分します。","【仕訳（取得時）】（借）有形固定資産　×××／（貸）資産除去債務　×××。\n【その後】①資産計上した除去費用は減価償却で各期に配分、②時の経過による資産除去債務の増加は「利息費用相当額」として、資産除去債務の調整額として費用処理（損益計算書は償却費と同じ区分）。将来キャッシュ・フローの見積りが変わったときは、資産・負債を調整します。"],
/*9*/["オプション（購入選択権）は、所有権移転ファイナンス・リースか否かを判断する要素のひとつです。ファイナンス・リースの定義要件ではありません。","所有権移転条項は、ファイナンス・リースを「所有権移転」と「所有権移転外」に区分する基準です。ファイナンス・リースかどうかの要件ではありません。","中途解約金の支払は、解約不能に「準ずる」リースと判定する要件の一つですが、定義（要件）そのものではありません。","【要件】①解約不能（ノンキャンセラブル）　②フルペイアウト（借手が資産の経済的利益を実質的に享受し、使用コストを実質的に負担する）。②の判定は現在価値基準（90%）と経済的耐用年数基準（75%）です。基準を満たしたうえで、所有権移転か否かで処理が変わります。"],
/*10*/["経済的耐用年数を償却年数にするのは、所有権移転ファイナンス・リースです。所有権が移転しないので、リース期間で使い切る扱いです。","税法上の耐用年数は税務の基準で、会計上の償却年数にはなりません。","「解約不能期間の半分」という基準はありません。","【対比】所有権移転：自己所有資産と同じ方法（経済的耐用年数、残存価額あり）。所有権移転外：リース期間定額法（残存価額ゼロ）。\n【借手のリース資産の計上額】リース料総額の現在価値と見積現金購入価額（貸手の購入価額が明らかな場合はその価額）のいずれか低い額です。"],
/*11*/["75%は経済的耐用年数基準（解約不能リース期間が経済的耐用年数のおおむね75%以上）の数値です。現在価値基準は90%です。","80%という基準はありません。","100%は「フルペイアウト」の厳密な意味ですが、判定基準は「おおむね90%」です。","【覚え方】「現在価値90、耐用年数75」。現在価値基準は「見積現金購入価額の90%」、経済的耐用年数基準は「経済的耐用年数の75%」です。どちらか一方でも満たせばファイナンス・リースです。"],
/*12*/["「加重平均」は、割引率を複数の債券の利回りを基礎に決めるときに使うことがあります。しかし、退職給付債務の算定方法は「割引計算」です。","時価評価をするのは年金資産（期末の公正な評価額）です。退職給付債務は将来支払額の現在価値で、時価評価ではありません。","将来価値に換算するのは逆の計算です。将来の支払額を現在の価値に引き直すのが割引計算です。","【算定式】退職給付債務−年金資産＝積立状況。積立状況を示す額を、退職給付に係る負債（負担超過）または退職給付に係る資産（積立超過）として連結貸借対照表に計上します。割引率は、期末における安全性の高い長期の債券（国債・優良社債）の利回りです。"],
/*13*/["法定耐用年数は税法・固定資産の制度で、退職給付の費用処理年数とは関係ありません。","5年など固定の年数は定められていません。基準は「平均残存勤務期間以内の一定の年数」です。","従業員の過去の勤続年数ではなく、これから退職するまでの残りの勤務期間（将来の期間）です。","【対比】数理計算上の差異は発生年度の翌期から、過去勤務費用は発生年度から費用処理するのが原則です（いずれも按分する場合。発生年度に一括して処理する方法も認められます）。連結財務諸表では、未認識の額を発生時にその他の包括利益に計上し、費用処理時に組替調整（リサイクリング）します。個別財務諸表では、未認識項目は貸借対照表に認識しません。"],
/*14*/["未認識項目を反映した積立状況は、退職給付に係る負債（または資産）に直接計上されます。その相手勘定がその他の包括利益累計額です。「負債の減算」ではありません。","特別損益に計上するのは、退職給付制度の終了に伴う損益などです。未認識項目はその他の包括利益を通ります。","利益剰余金に直接計上すると、費用処理の際に組替調整ができません。いったんその他の包括利益累計額に計上し、費用処理時に損益計算書へ振り替えます。","【仕訳（連結）】（借）退職給付に係る調整額（OCI）／（貸）退職給付に係る負債（税効果を調整）。【表示】純資産の部の「その他の包括利益累計額」に、退職給付に係る調整累計額として表示します。"],
/*15*/["取引価格の算定は第3ステップです。契約の識別の次は、契約に含まれる履行義務（財・サービスの約束）を識別します。","取引価格の配分は第4ステップです。","充足時に収益を認識するのは最後（第5）のステップです。","【5ステップ】①契約の識別　②履行義務の識別　③取引価格の算定　④取引価格の履行義務への配分　⑤履行義務の充足時（または充足につれて）収益を認識。\n【覚え方】「契・履・取・配・認」。"],
/*16*/["原価に基づく配分は基準の原則ではありません。独立販売価格は、財・サービスを単独で顧客に販売した場合の価格です。","「市場価格の平均」も基準の用語ではありません。","契約書の価格は、値引きや複数の履行義務のまとめ売りによって独立販売価格から乖離する場合があります。そのため、契約書の金額のままでは配分しません。","【独立販売価格の見積方法】観察できる場合は観察価格を使い、観察できない場合は、調整した市場評価アプローチ、予想コストにマージンを加算するアプローチ、残余アプローチ（限定的）などで見積ります。"],
/*17*/["日数は進捗度の指標ではありません。進捗度はインプット法（発生原価など）またはアウトプット法（完成度など）で測ります。","前受金は入金の額で、履行の度合いとは無関係です。入金額を売上にすると、履行前に収益を計上してしまいます。","請求済みの金額も履行の度合いとは一致しません。請求基準は、実際の履行状況を反映しない場合があります。","【重要】進捗度を合理的に見積もれないが費用回収が見込まれる場合は「原価回収基準」を適用します。契約の初期段階（進捗度を合理的に見積もれない）は、収益を認識しない選択もあります。【期間がごく短い工事契約】完全に履行義務を充足した時点で収益を認識する代替的な取扱いがあります。"],
/*18*/["総額で収益を認識するのは「本人」の場合です。本人は、顧客に提供する前に財・サービスを支配しており、在庫リスクなども負っています。","仕入原価相当額は、代理人が買い取った商品の原価ではありません。代理人は商品を仕入れず、手数料（純額）を収益にします。","「販売代金の50%」のような機械的な基準はありません。","【判定】財・サービスが顧客に提供される前に支配しているか（在庫リスク、価格の裁量権など）で本人か代理人かを判断します。\n【例】百貨店の消化仕入は、代理人として手数料相当の純額で収益を認識する場合があります。"],
/*19*/["契約資産は、履行が済んだが対価を請求する権利が時の経過以外の条件（他の履行など）に依存する場合の資産です。返品に伴う返金の義務とは逆の概念です。","返品に伴う義務は、以前は返品調整引当金でしたが、収益認識会計基準では返金負債に振り替えます。","契約負債は、顧客から対価を受け取っているが履行義務が未履行の場合の負債（前受金に相当）です。返品による返金の義務ではありません。","【仕訳（販売時）】（借）売掛金／（貸）売上（返品見込みを除く額）・返金負債（返品見込みの額）。あわせて、返品見込みの商品の原価は（借）返品資産／（貸）売上原価とします。【表示】返金負債は流動負債で、返品資産は流動資産です。"],
/*20*/["部分時価評価法は、親会社の持分に相当する部分のみ時価評価する方法で、旧基準でありました。現行基準では認められません。","簿価評価にすると、支配獲得時点の子会社の資産・負債の実態が反映されません。","「親会社持分時価評価」は部分時価評価法のことで、現行基準では採用しません。","【理由】現行の連結会計は、親会社説ではなく経済的単一体説に近い考え方をとっており、非支配株主持分も時価評価後の金額を基礎にします。\n【手順】支配獲得日に、子会社の資産・負債を全面時価評価し、評価差額を計上（税効果を認識）→投資と資本の相殺消去→のれんを算出、の順です。"],
/*21*/["5年は会社法上の繰延資産（創立費・開業費など）の償却期間に関する数字です。連結上ののれんとは別のものです。","10年という基準は、のれんにはありません。","40年は米国の旧基準などの数字です。日本基準では20年以内です。","【比較】日本基準：20年以内で規則的に償却　IFRS：償却せず、毎期減損テストを実施。\n【処理】のれんは無形固定資産（貸借対照表）に計上し、償却額は販売費及び一般管理費に表示します。"],
/*22*/["「部分連結」は会計基準上の用語ではなく、持分法の別名でもありません。","比例連結は、共同支配企業の資産・負債・収益・費用のうち持分に応じた金額を取り込む方法です。現行の日本基準では、共同支配企業には持分法が適用されます。","「簡易連結」という会計基準上の用語はありません。","【対比】連結は、子会社の財務諸表項目を全部取り込む「多行連結」です。持分法は、投資の金額と損益を1行（投資有価証券・持分法による投資損益）で修正するので「一行連結」です。【適用】関連会社（議決権20%以上50%以下、または影響力を持つもの）と共同支配企業に持分法を適用します。"],
/*23*/["親会社のみが負担するのは、親会社から子会社に販売した場合（ダウンストリーム）です。逆方向のアップストリームでは、子会社の利益にも非支配株主の持分が含まれます。","非支配株主のみが負担することはありません。未実現利益は、内部取引を行った売り手側の利益から消去します。","負担割合は資本金の比率ではなく、持分比率（実質的な出資比率）です。","【処理】アップストリームでは、未実現利益の全額を消去し、その消去額を親会社と非支配株主に、持分比率で配分します（非支配株主に帰属する当期純利益の減少）。ダウンストリームでは、全額を親会社の持分に負担させます。"],
/*24*/["のれんは、取得原価が識別可能資産・負債の純額（時価）を上回る場合の差額（正の差額）です。今回は、下回る場合の差額です。","資本剰余金は、親会社が支配を継続したまま子会社株式を追加取得・一部売却したときに、非支配株主との取引で生じた差額を計上する科目です。","現行基準では、負ののれんを繰り延べる処理はありません（旧基準では償却していました）。","【手順】負ののれんが生じたときは、識別可能資産及び負債の把握・時価評価が適正かを再検討し、それでもなお生じる差額を、発生年度の特別利益として処理します。表示は損益計算書の特別利益（負ののれん発生益）です。"],
/*25*/["将来加算一時差異は、将来の課税所得を増加させる差異で、繰延税金負債を生じます（例：積立金方式の圧縮記帳）。","永久差異は、交際費の損金不算入や受取配当金の益金不算入のように、将来も解消されない差異です。税効果の対象にはなりません。","「恒久差異」は永久差異と同じ意味で、税効果会計の対象外です。","【まとめ】将来減算一時差異：貸倒引当金・賞与引当金・退職給付引当金などの損金算入限度超過額、減価償却超過額など。→繰延税金資産。\n将来加算一時差異：圧縮積立金、その他有価証券の評価差益など。→繰延税金負債。【仕訳】（借）繰延税金資産　×××／（貸）法人税等調整額　×××。"],
/*26*/["「換金可能性」は、繰延税金資産の判断基準ではありません。判断するのは、将来の課税所得により一時差異等が解消できるか（回収できるか）です。","「支払可能性」は、負債の側の概念で、繰延税金資産の判断基準ではありません。","「償却可能性」という基準もありません。繰延税金資産は償却するのではなく、回収可能性を毎期見直します。","【判断の目安】企業を分類（分類1〜5）し、将来の課税所得の見込み（スケジューリング）に基づいて、回収可能な範囲でのみ繰延税金資産を計上します。回収が見込まれない部分は評価性引当額として控除します。"],
/*27*/["流動・固定の区分は旧基準でした。現在は流動・固定に分類せず、繰延税金資産は「投資その他の資産」、繰延税金負債は「固定負債」に表示します。","「特別の区分」という表示区分はありません。","純資産の部に表示するのは、評価・換算差額等などです。繰延税金資産・負債そのものは、資産・負債の部に表示します。","【表示ルール】同一納税主体の繰延税金資産と繰延税金負債は、相殺して表示します。異なる納税主体（連結上、親会社と子会社など）の場合は、相殺せずに両方を表示します。"],
/*28*/["取得時の税率ではなく、将来、一時差異が解消される時の税率を使います。","一時差異が発生した時の税率は使いません。将来の税額に影響するため、解消時点の税率で測定します。","過去の平均税率は使いません。決算日現在で成立している税法に基づく、将来の期の税率を使います。","【税率の変更】決算日までに税率が変更された法律が成立している場合は、新税率を適用します。税率変更による繰延税金資産・負債の修正差額は、法人税等調整額として処理します（その他有価証券評価差額金などに係るものは、その項目に加減します）。"],
/*29*/["取得時（取引発生時）の為替相場を使うのは、外貨建取引の発生時の換算です。決算時に残っている金銭債権債務は、決算時の相場に換算し直します。","期中平均相場は、在外子会社の収益・費用の換算などに使う場合があります。金銭債権債務の換算には使いません。","前期末の相場を使うことはありません。","【仕訳】売掛金（外貨建）を決算時に換算：（借）売掛金　×××／（貸）為替差益　×××（円安の場合）。為替差損益は営業外損益に表示します（ただし営業取引に係る場合は営業損益に含める処理もあります）。【非貨幣項目】前払金や棚卸資産などは、取得時の為替相場のままです。"],
/*30*/["現金預金は貨幣項目で資産に該当し、決算時の為替相場で換算されます。","売掛金も資産で、決算時の為替相場で換算されます。","繰延税金資産も資産であり、決算時の為替相場で換算されます。","【覚え方】資産・負債＝決算時（CR）、収益・費用＝期中平均（AR）、純資産＝取得時・発生時（HR）。換算すると貸借がずれるので、その差額を為替換算調整勘定として純資産に計上します。親会社の持分に係る部分は評価・換算差額等、非支配株主の持分に係る部分は非支配株主持分に含めます。"],
/*31*/["為替差損益は、外貨建取引や外貨建金銭債権債務の換算で生じ、損益計算書に計上します。在外子会社の財務諸表の換算差額は、純資産の部です。","繰延ヘッジ損益は、繰延ヘッジ処理をしているヘッジ手段の損益や評価差額で、換算差額ではありません。","利益剰余金に直接計上すると、換算差額が利益の一部として扱われてしまいます。換算差額は、その他の包括利益累計額（評価・換算差額等）に計上します。","【処理】為替換算調整勘定は、在外子会社等の株式を売却・清算したときに、損益に振り替えます（組替調整）。【関連】在外子会社の投資の持分に係るヘッジ（純投資のヘッジ）では、ヘッジ手段の損益を為替換算調整勘定として処理する方法もあります。"]
];
// 深掘り解説: Qと同じ順序。[理論的背景（なぜそう決まっているか）, 数値例・仕訳例, 試験でのポイント・ひっかけ]
const EX2=[
/*0*/["売買目的有価証券は、短期間の価格変動により利益を得ることが目的で、いつでも売却・換金できる状態にあります。そのため、時価の変動は投資成果そのものであり、実現した利益と同じように業績として扱うのが合理的とされています。","取得原価800、期末時価850の場合：\n（借）有価証券　50／（貸）有価証券評価益　50\n評価益は損益計算書の営業外収益に表示します。","売買目的有価証券の翌期の処理は、洗替え方式と切放し方式のいずれも認められます。一方、その他有価証券は洗替え方式のみです。混同しないようにしましょう。"],
/*1*/["子会社株式は、その会社を支配して事業を行うための投資です。売却して現金化する前提がなく、時価の変動を損益に反映させると、事業投資の成果を誤って表示することになります。","取得原価1,000、発行会社の財政状態に基づく実質価額が400まで著しく低下した場合：\n（借）関係会社株式評価損　600／（貸）関係会社株式　600\n評価損は特別損失に計上します。","市場価格のある子会社株式でも時価評価はしません。ただし、時価が著しく下落して回復の見込みがないときは減損処理をします。市場価格のない株式では、実質価額が取得原価に比べて50%程度以上低下している場合に減損処理を検討するのが目安です。"],
/*2*/["その他有価証券は、売却する意思決定が事業上の必要性に左右され、直ちに売却するわけではありません。時価情報の有用性は認めつつも、未実現の評価差額を損益にはせず、純資産に直接計上して、実現した時点で損益に反映させます。","取得原価1,000、期末時価1,200、実効税率30%の場合：\n（借）投資有価証券　200／（貸）繰延税金負債　60\n　　　　　　　　　　　　　　　　その他有価証券評価差額金　140\n翌期首に洗替え（逆仕訳）をします。","売却損益は、売却価額から（洗替え後の）取得原価を引いた額です。前期末の時価を基準にはしません。この点は洗替え方式のポイントです。"],
/*3*/["金融資産は、譲渡、証券化、買戻し条件付き取引など、複雑な取引が多くあります。リスク・経済価値アプローチは、全部消滅か存続かの二者択一になりやすく、実態を表しにくいという問題がありました。これを解決するため、構成要素ごとに支配の移転を判定する考え方が採用されました。","債権100を譲渡した場合：\n・消滅の3要件を満たす→債権を消滅させ、譲渡損益（対価−帳簿価額）を計上。\n・一部に遡及義務（買戻しなど）が残る→その部分は存続し、遡及義務の時価を負債として計上します。","論述では、①定義（支配の移転に着目）、②消滅の要件3つ（法的保全・享受・買戻し権利義務の不在）、③リスク・経済価値アプローチとの違い、の順に書けるようにしておきます。"],
/*4*/["【一言でいうと】ヘッジ手段の損益を、ヘッジ対象の損益が出るまで、貸借対照表の純資産の部に一時的に置いておく、という意味です。\n【用語】ヘッジ＝価格変動リスクを逆の値動きをする取引で打ち消すこと。ヘッジ対象＝守りたい取引（来月の輸入代金など）。ヘッジ手段＝守るための取引（為替予約・金利スワップなどのデリバティブ）。繰り延べる＝今期の損益にせず先送りすること。\n【なぜ繰り延べるのか】たとえば、3か月後に外貨で輸入代金を払う予定の商社が、円安リスクを為替予約で打ち消すとします。円安になると、為替予約には評価益+100がすぐ出ますが、輸入代金が増える損失は3か月後にならないと出ません。このままだと、益だけが先に出て、損が後から出ます。実際は打ち消し合って損益ゼロなのに、期間損益がゆがみます。そこで、評価益を今期の損益にせず、繰延ヘッジ損益として純資産の部に置いておき、ヘッジ対象の損益が出る期に損益へ振り替えます。これで益と損が同じ期に出て、打ち消し合います。","為替予約（ヘッジ手段）の評価益100を計上した場合：\n（借）為替予約　100／（貸）繰延ヘッジ損益　100（税効果調整後）\n\n【3か月後、ヘッジ対象の損益が出る期】\n繰延ヘッジ損益を損益に振り替えます。\nヘッジ手段の益+100とヘッジ対象の損△100が同じ期に出て、打ち消し合います。","・原則は「繰延ヘッジ」です。「時価ヘッジ」（対象も時価評価して両方を当期の損益にする）は例外です。\n・表示は「繰延ヘッジ損益」で、税効果調整後の額を純資産の部に計上します。\n・ヘッジ手段の損益を資産や負債にするのではなく、純資産に置く点が問われます。「流動資産の部」「固定負債の部」「特別損益の区分」は誤りです。\n・ヘッジ会計の区別：繰延ヘッジ（原則）、時価ヘッジ（例外）、為替予約の振当処理、金利スワップの特例処理。ヘッジ有効性の評価が要件になります。"],
/*5*/["減損は、時価評価ではなく「投資額の回収が見込めなくなった部分を帳簿価額から切り下げる」処理です。認識の判定に割引前将来キャッシュ・フローを使うのは、投資を回収できるか（回収可能性）を、貨幣の時間価値を考慮せずに客観的に判断し、減損の過大な認識を避けるためです。","帳簿価額1,000の場合：\nA．割引前CF総額900→下回る→認識。使用価値700、正味売却価額650なら回収可能価額は700、減損損失は300。\nB．割引前CF総額1,100→上回る→認識しない（使用価値が600でも損失なし）。","ひっかけの定番は「使用価値が帳簿価額を下回っていれば減損損失を認識する」という誤り。認識の判定は割引前CF総額で行い、使用価値は測定でのみ使います。"],
/*6*/["回収可能価額を「継続使用による価値（使用価値）と売却による価値（正味売却価額）のうち高い方」とするのは、経営者は資産を最も有利な方法で回収すると考えるためです。","使用価値700、正味売却価額650の場合：回収可能価額700。帳簿価額1,000との差額300が減損損失です。\n（借）減損損失　300／（貸）機械装置　300","資産グループで減損損失を認識した場合、各資産への配分は帳簿価額に比例して行うのが原則です。のれんを含む場合の判定単位（より大きな単位）も、あわせて覚えます。"],
/*7*/["日本基準は取得原価主義の枠内で減損を処理します。減損後の帳簿価額を新たな取得原価とみなすので、その後に価値が回復しても取得原価は戻しません。戻入れを認めると、収益の操作（恣意性）や、事務負担の増加、未実現利益の計上という問題も生じます。","減損後の帳簿価額700の資産の使用価値が翌期に1,000へ回復した場合：処理は行わず、翌期以降の減価償却は700を基礎に行います。","論述では「戻入れしない理由」として、①取得原価基準との整合、②実務上の事務負担、③恣意性の排除、の3つを書けるようにします。IFRSは戻入れを認めるため、比較でも問われます。"],
/*8*/["【資産除去債務とは】有形固定資産を取得・使用することで生じる、除去に関する法律上の義務およびこれに準ずるものです（例：賃借建物の原状回復義務、アスベストの除去、原子力発電所の解体）。\n【処理の流れ】\n①負債計上：除去に要する将来キャッシュ・フローの見積額を割り引いた現在価値で、資産除去債務を計上します。\n②資産計上：負債と同額の「除去費用」を、関連する有形固定資産の帳簿価額に加えます（＝この問題の答え）。\n③各期：資産に加えた除去費用は、減価償却を通じて耐用年数にわたって費用配分します。\n④時の経過：割引計算が戻るため、資産除去債務は増加します。この増加額（調整額、利息費用相当額）は、資産に加えず費用として処理します。\n⑤履行時：実際の支出額と債務の帳簿価額との差額（履行差額）を損益とします。\n【なぜ資産に加えるのか】除去費用は、その資産を使うために避けられない支出で、投資額の一部と考えられます。その資産が収益を生む期間にわたって費用配分すれば、費用収益対応にもなります。仮に取得時に費用処理すると、取得した期だけ大きな損失が出て、使用期間の損益がゆがみます。","資産の取得原価10,000、除去費用の見積額1,000、5年後に除去、割引率2%、耐用年数5年（残存価額ゼロ、定額法）の場合：\n\n【取得時】\n（借）有形固定資産　10,000／（貸）現金　10,000\n現在価値＝1,000÷1.02の5乗≒905.7\n（借）有形固定資産　905.7／（貸）資産除去債務　905.7\n\n【毎期の減価償却】\n（10,000＋905.7）÷5年≒2,181.1\n（借）減価償却費　2,181.1／（貸）減価償却累計額　2,181.1\n\n【1年目の時の経過による増加（調整額）】\n905.7×2%≒18.1\n（借）利息費用（調整額）　18.1／（貸）資産除去債務　18.1\n（債務は5年かけて増え、5年後にほぼ1,000になります。）\n\n【除去時】実際の支出が1,050だった場合：\n（借）資産除去債務　1,000／（借）履行差額（損失）　50／（貸）現金　1,050","・答えは「関連する有形固定資産の帳簿価額に加える」。誤りの選択肢の「発生時の費用として処理する」「特別損失に計上する」は、取得時に一度に費用にする処理で、基準では行いません。\n・債務を「負債の部で繰り延べる」という処理はありません。繰り延べるのは資産側（有形固定資産の帳簿価額）です。\n・時の経過による調整額（利息費用相当額）は、資産に加えず費用です。この違いを問う選択肢に注意します。\n・割引率は、貨幣の時間価値を反映した、リスクフリーの税引前の利率です。\n・見積りの変更で将来CFが増加する場合は変更時点の割引率、減少する場合は負債計上時の割引率を使い、資産の帳簿価額も同額を調整します。"],
/*9*/["ファイナンス・リースは、形式上は賃貸借でも、経済的実態は「借手が資産を購入し、その資金を貸手から借り入れた」取引と同じです。そのため、実態を重視して売買取引に準じた処理（オンバランス）をします。","（借手・リース開始時）\n（借）リース資産　×××／（貸）リース債務　×××","現行の基準では、オペレーティング・リースは賃貸借処理（オフバランス）です。新リース会計基準では、借手は原則としてすべてのリースをオンバランス化します（2027年4月1日以後開始する事業年度から適用）。受験年度の出題範囲は必ず確認してください。"],
/*10*/["所有権移転外ファイナンス・リースは、リース期間終了時に資産を返還するので、借手は資産を使い切る（残存価額ゼロ）と考え、リース期間で償却します。","リース資産900,000、リース期間5年、経済的耐用年数8年の場合：\n所有権移転外→900,000÷5年＝年180,000\n参考（所有権移転で残存価額10%）→900,000×0.9÷8年＝101,250","所有権移転か否かで「耐用年数」と「残存価額」の両方が変わります。この対比は頻出です。"],
/*11*/["ファイナンス・リースかどうかは、リース期間中に借手が経済的利益をほぼ享受しているか（フルペイアウト）で判定します。その定量的な目安が現在価値基準（90%）と経済的耐用年数基準（75%）です。","見積現金購入価額1,000、リース料総額の現在価値920→92%（90%以上）→ファイナンス・リース。\nまたは解約不能リース期間8年、経済的耐用年数10年→80%（75%以上）→ファイナンス・リース。","どちらか一方を満たせばよい点が重要です。「おおむね」は、90%や75%を目安に判定してよいという意味で、実務では機械的に数値基準を使います。"],
/*12*/["退職給付は、従業員が働いた期間に対応して発生する「後払いの賃金」とみなされます。将来の支払額をそのまま負債にせず、現在価値に割り引くことで、決算日時点の債務の実態を示します。","退職給付見込額（期末までに発生した分）10,000,000円、10年後に支払、割引率2%の場合：\n10,000,000÷1.02の10乗≒8,203,000円","割引率が低下すると退職給付債務は増加します。費用の内訳は、勤務費用（当期の労働に対応）、利息費用（期首債務×割引率）、期待運用収益（期首年金資産×期待運用収益率）です。"],
/*13*/["数理計算上の差異は、予測と実績のずれや前提条件の変更で生じます。将来の期間にも影響する性質があるため、発生時に一度に費用処理せず、平均残存勤務期間内で規則的に配分（遅延認識）して、損益の変動をならします。","数理計算上の差異（不利）300、平均残存勤務期間10年の場合：\n毎期30ずつ費用処理します（発生の翌期から）。","連結では、まずその他の包括利益で即時に認識し、費用処理のときに損益に振り替えます（組替調整）。個別では未認識のままです。この違いを整理しておきます。"],
/*14*/["未認識項目を貸借対照表に反映しないと、実際の積立不足が財務諸表から見えなくなります。積立状況（退職給付債務−年金資産）をそのまま示すことで、財務情報の有用性が高まります。国際的な基準との整合性も理由です。","未認識数理計算上の差異（不利）300、税率30%の場合：\n（借）退職給付に係る調整額（OCI）　210\n（借）繰延税金資産　90／（貸）退職給付に係る負債　300","個別財務諸表では未認識項目を貸借対照表に計上しません（退職給付引当金）。連結財務諸表では計上します（退職給付に係る負債・調整累計額）。この対比で出題されます。"],
/*15*/["従来は「実現主義（実現・稼得）」で業種ごとの実務に頼っていましたが、国際的な基準（IFRS 15）にそろえ、顧客への財・サービスの支配の移転を基準に、統一した5ステップで収益を認識する枠組みになりました。","携帯電話端末と通信サービスをセットで契約する場合：\n端末と通信は別個の履行義務なので、履行義務は2つに識別します。","履行義務の識別では、財・サービスが「別個のものか」を判断します。別個のものであれば、別々の履行義務として、それぞれ収益認識の時期を判断します。"],
/*16*/["契約書上の価格をそのまま使うと、値引きの配分などで実態と異なる収益になることがあります。そのため、各履行義務を独立して販売した場合の価格（独立販売価格）を基礎に配分することで、履行義務ごとの価値を正しく反映します。","契約100、端末の独立販売価格80、通信サービスの独立販売価格40の場合：\n端末＝100×80/(80+40)≒66.7、通信＝100×40/(80+40)≒33.3","値引きは、原則として、すべての履行義務に比例して配分します。特定の履行義務にだけ値引きが帰属する場合の例外もあります。"],
/*17*/["顧客が財・サービスの便益を受けるのと同時に支配が移転していく場合（工事など）は、履行の程度（進捗度）に応じて収益を認識するのが、実態に合います。要件は、①顧客が同時に便益を享受、②顧客の資産を創出・増価させる、③別の用途に転用できず、履行済み部分の対価を受け取る強制力のある権利がある、のいずれかです。","収益総額1,000、見積総原価800の工事の場合：\n当期：発生原価200→進捗度25%→売上250\n次期：累積発生原価480→進捗度60%→累積売上600→当期売上＝600−250＝350","原価比例法（インプット法）が代表的です。進捗度を合理的に見積もれない場合は原価回収基準、ごく短期の工事は完全に履行義務を充足した時点で収益を認識する扱いもあります。"],
/*18*/["収益として総額を表示するか、手数料だけの純額を表示するかは、企業が「財・サービスを支配して提供しているか」、それとも「他社の提供を手配しているだけか」で決まります。","顧客から1,000を受け取り、仕入先へ900を支払う（代理人）の場合：収益は差額の100です。\n本人の場合：売上1,000、売上原価900（売上総利益は同じ100）。","本人か代理人かで、売上高の金額が変わります（売上総利益は変わりません）。判定要素は、在庫リスク、価格決定の裁量、履行の主たる責任などです。"],
/*19*/["返品されると見込まれる部分は、顧客に財の支配が確定的に移転していないと考えられます。そのため、その分の収益は認識せず、返金する義務を返金負債として計上します。","売価1,000、原価600、返品率10%の見込みの場合：\n（借）売掛金　1,000／（貸）売上　900、返金負債　100\n（借）売上原価　540、返品資産　60／（貸）商品　600","返品率の見積りは、各期末に見直します。収益認識基準の導入により、従来の返品調整引当金の処理は廃止されました。"],
/*20*/["連結財務諸表は、企業集団を1つの経済的実体としてみるため、子会社の資産・負債を支配獲得時にすべて時価評価し直します。親会社の持分だけでなく、非支配株主持分に対応する部分も評価するのが全面時価評価法です。","子会社の土地：簿価500、時価800、税率30%の場合：\n（借）土地　300／（貸）繰延税金負債　90、評価差額　210\n評価差額は子会社の資本として、投資と相殺消去します。","部分時価評価法は、2013年の基準改正までは認められていましたが、現行では認められません。旧基準との違いとして問われることがあります。"],
/*21*/["のれんは、企業が持つ超過収益力（ブランド・人材・技術など）に対する対価です。その効果は時間とともに減少するので、投資額の回収にあわせ、効果の及ぶ期間にわたって費用配分（償却）します。","投資1,000、子会社の純資産（時価）に対する持分700の場合：\nのれん＝300、20年定額なら年15を償却。\n（借）のれん償却額　15／（貸）のれん　15","のれん償却額は連結損益計算書の販売費及び一般管理費に表示します。IFRSと比べて「償却する・しない」が違う点も、問われます。"],
/*22*/["関連会社には支配がないため、その資産・負債を連結財務諸表にすべて取り込むのは適切ではありません。しかし、投資の成果は投資会社の業績に反映すべきなので、投資額を持分の増減にあわせて修正します。","投資500（持分30%）、関連会社の当期純利益200の場合：\n（借）関連会社株式　60／（貸）持分法による投資利益　60\n配当100を受け取った場合（持分30%）：\n（借）受取配当金　30／（貸）関連会社株式　30","持分法でも、投資差額（のれん相当額）の償却や、未実現利益の消去は行います。未実現利益の消去は持分比率に応じた部分が対象です。"],
/*23*/["内部取引による未実現利益は、企業集団の外部に売れるまでは実現していません。子会社が売り手の場合、その利益の一部は非支配株主の持分に帰属しているため、消去額を持分比率で配分し、非支配株主にも負担させます。","子会社（親会社持分70%）が親会社へ販売、未実現利益100の場合：\n（借）売上原価　100／（貸）商品　100\n（借）非支配株主持分　30／（貸）非支配株主に帰属する当期純利益　30","ダウンストリーム（親→子）は、全額を親会社に負担させます。アップストリーム（子→親）は、持分比率に応じて負担させます。この対比は頻出です。"],
/*24*/["割安で取得した（バーゲン・パーチェス）場合の差額は、経済実態としては取得時に得た利益と考えられます。ただし、資産・負債の時価評価に誤りがないかを見直したうえで、なお残る差額に限って利益として処理します。","取得原価600、識別可能純資産（時価）の持分700の場合：\n負ののれん＝100\n（借）子会社の純資産　700／（貸）子会社株式　600、負ののれん発生益　100","のれん（正の差額）と負ののれん（負の差額）の処理の対比が問われます。のれんは償却、負ののれんは発生時に特別利益です。"],
/*25*/["会計上の利益と課税所得の間には、費用・収益の認識時期の違い（一時差異）があります。税効果会計は、こうした差異を調整して、税引前当期純利益に対応する法人税等の負担を期間に配分し、期間損益計算を適正にするための仕組みです。","貸倒引当金繰入100（損金不算入）、実効税率30%の場合：\n（借）繰延税金資産　30／（貸）法人税等調整額　30\n将来、貸倒れが生じて損金算入されると、繰延税金資産は取り崩されます。","将来減算一時差異→繰延税金資産、将来加算一時差異→繰延税金負債です。永久差異（交際費の損金不算入など）は対象外という点も、セットで確認します。"],
/*26*/["繰延税金資産は、将来の税金負担を減らす効果があるから資産といえます。将来に十分な課税所得がなければ効果が生まれないため、回収の見込みが立たない部分は資産として計上できません。","将来減算一時差異100（税率30%）、将来の課税所得の見込みが60の場合：\n回収可能な繰延税金資産＝60×30%＝18\n残りの12は評価性引当額として控除します。","回収可能性の判断は、企業の収益力等に応じた5つの分類（分類1〜5）で行います。分類ごとに、将来減算一時差異の回収の見込める範囲が決まります。"],
/*27*/["繰延税金資産・負債は、税金の前払・後払いという性格で、その回収・支払時期を流動・固定で分類する意味が薄いため、流動・固定の区分を廃止しました（2018年の改正）。","同一納税主体で、繰延税金資産500、繰延税金負債200の場合：\n相殺して繰延税金資産300（投資その他の資産）として表示。","連結財務諸表では、納税主体ごとに相殺します。親会社と子会社は別の納税主体なので、相殺せずに両方を表示することがあります。"],
/*28*/["繰延税金資産・負債は、将来の税金の増減効果を表すものです。そのため、一時差異が実際に解消される期の税率で測定するのが、将来の税額に最も近いといえます。ただし将来の税率の予測は難しいため、決算日現在で成立している税法に基づいた税率を使います。","将来減算一時差異1,000、現行税率30%、来期から28%に改正する法律が成立した場合：\n繰延税金資産＝1,000×28%＝280\n（税率変更の差額20は、法人税等調整額で調整します。）","解消される年度ごとに税率が異なる場合は、各年度の税率を使います。税率変更の影響は、法人税等調整額に計上する点もよく出題されます。"],
/*29*/["外貨建金銭債権債務は、将来の決済によって円貨でいくら受け取る（支払う）かが問題です。したがって、決算日の為替相場で測定し直し、その差額は実現の可能性が高いので、当期の損益とします。","売掛金US$1,000、発生時100円/$、決算時110円/$の場合：\n売掛金110,000円に換算し直し、差額10,000円を計上。\n（借）売掛金　10,000／（貸）為替差益　10,000","貨幣項目（金銭債権債務）は決算時レート、非貨幣項目（前払金・棚卸資産など）は取得時レートで、換算し直しません。この違いを区別します。"],
/*30*/["在外子会社の財務諸表は、親会社の報告通貨に換算する必要があります。項目ごとに適用するレートが異なるので、貸借がずれ、その差額を為替換算調整勘定として純資産に計上します。","資産US$1,000（決算時110円）＝110,000、負債US$400＝44,000、資本金US$600（発生時100円）＝60,000の場合：\n差額＝110,000−44,000−60,000＝6,000（貸方）→為替換算調整勘定6,000","レートの適用は、資産・負債＝決算時、収益・費用＝期中平均（決算時も可）、純資産＝取得時・発生時、と整理します。"],
/*31*/["在外子会社への純投資の為替変動は、未実現の変動であり、当期の損益に反映させるべきではありません。純資産で保持し、株式を売却・清算して実現した時点で損益に反映させます。","前問の換算差額6,000（親会社持分70%）の場合：\n為替換算調整勘定4,200、非支配株主持分に含まれる部分1,800","在外子会社株式を売却・清算したときは、為替換算調整勘定を損益に振り替えます（組替調整）。売却損益に含めて表示します。"]
];
const UNITS=[...new Set(Q.map(q=>q[0]))];
const DAY=86400000,INTERVAL=[0,1,3,7,14,30];
let S;
try{S=JSON.parse(localStorage.getItem("boki1kk")||"{}")}catch(e){S={}}
const save=()=>{try{localStorage.setItem("boki1kk",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const st=i=>S[i]||(S[i]={box:0,due:0,ok:0,ng:0,last:null});
let sel=new Set(UNITS),session=[],idx=0,score=0,mode="all";

function home(){
  const due=Q.map((_,i)=>i).filter(i=>S[i]&&S[i].due<=Date.now()&&S[i].ng>0&&S[i].box<3).length;
  let h=`<h1>簿記1級 会計学トレーナー</h1><div class="sub">穴埋め式・間隔反復で会計基準を定着</div>
  <div class="card"><b>単元を選ぶ</b>`;
  UNITS.forEach((u,k)=>{
    const ids=Q.map((q,i)=>q[0]===u?i:-1).filter(i=>i>=0);
    const mastered=ids.filter(i=>S[i]&&S[i].box>=3).length;
    const tried=ids.reduce((a,i)=>a+(S[i]?S[i].ok+S[i].ng:0),0),okc=ids.reduce((a,i)=>a+(S[i]?S[i].ok:0),0);
    h+=`<div class="unit"><input type="checkbox" id="u${k}" ${sel.has(u)?"checked":""} onchange="tog('${u}',this.checked)">
    <label for="u${k}">${u}<div class="tag">${ids.length}問 ・ 定着${mastered} ・ 正答率${tried?Math.round(okc/tried*100)+"%":"—"}</div></label>
    <div class="bar"><i style="width:${mastered/ids.length*100}%"></i></div></div>`;
  });
  h+=`</div><div class="row"><button class="btn" onclick="start('all')">出題開始</button>
  <button class="btn sec" onclick="start('review')">復習（${due}）</button></div>
  <div class="card sub" style="font-size:12px">※問題文は学習補助用です。要件・数値は必ず市販テキストや会計基準原文で確認してください。<br>
  <a href="#" onclick="if(confirm('学習記録をすべて消します')){S={};save();home()}return false">記録をリセット</a></div>`;
  $("#app").innerHTML=h;
}
function tog(u,c){c?sel.add(u):sel.delete(u)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(m){
  mode=m;
  let ids=Q.map((_,i)=>i).filter(i=>sel.has(Q[i][0]));
  if(m==="review")ids=ids.filter(i=>S[i]&&S[i].ng>0&&S[i].box<3&&S[i].due<=Date.now());
  else ids=ids.filter(i=>!S[i]||S[i].due<=Date.now()||S[i].box<3);
  if(!ids.length){alert(m==="review"?"復習すべき問題はありません":"出題できる問題がありません（単元を選ぶか、復習期日をお待ちください）");return}
  session=shuffle(ids).slice(0,10);idx=0;score=0;show();
}
function show(){
  if(idx>=session.length)return finish();
  const i=session[idx],q=Q[i],opts=shuffle([q[2],...q[3]]);
  const stem=esc(q[1]).replace("【　】",'<span class="blank">　　　</span>');
  $("#app").innerHTML=`<div class="tag">${idx+1} / ${session.length}　${q[0]}</div>
  <div class="card"><div class="q">${stem}</div><div id="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div><div id="fb"></div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(i,b));
}
const nl=s=>esc(s).replace(/\n/g,"<br>");
function answer(i,btn){
  const q=Q[i],ex=EX[i],ok=btn.dataset.v===q[2],s=st(i);
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.v===q[2])b.classList.add("ok")});
  if(!ok)btn.classList.add("ng");
  if(ok){s.ok++;s.box=Math.min(s.box+1,5);score++}else{s.ng++;s.box=0}
  s.due=Date.now()+INTERVAL[s.box]*DAY;s.last=Date.now();save();
  const why=k=>ex?`<div class="exp why"><b>「${esc(q[3][k])}」が違う理由</b><br>${nl(ex[k])}</div>`:"";
  const e2=EX2[i];
  const deep=e2?`<div class="exp th"><b>なぜそうなるのか（理論的背景）</b><br>${nl(e2[0])}</div>
    ${e2[1]?`<div class="exp ex"><b>数値例・仕訳例</b><br>${nl(e2[1])}</div>`:""}
    <div class="exp pt"><b>試験でのポイント・ひっかけ</b><br>${nl(e2[2])}</div>`:"";
  const more=ex?`<div class="exp more"><b>関連論点・覚え方</b><br>${nl(ex[3])}</div>`:"";
  let h=`<div class="exp"><b style="color:var(--${ok?"ok":"ng"})">${ok?"正解":"不正解"}</b>　答え：${esc(q[2])}<br>${esc(q[4])}</div>`;
  if(!ok){
    const k=q[3].indexOf(btn.dataset.v);
    h+=why(k)+deep+more;
    if(ex)h+=`<details><summary>他の選択肢が違う理由</summary>${[0,1,2].filter(x=>x!==k).map(why).join("")}</details>`;
  }else if(ex){
    h+=`<details><summary>詳しい解説を見る</summary>${deep}${more}${[0,1,2].map(why).join("")}</details>`;
  }
  $("#fb").innerHTML=h+`<button class="btn" onclick="idx++;show()">${idx+1<session.length?"次へ":"結果を見る"}</button>`;
}
function finish(){
  $("#app").innerHTML=`<div class="card"><div class="res">${score} / ${session.length}</div>
  <p style="text-align:center">${score===session.length?"全問正解です":"間違えた問題は「復習」で再挑戦できます"}</p>
  <div class="row"><button class="btn" onclick="start(mode)">もう一度</button><button class="btn sec" onclick="home()">ホームへ</button></div></div>`;
}
home();
</script>
</body>
</html>
