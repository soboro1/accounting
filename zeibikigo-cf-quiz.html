<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設備投資の税引後キャッシュフロー ランダム問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #101b2d;
    color: #f6f1e6;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .kicker { font-size: 13px; letter-spacing: 3px; color: #d4a24c; font-weight: 700; }
  h1 { font-size: 26px; font-weight: 700; margin: 4px 0 0 0; }
  .score-label { font-size: 13px; color: #9aa5b1; text-align: right; }
  .score-value { font-size: 22px; font-weight: 700; color: #d4a24c; text-align: right; }

  .topic-badge {
    display: inline-flex; align-self: flex-start;
    padding: 6px 16px; border-radius: 999px;
    background: rgba(212,162,76,0.18); border: 1px solid #d4a24c;
    font-size: 13px; font-weight: 700; color: #d4a24c; letter-spacing: 1px;
  }

  .problem-card {
    padding: 20px 24px; border: 1px solid rgba(212,162,76,0.35); border-radius: 12px;
    background: rgba(255,255,255,0.03); display: flex; flex-direction: column; gap: 6px;
  }
  .problem-line { font-size: 16px; line-height: 1.9; color: #e8e3d8; }
  .problem-line b { color: #f6f1e6; }

  .inputs-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .input-group { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 14px; color: #c7c0b0; }
  .input-group input {
    padding: 10px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid rgba(212,162,76,0.4); background: #0e1726; color: #f6f1e6; font-family: inherit;
  }
  .input-group input::placeholder { color: #6b7688; }
  .input-group input:focus { outline: none; border-color: #d4a24c; }

  .hint { font-size: 12px; color: #8b93a1; }
  .error { font-size: 13px; color: #f0997b; display: none; }

  .buttons-row { display: flex; gap: 12px; flex-wrap: wrap; }
  button { font-family: inherit; cursor: pointer; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 700; border: none; }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.95); }
  .btn-primary { color: #101b2d; background: #d4a24c; }
  .btn-secondary { color: #d4a24c; background: transparent; border: 1px solid #d4a24c; }

  .result-card { padding: 18px 22px; border-radius: 12px; border: 2px solid; display: none; flex-direction: column; gap: 8px; }
  .result-card.show { display: flex; }
  .result-title { font-size: 17px; font-weight: 700; }
  .result-explanation { font-size: 14px; line-height: 1.8; color: #e8e3d8; white-space: pre-line; }

  .footer-note { font-size: 12px; color: #6b7688; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">

  <div class="header-row">
    <div>
      <div class="kicker">BOOKKEEPING LV.1 工業簿記 ⑯ 税引後キャッシュフロー</div>
      <h1>税引後キャッシュフロー ランダム問題</h1>
    </div>
    <div>
      <div class="score-label">スコア</div>
      <div class="score-value"><span id="score">0</span> / <span id="total">0</span></div>
    </div>
  </div>

  <div class="topic-badge" id="topicBadge"></div>

  <div class="problem-card" id="problemCard"></div>

  <div class="inputs-row">
    <div class="input-group">
      <label id="label1"></label>
      <input type="text" id="input1" autocomplete="off">
    </div>
    <div class="input-group">
      <label id="label2"></label>
      <input type="text" id="input2" autocomplete="off">
    </div>
  </div>
  <div class="hint">半角数字、カンマなしで入力(単位は千円)。マイナスは先頭に「-」を付けてください。</div>
  <div class="error" id="errorText"></div>

  <div class="buttons-row">
    <button class="btn-primary" id="checkBtn">解答する</button>
    <button class="btn-secondary" id="nextBtn">次の問題へ</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-explanation" id="resultExplanation"></div>
  </div>

  <div class="footer-note">簿記1級 設備投資の税引後キャッシュフローの練習用アプリ(自己採点)</div>

</div>

<script>
(function () {
  var state = { problem: null, score: 0, total: 0 };

  function randMultiple(min, max, step) {
    var n = Math.floor(Math.random() * ((max - min) / step + 1));
    return min + n * step;
  }
  function randNonZero(min, max, step) {
    var v = 0;
    while (v === 0) { v = randMultiple(min, max, step); }
    return v;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fmt(n) {
    var s = Math.abs(Math.round(n)).toLocaleString('ja-JP');
    return (n < 0 ? '−' : '') + s;
  }
  function fmt1(n) {
    var s = Math.abs(n).toFixed(1);
    return (n < 0 ? '−' : '') + s;
  }
  function fmt3(n) {
    return n.toFixed(3);
  }
  function fav(n) { return n > 0 ? '有利(採用)' : (n < 0 ? '不利(不採用)' : '±0'); }

  // 現価係数(1年分) = 1 / (1+r)^t, 3桁に丸める(実際の現価係数表と同じ丸め方)
  function pvFactor(r, t) {
    return Math.round((1 / Math.pow(1 + r, t)) * 1000) / 1000;
  }
  // 年金現価係数 = (1-(1+r)^-n)/r を3桁に丸める(実際の年金現価係数表と同じ丸め方)
  function annuityFactor(r, n) {
    return Math.round(((1 - Math.pow(1 + r, -n)) / r) * 1000) / 1000;
  }

  var RATES = [0.06, 0.08, 0.10, 0.12];
  var TAXES = [30, 40];
  function sg(n) { return (n > 0 ? '+' : (n < 0 ? '△' : '')) + fmt(Math.abs(n)); }

  // 年々の税引後CFの内訳(説明用)
  function annualExplain(inc, out, dep, t) {
    var pre = inc - out;
    var after = Math.round(pre * (100 - t) / 100);
    var shield = Math.round(dep * t / 100);
    var profit = pre - dep;
    var tax = Math.round(profit * t / 100);
    return '税引前CF = ' + fmt(inc) + ' − ' + fmt(out) + ' = ' + fmt(pre) + '\n' +
      '【方法1】' + fmt(pre) + ' × (1 − ' + t + '%) + 減価償却費 ' + fmt(dep) + ' × ' + t + '% = ' + fmt(after) + ' + ' + fmt(shield) + ' = ' + fmt(after + shield) + '\n' +
      '【方法2】税引前利益 = ' + fmt(pre) + ' − ' + fmt(dep) + ' = ' + sg(profit) + '、法人税 = ' + sg(tax) + '\n' +
      '　税引後利益 ' + sg(profit - tax) + ' + 減価償却費 ' + fmt(dep) + ' = ' + fmt(profit - tax + dep) + '(方法1と一致)\n' +
      '節税効果(タックス・シールド) = ' + fmt(dep) + ' × ' + t + '% = ' + fmt(shield);
  }

  // ① 年々の税引後キャッシュフロー
  function genAnnual() {
    var t = pick(TAXES);
    var life = randMultiple(3, 8, 1);
    var cost = randMultiple(2, 20, 1) * 1000 * life;
    var dep = cost / life;
    var out = randMultiple(5, 40, 1) * 1000;
    var inc = out + randMultiple(1, 30, 1) * 1000;
    var cf = Math.round((inc - out) * (100 - t) / 100) + Math.round(dep * t / 100);
    return {
      badge: '年々の税引後キャッシュフロー(タックス・シールド)',
      check: Number.isInteger(cf),
      lines: [
        '設備(取得原価<b>' + fmt(cost) + '千円</b>、耐用年数<b>' + life + '年</b>、残存価額0、定額法)に投資する。',
        '毎年の現金収入は<b>' + fmt(inc) + '千円</b>、現金支出は<b>' + fmt(out) + '千円</b>、法人税率は<b>' + t + '%</b>である。'
      ],
      label1: '減価償却費による節税効果(千円)',
      label2: '年々の税引後キャッシュフロー(千円)',
      ph1: '例: 3000', ph2: '例: 17000',
      answers: [Math.round(dep * t / 100), cf],
      tol: [0, 0],
      explanation: '減価償却費 = ' + fmt(cost) + ' ÷ ' + life + ' = ' + fmt(dep) + '\n' + annualExplain(inc, out, dep, t)
    };
  }

  // ② 売却キャッシュフロー
  function genSale() {
    var t = pick(TAXES);
    var life = randMultiple(4, 8, 1);
    var cost = randMultiple(2, 20, 1) * 1000 * life;
    var dep = cost / life;
    var used = randMultiple(1, life, 1);
    var book = cost - dep * used;
    var price = Math.max(0, book + randMultiple(-6, 6, 1) * 500);
    if (price === book) price = book + 1000;
    var gain = price - book;
    var cf = price - Math.round(gain * t / 100);
    return {
      badge: '売却キャッシュフロー(売却益の課税・売却損の節税)',
      check: Number.isInteger(cf),
      lines: [
        '設備(取得原価<b>' + fmt(cost) + '千円</b>、耐用年数<b>' + life + '年</b>、残存価額0、定額法)を<b>' + used + '年</b>使用した時点で、<b>' + fmt(price) + '千円</b>で売却する。',
        '法人税率は<b>' + t + '%</b>である。'
      ],
      label1: '売却損益(益は+、損は−、千円)',
      label2: '売却キャッシュフロー(千円)',
      ph1: '例: 2000 / -1000', ph2: '例: 1400 / 2300',
      answers: [gain, cf],
      tol: [0, 0],
      explanation:
        '帳簿価額 = ' + fmt(cost) + ' − ' + fmt(dep) + ' × ' + used + ' = ' + fmt(book) + '\n' +
        '売却損益 = ' + fmt(price) + ' − ' + fmt(book) + ' = ' + sg(gain) + '\n' +
        (gain > 0 ? '売却益に課税:' + fmt(gain) + ' × ' + t + '% = ' + fmt(Math.round(gain * t / 100)) + 'を差し引く\n'
                  : '売却損で節税:' + fmt(-gain) + ' × ' + t + '% = ' + fmt(Math.round(-gain * t / 100)) + 'を加える\n') +
        '売却CF = ' + fmt(price) + (gain > 0 ? ' − ' : ' + ') + fmt(Math.abs(Math.round(gain * t / 100))) + ' = ' + fmt(cf)
    };
  }

  // ③ NPV(税引後CF+売却CF)
  function genNPV() {
    for (var k = 0; k < 20000; k++) {
      var t = pick(TAXES);
      var r = pick(RATES);
      var life = randMultiple(3, 5, 1);
      var cost = randMultiple(4, 20, 1) * 1000 * life;
      var dep = cost / life;
      var out = randMultiple(5, 40, 1) * 1000;
      var inc = out + randMultiple(1, 30, 1) * 1000;
      var cf = Math.round((inc - out) * (100 - t) / 100) + Math.round(dep * t / 100);
      if (cf % 1000 !== 0) continue;
      var unit = (t === 30 ? 10000 : 5000);
      var maxK = Math.floor(cost * 0.3 / unit);
      if (maxK < 1) continue;
      var price = randMultiple(1, maxK, 1) * unit;
      var scf = price - Math.round(price * t / 100);
      if (scf % 1000 !== 0) continue;
      var af = annuityFactor(r, life), pf = pvFactor(r, life);
      var pv1 = Math.round(cf * af), pv2 = Math.round(scf * pf);
      var npv = pv1 + pv2 - cost;
      if (npv === 0) continue;
      return {
        badge: 'NPV(税引後キャッシュフロー+売却キャッシュフロー)',
        check: Number.isInteger(npv),
        lines: [
          '設備(取得原価<b>' + fmt(cost) + '千円</b>、耐用年数<b>' + life + '年</b>、残存価額0、定額法)に投資する。毎年の現金収入は<b>' + fmt(inc) + '千円</b>、現金支出は<b>' + fmt(out) + '千円</b>である。',
          life + '年目の終わりに設備を<b>' + fmt(price) + '千円</b>で売却する。法人税率は<b>' + t + '%</b>、資本コストは<b>' + (r * 100) + '%</b>である。',
          '割引率' + (r * 100) + '%・' + life + '年の年金現価係数は<b>' + af.toFixed(3) + '</b>、' + life + '年目の現価係数は<b>' + pf.toFixed(3) + '</b>とする。'
        ],
        label1: '年々の税引後キャッシュフロー(千円)',
        label2: 'NPV(千円、マイナスは−)',
        ph1: '例: 17000', ph2: '例: 17536 / -2411',
        answers: [cf, npv],
        tol: [0, 0],
        explanation:
          '減価償却費 = ' + fmt(cost) + ' ÷ ' + life + ' = ' + fmt(dep) + '\n' + annualExplain(inc, out, dep, t) + '\n' +
          '売却CF = ' + fmt(price) + ' − (' + fmt(price) + ' − 帳簿価額0) × ' + t + '% = ' + fmt(scf) + '\n' +
          '年々のCFの現在価値 = ' + fmt(cf) + ' × ' + af.toFixed(3) + ' = ' + fmt(pv1) + '\n' +
          '売却CFの現在価値 = ' + fmt(scf) + ' × ' + pf.toFixed(3) + ' = ' + fmt(pv2) + '\n' +
          'NPV = ' + fmt(pv1) + ' + ' + fmt(pv2) + ' − ' + fmt(cost) + ' = ' + sg(npv) + '\n' +
          '判定:NPVが' + (npv > 0 ? 'プラスなので投資すべき' : 'マイナスなので投資すべきでない')
      };
    }
  }

  function generateProblem() {
    var y = Math.random();
    if (y < 0.35) return genAnnual();
    if (y < 0.6) return genSale();
    return genNPV();
  }

  function renderProblem() {
    var p = state.problem;
    document.getElementById('topicBadge').textContent = '【 ' + p.badge + ' 】';
    document.getElementById('problemCard').innerHTML = p.lines.map(function (l) {
      return '<div class="problem-line">' + l + '</div>';
    }).join('');
    document.getElementById('label1').textContent = p.label1;
    document.getElementById('label2').textContent = p.label2;
    var i1 = document.getElementById('input1');
    var i2 = document.getElementById('input2');
    i1.placeholder = p.ph1;
    i2.placeholder = p.ph2;
    i1.value = '';
    i2.value = '';
    document.getElementById('errorText').style.display = 'none';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;
  }

  function parseSigned(s) {
    if (s === undefined || s === null) return NaN;
    var t = String(s).trim().replace(/,/g, '').replace(/円/g, '').replace(/%/g, '').replace(/[−▲△]/g, '-');
    if (t === '' || t === '-' || t === '+') return NaN;
    return Number(t);
  }

  function isClose(a, b, tol) {
    return Math.abs(a - b) <= tol + 1e-9;
  }

  function handleCheck() {
    var u1 = parseSigned(document.getElementById('input1').value);
    var u2 = parseSigned(document.getElementById('input2').value);
    var errEl = document.getElementById('errorText');
    if (isNaN(u1) || isNaN(u2)) {
      errEl.textContent = '両方の欄に数値を入力してください';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    var p = state.problem;
    var tol = p.tol || [0, 0];
    var isCorrect = isClose(u1, p.answers[0], tol[0]) && isClose(u2, p.answers[1], tol[1]);
    state.total += 1;
    if (isCorrect) state.score += 1;
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;

    var resultCard = document.getElementById('resultCard');
    var resultTitle = document.getElementById('resultTitle');
    resultTitle.textContent = isCorrect ? '正解です!' : '不正解です。もう一度見直してみましょう。';
    resultTitle.style.color = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.borderColor = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.background = isCorrect ? 'rgba(99,153,34,0.14)' : 'rgba(216,90,48,0.14)';
    document.getElementById('resultExplanation').textContent = p.explanation;
    resultCard.classList.add('show');
  }

  function handleNext() {
    state.problem = generateProblem();
    renderProblem();
  }

  document.getElementById('checkBtn').addEventListener('click', handleCheck);
  document.getElementById('nextBtn').addEventListener('click', handleNext);
  document.getElementById('input1').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });
  document.getElementById('input2').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });

  state.problem = generateProblem();
  renderProblem();
})();
</script>
</body>
</html>
