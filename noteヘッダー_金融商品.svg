<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="160" fill="#2F7DE1" opacity="0.16"/>
  <circle cx="1250" cy="660" r="210" fill="#E8543F" opacity="0.14"/>
  <circle cx="680" cy="700" r="110" fill="#0FA18D" opacity="0.12"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="86" width="280" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="220" y="119" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">簿記1級 | 会計学</text>

  <text x="80" y="246" class="dg" font-size="100" fill="#5BA2FF">金融商品</text>
  <text x="80" y="350" class="dg" font-size="64" fill="#FFC94A">の</text>
  <text x="150" y="350" class="dg" font-size="72" fill="#FF7A66">出る論点</text>

  <text x="80" y="418" font-size="28" font-weight="700" fill="#fff" opacity="0.95">有価証券・債権・ヘッジを図と仕訳で</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="452" width="176" height="50" rx="25" fill="#fff"/>
    <text x="168" y="485" fill="#1D5DB3">4分類で整理</text>
    <rect x="270" y="452" width="164" height="50" rx="25" fill="#fff"/>
    <text x="352" y="485" fill="#8A6000">計算問題2問</text>
    <rect x="448" y="452" width="150" height="50" rx="25" fill="#fff"/>
    <text x="523" y="485" fill="#A8205C">○×54問</text>
  </g>

  <text x="80" y="572" font-size="20" font-weight="500" fill="#fff" opacity="0.8">図解つき・登録不要の無料Webページ</text>

  <!-- 右:有価証券の4分類 -->
  <text x="1000" y="112" text-anchor="middle" class="dg" font-size="26" fill="#fff">持つ目的で評価が変わる</text>

  <g filter="url(#shadow)">
    <rect x="790" y="146" width="205" height="150" rx="18" fill="#E8543F"/>
    <rect x="1005" y="146" width="205" height="150" rx="18" fill="#2F7DE1"/>
    <rect x="790" y="306" width="205" height="150" rx="18" fill="#6B7194"/>
    <rect x="1005" y="306" width="205" height="150" rx="18" fill="#0FA18D"/>
  </g>
  <g text-anchor="middle" fill="#fff">
    <text x="892" y="200" font-size="22" font-weight="900">売買目的</text>
    <text x="892" y="240" font-size="17" font-weight="700" opacity="0.95">時価</text>
    <text x="892" y="266" font-size="17" font-weight="700" opacity="0.95">差額は当期の損益</text>

    <text x="1107" y="200" font-size="22" font-weight="900">満期保有目的</text>
    <text x="1107" y="240" font-size="17" font-weight="700" opacity="0.95">償却原価法</text>
    <text x="1107" y="266" font-size="17" font-weight="700" opacity="0.95">原則は利息法</text>

    <text x="892" y="350" font-size="20" font-weight="900">子会社・関連会社</text>
    <text x="892" y="374" font-size="20" font-weight="900">株式</text>
    <text x="892" y="420" font-size="17" font-weight="700" opacity="0.95">取得原価</text>

    <text x="1107" y="360" font-size="22" font-weight="900">その他有価証券</text>
    <text x="1107" y="400" font-size="17" font-weight="700" opacity="0.95">時価</text>
    <text x="1107" y="426" font-size="17" font-weight="700" opacity="0.95">差額は純資産</text>
  </g>

  <rect x="790" y="484" width="420" height="52" rx="26" fill="#fff" fill-opacity="0.10" stroke="#FFC94A" stroke-width="2"/>
  <text x="1000" y="517" text-anchor="middle" font-size="19" font-weight="900" fill="#fff">CF見積法は「当初の約定利子率」で割り引く</text>

  <text x="1000" y="590" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">減損は50%・30%</text>
  <text x="1000" y="622" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">ヘッジは繰延ヘッジが原則</text>
</svg>
