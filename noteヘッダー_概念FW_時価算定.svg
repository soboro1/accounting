<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#fff" fill-opacity="0.75"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#FF7A66"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="160" fill="#0FA18D" opacity="0.14"/>
  <circle cx="1250" cy="660" r="210" fill="#E8543F" opacity="0.14"/>
  <circle cx="680" cy="700" r="110" fill="#E3A300" opacity="0.10"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="86" width="280" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="220" y="119" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">簿記1級 | 会計学</text>

  <text x="80" y="236" class="dg" font-size="64" fill="#34D1BA">概念フレームワーク</text>
  <text x="80" y="344" class="dg" font-size="60" fill="#FFC94A">×</text>
  <text x="152" y="350" class="dg" font-size="92" fill="#FF7A66">時価算定</text>

  <text x="80" y="418" font-size="28" font-weight="700" fill="#fff" opacity="0.95">出る論点を、図と仕訳と「問い」で</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="452" width="184" height="50" rx="25" fill="#fff"/>
    <text x="172" y="485" fill="#1D5DB3">シナリオ17題</text>
    <rect x="278" y="452" width="164" height="50" rx="25" fill="#fff"/>
    <text x="360" y="485" fill="#8A6000">原則と例外</text>
    <rect x="456" y="452" width="150" height="50" rx="25" fill="#fff"/>
    <text x="531" y="485" fill="#A8205C">○×70問</text>
  </g>

  <text x="80" y="572" font-size="20" font-weight="500" fill="#fff" opacity="0.8">図解つき・登録不要の無料Webページ</text>

  <!-- 右:2つの基準のつながり -->
  <g filter="url(#shadow)">
    <rect x="770" y="86" width="420" height="104" rx="24" fill="#0FA18D"/>
  </g>
  <text x="980" y="135" text-anchor="middle" class="dg" font-size="32" fill="#fff">概念フレームワーク</text>
  <text x="980" y="169" text-anchor="middle" font-size="19" font-weight="700" fill="#fff" opacity="0.92">何を時価で測るか</text>

  <path d="M980 190 V214 M870 214 H1090 M870 214 V236 M1090 214 V236" stroke="#fff" stroke-opacity="0.45" stroke-width="3" fill="none"/>

  <rect x="770" y="242" width="200" height="112" rx="20" fill="#fff" fill-opacity="0.10" stroke="#34D1BA" stroke-width="3"/>
  <text x="870" y="290" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">事業投資</text>
  <text x="870" y="327" text-anchor="middle" font-size="20" font-weight="700" fill="#34D1BA">→ 取得原価</text>

  <rect x="990" y="242" width="200" height="112" rx="20" fill="#fff" fill-opacity="0.10" stroke="#FF7A66" stroke-width="3"/>
  <text x="1090" y="290" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">金融投資</text>
  <text x="1090" y="327" text-anchor="middle" font-size="20" font-weight="700" fill="#FF7A66">→ 時価</text>

  <path d="M870 354 V392" stroke="#fff" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
  <text x="870" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" opacity="0.7">時価算定の対象外</text>
  <path d="M1090 354 V430" stroke="#FF7A66" stroke-width="3" fill="none" marker-end="url(#ahc)"/>

  <g filter="url(#shadow)">
    <rect x="770" y="442" width="420" height="104" rx="24" fill="#E8543F"/>
  </g>
  <text x="980" y="491" text-anchor="middle" class="dg" font-size="32" fill="#fff">時価算定基準</text>
  <text x="980" y="525" text-anchor="middle" font-size="19" font-weight="700" fill="#fff" opacity="0.92">その時価をどう算定するか</text>

  <text x="980" y="600" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="3">出口価格・レベル1〜3・リスクからの解放</text>
</svg>
