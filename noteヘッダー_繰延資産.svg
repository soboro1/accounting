<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="160" fill="#2F7DE1" opacity="0.16"/>
  <circle cx="1250" cy="660" r="210" fill="#E8543F" opacity="0.14"/>
  <circle cx="680" cy="700" r="110" fill="#0FA18D" opacity="0.12"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="86" width="280" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="220" y="119" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">簿記1級 | 会計学</text>

  <text x="80" y="246" class="dg" font-size="100" fill="#5BA2FF">繰延資産</text>
  <text x="80" y="350" class="dg" font-size="64" fill="#FFC94A">の</text>
  <text x="150" y="350" class="dg" font-size="72" fill="#FF7A66">出る論点</text>

  <text x="80" y="418" font-size="28" font-weight="700" fill="#fff" opacity="0.95">5項目の償却と表示を図と仕訳で</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="452" width="176" height="50" rx="25" fill="#fff"/>
    <text x="168" y="485" fill="#1D5DB3">3年と5年</text>
    <rect x="270" y="452" width="164" height="50" rx="25" fill="#fff"/>
    <text x="352" y="485" fill="#8A6000">計算問題2問</text>
    <rect x="448" y="452" width="150" height="50" rx="25" fill="#fff"/>
    <text x="523" y="485" fill="#A8205C">○×44問</text>
  </g>

  <text x="80" y="572" font-size="20" font-weight="500" fill="#fff" opacity="0.8">図解つき・登録不要の無料Webページ</text>

  <!-- 右:5項目の償却期間 -->
  <text x="1000" y="112" text-anchor="middle" class="dg" font-size="26" fill="#fff">償却期間は3年・償還期間・5年</text>

  <path d="M1102 140 V274 M1102 318 V472 M1210 140 V472" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="1102" y="160" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" opacity="0.8">3年</text>
  <text x="1196" y="160" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" opacity="0.8">5年</text>

  <g font-size="17" font-weight="900" fill="#fff" text-anchor="end">
    <text x="926" y="199">株式交付費</text>
    <text x="926" y="251">新株予約権発行費</text>
    <text x="926" y="303">社債発行費</text>
    <text x="926" y="355">創立費</text>
    <text x="926" y="407">開業費</text>
    <text x="926" y="459">開発費</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="940" y="174" width="162" height="36" rx="10" fill="#E8543F"/>
    <rect x="940" y="226" width="162" height="36" rx="10" fill="#E8543F"/>
    <rect x="940" y="330" width="270" height="36" rx="10" fill="#2F7DE1"/>
    <rect x="940" y="382" width="270" height="36" rx="10" fill="#2F7DE1"/>
    <rect x="940" y="434" width="270" height="36" rx="10" fill="#F07C1E"/>
  </g>
  <rect x="940" y="278" width="270" height="36" rx="10" fill="#0FA18D" fill-opacity="0.35" stroke="#34D1BA" stroke-width="2.5" stroke-dasharray="7 5"/>
  <g font-size="15" font-weight="900" fill="#fff" text-anchor="middle">
    <text x="1021" y="198">3年以内</text>
    <text x="1021" y="250">3年以内</text>
    <text x="1075" y="302">償還期間・利息法</text>
    <text x="1075" y="354">5年以内</text>
    <text x="1075" y="406">5年以内</text>
    <text x="1075" y="458">5年以内</text>
  </g>

  <rect x="790" y="500" width="420" height="52" rx="26" fill="#fff" fill-opacity="0.10" stroke="#FFC94A" stroke-width="2"/>
  <text x="1000" y="533" text-anchor="middle" font-size="19" font-weight="900" fill="#fff">原則は支出時の費用、資産計上は容認</text>

  <text x="1000" y="606" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">開発費だけは売上原価・販管費</text>
</svg>
