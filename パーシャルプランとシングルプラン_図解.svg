<text x="400" y="331" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="end">500,000</text>
<text x="440" y="331" font-size="20" font-weight="400" fill="#1F3A5F" text-anchor="start">仕掛品</text>
<text x="730" y="331" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="end">500,000</text>
