<rect width="1600" height="900" fill="#F5F8FC"/>
<text x="800" y="72" font-size="48" font-weight="800" fill="#1F3A5F" text-anchor="middle">パーシャルプランとシングルプランの違い</text>
<text x="800" y="114" font-size="23" font-weight="400" fill="#4A5D78" text-anchor="middle">違いは、仕掛品勘定の借方を「実際原価」で書くか「標準原価」で書くか(例:実際発生額 500,000円、標準配賦額 450,000円)</text>
