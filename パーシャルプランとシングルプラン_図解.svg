<text x="224" y="820" font-size="21" font-weight="500" fill="#1F3A5F" text-anchor="start">仕掛品勘定の貸方(完成品原価)は、どちらも標準原価。原価差異の金額も同じ(50,000円の不利差異)。</text>
<text x="224" y="852" font-size="21" font-weight="400" fill="#4A5D78" text-anchor="start">見分け方:仕掛品勘定に差異が載っていればパーシャルプラン、載っていなければシングルプラン。</text>
