<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4A5D78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1600" height="900" fill="#F5F8FC"/>
<text x="800" y="60" font-size="44" font-weight="800" fill="#1F3A5F" text-anchor="middle">予算差異の求め方</text>
<text x="800" y="98" font-size="23" font-weight="400" fill="#4A5D78" text-anchor="middle">予算差異 = 予算許容額 − 実際発生額。予算許容額は「実際操業度」で計算する</text>
<rect x="40" y="120" width="740" height="492" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
<rect x="64" y="138" width="692" height="232" rx="16" fill="#F5F8FC"/>
<rect x="82" y="152" width="86" height="30" rx="15" fill="#1F3A5F"/>
<text x="125" y="173" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">STEP 1</text>
<text x="182" y="175" font-size="20" font-weight="800" fill="#1F3A5F" text-anchor="start">予算許容額を求める</text>
<text x="406" y="175" font-size="15" font-weight="400" fill="#4A5D78" text-anchor="start">実際操業度 5,350h のときに使ってよい金額</text>
<text x="92" y="222" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start">変動費</text>
<text x="174" y="222" font-size="18" font-weight="400" fill="#1F3A5F" text-anchor="start">変動費率 @900 × 実際操業度 5,350h</text>
<text x="728" y="222" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="end">4,815,000</text>
<text x="92" y="256" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start">固定費</text>
<text x="174" y="256" font-size="18" font-weight="400" fill="#1F3A5F" text-anchor="start">固定費予算(操業度に関係なく一定)</text>
<text x="728" y="256" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="end">3,600,000</text>
<line x1="92" y1="272" x2="728" y2="272" stroke="#1F3A5F" stroke-width="2"/>
<text x="92" y="306" font-size="20" font-weight="800" fill="#1F6FEB" text-anchor="start">予算許容額</text>
<text x="728" y="306" font-size="24" font-weight="800" fill="#1F6FEB" text-anchor="end">8,415,000</text>
<text x="92" y="346" font-size="15" font-weight="400" fill="#4A5D78" text-anchor="start">※ 固定費予算が年間で与えられていたら月間に直す:43,200,000 ÷ 12 = 3,600,000</text>
<line x1="410" y1="374" x2="410" y2="386" stroke="#4A5D78" stroke-width="3" marker-end="url(#arr)"/>
<rect x="64" y="394" width="692" height="100" rx="16" fill="#F5F8FC"/>
<rect x="82" y="408" width="86" height="30" rx="15" fill="#1F3A5F"/>
<text x="125" y="429" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">STEP 2</text>
<text x="182" y="431" font-size="20" font-weight="800" fill="#1F3A5F" text-anchor="start">実際発生額を引く</text>
<text x="92" y="474" font-size="19" font-weight="400" fill="#1F3A5F" text-anchor="start">予算許容額 8,415,000 − 実際発生額 8,390,000 =</text>
<text x="728" y="474" font-size="24" font-weight="800" fill="#1F6FEB" text-anchor="end">+25,000</text>
<line x1="410" y1="498" x2="410" y2="510" stroke="#4A5D78" stroke-width="3" marker-end="url(#arr)"/>
<rect x="64" y="518" width="692" height="78" rx="16" fill="#F5F8FC"/>
<rect x="82" y="532" width="86" height="30" rx="15" fill="#1F3A5F"/>
<text x="125" y="553" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">STEP 3</text>
<text x="182" y="555" font-size="20" font-weight="800" fill="#1F3A5F" text-anchor="start">符号で判定する</text>
<text x="364" y="555" font-size="17" font-weight="400" fill="#1F3A5F" text-anchor="start">プラス = 予算より少なく済んだ →</text>
<text x="728" y="555" font-size="20" font-weight="800" fill="#1F6FEB" text-anchor="end">有利差異</text>
<text x="364" y="580" font-size="15" font-weight="400" fill="#4A5D78" text-anchor="start">マイナスなら、予算を超えた → 不利差異</text>
<rect x="800" y="120" width="760" height="492" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
<text x="828" y="160" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">金額の大きさで比べる</text>
<text x="1532" y="160" font-size="14" font-weight="400" fill="#4A5D78" text-anchor="end">※ 差は大きく描いています</text>
<text x="840" y="204" font-size="18" font-weight="800" fill="#1F6FEB" text-anchor="start">予算許容額</text>
<text x="1520" y="204" font-size="20" font-weight="800" fill="#1F6FEB" text-anchor="end">8,415,000</text>
<rect x="840" y="216" width="389" height="62" fill="#E8F1FE" stroke="#1F6FEB" stroke-width="2"/>
<rect x="1229" y="216" width="291" height="62" fill="#E6F6EC" stroke="#16A34A" stroke-width="2"/>
<text x="1034.5" y="242" font-size="16" font-weight="800" fill="#1F6FEB" text-anchor="middle">変動費</text>
<text x="1034.5" y="265" font-size="15" font-weight="600" fill="#1F6FEB" text-anchor="middle">@900 × 5,350h = 4,815,000</text>
<text x="1374.5" y="242" font-size="16" font-weight="800" fill="#16A34A" text-anchor="middle">固定費</text>
<text x="1374.5" y="265" font-size="15" font-weight="600" fill="#16A34A" text-anchor="middle">予算 3,600,000</text>
<text x="840" y="322" font-size="18" font-weight="800" fill="#1F3A5F" text-anchor="start">実際発生額</text>
<text x="1450" y="322" font-size="20" font-weight="800" fill="#1F3A5F" text-anchor="end">8,390,000</text>
<rect x="840" y="334" width="610" height="62" fill="#E9EEF6" stroke="#1F3A5F" stroke-width="2"/>
<text x="1145.0" y="372" font-size="16" font-weight="600" fill="#1F3A5F" text-anchor="middle">実際に掛かった製造間接費</text>
<rect x="1450" y="334" width="70" height="62" fill="#F1E9FE" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="1520" y1="278" x2="1520" y2="334" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="1485" y1="396" x2="1485" y2="416" stroke="#7C3AED" stroke-width="2"/>
<text x="1520" y="438" font-size="18" font-weight="800" fill="#7C3AED" text-anchor="end">予算差異 +25,000(有利):予算許容額より少なく済んだ分</text>
<line x1="828" y1="462" x2="1532" y2="462" stroke="#C9D6E8" stroke-width="1.5"/>
<text x="828" y="496" font-size="19" font-weight="800" fill="#1F3A5F" text-anchor="start">なぜ実際操業度で計算するのか</text>
<text x="828" y="528" font-size="17" font-weight="400" fill="#4A5D78" text-anchor="start">「5,350時間稼働したなら、ここまでは使ってよい」という金額と比べるため。</text>
<text x="828" y="556" font-size="17" font-weight="400" fill="#4A5D78" text-anchor="start">変動費は稼働時間に応じて増えるので、予算を実際操業度に合わせて引き直す。</text>
<text x="828" y="584" font-size="17" font-weight="400" fill="#4A5D78" text-anchor="start">固定費は稼働時間に関係なく発生するので、予算額をそのまま使う。</text>
<rect x="40" y="628" width="940" height="244" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
<rect x="64" y="646" width="170" height="36" rx="18" fill="#FDEDE3"/>
<text x="149" y="671" font-size="18" font-weight="800" fill="#C2410C" text-anchor="middle">よくある間違い</text>
<text x="68" y="718" font-size="17" font-weight="800" fill="#C2410C" text-anchor="start">✕</text>
<text x="94" y="718" font-size="17" fill="#1F3A5F">標準操業度(5,100h)や予算操業度(5,200h)を掛ける<tspan fill="#4A5D78">　→　</tspan><tspan fill="#16A34A" font-weight="700">掛けるのは実際操業度(5,350h)</tspan></text>
<text x="68" y="756" font-size="17" font-weight="800" fill="#C2410C" text-anchor="start">✕</text>
<text x="94" y="756" font-size="17" fill="#1F3A5F">固定費を「固定費率 × 実際操業度」で計算する<tspan fill="#4A5D78">　→　</tspan><tspan fill="#16A34A" font-weight="700">固定費は予算額 3,600,000 をそのまま足す</tspan></text>
<text x="68" y="794" font-size="17" font-weight="800" fill="#C2410C" text-anchor="start">✕</text>
<text x="94" y="794" font-size="17" fill="#1F3A5F">年間の固定費予算をそのまま使う<tspan fill="#4A5D78">　→　</tspan><tspan fill="#16A34A" font-weight="700">月間に直してから使う(÷12)</tspan></text>
<text x="68" y="832" font-size="17" font-weight="800" fill="#C2410C" text-anchor="start">✕</text>
<text x="94" y="832" font-size="17" fill="#1F3A5F">引く順番を逆にする<tspan fill="#4A5D78">　→　</tspan><tspan fill="#16A34A" font-weight="700">予算許容額 − 実際発生額。プラスが有利</tspan></text>
<rect x="1000" y="628" width="560" height="244" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
<rect x="1024" y="646" width="90" height="36" rx="18" fill="#E9EEF6"/>
<text x="1069" y="671" font-size="18" font-weight="800" fill="#1F3A5F" text-anchor="middle">仕訳</text>
<text x="1028" y="716" font-size="15" font-weight="800" fill="#1F6FEB" text-anchor="start">有利差異(今回):予算差異は貸方</text>
<text x="1028" y="746" font-size="18" font-weight="400" fill="#4A5D78" text-anchor="start">(借)</text>
<text x="1076" y="746" font-size="18" font-weight="600" fill="#1F3A5F" text-anchor="start">製造間接費</text>
<text x="1268" y="746" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="end">25,000</text>
<text x="1296" y="746" font-size="18" font-weight="400" fill="#4A5D78" text-anchor="start">(貸)</text>
<text x="1344" y="746" font-size="18" font-weight="600" fill="#1F3A5F" text-anchor="start">予算差異</text>
<text x="1532" y="746" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="end">25,000</text>
<text x="1028" y="786" font-size="15" font-weight="800" fill="#4A5D78" text-anchor="start">不利差異の場合:予算差異は借方</text>
<text x="1028" y="816" font-size="18" font-weight="400" fill="#4A5D78" text-anchor="start">(借)</text>
<text x="1076" y="816" font-size="18" font-weight="400" fill="#4A5D78" text-anchor="start">予算差異</text>
<text x="1268" y="816" font-size="18" font-weight="700" fill="#4A5D78" text-anchor="end">×××</text>
<text x="1296" y="816" font-size="18" font-weight="400" fill="#4A5D78" text-anchor="start">(貸)</text>
<text x="1344" y="816" font-size="18" font-weight="400" fill="#4A5D78" text-anchor="start">製造間接費</text>
<text x="1532" y="816" font-size="18" font-weight="700" fill="#4A5D78" text-anchor="end">×××</text>
<text x="1028" y="852" font-size="14" font-weight="400" fill="#4A5D78" text-anchor="start">※ パーシャルプランでは「製造間接費」が「仕掛品」になる</text>
</svg>
