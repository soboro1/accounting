    });
    if (!xs.length) return '';
    return '<div class="look"><div class="look-h">問題文の' + circ(i + 1) + 'のマーカー</div>' + xs.map(function (x) { return '<mark class="k' + (i + 1) + '">' + esc(x) + '</mark>'; }).join(' ') + '</div>';
  }
  function figHtml(t) {
    var f = t.fig;
    return '<div class="fig"><div class="fig-title">' + esc(f.title) + '</div>' + f.svg + '<ul class="fig-notes">' + f.notes.map(function (n) {
      return '<li><span class="sw"' + (n[1] ? ' style="background:' + n[1] + '"' : '') + '></span>' + esc(n[0]) + '</li>';
    }).join('') + '</ul></div>';
  }
  function find(id) { return TYPES.filter(function (t) { return t.id === id; })[0]; }
  function entryHtml(e) {
    function side(lines, tag) {
      return '<div class="j-side">' + lines.map(function (l, k) {
        return '<div class="j-line"><span class="j-tag">' + (k === 0 ? '(' + tag + ')' : '') + '</span><span class="j-acct">' + esc(l[0]) + '</span><span class="j-amt">' + fmt(l[1]) + '</span></div>';
      }).join('') + '</div>';
    }
    return '<div class="ent"><div class="ent-n">' + esc(e[0]) + '</div><div class="sol"><div class="j-body">' + side(e[1], '借') + side(e[2], '貸') + '</div></div></div>';
  }

  // ===== 一覧 =====
  function renderHome() {
    var done = TYPES.filter(function (t) { return rec[t.id] && rec[t.id].solved; }).length;
    el('okN').textContent = done; el('allN').textContent = TYPES.length;
    el('view').innerHTML = TJ.qno.map(function (q) {
      var ts = TYPES.filter(function (t) { return t.qno === q; });
      return '<h2 class="unit-h">' + q + '</h2><div class="cards">' + ts.map(function (t) {
        var r = rec[t.id] || {};
        return '<a class="paper tcard" href="#' + t.id + '/read"><div class="it-head"><span class="stars" aria-label="頻出度' + t.star + '">' + stars(t.star) + '</span><h3>' + esc(t.name) + '</h3></div>' +
          '<p class="tlead">' + esc(t.lead) + '</p><div class="tags"><span class="tag">目安 ' + esc(t.time) + '</span><span class="tag">手順 ' + t.steps.length + 'つ</span><span class="tag">入力 ' + t.parts.length + '問</span>' +
          (r.order ? '<span class="tag ok">並べ替え できた</span>' : '') + (r.solved ? '<span class="tag ok">練習問題 できた</span>' : '') + '</div></a>';
      }).join('') + '</div>';
    }).join('');
  }

  // ===== 形式ごとの画面 =====
  var cur = { t: null, tab: 'read', order: [], pool: [], checked: false, step: 0, marks: {} };
  function tabs(t) {
    return '<div class="seg" role="group" aria-label="モード">' + [['read', '手順を読む'], ['order', '手順を並べる'], ['solve', '練習問題']].map(function (m) {
      return '<a href="#' + t.id + '/' + m[0] + '" aria-pressed="' + (cur.tab === m[0]) + '">' + m[1] + '</a>';
    }).join('') + '</div>';
  }
  function head(t) {
    return '<a class="back" href="#">← 形式の一覧に戻る</a><section class="paper thead"><div class="kicker">' + t.qno + '</div>' +
      '<div class="it-head"><h2 class="tname">' + esc(t.name) + '</h2><span class="stars">' + stars(t.star) + '</span></div><p class="tlead">' + esc(t.lead) + '</p>' + tabs(t) + '</section>';
  }
  function renderRead(t) {
    return '<section class="paper"><h3 class="sec-h">解く手順</h3><ol class="steps">' + t.steps.map(function (s) {
      return '<li><b>' + esc(s.t) + '</b><span>' + esc(s.d) + '</span></li>';
    }).join('') + '</ol>' +
      '<h3 class="sec-h">例題:解く順番にマーカーを引く</h3><p class="ask">練習問題と同じ問題です。マーカーの色と番号が、上の手順の番号に対応しています。</p>' + exBox(t, 0, true) +
      '<h3 class="sec-h">本番で書く下書き</h3><p class="ask">問題用紙の余白や計算用紙に、このように書いて整理します。</p>' + figHtml(t) +
      '<h3 class="sec-h">ひっかけ</h3><ul class="traps">' + t.traps.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '<h3 class="sec-h">関係する仕訳</h3>' + t.entries.map(entryHtml).join('') +
      '<div class="actions"><a class="btn btn-primary" href="#' + t.id + '/order">手順を並べてみる</a><a class="btn btn-ghost" href="#' + t.id + '/solve">練習問題を解く</a></div></section>';
  }
  function startOrder(t) { cur.pool = shuffle(t.steps.map(function (s, i) { return i; })); cur.order = []; cur.checked = false; }
  function renderOrder(t) {
    var n = t.steps.length, h = '<section class="paper"><p class="ask">手順のカードを、解く順番にタップしてください。</p><ol class="steps picked">';
    cur.order.forEach(function (i, k) {
      var ok = cur.checked ? i === k : null;
      h += '<li class="' + (ok === true ? 'is-ok' : ok === false ? 'is-ng' : '') + '"><b>' + esc(t.steps[i].t) + '</b>' + (cur.checked && !ok ? '<span>正しくは' + (i + 1) + '番目</span>' : '') + '</li>';
    });
    for (var k = cur.order.length; k < n; k++) h += '<li class="blank"><b>　</b></li>';
    h += '</ol>';
    if (!cur.checked) {
      h += '<div class="pool">' + cur.pool.filter(function (i) { return cur.order.indexOf(i) < 0; }).map(function (i) {
        return '<button type="button" class="pcard" data-pick="' + i + '">' + esc(t.steps[i].t) + '</button>';
      }).join('') + '</div><div class="actions"><button type="button" class="btn btn-quiet" data-act="undo"' + (cur.order.length ? '' : ' disabled') + '>1つ戻す</button></div>';
    } else {
      var right = cur.order.filter(function (i, k) { return i === k; }).length;
      h += '<p class="verdict' + (right === n ? ' all' : '') + '">' + n + 'つ中 ' + right + 'つが正しい位置です' + (right === n ? '。全部正解です' : '') + '</p>' +
        '<h3 class="sec-h">正しい順番</h3><ol class="steps">' + t.steps.map(function (s) { return '<li><b>' + esc(s.t) + '</b><span>' + esc(s.d) + '</span></li>'; }).join('') + '</ol>' +
        '<div class="actions"><button type="button" class="btn btn-primary" data-act="reorder">もう一度並べる</button><a class="btn btn-ghost" href="#' + t.id + '/solve">練習問題を解く</a></div>';
    }
    return h + '</section>';
  }
  function startSolve() { cur.step = 0; cur.marks = {}; }
  function partHtml(t, p, idx) {
    var m = cur.marks[idx], dis = m ? ' disabled' : '';
    return '<div class="part' + (m ? (m.ok ? ' is-ok' : ' is-ng') : '') + '"><label class="p-l" for="p-' + idx + '">' + esc(p.label) + '</label><div class="p-ctrl">' +
      (p.dirs ? '<select id="d-' + idx + '" aria-label="' + esc(p.label) + 'の向き"' + dis + '><option value="">選ぶ</option>' + p.dirs.map(function (d) { return '<option' + (m && m.dir === d ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select>' : '') +
      '<input id="p-' + idx + '" type="text" inputmode="decimal" autocomplete="off" value="' + (m ? esc(m.raw) : '') + '"' + dis + '><span class="unit">' + esc(p.unit) + '</span></div>' +
      (m ? '<div class="p-fb">' + (m.ok ? '○ 正解' : '× 正解は ' + fmt(p.ans) + esc(p.unit) + (p.dir ? ' ' + p.dir : '')) + '</div><ul class="calc">' + p.calc.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
  }
  function renderSolve(t) {
    var fin = cur.step >= t.steps.length - 1 && t.parts.every(function (p, idx) { return cur.marks[idx]; });
    var h = '<section class="paper"><h3 class="sec-h">問題の資料</h3>' + exBox(t, fin ? 0 : cur.step + 1, false) + '<p class="ask">' + (fin ? 'すべての手順のマーカーを表示しています。' : '今の手順(' + circ(cur.step + 1) + ')のマーカーを太く、ほかの手順のマーカーを細い線で表示しています。') + '</p></section>';
    for (var i = 0; i <= Math.min(cur.step, t.steps.length - 1); i++) {
      var s = t.steps[i], ps = [];
      t.parts.forEach(function (p, idx) { if (p.step === i) ps.push(idx); });
      var checked = ps.every(function (idx) { return cur.marks[idx]; });
      h += '<section class="paper stp' + (i < cur.step ? ' past' : '') + '"><div class="stp-no">手順' + (i + 1) + ' / ' + t.steps.length + '</div><h3 class="stp-t"><span class="exn k' + (i + 1) + '">' + circ(i + 1) + '</span>' + esc(s.t) + '</h3><p class="stp-d">' + esc(s.d) + '</p>' + lookHtml(t, i) +
        ps.map(function (idx) { return partHtml(t, t.parts[idx], idx); }).join('');
      if (i === cur.step) {
        if (ps.length && !checked) h += '<div class="actions"><button type="button" class="btn btn-primary" data-act="check" data-step="' + i + '">確かめる</button><button type="button" class="btn btn-quiet" data-act="giveup" data-step="' + i + '">答えを見る</button></div>';
        else if (i < t.steps.length - 1) h += '<div class="actions"><button type="button" class="btn btn-primary" data-act="next">次の手順へ</button></div>';
      }
      h += '</section>';
    }
    if (fin) {
      var ok = t.parts.filter(function (p, idx) { return cur.marks[idx].ok; }).length;
      h += '<section class="paper"><p class="verdict' + (ok === t.parts.length ? ' all' : '') + '">' + t.parts.length + '問中 ' + ok + '問正解' + (ok === t.parts.length ? '。全問正解です' : '') + '</p>' +
        '<h3 class="sec-h">本番で書く下書き</h3>' + figHtml(t) + '<h3 class="sec-h">この問題の仕訳</h3>' + t.entries.map(entryHtml).join('') +
        '<div class="actions"><button type="button" class="btn btn-primary" data-act="resolve">最初から解き直す</button><a class="btn btn-ghost" href="#">ほかの形式を選ぶ</a></div></section>';
    }
    return h;
  }
  function renderType() {
    var t = cur.t;
    var body = cur.tab === 'order' ? renderOrder(t) : cur.tab === 'solve' ? renderSolve(t) : renderRead(t);
    el('view').innerHTML = head(t) + body;
  }
  function route() {
    var m = location.hash.replace('#', '').split('/'), t = find(m[0]);
    if (!t) { cur.t = null; el('home').hidden = false; renderHome(); return; }
    var tab = ['read', 'order', 'solve'].indexOf(m[1]) >= 0 ? m[1] : 'read';
    var changed = cur.t !== t || cur.tab !== tab;
    if (cur.t !== t || tab !== cur.tab) {
      if (tab === 'order') startOrder(t);
      if (tab === 'solve') startSolve();
    }
    cur.t = t; cur.tab = tab;
    el('home').hidden = true;
    renderType();
    if (changed) window.scrollTo(0, 0);
  }
  function mark(t, idx) {
    var p = t.parts[idx], raw = el('p-' + idx).value, v = parseNum(raw), d = p.dirs ? el('d-' + idx).value : null;
    cur.marks[idx] = { raw: raw, dir: d, ok: Math.abs(v - p.ans) < 1e-9 && (!p.dir || d === p.dir) };
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || !cur.t) return;
    var t = cur.t, d = b.dataset;
    if (d.pick !== undefined) {
      cur.order.push(Number(d.pick));
      if (cur.order.length === t.steps.length) {
        cur.checked = true;
        if (cur.order.every(function (i, k) { return i === k; })) { rec[t.id] = rec[t.id] || {}; rec[t.id].order = true; save(); }
      }
      renderType(); return;
    }
    if (d.act === 'undo') { cur.order.pop(); renderType(); return; }
    if (d.act === 'reorder') { startOrder(t); renderType(); return; }
    if (d.act === 'check' || d.act === 'giveup') {
      var st = Number(d.step);
      t.parts.forEach(function (p, idx) {
        if (p.step !== st) return;
        if (d.act === 'check') mark(t, idx); else cur.marks[idx] = { raw: '', dir: null, ok: false };
      });
      if (t.parts.every(function (p, idx) { return cur.marks[idx]; })) {
        var all = t.parts.every(function (p, idx) { return cur.marks[idx].ok; });
        if (all) { rec[t.id] = rec[t.id] || {}; rec[t.id].solved = true; save(); }
      }
      renderType(); return;
    }
    if (d.act === 'next') {
      cur.step++;
      renderType();
      var secs = document.querySelectorAll('.stp');
      if (secs.length) secs[secs.length - 1].scrollIntoView({ block: 'start' });
      return;
    }
    if (d.act === 'resolve') { startSolve(); renderType(); window.scrollTo(0, 0); }
  });
  window.addEventListener('hashchange', route);
  el('resetBtn').addEventListener('click', function () {
    if (window.confirm('「できた」の記録をすべて消します。よろしいですか?')) { rec = {}; save(); route(); }
  });
  route();
})();
</script>
</body>
</html>
