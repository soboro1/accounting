<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>簿記2級 本番の解き方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
  /* Layout: 1カラムの答案用紙。問題ごとに借方・貸方の科目と金額を入力し、採点後に仕訳と計算を表示。ほかの出題パターンドリルと同じ紺×金、ライトテーマも用意 */
  :root {
    color-scheme: dark;
    --bg: #101b2d;
    --surface: #15233a;
    --surface-2: #0d1624;
    --fg: #f6f1e6;
    --fg-soft: #ddd6c7;
    --muted: #9aa5b1;
    --accent: #d4a24c;
    --accent-ink: #101b2d;
    --accent-soft: rgba(212, 162, 76, 0.16);
    --line: rgba(212, 162, 76, 0.36);
    --rule: rgba(246, 241, 230, 0.12);
    --good: #8cc152;
    --good-soft: rgba(140, 193, 82, 0.2);
    --bad: #ec7f56;
    --bad-soft: rgba(236, 127, 86, 0.2);
    --std-fill: rgba(212, 162, 76, 0.2);
    --c1: #d4a24c; --c2: #5fa8d3; --c3: #7cc6a4; --c4: #b39ddb; --c5: #ec7f56;
    --font: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #eef1f6; --surface: #ffffff; --surface-2: #f5f7fb;
      --fg: #14213a; --fg-soft: #33415a; --muted: #5b6678;
      --accent: #9a6a12; --accent-ink: #ffffff; --accent-soft: rgba(154, 106, 18, 0.1);
      --line: rgba(154, 106, 18, 0.35); --rule: rgba(20, 33, 58, 0.12);
      --good: #3d7a14; --good-soft: rgba(61, 122, 20, 0.12);
      --bad: #b8461f; --bad-soft: rgba(184, 70, 31, 0.12);
      --std-fill: rgba(154, 106, 18, 0.13);
      --c1: #b07d1a; --c2: #2f78a8; --c3: #2f8a63; --c4: #7a5fb0; --c5: #c0552b;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #eef1f6; --surface: #ffffff; --surface-2: #f5f7fb;
    --fg: #14213a; --fg-soft: #33415a; --muted: #5b6678;
    --accent: #9a6a12; --accent-ink: #ffffff; --accent-soft: rgba(154, 106, 18, 0.1);
    --line: rgba(154, 106, 18, 0.35); --rule: rgba(20, 33, 58, 0.12);
    --good: #3d7a14; --good-soft: rgba(61, 122, 20, 0.12);
    --bad: #b8461f; --bad-soft: rgba(184, 70, 31, 0.12);
    --std-fill: rgba(154, 106, 18, 0.13);
    --c1: #b07d1a; --c2: #2f78a8; --c3: #2f8a63; --c4: #7a5fb0; --c5: #c0552b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.8;
    -webkit-text-size-adjust: 100%;
  }
  .app {
    max-width: 860px; margin: 0 auto;
    padding-inline: 16px; padding-block: 28px 56px;
    display: flex; flex-direction: column; gap: 18px;
  }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; }
  .top > div:first-child { min-width: 0; flex: 1 1 420px; }
  .kicker { font-size: 12px; letter-spacing: 0.18em; color: var(--accent); font-weight: 700; }
  h1 { font-size: clamp(22px, 4.6vw, 28px); margin: 2px 0 0; line-height: 1.35; text-wrap: balance; }
  .lead { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; max-width: 42em; }
  .score { text-align: right; }
  .score-k { font-size: 12px; color: var(--muted); }
  .score-v { font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 500; line-height: 1.5;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--fg-soft);
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

  .paper {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px clamp(14px, 3vw, 26px);
    display: flex; flex-direction: column; gap: 14px; min-width: 0;
  }
  .badge {
    align-self: flex-start; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--accent); background: var(--accent-soft); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 14px;
  }
  .intro { margin: 0; font-size: 15.5px; }
  .freq { font-size: 12.5px; color: var(--muted); margin-top: -6px; }
  .facts { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
  .facts b { font-weight: 700; color: var(--fg); }

  .cost-card { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px 6px; background: var(--surface-2); max-width: 560px; }
  .cc-title { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .cc-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; column-gap: 14px; font-variant-numeric: tabular-nums; }
  .cc-grid > span { padding: 5px 0; border-top: 1px dashed var(--rule); font-size: 14px; }
  .cc-c { color: var(--muted); }
  .cc-v { text-align: right; font-weight: 500; }

  .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
  .figbox {
    margin: 0; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 10px;
    padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .figscroll { overflow-x: auto; }
  .figbox figcaption { font-size: 12px; color: var(--muted); padding: 0 4px; line-height: 1.6; }
  .fig { width: 100%; min-width: 330px; height: auto; display: block; }
  .fig text { font-family: var(--font); }
  .fig .t { fill: var(--fg); font-size: 13px; }
  .fig .ts { fill: var(--muted); font-size: 11.5px; }
  .fig .tb { fill: var(--fg); font-size: 13.5px; font-weight: 700; }
  .fig .ta { fill: var(--accent); font-size: 12px; font-weight: 700; }
  .fig .tu { fill: var(--bad); font-size: 12px; font-weight: 700; }
  .fig .tf { fill: var(--good); font-size: 12px; font-weight: 700; }
  .fig .box { fill: var(--surface); stroke: var(--fg-soft); stroke-width: 1.2; }
  .fig .div { stroke: var(--fg-soft); stroke-width: 1.2; }
  .fig .hl { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; }
  .fig .std { fill: var(--std-fill); stroke: var(--accent); stroke-width: 1.2; }
  .fig .vu { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.2; }
  .fig .ax { stroke: var(--muted); stroke-width: 1.2; }
  .fig .bar { fill: var(--muted); fill-opacity: 0.5; }
  .fig .bar-hit { fill: var(--accent); }
  .fig .arr { stroke: var(--muted); stroke-width: 1.4; }
  .fig .mk { fill: var(--muted); }
  .fig .frame { fill: none; stroke: var(--fg-soft); stroke-width: 1.2; }
  .fig .lead { fill: none; stroke: var(--muted); stroke-width: 1; }
  .fig .s0 { fill: var(--c1); }
  .fig .s1 { fill: var(--c2); }
  .fig .s2 { fill: var(--c3); }
  .fig .s3 { fill: var(--c5); }

  .lad-title { font-size: 13.5px; font-weight: 700; padding: 2px 4px 0; }
  .ladder { display: flex; flex-direction: column; padding: 4px; font-variant-numeric: tabular-nums; }
  .rung { border: 1px solid var(--line); background: var(--std-fill); border-radius: 8px; padding: 7px 12px; }
  .rung-k { font-size: 12px; color: var(--muted); }
  .rung-v { font-size: 13.5px; overflow-wrap: anywhere; }
  .step { position: relative; margin-left: 22px; padding: 8px 0 10px 18px; border-left: 2px solid var(--muted); font-size: 13.5px; }
  .step::after {
    content: ''; position: absolute; left: -7px; bottom: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--muted);
  }
  .step.u b { color: var(--bad); }
  .step.f b { color: var(--good); }
  .step.n b { color: var(--fg); }
  .rung.mark { border: 2px solid var(--accent); background: var(--accent-soft); }

  /* タイムテーブル・換算表・財務諸表 */
  .tbl { width: 100%; min-width: 320px; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .tbl th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  .tbl td { padding: 5px 8px; text-align: right; border-bottom: 1px dashed var(--rule); white-space: nowrap; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; white-space: normal; }
  .tbl td.l { text-align: left; }
  .tbl tr.sum td { border-top: 1px solid var(--fg-soft); font-weight: 700; }
  .tbl tr.hl td { color: var(--accent); font-weight: 700; }
  .tbl tr:last-child td { border-bottom: none; }

  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt {
    font: inherit; font-size: 14px; line-height: 1.4; padding: 7px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--fg-soft);
  }
  .opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sheet-head { font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .hint { font-size: 12.5px; color: var(--muted); font-weight: 400; }
  .sheet { display: flex; flex-direction: column; }
  .ans-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
    gap: 8px 16px; padding: 12px 0; border-top: 1px solid var(--rule);
  }
  .ans-row:first-child { border-top: none; padding-top: 4px; }
  .ans-row.choice { grid-template-columns: minmax(0, 1fr); }
  .ans-label { font-weight: 500; }
  .qno { display: inline-block; min-width: 2.8em; color: var(--accent); font-weight: 700; font-size: 13px; }
  .ans-ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ans-ctrl input {
    width: 10.5em; padding: 8px 12px; font: inherit; font-size: 16px; line-height: 1.4;
    border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .ans-ctrl input::placeholder { color: var(--muted); opacity: 0.7; }
  .yen { color: var(--muted); font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 13.5px; line-height: 1.4; padding: 7px 14px;
    background: transparent; color: var(--fg-soft); border: none; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .fb { grid-column: 1 / -1; font-size: 13.5px; font-weight: 500; }
  .fb.ok { color: var(--good); }
  .fb.ng { color: var(--bad); }
  @media (max-width: 560px) { .ans-row { grid-template-columns: minmax(0, 1fr); } }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: 15px; font-weight: 700; line-height: 1.4;
    padding: 11px 22px; border-radius: 999px; cursor: pointer; border: 1px solid var(--accent);
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: transparent; color: var(--accent); }
  .btn-quiet { background: transparent; color: var(--muted); border-color: var(--rule); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .ans-ctrl input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .err { color: var(--bad); font-size: 13.5px; }

  .result { display: flex; flex-direction: column; gap: 14px; }
  .verdict { font-size: 17px; font-weight: 700; }
  .verdict.all { color: var(--good); }
  .sol {
    background: var(--surface-2); border: 1px solid var(--rule); border-radius: 10px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; font-variant-numeric: tabular-nums;
  }
  .sol h4 { margin: 12px 0 2px; font-size: 13.5px; color: var(--accent); letter-spacing: 0.04em; }
  .sol h4:first-child { margin-top: 0; }
  .sol p { margin: 0; font-size: 14px; line-height: 1.75; overflow-wrap: anywhere; }

  .journal { display: flex; flex-direction: column; gap: 10px; }
  .j-head { margin: 6px 0 0; font-size: 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .j-rule { font-size: 12.5px; font-weight: 400; color: var(--muted); }
  .j-note { margin: 0; font-size: 13.5px; color: var(--fg-soft); max-width: 46em; }
  .j-list { display: flex; flex-direction: column; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 10px; padding: 4px 16px; }
  .j-entry { padding: 9px 0; border-top: 1px dashed var(--rule); }
  .j-entry:first-child { border-top: none; }
  .j-title { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .j-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 28px; font-variant-numeric: tabular-nums; }
  .j-line { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 6px; font-size: 14px; line-height: 1.7; }
  .j-tag { color: var(--accent); font-weight: 700; }
  .j-amt { text-align: right; }
  @media (max-width: 540px) { .j-body { grid-template-columns: minmax(0, 1fr); } }

  .foot { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }

  .chips.range { align-items: center; }
  .range-l { font-size: 13px; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .lead a { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .je-q { border-top: 1px solid var(--rule); padding: 16px 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .je-q:first-child { border-top: none; padding-top: 4px; }
  .je-tag { font-size: 12px; color: var(--muted); font-weight: 700; }
  .je-text { margin: 0; font-size: 15px; line-height: 1.85; overflow-wrap: anywhere; }
  .je-text .qno { margin-right: 4px; }
  .je-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
  .je-h { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .jr { display: grid; grid-template-columns: minmax(0, 1fr) 7.5em; gap: 6px; margin-bottom: 6px; }
  .jr select, .jr input { width: 100%; min-width: 0; padding: 8px; font: inherit; font-size: 16px; line-height: 1.4; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
  .jr input { text-align: right; font-variant-numeric: tabular-nums; }
  .jr select:focus-visible, .jr input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .journal { border-top: 1px solid var(--rule); padding-top: 12px; }
  @media (max-width: 620px) { .je-grid { grid-template-columns: minmax(0, 1fr); } }

  @media (prefers-reduced-motion: no-preference) {
    .result:not([hidden]) { animation: rise 0.25s ease-out; }
    @keyframes rise { from { transform: translateY(6px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  }

  .j-side { display: flex; flex-direction: column; min-width: 0; }
  .j-acct { min-width: 0; overflow-wrap: anywhere; }
  .progress { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; margin-top: 6px; }
  .unit-h { font-size: 18px; margin: 10px 0 0; padding-bottom: 4px; border-bottom: 2px solid var(--line); color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
  a.tcard { text-decoration: none; color: inherit; gap: 8px; }
  a.tcard:hover { border-color: var(--accent); }
  .it-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .it-head h3 { margin: 0; font-size: 16.5px; }
  .tname { margin: 0; font-size: clamp(19px, 4vw, 23px); }
  .stars { color: var(--accent); letter-spacing: 1px; font-size: 13px; }
  .st-off { opacity: .25; }
  .tlead { margin: 0; font-size: 14px; color: var(--fg-soft); line-height: 1.75; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11.5px; padding: 1px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--fg-soft); }
  .tag.ok { background: var(--good-soft); color: var(--fg); font-weight: 700; }
  .back { color: var(--accent); font-weight: 700; text-decoration: none; font-size: 14px; }
  .thead { gap: 10px; }
  .seg a { font-size: 13.5px; line-height: 1.4; padding: 8px 14px; color: var(--fg-soft); text-decoration: none; }
  .seg a[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  [hidden] { display: none !important; }
  .thead .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; max-width: 480px; border-radius: 12px; }
  .thead .seg a { text-align: center; padding: 9px 6px; font-size: 13px; }
  .sec-h { margin: 6px 0 0; font-size: 15px; color: var(--accent); }
  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 8px; }
  ol.steps li { counter-increment: st; display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--rule); }
  ol.steps li::before { content: counter(st); grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  ol.steps li b { font-size: 14.5px; }
  ol.steps li span { font-size: 13.5px; color: var(--fg-soft); line-height: 1.7; }
  ol.steps li.blank { opacity: .45; border-style: dashed; }
  ol.steps li.is-ok { border-color: var(--good); background: var(--good-soft); }
  ol.steps li.is-ng { border-color: var(--bad); background: var(--bad-soft); }
  .traps, .facts, .calc { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.8; }
  .facts li { margin-bottom: 4px; }
  .ent { display: flex; flex-direction: column; gap: 4px; }
  .ent-n { font-size: 13px; font-weight: 700; color: var(--fg-soft); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn { text-decoration: none; display: inline-block; }
  .ask { margin: 0; font-size: 14px; color: var(--muted); }
  .pool { display: flex; flex-direction: column; gap: 8px; }
  .pcard { font: inherit; font-size: 14.5px; text-align: left; padding: 11px 14px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .pcard:hover { border-color: var(--accent); }
  .verdict { margin: 0; font-weight: 700; font-size: 16px; color: var(--bad); }
  .verdict.all { color: var(--good); }
  .stp { gap: 10px; }
  .stp.past { opacity: .82; }
  .stp-no { font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .stp-t { margin: 0; font-size: 16.5px; }
  .stp-d { margin: 0; font-size: 14px; color: var(--fg-soft); }
  .part { border-top: 1px solid var(--rule); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .p-l { font-weight: 700; font-size: 14.5px; }
  .p-ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .p-ctrl input { font: inherit; font-size: 16px; width: 11em; max-width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); text-align: right; }
  .p-ctrl select { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
  .unit { font-size: 13px; color: var(--muted); }
  .part.is-ok input, .part.is-ok select { border-color: var(--good); background: var(--good-soft); }
  .part.is-ng input, .part.is-ng select { border-color: var(--bad); background: var(--bad-soft); }

=\"#262626\" text-anchor=\"end\">960,000<\/text><text x=\"166\" y=\"234\" font-size=\"15\" fill=\"#c2410c\" text-anchor=\"middle\">=<\/text><\/svg>","notes":[["期首から売却日までの線を引き、当期の月数(6か月)を数える","rgba(255,205,0,0.55)"],["○を付けた60,000円が当期分の減価償却費","rgba(230,80,60,0.35)"],["売却損は最後に貸借の差額で出す。合計が960,000円で一致すれば完成",null]]}},{"id":"q2r","qno":"第2問","name":"連結会計","star":3,"time":"20分","lead":"タイムテーブルで資本とのれんを整理してから、連結修正を順番に積み上げます。","steps":[{"t":"タイムテーブルを書く","d":"支配獲得日、前期末、当期末の子会社の資本金・利益剰余金と、のれんを時系列に並べる。"},{"t":"のれんと非支配株主持分を出す","d":"支配獲得日に、親会社の投資と子会社の資本を相殺する。差額がのれん。"},{"t":"開始仕訳をまとめる","d":"前期までの利益の按分とのれん償却を、純資産の項目は「当期首残高」で引き継ぐ。"},{"t":"当期の連結修正をする","d":"のれん償却、子会社の利益の按分、子会社の配当の修正。"},{"t":"内部取引と未実現利益を消す","d":"売上と仕入、債権と債務、期首・期末の未実現利益。売り手が子会社なら非支配株主にも按分。"},{"t":"答案の金額を集計する","d":"個別財務諸表の合計に、連結修正を足し引きする。"}],"traps":["期首の未実現利益は、売上原価から引く(足すと向きが逆)","売り手が親会社(ダウンストリーム)なら、未実現利益は非支配株主に按分しない","子会社の配当のうち親会社の受取分は、受取配当金を消す"],"entries":[["開始仕訳",[["資本金当期首残高",30000],["利益剰余金当期首残高",21100],["のれん",2700]],[["S社株式",43000],["非支配株主持分当期首残高",10800]]],["期首の未実現利益",[["利益剰余金当期首残高",600]],[["売上原価",600]]],["期末の未実現利益",[["売上原価",1000]],[["商品",1000]]]],"facts":["金額の単位は千円である。P社は×1年3月31日にS社の発行済株式の80%を43,000千円で取得し、支配を獲得した。当期は×2年4月1日から×3年3月31日までである。","支配獲得時のS社の資本金は30,000千円、利益剰余金は20,000千円である。のれんは10年で定額法により償却する。","前期のS社の当期純利益は5,000千円、配当は1,000千円である。当期のS社の配当2,000千円のうち、P社の受取配当金は1,600千円である。","P社はS社に商品を販売している。当期の販売額は20,000千円、売上総利益率は20%である。S社の期末商品のうちP社から仕入れた分は5,000千円、期首商品のうちP社から仕入れた分は3,000千円である。","P社:売上高100,000、売上原価70,000、当期純利益15,000、利益剰余金の当期首残高30,000、配当5,000、当期末残高40,000","S社:売上高50,000、売上原価35,000、当期純利益6,000、利益剰余金の当期首残高24,000、配当2,000、当期末残高28,000"],"parts":[{"step":1,"label":"支配獲得時ののれん","ans":3000,"calc":["43,000 − (30,000 + 20,000) × 80% = 3,000"],"unit":"千円","dirs":null,"dir":null},{"step":2,"label":"非支配株主持分の当期首残高","ans":10800,"calc":["(30,000 + 24,000) × 20% = 10,800"],"unit":"千円","dirs":null,"dir":null},{"step":3,"label":"非支配株主に帰属する当期純利益","ans":1200,"calc":["6,000 × 20% = 1,200"],"unit":"千円","dirs":null,"dir":null},{"step":3,"label":"のれんの当期末残高","ans":2400,"calc":["3,000 − 300 × 2年 = 2,400"],"unit":"千円","dirs":null,"dir":null},{"step":4,"label":"連結損益計算書の売上原価","ans":85400,"calc":["70,000 + 35,000 − 20,000(内部取引) + 1,000(期末) − 600(期首) = 85,400"],"unit":"千円","dirs":null,"dir":null},{"step":5,"label":"親会社株主に帰属する当期純利益","ans":17500,"calc":["15,000 + 6,000 − 300 − 1,600 + 600 − 1,000 − 1,200 = 17,500"],"unit":"千円","dirs":null,"dir":null},{"step":5,"label":"連結貸借対照表の利益剰余金","ans":44800,"calc":["40,000 + 28,000 − 20,000 − 1,600 − 600 − 1,000 = 44,800","1,600は子会社の増加分8,000の20%、600はのれん償却2年分"],"unit":"千円","dirs":null,"dir":null}],"mfacts":["金額の単位は千円である。P社は{1|×1年3月31日}にS社の発行済株式の{2|80%を43,000千円で取得}し、支配を獲得した。当期は{1|×2年4月1日から×3年3月31日まで}である。","支配獲得時の{2|S社の資本金は30,000千円、利益剰余金は20,000千円}である。{3|のれんは10年で定額法により償却}する。","{3|前期のS社の当期純利益は5,000千円、配当は1,000千円}である。{4|当期のS社の配当2,000千円のうち、P社の受取配当金は1,600千円}である。","P社はS社に商品を販売している。{5|当期の販売額は20,000千円}、{5|売上総利益率は20%}である。{5|S社の期末商品のうちP社から仕入れた分は5,000千円}、{5|期首商品のうちP社から仕入れた分は3,000千円}である。","{6|P社:売上高100,000、売上原価70,000、当期純利益15,000、利益剰余金の当期首残高30,000、配当5,000、当期末残高40,000}","S社:売上高50,000、売上原価35,000、{4|当期純利益6,000}、{3|利益剰余金の当期首残高24,000}、配当2,000、当期末残高28,000"],"mnotes":["支配獲得日(×1/3/31)、前期末(×2/3/31)、当期末(×3/3/31)の3つの時点を並べる","のれん 43,000 − 50,000 × 80% = 3,000、非支配株主持分 50,000 × 20% = 10,000","前期の増加4,000の20%と、のれん償却300を当期首残高で引き継ぐ。非支配株主持分は 54,000 × 20% = 10,800","のれん償却300、利益の按分 6,000 × 20% = 1,200。配当は受取配当金1,600と非支配株主持分400を消す","売上と売上原価20,000を消す。未実現利益は期末 5,000 × 20% = 1,000、期首 3,000 × 20% = 600","P社とS社の金額を足し、連結修正を足し引きする"],"fig":{"title":"タイムテーブルで、子会社の資本とのれんを時点ごとに並べる","svg":"<svg viewBox=\"0 0 320 214\" role=\"img\" aria-label=\"連結会計のタイムテーブル\"><defs><marker id=\"ahf2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf2\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"234\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" num <\/text><text x=\"302\" y=\"80\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">28,000<\/text><text x=\"8\" y=\"108\" font-size=\"12\" fill=\"#262626\">合計<\/text><text x=\"142\" y=\"108\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">50,000<\/text><text x=\"222\" y=\"108\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">54,000<\/text><text x=\"302\" y=\"108\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">58,000<\/text><text x=\"8\" y=\"132\" font-size=\"12\" fill=\"#2554a8\">非支配20%<\/text><text x=\"142\" y=\"132\" font-size=\"13\" fill=\"#2554a8\" text-anchor=\"end\">10,000<\/text><text x=\"222\" y=\"132\" font-size=\"13\" fill=\"#2554a8\" text-anchor=\"end\">10,800<\/text><text x=\"302\" y=\"132\" font-size=\"13\" fill=\"#2554a8\" text-anchor=\"end\">11,600<\/text><text x=\"8\" y=\"152\" font-size=\"12\" fill=\"#c2410c\">のれん<\/text><text x=\"142\" y=\"152\" font-size=\"13\" fill=\"#c2410c\" text-anchor=\"end\">3,000<\/text><text x=\"222\" y=\"152\" font-size=\"13\" fill=\"#c2410c\" text-anchor=\"end\">2,700<\/text><text x=\"302\" y=\"152\" font-size=\"13\" fill=\"#c2410c\" text-anchor=\"end\">2,400<\/text><line x1=\"70\" y1=\"90\" x2=\"312\" y2=\"90\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf2)\" stroke-linecap=\"round\"/><text x=\"160\" y=\"176\" font-size=\"11\" fill=\"#c2410c\" text-anchor=\"middle\">−300<\/text><text x=\"240\" y=\"176\" font-size=\"11\" fill=\"#c2410c\" text-anchor=\"middle\">−300<\/text><text x=\"8\" y=\"202\" font-size=\"12\" fill=\"#262626\">43,000 − 50,000 × 80% =<\/text><text x=\"158\" y=\"202\" font-size=\"13\" fill=\"#c2410c\">3,000<\/text><ellipse cx=\"173\" cy=\"198\" rx=\"20\" ry=\"10\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf2)\" stroke-linecap=\"round\"/><\/svg>","notes":[["支配獲得日・前期末・当期末の3つの時点で、S社の資本金と利益剰余金を縦に書く",null],["資本の合計に20%を掛けたものが、その時点の非支配株主持分","rgba(90,150,255,0.38)"],["のれんは毎年300ずつ償却して減っていく","rgba(255,205,0,0.55)"],["支配獲得時ののれん:投資43,000 − 資本50,000 × 80% = 3,000","rgba(230,80,60,0.35)"]]}},{"id":"q2rw","qno":"第2問","name":"連結精算表","star":2,"time":"20分","lead":"個別財務諸表を横に並べ、修正消去欄に連結修正を書いて、行ごとに横に合計します。","steps":[{"t":"精算表の形を確かめる","d":"P社・S社・修正消去・連結の欄があり、損益計算書・株主資本等変動計算書・貸借対照表が上から並ぶ。"},{"t":"投資と資本を相殺する","d":"開始仕訳。のれんと非支配株主持分を出す。"},{"t":"当期の連結修正をする","d":"のれん償却、子会社の利益の按分、子会社の配当の修正。"},{"t":"内部取引と債権債務を消す","d":"売上と仕入、売掛金と買掛金を消し、消した売掛金の貸倒引当金も戻す。未実現利益も消す。"},{"t":"行ごとに横に合計する","d":"資産・負債・収益・費用は、個別の合計に修正を足し引きする。"},{"t":"純資産を下から集計する","d":"損益計算書の当期純利益を株主資本等変動計算書へ、その当期末残高を貸借対照表へ移す。"}],"traps":["売掛金を消したら、その分の貸倒引当金と貸倒引当金繰入も修正する","非支配株主持分の当期末残高は、当期首残高に利益の按分を足し、配当の按分を引く","利益剰余金の行は、横に足すのではなく、損益計算書から順に集計する"],"entries":[["開始仕訳",[["資本金当期首残高",20000],["利益剰余金当期首残高",10000],["のれん",3000]],[["S社株式",24000],["非支配株主持分当期首残高",9000]]],["債権債務の相殺",[["買掛金",4000]],[["売掛金",4000]]],["貸倒引当金の修正",[["貸倒引当金",80]],[["貸倒引当金繰入",80]]],["未実現利益",[["売上原価",500]],[["商品",500]]]],"facts":["金額の単位は千円である。P社は前期末にS社の発行済株式の70%を24,000千円で取得し、支配を獲得した。そのときのS社の資本金は20,000千円、利益剰余金は10,000千円である。のれんは10年で定額法により償却する。","当期のS社の当期純利益は4,000千円、配当は1,000千円(P社の受取配当金700千円)である。","当期のP社からS社への売上高は15,000千円で、S社の期末商品のうちP社から仕入れた分は2,500千円である。P社の売上総利益率は20%である。","P社の売掛金のうち4,000千円はS社に対するものである。P社は売掛金の期末残高に2%の貸倒引当金を設定している。","P社:売掛金30,000、商品8,000、売上高100,000、売上原価70,000、当期純利益12,000","S社:売掛金12,000、商品5,000、売上高40,000、売上原価29,000"],"parts":[{"step":1,"label":"のれん(開始仕訳)","ans":3000,"calc":["24,000 − (20,000 + 10,000) × 70% = 3,000"],"unit":"千円","dirs":null,"dir":null},{"step":1,"label":"非支配株主持分の当期首残高","ans":9000,"calc":["30,000 × 30% = 9,000"],"unit":"千円","dirs":null,"dir":null},{"step":2,"label":"非支配株主持分の当期末残高","ans":9900,"calc":["9,000 + 4,000 × 30% − 1,000 × 30% = 9,900"],"unit":"千円","dirs":null,"dir":null},{"step":3,"label":"連結貸借対照表の売掛金","ans":38000,"calc":["30,000 + 12,000 − 4,000 = 38,000"],"unit":"千円","dirs":null,"dir":null},{"step":3,"label":"連結損益計算書の売上原価","ans":84500,"calc":["70,000 + 29,000 − 15,000 + 500 = 84,500","未実現利益 2,500 × 20% = 500"],"unit":"千円","dirs":null,"dir":null},{"step":4,"label":"連結貸借対照表の商品","ans":12500,"calc":["8,000 + 5,000 − 500 = 12,500"],"unit":"千円","dirs":null,"dir":null},{"step":5,"label":"親会社株主に帰属する当期純利益","ans":13380,"calc":["12,000 + 4,000 − 300(のれん償却) − 700(受取配当金) − 500(未実現利益) + 80(貸倒引当金) − 1,200(非支配株主) = 13,380"],"unit":"千円","dirs":null,"dir":null}],"mfacts":["金額の単位は千円である。P社は前期末にS社の発行済株式の{2|70%を24,000千円で取得}し、支配を獲得した。そのときのS社の{2|資本金は20,000千円、利益剰余金は10,000千円}である。{3|のれんは10年で定額法により償却}する。","当期のS社の{3|当期純利益は4,000千円、配当は1,000千円(P社の受取配当金700千円)}である。","当期の{4|P社からS社への売上高は15,000千円}で、{4|S社の期末商品のうちP社から仕入れた分は2,500千円}である。P社の売上総利益率は20%である。","P社の売掛金のうち{4|4,000千円はS社に対するもの}である。P社は売掛金の期末残高に{4|2%の貸倒引当金}を設定している。","{1|P社:}売掛金30,000、商品8,000、売上高100,000、売上原価70,000、{6|当期純利益12,000}","{1|S社:}売掛金12,000、商品5,000、売上高40,000、売上原価29,000"],"mnotes":["P社とS社の個別の金額が、横に並んでいることを確かめる","のれん 24,000 − 30,000 × 70% = 3,000、非支配株主持分 30,000 × 30% = 9,000","のれん償却300、利益の按分 4,000 × 30% = 1,200、配当の按分300","売上と売上原価15,000、売掛金と買掛金4,000を消す。貸倒引当金80を戻し、未実現利益500を消す","売掛金 38,000、売上原価 84,500、商品 12,500","12,000 + 4,000 − 300 − 700 − 500 + 80 − 1,200 = 13,380"],"fig":{"title":"修正消去欄に連結修正を書き、行ごとに横に合計する","svg":"<svg viewBox=\"0 0 320 224\" role=\"img\" aria-label=\"連結精算表の下書き\"><defs><marker id=\"ahf15\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf15\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"244\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"15\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"90\" y=\"16\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">P社<\/text><text x=\"152\" y=\"16\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">S社<\/text><text x=\"222\" y=\"16\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">修正消去<\/text><text x=\"286\" y=\"16\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">連結<\/text><line x1=\"4\" y1=\"24\" x2=\"316\" y2=\"24\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf15)\" stroke-linecap=\"round\"/><line x1=\"62\" y1=\"6\" x2=\"62\" y2=\"170\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf15)\" stroke-linecap=\"round\"/><line x1=\"124\" y1=\"6\" x2=\"124\" y2=\"170\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf15)\" stroke-linecap=\"round\"/><line x1=\"186\" y1=\"6\" x2=\"186\" y2=\"170\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf15)\" stroke-linecap=\"round\"/><line x1=\"256\" y1=\"6\" x2=\"256\" y2=\"170\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf15)\" stroke-linecap=\"round\"/><rect x=\"258\" y=\"30\" width=\"58\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf15)\" stroke-linecap=\"round\"/><rect x=\"258\" y=\"54\" width=\"58\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf15)\" stroke-linecap=\"round\"/><rect x=\"258\" y=\"98\" width=\"58\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf15)\" stroke-linecap=\"round\"/><text x=\"6\" y=\"44\" font-size=\"11\" fill=\"#6a6a6a\">売掛金<\/text><text x=\"118\" y=\"44\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">30,000<\/text><text x=\"180\" y=\"44\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">12,000<\/text><text x=\"250\" y=\"44\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"end\">△4,000<\/text><text x=\"314\" y=\"44\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">38,000<\/text><text x=\"6\" y=\"68\" font-size=\"11\" fill=\"#6a6a6a\">売上原価<\/text><text x=\"118\" y=\"68\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">70,000<\/text><text x=\"180\" y=\"68\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">29,000<\/text><text x=\"250\" y=\"68\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"end\">△15,000<\/text><text x=\"314\" y=\"68\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">84,500<\/text><text x=\"6\" y=\"86\" font-size=\"11\" fill=\"#6a6a6a\"><\/text><text x=\"250\" y=\"86\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">+500<\/text><text x=\"6\" y=\"112\" font-size=\"11\" fill=\"#6a6a6a\">商品<\/text><text x=\"118\" y=\"112\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">8,000<\/text><text x=\"180\" y=\"112\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">5,000<\/text><text x=\"250\" y=\"112\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"end\">△500<\/text><text x=\"314\" y=\"112\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">12,500<\/text><text x=\"6\" y=\"136\" font-size=\"11\" fill=\"#6a6a6a\">のれん<\/text><text x=\"250\" y=\"136\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">3,000<\/text><text x=\"6\" y=\"154\" font-size=\"11\" fill=\"#6a6a6a\"><\/text><text x=\"250\" y=\"154\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"end\">△300<\/text><text x=\"314\" y=\"154\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">2,700<\/text><text x=\"4\" y=\"192\" font-size=\"12\" fill=\"#2554a8\">非支配 9,000 + 1,200 − 300 = 9,900<\/text><text x=\"4\" y=\"214\" font-size=\"11\" fill=\"#6a6a6a\">(千円)横に足して、修正を足し引き<\/text><\/svg>","notes":[["資産・負債・収益・費用の行は、P社 + S社 ± 修正消去で連結の金額になる","rgba(255,205,0,0.55)"],["債権債務の相殺、内部取引、未実現利益は、修正消去欄に△で書く","rgba(230,80,60,0.35)"],["非支配株主持分は、当期首残高 + 利益の按分 − 配当の按分","rgba(90,150,255,0.38)"]]}},{"id":"q2s","qno":"第2問","name":"株主資本等変動計算書","star":2,"time":"20分","lead":"取引を日付の順に仕訳し、列ごとに増減を書き込んでから縦に合計します。","steps":[{"t":"当期首残高を確かめる","d":"答案用紙の当期首残高の行を読み、どの列があるかを確認する。"},{"t":"取引を日付の順に仕訳する","d":"配当、増資、合併、振替などを1つずつ仕訳にする。"},{"t":"配当の準備金の積立額を出す","d":"「配当の10分の1」と「資本金の4分の1までの不足」の少ないほう。配当の時点の資本金で計算する。"},{"t":"列ごとに増減を書き込む","d":"減少は△をつける。積立や振替は純資産の中の移動なので合計は変わらない。"},{"t":"株主資本以外の項目を純額で書く","d":"その他有価証券評価差額金は「当期末 − 当期首」を税効果のあとで書く。"},{"t":"縦に合計して当期末残高を出す","d":"株主資本合計は、増資・合併・配当・利益だけで検算できる。"}],"traps":["増資の前の資本金で準備金の上限を計算する","合併で増える株主資本は、交付した株式の時価","評価差額金の欄に、差額の税効果前の金額を書かない"],"entries":[["配当と積立",[["繰越利益剰余金",1800000]],[["未払配当金",1500000],["利益準備金",100000],["別途積立金",200000]]],["吸収合併",[["諸資産",12000000],["のれん",1000000]],[["諸負債",7000000],["資本金",3000000],["資本準備金",1000000],["その他資本剰余金",2000000]]]],"facts":["当期首残高:資本金30,000,000円、資本準備金4,500,000円、その他資本剰余金800,000円、利益準備金2,900,000円、別途積立金600,000円、繰越利益剰余金5,000,000円、その他有価証券評価差額金140,000円","6月25日:繰越利益剰余金を財源とする配当1,500,000円を決議し、会社法に定める利益準備金を積み立て、別途積立金200,000円を積み立てる。","8月1日:新株500株を1株20,000円で発行し、資本金は会社法が認める最低額とした。","10月1日:Y社を吸収合併した。Y社の諸資産の時価は12,000,000円、諸負債の時価は7,000,000円。新株300株(時価1株20,000円)を交付し、資本金3,000,000円、資本準備金1,000,000円、残額をその他資本剰余金とした。","2月10日:資本準備金1,000,000円を取り崩し、その他資本剰余金に振り替えた。","3月31日:当期純利益2,800,000円を計上した。その他有価証券の時価は、当期首1,200,000円、当期末1,300,000円(取得原価1,000,000円、税率30%)である。"],"parts":[{"step":2,"label":"利益準備金の積立額","ans":100000,"calc":["配当の10分の1 = 150,000","30,000,000 × 1/4 − (4,500,000 + 2,900,000) = 100,000","少ないほうの100,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"新株の発行による資本金の増加","ans":5000000,"calc":["500株 × 20,000 = 10,000,000の2分の1"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"吸収合併によるその他資本剰余金の増加","ans":2000000,"calc":["300株 × 20,000 − 3,000,000 − 1,000,000 = 2,000,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"その他有価証券評価差額金の当期変動額","ans":70000,"calc":["当期末 300,000 × 70% = 210,000","当期首 200,000 × 70% = 140,000","210,000 − 140,000 = 70,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"繰越利益剰余金の当期末残高","ans":6000000,"calc":["5,000,000 − 1,600,000 − 200,000 + 2,800,000 = 6,000,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"純資産合計の当期末残高","ans":61310000,"calc":["株主資本 43,800,000 + 10,000,000 + 6,000,000 − 1,500,000 + 2,800,000 = 61,100,000","評価差額金 210,000 を足して 61,310,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["{1|当期首残高}:{3|資本金30,000,000円、資本準備金4,500,000円}、その他資本剰余金800,000円、{3|利益準備金2,900,000円}、別途積立金600,000円、繰越利益剰余金5,000,000円、{5|その他有価証券評価差額金140,000円}","{2|6月25日}:繰越利益剰余金を財源とする{3|配当1,500,000円}を決議し、{3|会社法に定める利益準備金を積み立て}、別途積立金200,000円を積み立てる。","{2|8月1日}:新株500株を1株20,000円で発行し、{4|資本金は会社法が認める最低額}とした。","{2|10月1日}:Y社を吸収合併した。Y社の諸資産の時価は12,000,000円、諸負債の時価は7,000,000円。新株300株(時価1株20,000円)を交付し、{4|資本金3,000,000円、資本準備金1,000,000円、残額をその他資本剰余金}とした。","{2|2月10日}:{4|資本準備金1,000,000円を取り崩し、その他資本剰余金に振り替えた}。","{2|3月31日}:{4|当期純利益2,800,000円}を計上した。{5|その他有価証券の時価は、当期首1,200,000円、当期末1,300,000円(取得原価1,000,000円、税率30%)}である。"],"mnotes":["当期首残高の行から、どの列があるかを確かめる","日付の順に、1つずつ仕訳にする","配当の10分の1(150,000)と、30,000,000 × 1/4 − (4,500,000 + 2,900,000) = 100,000 の少ないほう","増資は資本金と資本準備金に半分ずつ。合併の残額2,000,000はその他資本剰余金。振替は列の間の移動","当期末 300,000 × 70% = 210,000 と当期首140,000の差70,000を、1行で書く","列ごとに縦に足す。繰越利益剰余金は 5,000,000 − 1,800,000 + 2,800,000 = 6,000,000"],"fig":{"title":"列ごとに増減を書き込み、最後に縦に合計する","svg":"<svg viewBox=\"0 0 320 222\" role=\"img\" aria-label=\"株主資本等変動計算書の下書き\"><defs><marker id=\"ahf3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf3\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"242\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"3\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"4\" y=\"14\" font-size=\"10\" fill=\"#6a6a6a\">(千円)<\/text><text x=\"76\" y=\"30\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">資本金<\/text><text x=\"146\" y=\"30\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">資本準備金<\/text><text x=\"216\" y=\"30\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">利益準備金<\/text><text x=\"284\" y=\"30\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">繰越利益<\/text><line x1=\"4\" y1=\"38\" x2=\"316\" y2=\"38\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf3)\" stroke-linecap=\"round\"/><line x1=\"44\" y1=\"20\" x2=\"44\" y2=\"172\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf3)\" stroke-linecap=\"round\"/><line x1=\"114\" y1=\"20\" x2=\"114\" y2=\"172\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf3)\" stroke 200,000 − 200,000 + 45,000 = 45,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["会計期間は{1|4月1日から3月31日まで}。減価償却は定額法、残存価額ゼロ、間接法で、{4|期中の取得と売却は月割}で計算する。","期首の備品A:取得原価600,000円、{2|耐用年数6年}、{2|期首の減価償却累計額200,000円}","{1|10月1日}:備品Aを{3|330,000円で売却}し、代金は現金で受け取った。","{1|7月1日}:備品B({4|耐用年数8年})を480,000円で購入し、代金は当座預金で支払った。","{5|備品勘定と備品減価償却累計額勘定に記入}し、{6|締め切る}。"],"mnotes":["期首(4/1)・取得(7/1)・売却(10/1)・決算(3/31)を線に書く","備品Aの4月〜9月の6か月分で50,000","帳簿価額350,000と売却額330,000の差で、売却損20,000","備品Bの7月〜3月の9か月分で45,000","備品勘定に売却と購入、累計額勘定に売却と決算の償却を書く","備品は480,000、累計額は45,000を次期繰越にする"],"fig":{"title":"資産ごとに時系列の線を書き、勘定に日付の順で記入する","svg":"<svg viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"固定資産の時系列と備品勘定\"><defs><marker id=\"ahf16\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf16\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"260\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"16\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"4\" y=\"16\" font-size=\"12\" fill=\"#a8550a\">備品A<\/text><rect x=\"20\" y=\"30\" width=\"144\" height=\"12\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf16)\" stroke-linecap=\"round\"/><line x1=\"14\" y1=\"36\" x2=\"310\" y2=\"36\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf16)\" stroke-linecap=\"round\"/><line x1=\"20\" y1=\"28\" x2=\"20\" y2=\"44\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf16)\" stroke-linecap=\"round\"/><line x1=\"164\" y1=\"28\" x2=\"164\" y2=\"44\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf16)\" stroke-linecap=\"round\"/><line x1=\"308\" y1=\"28\" x2=\"308\" y2=\"44\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf16)\" stroke-linecap=\"round\"/><text x=\"20\" y=\"58\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">4/1<\/text><text x= a\">諸口<\/text><text x=\"296\" y=\"176\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">600,000<\/text><text x=\"166\" y=\"194\" font-size=\"10\" fill=\"#c2410c\">次期繰越<\/text><text x=\"296\" y=\"194\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"end\">480,000<\/text><line x1=\"26\" y1=\"204\" x2=\"156\" y2=\"204\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf16)\" stroke-linecap=\"round\"/><line x1=\"166\" y1=\"204\" x2=\"298\" y2=\"204\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf16)\" stroke-linecap=\"round\"/><text x=\"154\" y=\"222\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">1,080,000<\/text><text x=\"296\" y=\"222\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">1,080,000<\/text><\/svg>","notes":[["売却した備品Aは、期首から売却日までの6か月分","rgba(255,205,0,0.55)"],["期中に取得した備品Bは、取得日から決算日までの9か月分","rgba(90,150,255,0.38)"],["売却の相手科目が複数なら「諸口」。差額を次期繰越にして、合計をそろえる","rgba(230,80,60,0.35)"]]}},{"id":"q2c","qno":"第2問","name":"商品売買の勘定記入","star":1,"time":"15分","lead":"払出単価の方法に沿って売上原価を出し、期末に減耗損と評価損を引いてから、商品勘定を締め切ります。","steps":[{"t":"記帳の方法と払出単価を確かめる","d":"三分法か、販売のつど売上原価に振り替える方法か。先入先出法か移動平均法か。"},{"t":"仕入と払出を時系列で書き出す","d":"日付ごとに数量と単価を並べる(商品有高帳の形)。"},{"t":"払い出すたびに売上原価を出す","d":"先入先出法なら、古い単価の分から順に払い出す。"},{"t":"期末の帳簿棚卸高を出す","d":"最後に残った数量と単価で計算する。"},{"t":"棚卸減耗損と商品評価損を出す","d":"期末商品の箱を書き、減耗損は原価、評価損は実地数量で計算する。"},{"t":"商品勘定に記入して締め切る","d":"減耗損と評価損を引いた残りを次期繰越にする。"}],"traps":["売上原価は売価ではなく原価で計算する","先入先出法で単価が2つにまたがるときは、数量を分けて計算する","商品評価損は帳簿数量ではなく実地数量で計算する"],"entries":[["6月5日 販売",[["売掛金",400000],["売上原価",265000]],[["売上",400000],["商品",265000]]],["決算",[["棚卸減耗損",5750],["商品評価損",2250]],[["商品",8000]]]],"facts":["商品は、仕入れたときに商品勘定に記入し、販売したつど原価を売上原価勘定に振り替える方法で記帳している。払出単価は先入先出法による。","4月1日 前期繰越 100個 @1,000円","4月10日 仕入 300個 @1,100円","6月5日 売上 250個 @1,600円(掛け)","9月20日 仕入 200個 @1,150円","12月1日 売上 300個 @1,700円(掛け)","期末の実地数量は45個、正味売却価額は@1,100円である。"],"parts":[{"step":2,"label":"6月5日の売上原価","ans":265000,"calc":["100個 × 1,000 = 100,000","150個 × 1,100 = 165,000","合計 265,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"12月1日の売上原価","ans":337500,"calc":["150個 × 1,100 = 165,000","150個 × 1,150 = 172,500","合計 337,500"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"期末の帳簿棚卸高","ans":57500,"calc":["50個 × 1,150 = 57,500"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"棚卸減耗損","ans":5750,"calc":["(50 − 45)個 × 1,150 = 5,750"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"商品評価損","ans":2250,"calc":["45個 × (1,150 − 1,100) = 2,250"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"商品勘定の次期繰越","ans":49500,"calc":["57,500 − 5,750 − 2,250 = 49,500","45個 × 1,100 = 49,500"],"unit":"円","dirs":null,"dir":null}],"mfacts":["商品は、仕入れたときに商品勘定に記入し、{1|販売したつど原価を売上原価勘定に振り替える方法}で記帳している。払出単価は{1|先入先出法}による。","4月1日 {2|前期繰越 100個 @1,000円}","4月10日 {2|仕入 300個 @1,100円}","6月5日 {3|売上 250個} @1,600円(掛け)","9月20日 {2|仕入 200個 @1,150円}","12月1日 {3|売上 300個} @1,700円(掛け)","期末の{5|実地数量は45個、正味売却価額は@1,100円}である。"],"mnotes":["売上原価対立法なので、販売のたびに売上原価を記入する。払出は先入先出法","仕入れた順に、数量と単価を書き並べる","6月5日は100個@1,000と150個@1,100、12月1日は150個@1,100と150個@1,150","残りは50個@1,150で57,500","減耗損 5個 × 1,150 = 5,750、評価損 45個 × 50 = 2,250","商品勘定の次期繰越は49,500"],"fig":{"title":"古い単価の箱から順に払い出し、残りの箱を書いておく","svg":"<svg viewBox=\"0 0 320 246\" role=\"img\" aria-label=\"先入先出法の払出\"><defs><marker id=\"ahf17\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf17\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"266\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"17\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"4\" y=\"14\" font-size=\"12\" fill=\"#a8550a\">6/5 払出250個<\/text><rect x=\"10\" y=\"20\" width=\"80\" height=\"28\" rx=\"3\" fill=\"rgba(255,140,60,0.45)\" filter=\"url(#rgf17)\" stroke-linecap=\"round\"/><rect x=\"10\" y=\"20\" width=\"80\" height=\"28\ fill=\"rgba(255,140,60,0.45)\" filter=\"url(#rgf17)\" stroke-linecap=\"round\"/><rect x=\"120\" y=\"98\" width=\"110\" height=\"28\" fill=\"none\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf17)\" stroke-linecap=\"round\"/><text x=\"175.0\" y=\"111\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">150個<\/text><text x=\"175.0\" y=\"123\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">@1,150<\/text><rect x=\"230\" y=\"98\" width=\"80\" height=\"28\" rx=\"3\" fill=\"rgba(60,190,120,0.42)\" filter=\"url(#rgf17)\" stroke-linecap=\"round\"/><rect x=\"230\" y=\"98\" width=\"80\" height=\"28\" fill=\"none\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf17)\" stroke-linecap=\"round\"/><text x=\"270.0\" y=\"111\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">残50個<\/text><text x=\"270.0\" y=\"123\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">@1,150<\/text><text x=\"4\" y=\"144\" font-size=\"12\" fill=\"#262626\">165,000 + 172,500 = 337,500<\/text><text x=\"4\" y=\"172\" font-size=\"12\" fill=\"#16803c\">期末 50個 × 1,150 = 57,500<\/text><text x=\"4\" y=\"194\" font-size=\"12\" fill=\"#2554a8\">減耗 5個 × 1,150 = 5,750<\/text><text x=\"4\" y=\"214\" font-size=\"12\" fill=\"#c2410c\">評価損 45個 × 50 = 2,250<\/text><text x=\"316\" y=\"236\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">次期繰越 49,500<\/text><ellipse cx=\"262\" cy=\"231\" rx=\"56\" ry=\"12\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf17)\" stroke-linecap=\"round\"/><\/svg>","notes":[["払い出す数量が単価をまたぐときは、箱を2つに分けて計算する","rgba(255,140,60,0.45)"],["払い出したあとに残る箱を毎回書いておくと、次の払出で迷わない","rgba(90,150,255,0.38)"],["期末は、帳簿の残り − 減耗損 − 評価損 が次期繰越","rgba(60,190,120,0.42)"]]}},{"id":"q2b","qno":"第2問","name":"銀行勘定調整表","star":1,"time":"10分","lead":"不一致の原因を銀行側と当社側に分け、当社側だけ修正仕訳を書いて、両方の残高をそろえます。","steps":[{"t":"不一致の原因を銀行側と当社側に分ける","d":"時間外預入・未取付小切手は銀行側。未渡小切手・誤記入・連絡未通知は当社側。"},{"t":"銀行側の残高を調整する","d":"時間外預入は足す。未取付小切手は引く。仕訳はしない。"},{"t":"当社側の修正仕訳を書く","d":"未渡小切手は取り消し、誤記入は差額を直し、連絡未通知は記帳する。"},{"t":"当社側の残高を調整する","d":"修正仕訳の当座預金の増減を、帳簿残高に足し引きする。"},{"t":"両方の一致を確かめる","d":"銀行側と当社側の調整後の残高が同じになれば完成。貸借対照表にはこの金額を書く。"}],"traps":["時間外預入と未取付小切手は、当社の仕訳はしない","未渡小切手の相手は、買掛金なら買掛金、費用の支払いなら未払金","誤記入は、正しい金額との差額だけを修正する"],"entries":[["未渡小切手",[["当座預金",40000]],[["買掛金",40000]]],["誤記入",[["売掛金",27000]],[["当座預金",27000]]],["連絡未通知(引落し)",[["通信費",13000]],[["当座預金",13000]]],["連絡未通知(振込)",[["当座預金",60000]],[["売掛金",60000]]]],"facts":["決算日の当座預金の帳簿残高は520,000円、銀行の残高証明書の残高は610,000円で、不一致の原因は次のとおりである。","1. 決算日に預け入れた50,000円が、銀行の営業時間外のため翌日の入金として処理されていた。","2. 仕入先に振り出した小切手80,000円が、まだ銀行に呈示されていない。","3. 買掛金の支払いのために作成した小切手40,000円が、まだ仕入先に渡されていない。","4. 売掛金36,000円の当座振込を、63,000円と誤って記帳していた。","5. 電話代13,000円の引落しと、得意先からの売掛金60,000円の振込が、当社に未通知だった。"],"parts":[{"step":1,"label":"銀行側の調整後の残高","ans":580000,"calc":["610,000 + 50,000 − 80,000 = 580,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"誤記入の修正で減る当座預金","ans":27000,"calc":["63,000 − 36,000 = 27,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"当社側の調整後の残高","ans":580000,"calc":["520,000 + 40,000 − 27,000 − 13,000 + 60,000 = 580,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["決算日の当座預金の{4|帳簿残高は520,000円}、銀行の{2|残高証明書の残高は610,000円}で、不一致の原因は次のとおりである。","1. 決算日に預け入れた50,000円が、銀行の{1|営業時間外}のため翌日の入金として処理されていた。","2. 仕入先に振り出した小切手80,000円が、{1|まだ銀行に呈示されていない}。","3. 買掛金の支払いのために作成した小切手40,000円が、{3|まだ仕入先に渡されていない}。","4. 売掛金36,000円の当座振込を、{3|63,000円と誤って記帳}していた。","5. 電話代13,000円の引落しと、得意先からの売掛金60,000円の振込が、{3|当社に未通知}だった。"],"mnotes":["1.と2.は銀行側、3.〜5.は当社側の原因","610,000 + 50,000 − 80,000 = 580,000","未渡小切手は当座預金を戻し、誤記入は27,000を減らし、未通知の2つを記帳する","520,000 + 40,000 − 27,000 − 13,000 + 60,000 = 580,000","銀行側も当社側も580,000で一致"],"fig":{"title":"銀行側と当社側に分けて、両方の残高を調整する","svg":"<svg viewBox=\"0 0 320 226\" role=\"img\" aria-label=\"銀行勘定調整表の下書き\"><defs><marker id=\"ahf18\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marke \" filter=\"url(#rgf18)\" stroke-linecap=\"round\"/><line x1=\"170\" y1=\"158\" x2=\"312\" y2=\"158\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf18)\" stroke-linecap=\"round\"/><rect x=\"80\" y=\"164\" width=\"72\" height=\"20\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf18)\" stroke-linecap=\"round\"/><rect x=\"240\" y=\"164\" width=\"72\" height=\"20\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf18)\" stroke-linecap=\"round\"/><text x=\"150\" y=\"180\" font-size=\"14\" fill=\"#262626\" text-anchor=\"end\">580,000<\/text><text x=\"310\" y=\"180\" font-size=\"14\" fill=\"#262626\" text-anchor=\"end\">580,000<\/text><text x=\"160\" y=\"180\" font-size=\"16\" fill=\"#c2410c\" text-anchor=\"middle\">=<\/text><text x=\"10\" y=\"216\" font-size=\"12\" fill=\"#2554a8\">銀行側は仕訳なし<\/text><text x=\"170\" y=\"216\" font-size=\"12\" fill=\"#c2410c\">当社側だけ仕訳する<\/text><\/svg>","notes":[["時間外預入と未取付小切手は銀行側で調整し、当社は仕訳しない",null],["未渡小切手・誤記入・未通知は当社側で調整し、修正仕訳を書く","rgba(230,80,60,0.35)"],["両方が580,000円で一致すれば完成。貸借対照表の当座預金も580,000円","rgba(255,205,0,0.55)"]]}},{"id":"q2l","qno":"第2問","name":"リース取引","star":1,"time":"10分","lead":"計上額を決めてから、利息と減価償却を月割で出します。2027年4月からの試験では勘定科目の名前が変わります。","steps":[{"t":"リース取引の種類と方法を確かめる","d":"ファイナンス・リースかオペレーティング・リースか。利子抜き法か利子込み法か。"},{"t":"資産と債務の計上額を決める","d":"利子抜き法は見積現金購入価額。利子込み法はリース料の総額。"},{"t":"利息の総額と1年分を出す","d":"リース料の総額 − 計上額 が利息。定額法なら年数で割る。"},{"t":"決算で減価償却をする","d":"リース期間で、使った月数分を月割で計算する。"},{"t":"決算で未払利息を計上する","d":"前の支払日(契約日)から決算日までの利息を見越す。"},{"t":"支払日に債務と利息を分ける","d":"リース料 = 債務の返済分 + 支払利息。"}],"traps":["利子込み法では利息を分けないので、支払利息も未払利息も出てこない","契約日が期中なら、減価償却と未払利息は月割","2027年4月からの試験では、リース資産は使用権資産、リース債務はリース負債になる"],"entries":[["契約時(2027年3月までの試験)",[["リース資産",540000]],[["リース債務",540000]]],["契約時(2027年4月からの試験)",[["使用権資産",540000]],[["リース負債",540000]]],["決算:未払利息",[["支払利息",6000]],[["未払利息",6000]]]],"facts":["会計期間は4月1日から3月31日までである。","10月1日に、備品をファイナンス・リース契約で借りた。リース期間は5年、リース料は年額120,000円で、毎年9月30日に後払いする。","見積現金購入価額は540,000円で、利子抜き法で処理する。利息は定額法で各期に配分する。","減価償却は、耐用年数をリース期間とし、残存価額ゼロ、定額法、間接法で、月割で計算する。"],"parts":[{"step":1,"label":"計上する資産と債務の金額","ans":540000,"calc":["利子抜き法なので、見積現金購入価額の540,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"利息の1年分","ans":12000,"calc":["(120,000 × 5年 − 540,000) ÷ 5年 = 12,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"当期の減価償却費","ans":54000,"calc":["540,000 ÷ 5年 = 108,000","10月〜3月の6か月分 = 54,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"決算で計上する未払利息","ans":6000,"calc":["12,000 × 6 ÷ 12 = 6,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"翌期の9月30日に減る債務の金額","ans":108000,"calc":["120,000 − 12,000 = 108,000","支払利息は12,000(期首に未払利息6,000を再振替している)"],"unit":"円","dirs":null,"dir":null}],"mfacts":["会計期間は{4|4月1日から3月31日まで}である。","{4|10月1日}に、備品を{1|ファイナンス・リース契約}で借りた。{3|リース期間は5年、リース料は年額120,000円}で、{6|毎年9月30日に後払い}する。","{2|見積現金購入価額は540,000円}で、{1|利子抜き法}で処理する。{3|利息は定額法}で各期に配分する。","減価償却は、{4|耐用年数をリース期間とし}、残存価額ゼロ、定額法、間接法で、{5|月割}で計算する。"],"mnotes":["ファイナンス・リースで、利子抜き法","利子抜き法なので、計上額は見積現金購入価額の540,000","(600,000 − 540,000) ÷ 5年 = 12,000","10月〜3月の6か月分。540,000 ÷ 5年 × 6/12 = 54,000","10月1日から3月31日までの利息 12,000 × 6/12 = 6,000","翌期9月30日:リース債務108,000と支払利息12,000に分ける"],"fig":{"title":"契約日から決算日までの月数を数え、利息と償却を月割にする","svg":"<svg viewBox=\"0 0 320 236\" role=\"img\" aria-label=\"リース取引の下書き\"><defs><marker id=\"ahf19\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf19\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"256\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"19\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><line x1=\"14\" y1=\"44\" x2=\"310\" y2=\"44\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf19)\" stroke-linecap=\"round\"/><line x1=\"20\" y1=\"36\" x2=\"20\" y2=\"52\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf19)\" stroke-linecap=\"round\"/><text x=\"20\" y=\"16\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">4/1<\/text><text x=\"20\" y=\"30\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">期首<\/text><line x1=\"164\" y1=\"36\" x2=\"164\" y2=\"52\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf19)\" stroke-linecap=\"round\"/><text x=\"164\" y=\"16\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">10/1<\/text><text x=\"164\" y=\"30\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">契約<\/text><line x1=\"308\" y1=\"36\" x2=\"308\" y2=\"52\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf19)\" stroke-linecap=\"round\"/><text x=\"300\" y=\"16\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">3/31<\/text><text x=\"300\" y=\"30\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">決算<\/text><rect x=\"164\" y=\"56\" width=\"144\" height=\"14\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf19)\" stroke-linecap=\"round\"/><text x=\"236\" y=\"82\" font-size=\"12\" fill=\"#a8550a\" text-anchor=\"middle\">6か月<\/text><text x=\"4\" y=\"110\" font-size=\"12\" fill=\"#262626\">利息 120,000 × 5 − 540,000 = 60,000<\/text><text x=\"4\" y=\"130\" font-size=\"12\" fill=\"#262626\">1年分 60,000 ÷ 5 = 12,000<\/text><text x=\"4\" y=\"154\" font-size=\"12\" fill=\"#262626\">未払利息 12,000 × 6/12 =<\/text><text x=\"170\" y=\"154\" font-size=\"13\" fill=\"#c2410c\">6,000<\/text><ellipse cx=\"185\" cy=\"149\" rx=\"20\" ry=\"11\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf19)\" stroke-linecap=\"round\"/><text x=\"4\" y=\"178\" font-size=\"12\" fill=\"#262626\">償却 540,000 ÷ 5 × 6/12 =<\/text><text x=\"170\" y=\"178\" font-size=\"13\" fill=\"#c2410c\">54,000<\/text><ellipse cx=\"190\" cy=\"173\" rx=\"24\" ry=\"11\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf19)\" stroke-linecap=\"round\"/><text x=\"4\" y=\"208\" font-size=\"12\" fill=\"#2554a8\">リース資産 → 使用権資産<\/text><text x=\"4\" y=\"226\" font-size=\"12\" fill=\"#2554a8\">リース債務 → リース負債(2027年4月〜)<\/text><\/svg>","notes":[["契約日(10/1)から決算日までの6か月分が、当期の減価償却費と未払利息","rgba(255,205,0,0.55)"],["利子抜き法の利息は、リース料の総額 − 見積現金購入価額",null],["2027年4月からの試験では、勘定科目の名前が変わる","rgba(90,150,255,0.38)"]]}},{"id":"q2g","qno":"第2問","name":"外貨建取引","star":1,"time":"10分","lead":"取引日・決算日・決済日のレートを線に書き、どの項目をどのレートで換算するかを分けます。","steps":[{"t":"取引日のレートで円に換算する","d":"売上・仕入・売掛金・買掛金は、取引日のレートで記帳する。"},{"t":"前払金・前受金は受払時のレートのままにする","d":"手付金を払ったあとの仕入は、手付金の分を払ったときのレートで計算する。"},{"t":"決算で貨幣項目だけ換算替えする","d":"売掛金・買掛金・現金などは決算日のレート。商品・前払金などはそのまま。"},{"t":"換算の差額を為替差損益にまとめる","d":"資産が増えれば差益、負債が増えれば差損。"},{"t":"決済時は決算日のレートとの差を出す","d":"前期末に換算替えした項目は、決算日のレートと決済日のレートの差だけが損益になる。"}],"traps":["前払金(手付金)は換算替えしない","決算で換算替えするのは、売掛金・買掛金などの貨幣項目だけ","翌期の決済では、取引日ではなく決算日のレートと比べる"],"entries":[["3月1日 仕入",[["仕入",163500]],[["前払金",31500],["買掛金",132000]]],["決算:売掛金の換算替え",[["売掛金",8000]],[["為替差損益",8000]]],["決算:買掛金の換算替え",[["為替差損益",2400]],[["買掛金",2400]]]],"facts":["会計期間は4月1日から3月31日までである。","2月1日:商品2,000ドルを掛けで輸出した。レートは1ドル108円である。","2月20日:輸入する商品の手付金300ドルを現金で支払った。レートは1ドル105円である。","3月1日:商品1,500ドルを輸入し、手付金を差し引いた残額は掛けとした。レートは1ドル110円である。","3月31日:決算日のレートは1ドル112円である。","4月30日:2月1日の売掛金2,000ドルを現金で回収した。レートは1ドル111円である。"],"parts":[{"step":0,"label":"2月1日の売上","ans":216000,"calc":["2,000ドル × 108 = 216,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"3月1日の仕入","ans":163500,"calc":["手付金 300ドル × 105 = 31,500","残り 1,200ドル × 110 = 132,000","合計 163,500"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"貸借対照表の売掛金","ans":224000,"calc":["2,000ドル × 112 = 224,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"貸借対照表の買掛金","ans":134400,"calc":["1,200ドル × 112 = 134,400"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"決算の為替差損益","ans":5600,"calc":["売掛金 +8,000(差益)","買掛金 +2,400(差損)","8,000 − 2,400 = 5,600"],"unit":"円","dirs":["為替差益","為替差損"],"dir":"為替差益"},{"step":4,"label":"4月30日の為替差損益","ans":2000,"calc":["2,000ドル × (111 − 112) = −2,000"],"unit":"円","dirs":["為替差益","為替差損"],"dir":"為替差損"}],"mfacts":["会計期間は{4|4月1日から3月31日まで}である。","2月1日:商品2,000ドルを掛けで輸出した。レートは{1|1ドル108円}である。","2月20日:輸入する商品の{2|手付金300ドル}を現金で支払った。レートは{2|1ドル105円}である。","3月1日:商品1,500ドルを輸入し、{2|手付金を差し引いた残額は掛け}とした。レートは{1|1ドル110円}である。","3月31日:{3|決算日のレートは1ドル112円}である。","4月30日:2月1日の売掛金2,000ドルを現金で回収した。レートは{5|1ドル111円}である。"],"mnotes":["売上は 2,000 × 108、仕入の残り 1,200ドルは 110 で換算","手付金300ドルは、払ったときの105円のまま","売掛金と買掛金だけを112円に換算替え","売掛金 +8,000(差益)、買掛金 +2,400(差損)で、純額5,600の差益","決算日の112円と比べて、1円下がった分 2,000 が差損"],"fig":{"title":"取引日・決算日・決済日のレートを線に並べる","svg":"<svg viewBox=\"0 0 320 230\" role=\"img\" aria-label=\"外貨建取引のレートの線\"><defs><marker id=\"ahf20\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf20\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"250\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"20\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><line x1=\"10\" y1=\"50\" x2=\"310\" y2=\"50\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf20)\" stroke-linecap=\"round\"/><line x1=\"20\" y1=\"42\" x2=\"20\" y2=\"58\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf20)\" stroke-linecap=\"round\"/><text x=\"20\" y=\"18\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">2/1<\/text><text x=\"20\" y=\"34\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">売上<\/text><text x=\"20\" y=\"74\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">@108<\/text><line x1=\"80\" y1=\"42\" x2=\"80\" y2=\"58\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf20)\" stroke-linecap=\"round\"/><text x=\"80\" y=\"18\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">2/20<\/text><text x=\"80\" y=\"34\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">手付<\/text><text x=\"80\" y=\"74\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">@105<\/text><line x1=\"140\" y1=\"42\" x2=\"140\" y2=\"58\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf20)\" stroke-linecap=\"round\"/><text x=\"140\" y=\"18\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">3/1<\/text><text x=\"140\" y=\"34\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">仕入<\/text><text x=\"140\" y=\"74\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">@110<\/text><line x1=\"210\" y1=\"42\" x2=\"210\" y2=\"58\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf20)\" stroke-linecap=\"round\"/><text x=\"210\" y=\"18\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">3/31<\/text><text x=\"210\" y=\"34\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">決算<\/text><text x=\"210\" y=\"74\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"middle\">@112<\/text><line x1=\"290\" y1=\"42\" x2=\"290\" y2=\"58\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf20)\" stroke-linecap=\"round\"/><text x=\"290\" y=\"18\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">4/30<\/text><text x=\"290\" y=\"34\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">回収<\/text><text x=\"290\" y=\"74\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">@111<\/text><rect x=\"186\" y=\"62\" width=\"48\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf20)\" stroke-linecap=\"round\"/><text x=\"4\" y=\"104\" font-size=\"12\" fill=\"#262626\">仕入 300ドル × 105 + 1,200ドル × 110<\/text><text x=\"316\" y=\"122\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">= 163,500<\/text><text x=\"4\" y=\"148\" font-size=\"12\" fill=\"#16803c\">売掛金 2,000 × (112 − 108) = +8,000 差益<\/text><text x=\"4\" y=\"168\" font-size=\"12\" fill=\"#c2410c\">買掛金 1,200 × (112 − 110) = +2,400 差損<\/text><text x=\"4\" y=\"194\" font-size=\"12\" fill=\"#c2410c\">4/30 2,000 × (111 − 112) = −2,000 差損<\/text><text x=\"4\" y=\"220\" font-size=\"12\" fill=\"#2554a8\">手付金(前払金)は換算替えしない<\/text><\/svg>","notes":[["決算日のレート(112円)で換算替えするのは、売掛金と買掛金だけ","rgba(255,205,0,0.55)"],["手付金300ドルは、払ったときの105円のまま仕入原価に入る",null],["翌期の回収では、取引日ではなく決算日のレートと比べる","rgba(230,80,60,0.35)"]]}},{"id":"q2t","qno":"第2問","name":"税効果会計","star":1,"time":"10分","lead":"差異を「発生」と「解消」、「損益」と「純資産」に分けて、税率を掛けて整理します。","steps":[{"t":"差異の種類を分ける","d":"損金に入らなかった費用(将来減算)か、その他有価証券の評価差額か。"},{"t":"当期に発生した差異に税率を掛ける","d":"将来減算一時差異 × 税率 = 繰延税金資産の増加。"},{"t":"解消した差異を取り崩す","d":"前期の差異が当期に損金になったら、繰延税金資産を減らす。"},{"t":"法人税等調整額を純額で出す","d":"増えた繰延税金資産の分だけ、法人税等が減る。"},{"t":"その他有価証券は純資産で処理する","d":"評価差額の税金分は繰延税金負債。法人税等調整額は使わない。"},{"t":"貸借対照表で相殺して表示する","d":"繰延税金資産と繰延税金負債は、相殺して純額で表示する。"}],"traps":["その他有価証券の評価差額では、法人税等調整額を使わない","繰延税金資産が増えると、法人税等調整額は貸方(法人税等を減らす)","繰延税金資産と繰延税金負債は、相殺して表示する"],"entries":[["貸倒引当金の限度超過",[["繰延税金資産",12000]],[["法人税等調整額",12000]]],["商品評価損の解消",[["法人税等調整額",3000]],[["繰延税金資産",3000]]],["減価償却費の限度超過",[["繰延税金資産",9000]],[["法人税等調整額",9000]]],["その他有価証券の評価",[["その他有価証券",40000]],[["繰延税金負債",12000],["その他有価証券評価差額金",28000]]]],"facts":["法定実効税率は30%である。期首の繰延税金資産は3,000円で、すべて前期の商品評価損の損金不算入額10,000円に対するものである。","1. 当期に設定した貸倒引当金のうち40,000円は、損金に算入されなかった。","2. 前期に損金不算入とした商品評価損10,000円が、当期に損金に算入された。","3. 当期の減価償却費のうち30,000円は、損金算入の限度を超えていた。","4. その他有価証券(取得原価300,000円)の期末の時価は340,000円である。全部純資産直入法による。"],"parts":[{"step":1,"label":"1.で増える繰延税金資産","ans":12000,"calc":["40,000 × 30% = 12,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"3.で増える繰延税金資産","ans":9000,"calc":["30,000 × 30% = 9,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"2.で減る繰延税金資産","ans":3000,"calc":["10,000 × 30% = 3,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"法人税等調整額","ans":18000,"calc":["12,000 + 9,000 − 3,000 = 18,000","繰延税金資産が増えたので、法人税等から引く"],"unit":"円","dirs":["法人税等から引く","法人税等に足す"],"dir":"法人税等から引く"},{"step":4,"label":"その他有価証券評価差額金","ans":28000,"calc":["評価差額 340,000 − 300,000 = 40,000","40,000 × 70% = 28,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"貸借対照表の繰延税金資産","ans":9000,"calc":["繰延税金資産 3,000 − 3,000 + 12,000 + 9,000 = 21,000","繰延税金負債 12,000 と相殺して 9,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["{2|法定実効税率は30%}である。{3|期首の繰延税金資産は3,000円}で、すべて前期の商品評価損の損金不算入額10,000円に対するものである。","1. 当期に設定した貸倒引当金のうち{2|40,000円}は、{1|損金に算入されなかった}。","2. 前期に損金不算入とした商品評価損10,000円が、{3|当期に損金に算入された}。","3. 当期の減価償却費のうち{2|30,000円}は、{1|損金算入の限度を超えていた}。","4. その他有価証券(取得原価300,000円)の{5|期末の時価は340,000円}である。{5|全部純資産直入法}による。"],"mnotes":["1.と3.は将来減算一時差異の発生、2.はその解消、4.は純資産の差異","40,000 × 30% = 12,000、30,000 × 30% = 9,000","10,000 × 30% = 3,000を取り崩す","12,000 + 9,000 − 3,000 = 18,000 を法人税等から引く","評価差額40,000のうち、30%は繰延税金負債、70%は評価差額金","繰延税金資産21,000と繰延税金負債12,000を相殺して9,000"],"fig":{"title":"繰延税金資産のT字を書き、発生と解消を整理する","svg":"<svg viewBox=\"0 0 320 234\" role=\"img\" aria-label=\"税効果会計のT字\"><defs><marker id=\"ahf21\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf21\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"254\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"21\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"90\" y=\"18\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">繰延税金資産<\/text><line x1=\"5.0\" y1=\"25\" x2=\"175.0\" y2=\"25\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf21)\" stroke-linecap=\"round\"/><line x1=\"90\" y1=\"25\" x2=\"90\" y2=\"128\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf21)\" stroke-linecap=\"round\"/><text x=\"12\" y=\"44\" font-size=\"10\" fill=\"#6a6a6a\">期首<\/text><text x=\"84\" y=\"44\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">3,000<\/text><text x=\"12\" y=\"64\" font-size=\"10\" fill=\"#6a6a6a\">貸倒<\/text><text x=\"84\" y=\"64\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">12,000<\/text><text x=\"12\" y=\"84\" font-size=\"10\" fill=\"#6a6a6a\">償却<\/text><text x=\"84\" y=\"84\" font-size=\"12\" fill=\" 5)\" filter=\"url(#rgf22)\" stroke-linecap=\"round\"/><text x=\"243\" y=\"150\" font-size=\"11\" fill=\"#262626\">見積もる<\/text><text x=\"6\" y=\"186\" font-size=\"14\" fill=\"#a8550a\">オ<\/text><text x=\"28\" y=\"186\" font-size=\"12\" fill=\"#262626\">商品評価損<\/text><ellipse cx=\"58\" cy=\"182\" rx=\"36\" ry=\"11\" fill=\"none\" stroke=\"#16803c\" stroke-width=\"1.5\" filter=\"url(#rgf22)\" stroke-linecap=\"round\"/><text x=\"146\" y=\"186\" font-size=\"11\" fill=\"#6a6a6a\">棚卸減耗損<\/text><line x1=\"144\" y1=\"182\" x2=\"201\" y2=\"182\" stroke=\"#c2410c\" stroke-width=\"1.2\" filter=\"url(#rgf22)\" stroke-linecap=\"round\"/><rect x=\"240\" y=\"173\" width=\"72\" height=\"16\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf22)\" stroke-linecap=\"round\"/><text x=\"243\" y=\"186\" font-size=\"11\" fill=\"#262626\">単価が下がる<\/text><text x=\"6\" y=\"226\" font-size=\"12\" fill=\"#2554a8\">候補を2つに絞り、決め手の言葉で選ぶ<\/text><\/svg>","notes":[["正しいほうに○、もう1つに線を引いて消す",null],["「純資産の部」「当期の損益」など、答えを決める言葉に印を付ける","rgba(255,205,0,0.55)"],["最後に、同じ語句を2回使っていないかを確かめる",null]]}},{"id":"q3p","qno":"第3問","name":"損益計算書・貸借対照表","star":3,"time":"25分","lead":"決算整理事項を決まった順番で処理し、法人税等は必ず最後に計算します。","steps":[{"t":"未処理事項を先に片付ける","d":"売掛金の入金もれなど、残高そのものを変える事項を最初に処理する。"},{"t":"貸倒引当金を設定する","d":"修正したあとの売掛金で計算する。差額補充法なら残高を引く。"},{"t":"売上原価と棚卸減耗・評価損を出す","d":"減耗は原価で、評価損は実地数量で計算する。問題文の指示で表示場所を決める。"},{"t":"減価償却をする","d":"定率法は期首の帳簿価額に償却率を掛ける。期中取得は月割。"},{"t":"経過勘定を処理する","d":"次期の分は前払、当期の未払分は未払。問題用紙の試算表の横に増減をメモする。"},{"t":"税引前当期純利益を出し、最後に法人税等を計算する","d":"法人税等は、ほかの処理がすべて終わってから。"}],"traps":["未処理の入金を処理する前の売掛金で、貸倒引当金を計算しない","商品評価損を帳簿数量で計算しない","法人税等を先に計算すると、ほかの修正で金額が変わってしまう"],"entries":[["未処理事項",[["現金預金",50000]],[["売掛金",50000]]],["貸倒引当金",[["貸倒引当金繰入",10000]],[["貸倒引当金",10000]]],["法人税等",[["法人税、住民税及び事業税",151320]],[["仮払法人税等",30000],["未払法人税等",121320]]]],"facts":["会計期間は×1年4月1日から×2年3月31日までである。営業外損益と特別損益はない。","決算整理前の主な残高:現金預金500,000、売掛金800,000、繰越商品200,000、備品600,000、備品減価償却累計額150,000、貸倒引当金5,000、売上3,000,000、仕入1,800,000、給料500,000、保険料36,000、仮払法人税等30,000(単位:円)","1. 売掛金50,000円が当座預金に入金されていたが、未処理である。","2. 売掛金の期末残高に2%の貸倒引当金を差額補充法で設定する。","3. 期末商品の帳簿数量は400個(原価@600円)、実地数量は390個、正味売却価額は@560円である。棚卸減耗損は販売費及び一般管理費、商品評価損は売上原価に含める。","4. 備品は200%定率法(耐用年数5年、償却率40%)で減価償却する。","5. 保険料のうち12,000円は次期の分である。","6. 法人税等は税引前当期純利益の30%とする。"],"parts":[{"step":0,"label":"修正後の売掛金","ans":750000,"calc":["800,000 − 50,000 = 750,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"貸倒引当金繰入","ans":10000,"calc":["750,000 × 2% = 15,000","15,000 − 5,000 = 10,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"売上原価","ans":1775600,"calc":["200,000 + 1,800,000 − 240,000 + 15,600 = 1,775,600","商品評価損 = 390個 × (600 − 560) = 15,600"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"減価償却費","ans":180000,"calc":["(600,000 − 150,000) × 40% = 180,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"損益計算書の保険料","ans":24000,"calc":["36,000 − 12,000 = 24,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"営業利益","ans":504400,"calc":["売上総利益 3,000,000 − 1,775,600 = 1,224,400","販売費及び一般管理費 500,000 + 24,000 + 10,000 + 6,000 + 180,000 = 720,000","1,224,400 − 720,000 = 504,400"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"法人税、住民税及び事業税","ans":151320,"calc":["504,400 × 30% = 151,320"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"当期純利益","ans":353080,"calc":["504,400 − 151,320 = 353,080"],"unit":"円","dirs":null,"dir":null}],"mfacts":["会計期間は×1年4月1日から×2年3月31日までである。営業外損益と特別損益はない。","決算整理前の主な残高:現金預金500,000、売掛金800,000、繰越商品200,000、備品600,000、備品減価償却累計額150,000、貸倒引当金5,000、売上3,000,000、仕入1,800,000、給料500,000、保険料36,000、仮払法人税等30,000(単位:円)","1. {1|売掛金50,000円が当座預金に入金されていたが、未処理である。}","2. {2|売掛金の期末残高に2%の貸倒引当金を差額補充法で設定する。}","3. {3|期末商品の帳簿数量は400個(原価@600円)、実地数量は390個、正味売却価額は@560円である。棚卸減耗損は販売費及び一般管理費、商品評価損は売上原価に含める。}","4. {4|備品は200%定率法(耐用年数5年、償却率40%)で減価償却する。}","5. {5|保険料のうち12,000円は次期の分である。}","6. {6|法人税等は税引前当期純利益の30%とする。}"],"mnotes":["売掛金が 800,000 − 50,000 = 750,000 になる。2.より先に処理する","750,000 × 2% = 15,000、繰入は 15,000 − 5,000 = 10,000","棚卸減耗損 10個 × 600 = 6,000、商品評価損 390個 × 40 = 15,600","(600,000 − 150,000) × 40% = 180,000","前払保険料12,000。損益計算書の保険料は24,000","ほかをすべて処理したあとの 504,400 × 30% = 151,320"],"fig":{"title":"期末商品は、横が数量・縦が単価の箱を書く","svg":"<svg viewBox=\"0 0 320 244\" role=\"img\" aria-label=\"期末商品の評価の箱\"><defs><marker id=\"ahf5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf5\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"264\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"5\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><rect x=\"40\" y=\"70\" width=\"200\" height=\"80\" rx=\"3\" fill=\"rgba(60,190,120,0.42)\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><rect x=\"40\" y=\"40\" width=\"200\" height=\"30\" rx=\"3\" fill=\"rgba(255,120,165,0.42)\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><rect x=\"240\" y=\"40\" width=\"20\" height=\"110\" rx=\"3\" fill=\"rgba(90,150,255,0.38)\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><rect x=\"40\" y=\"40\" width=\"220\" height=\"110\" fill=\"none\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><line x1=\"40\" y1=\"70\" x2=\"240\" y2=\"70\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"40\" x2=\"240\" y2=\"150\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><text x=\"36\" y=\"45\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"end\">@600<\/text><text x=\"36\" y=\"75\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"end\">@560<\/text><text x=\"240\" y=\"166\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">実地390個<\/text><text x=\"262\" y=\"32\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">帳簿400個<\/text><text x=\"140\" y=\"60\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"middle\">評価損 15,600<\/text><text x=\"140\" y=\"108\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">商品<\/text><text x=\"140\" y=\"126\" font-size=\"14\" fill=\"#16803c\" text-anchor=\"middle\">218,400<\/text><text x=\"270\" y=\"96\" font-size=\"12\" fill=\"#2554a8\">減耗<\/text><text x=\"270\" y=\"112\" font-size=\"12\" fill=\"#2554a8\">6,000<\/text><text x=\"8\" y=\"192\" font-size=\"12\" fill=\"#262626\">減価償却 (600,000 − 150,000) × 40%<\/text><text x=\"312\" y=\"210\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">= 180,000<\/text><text x=\"8\" y=\"232\" font-size=\"12\" fill=\"#262626\">貸倒 750,000 × 2% − 5,000 = 10,000<\/text><\/svg>","notes":[["上の帯が商品評価損:実地数量390個 × (600 − 560)","rgba(255,120,165,0.42)"],["右の細い帯が棚卸減耗損:減った10個 × 原価600","rgba(90,150,255,0.38)"],["残りの部分が、貸借対照表の商品","rgba(60,190,120,0.42)"],["減価償却と貸倒引当金も、式を書いてから電卓を打つ",null]]}},{"id":"q3w","qno":"第3問","name":"精算表","star":2,"time":"25分","lead":"修正記入を書いてから、各行を損益計算書欄と貸借対照表欄に振り分けます。","steps":[{"t":"試算表欄の合計を確かめる","d":"借方と貸方の合計が一致しているかを最初に見る。"},{"t":"決算整理仕訳を修正記入欄に書く","d":"仕訳の借方を左、貸方を右の修正記入欄に書く。"},{"t":"新しい勘定を空欄に追加する","d":"貸倒引当金繰入、前払保険料、棚卸減耗損などを下の空欄に書き足す。"},{"t":"各行を損益計算書欄と貸借対照表欄に移す","d":"資産・負債・純資産は貸借対照表欄、収益・費用は損益計算書欄。修正記入を足し引きする。"},{"t":"当期純利益を差額で出す","d":"損益計算書欄の差額を、損益計算書欄の借方と貸借対照表欄の貸方に書く。"},{"t":"各欄の合計の一致を確かめる","d":"一致しなければ、修正記入の転記もれを探す。"}],"traps":["繰越商品の行は、期末の帳簿棚卸高から減耗と評価損を引いた金額","評価損を売上原価に含める指示なら、仕入の行で調整する","当期純利益は、損益計算書欄の借方と貸借対照表欄の貸方の両方に書く"],"entries":[["売上原価",[["仕入",200000],["繰越商品",240000]],[["繰越商品",200000],["仕入",240000]]],["減耗と評価損",[["棚卸減耗損",6000],["商品評価損",15600]],[["繰越商品",21600]]],["評価損を仕入へ",[["仕入",15600]],[["商品評価損",15600]]]],"facts":["会計期間は×1年4月1日から×2年3月31日までである。営業外損益と特別損益はなく、法人税等は考えない。","決算整理前の主な残高:現金預金500,000、売掛金800,000、繰越商品200,000、備品600,000、備品減価償却累計額150,000、貸倒引当金5,000、売上3,000,000、仕入1,800,000、給料500,000、保険料36,000(単位:円)","1. 売掛金50,000円が当座預金に入金されていたが、未処理である。","2. 売掛金の期末残高に2%の貸倒引当金を差額補充法で設定する。","3. 期末商品の帳簿数量は400個(原価@600円)、実地数量は390個、正味売却価額は@560円である。棚卸減耗損は販売費及び一般管理費、商品評価損は仕入の行で売上原価に含める。","4. 備品は200%定率法(耐用年数5年、償却率40%)で減価償却する。","5. 保険料のうち12,000円は次期の分である。"],"parts":[{"step":1,"label":"仕入の行の修正記入(借方の合計)","ans":215600,"calc":["期首商品 200,000 + 商品評価損 15,600 = 215,600"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"繰越商品の貸借対照表欄","ans":218400,"calc":["240,000 − 6,000 − 15,600 = 218,400"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"仕入の損益計算書欄","ans":1775600,"calc":["1,800,000 + 215,600 − 240,000 = 1,775,600"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"貸倒引当金の貸借対照表欄","ans":15000,"calc":["5,000 + 10,000 = 15,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"備品減価償却累計額の貸借対照表欄","ans":330000,"calc":["150,000 + 180,000 = 330,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"当期純利益","ans":504400,"calc":["収益 3,000,000 − 費用(1,775,600 + 500,000 + 24,000 + 10,000 + 6,000 + 180,000) = 504,400"],"unit":"円","dirs":null,"dir":null}],"mfacts":["会計期間は×1年4月1日から×2年3月31日までである。営業外損益と特別損益はなく、{5|法人税等は考えない}。","{1|決算整理前の主な残高:現金預金500,000、売掛金800,000、繰越商品200,000、備品600,000、備品減価償却累計額150,000、貸倒引当金5,000、売上3,000,000、仕入1,800,000、給料500,000、保険料36,000(単位:円)}","1. {2|売掛金50,000円が当座預金に入金されていたが、未処理である。}","2. {2|売掛金の期末残高に2%の貸倒引当金を差額補充法で設定する。}","3. {2|期末商品の帳簿数量は400個(原価@600円)、実地数量は390個、正味売却価額は@560円である。}{3|棚卸減耗損は販売費及び一般管理費}、{4|商品評価損は仕入の行で売上原価に含める。}","4. {2|備品は200%定率法(耐用年数5年、償却率40%)で減価償却する。}","5. {2|保険料のうち12,000円は次期の分である。}"],"mnotes":["試算表欄の借方と貸方の合計が一致しているかを見る","1.〜5.の決算整理仕訳を、行ごとに修正記入欄へ書く","棚卸減耗損・前払保険料・貸倒引当金繰入・減価償却費は、下の空いている行に書き足す","仕入の行は 1,800,000 + 215,600 − 240,000 = 1,775,600 を損益計算書欄へ","法人税等はないので、損益計算書欄の貸方 − 借方 = 504,400","4つの欄で、左右の合計を確かめる"],"fig":{"title":"仕入の行で売上原価を作り、各行を左右の欄に移す","svg":"<svg viewBox=\"0 0 320 232\" role=\"img\" aria-label=\"精算表の下書き\"><defs><marker id=\"ahf6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf6\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-
