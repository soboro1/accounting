<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>簿記2級 本番の解き方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
  /* Layout: 1カラムの答案用紙。問題ごとに借方・貸方の科目と金額を入力し、採点後に仕訳と計算を表示。ほかの出題パターンドリルと同じ紺×金、ライトテーマも用意 */
  :root {
    color-scheme: dark;
    --bg: #101b2d;
    --surface: #15233a;
    --surface-2: #0d1624;
    --fg: #f6f1e6;
    --fg-soft: #ddd6c7;
    --muted: #9aa5b1;
    --accent: #d4a24c;
    --accent-ink: #101b2d;
    --accent-soft: rgba(212, 162, 76, 0.16);
    --line: rgba(212, 162, 76, 0.36);
    --rule: rgba(246, 241, 230, 0.12);
    --good: #8cc152;
    --good-soft: rgba(140, 193, 82, 0.2);
    --bad: #ec7f56;
    --bad-soft: rgba(236, 127, 86, 0.2);
    --std-fill: rgba(212, 162, 76, 0.2);
    --c1: #d4a24c; --c2: #5fa8d3; --c3: #7cc6a4; --c4: #b39ddb; --c5: #ec7f56;
    --font: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #eef1f6; --surface: #ffffff; --surface-2: #f5f7fb;
      --fg: #14213a; --fg-soft: #33415a; --muted: #5b6678;
      --accent: #9a6a12; --accent-ink: #ffffff; --accent-soft: rgba(154, 106, 18, 0.1);
      --line: rgba(154, 106, 18, 0.35); --rule: rgba(20, 33, 58, 0.12);
      --good: #3d7a14; --good-soft: rgba(61, 122, 20, 0.12);
      --bad: #b8461f; --bad-soft: rgba(184, 70, 31, 0.12);
      --std-fill: rgba(154, 106, 18, 0.13);
      --c1: #b07d1a; --c2: #2f78a8; --c3: #2f8a63; --c4: #7a5fb0; --c5: #c0552b;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #eef1f6; --surface: #ffffff; --surface-2: #f5f7fb;
    --fg: #14213a; --fg-soft: #33415a; --muted: #5b6678;
    --accent: #9a6a12; --accent-ink: #ffffff; --accent-soft: rgba(154, 106, 18, 0.1);
    --line: rgba(154, 106, 18, 0.35); --rule: rgba(20, 33, 58, 0.12);
    --good: #3d7a14; --good-soft: rgba(61, 122, 20, 0.12);
    --bad: #b8461f; --bad-soft: rgba(184, 70, 31, 0.12);
    --std-fill: rgba(154, 106, 18, 0.13);
    --c1: #b07d1a; --c2: #2f78a8; --c3: #2f8a63; --c4: #7a5fb0; --c5: #c0552b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.8;
    -webkit-text-size-adjust: 100%;
  }
  .app {
    max-width: 860px; margin: 0 auto;
    padding-inline: 16px; padding-block: 28px 56px;
    display: flex; flex-direction: column; gap: 18px;
  }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; }
  .top > div:first-child { min-width: 0; flex: 1 1 420px; }
  .kicker { font-size: 12px; letter-spacing: 0.18em; color: var(--accent); font-weight: 700; }
  h1 { font-size: clamp(22px, 4.6vw, 28px); margin: 2px 0 0; line-height: 1.35; text-wrap: balance; }
  .lead { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; max-width: 42em; }
  .score { text-align: right; }
  .score-k { font-size: 12px; color: var(--muted); }
  .score-v { font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 500; line-height: 1.5;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--fg-soft);
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

  .paper {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px clamp(14px, 3vw, 26px);
    display: flex; flex-direction: column; gap: 14px; min-width: 0;
  }
  .badge {
    align-self: flex-start; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--accent); background: var(--accent-soft); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 14px;
  }
  .intro { margin: 0; font-size: 15.5px; }
  .freq { font-size: 12.5px; color: var(--muted); margin-top: -6px; }
  .facts { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
  .facts b { font-weight: 700; color: var(--fg); }

  .cost-card { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px 6px; background: var(--surface-2); max-width: 560px; }
  .cc-title { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .cc-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; column-gap: 14px; font-variant-numeric: tabular-nums; }
  .cc-grid > span { padding: 5px 0; border-top: 1px dashed var(--rule); font-size: 14px; }
  .cc-c { color: var(--muted); }
  .cc-v { text-align: right; font-weight: 500; }

  .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
  .figbox {
    margin: 0; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 10px;
    padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .figscroll { overflow-x: auto; }
  .figbox figcaption { font-size: 12px; color: var(--muted); padding: 0 4px; line-height: 1.6; }
  .fig { width: 100%; min-width: 330px; height: auto; display: block; }
  .fig text { font-family: var(--font); }
  .fig .t { fill: var(--fg); font-size: 13px; }
  .fig .ts { fill: var(--muted); font-size: 11.5px; }
  .fig .tb { fill: var(--fg); font-size: 13.5px; font-weight: 700; }
  .fig .ta { fill: var(--accent); font-size: 12px; font-weight: 700; }
  .fig .tu { fill: var(--bad); font-size: 12px; font-weight: 700; }
  .fig .tf { fill: var(--good); font-size: 12px; font-weight: 700; }
  .fig .box { fill: var(--surface); stroke: var(--fg-soft); stroke-width: 1.2; }
  .fig .div { stroke: var(--fg-soft); stroke-width: 1.2; }
  .fig .hl { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; }
  .fig .std { fill: var(--std-fill); stroke: var(--accent); stroke-width: 1.2; }
  .fig .vu { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.2; }
  .fig .ax { stroke: var(--muted); stroke-width: 1.2; }
  .fig .bar { fill: var(--muted); fill-opacity: 0.5; }
  .fig .bar-hit { fill: var(--accent); }
  .fig .arr { stroke: var(--muted); stroke-width: 1.4; }
  .fig .mk { fill: var(--muted); }
  .fig .frame { fill: none; stroke: var(--fg-soft); stroke-width: 1.2; }
  .fig .lead { fill: none; stroke: var(--muted); stroke-width: 1; }
  .fig .s0 { fill: var(--c1); }
  .fig .s1 { fill: var(--c2); }
  .fig .s2 { fill: var(--c3); }
  .fig .s3 { fill: var(--c5); }

  .lad-title { font-size: 13.5px; font-weight: 700; padding: 2px 4px 0; }
  .ladder { display: flex; flex-direction: column; padding: 4px; font-variant-numeric: tabular-nums; }
  .rung { border: 1px solid var(--line); background: var(--std-fill); border-radius: 8px; padding: 7px 12px; }
  .rung-k { font-size: 12px; color: var(--muted); }
  .rung-v { font-size: 13.5px; overflow-wrap: anywhere; }
  .step { position: relative; margin-left: 22px; padding: 8px 0 10px 18px; border-left: 2px solid var(--muted); font-size: 13.5px; }
  .step::after {
    content: ''; position: absolute; left: -7px; bottom: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--muted);
  }
  .step.u b { color: var(--bad); }
  .step.f b { color: var(--good); }
  .step.n b { color: var(--fg); }
  .rung.mark { border: 2px solid var(--accent); background: var(--accent-soft); }

  /* タイムテーブル・換算表・財務諸表 */
  .tbl { width: 100%; min-width: 320px; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .tbl th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  .tbl td { padding: 5px 8px; text-align: right; border-bottom: 1px dashed var(--rule); white-space: nowrap; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; white-space: normal; }
  .tbl td.l { text-align: left; }
  .tbl tr.sum td { border-top: 1px solid var(--fg-soft); font-weight: 700; }
  .tbl tr.hl td { color: var(--accent); font-weight: 700; }
  .tbl tr:last-child td { border-bottom: none; }

  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt {
    font: inherit; font-size: 14px; line-height: 1.4; padding: 7px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--fg-soft);
  }
  .opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sheet-head { font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .hint { font-size: 12.5px; color: var(--muted); font-weight: 400; }
  .sheet { display: flex; flex-direction: column; }
  .ans-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
    gap: 8px 16px; padding: 12px 0; border-top: 1px solid var(--rule);
  }
  .ans-row:first-child { border-top: none; padding-top: 4px; }
  .ans-row.choice { grid-template-columns: minmax(0, 1fr); }
  .ans-label { font-weight: 500; }
  .qno { display: inline-block; min-width: 2.8em; color: var(--accent); font-weight: 700; font-size: 13px; }
  .ans-ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ans-ctrl input {
    width: 10.5em; padding: 8px 12px; font: inherit; font-size: 16px; line-height: 1.4;
    border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .ans-ctrl input::placeholder { color: var(--muted); opacity: 0.7; }
  .yen { color: var(--muted); font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 13.5px; line-height: 1.4; padding: 7px 14px;
    background: transparent; color: var(--fg-soft); border: none; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .fb { grid-column: 1 / -1; font-size: 13.5px; font-weight: 500; }
  .fb.ok { color: var(--good); }
  .fb.ng { color: var(--bad); }
  @media (max-width: 560px) { .ans-row { grid-template-columns: minmax(0, 1fr); } }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: 15px; font-weight: 700; line-height: 1.4;
    padding: 11px 22px; border-radius: 999px; cursor: pointer; border: 1px solid var(--accent);
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: transparent; color: var(--accent); }
  .btn-quiet { background: transparent; color: var(--muted); border-color: var(--rule); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .ans-ctrl input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .err { color: var(--bad); font-size: 13.5px; }

  .result { display: flex; flex-direction: column; gap: 14px; }
  .verdict { font-size: 17px; font-weight: 700; }
  .verdict.all { color: var(--good); }
  .sol {
    background: var(--surface-2); border: 1px solid var(--rule); border-radius: 10px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; font-variant-numeric: tabular-nums;
  }
  .sol h4 { margin: 12px 0 2px; font-size: 13.5px; color: var(--accent); letter-spacing: 0.04em; }
  .sol h4:first-child { margin-top: 0; }
  .sol p { margin: 0; font-size: 14px; line-height: 1.75; overflow-wrap: anywhere; }

  .journal { display: flex; flex-direction: column; gap: 10px; }
  .j-head { margin: 6px 0 0; font-size: 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .j-rule { font-size: 12.5px; font-weight: 400; color: var(--muted); }
  .j-note { margin: 0; font-size: 13.5px; color: var(--fg-soft); max-width: 46em; }
  .j-list { display: flex; flex-direction: column; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 10px; padding: 4px 16px; }
  .j-entry { padding: 9px 0; border-top: 1px dashed var(--rule); }
  .j-entry:first-child { border-top: none; }
  .j-title { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .j-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 28px; font-variant-numeric: tabular-nums; }
  .j-line { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 6px; font-size: 14px; line-height: 1.7; }
  .j-tag { color: var(--accent); font-weight: 700; }
  .j-amt { text-align: right; }
  @media (max-width: 540px) { .j-body { grid-template-columns: minmax(0, 1fr); } }

  .foot { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }

  .chips.range { align-items: center; }
  .range-l { font-size: 13px; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .lead a { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .je-q { border-top: 1px solid var(--rule); padding: 16px 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .je-q:first-child { border-top: none; padding-top: 4px; }
  .je-tag { font-size: 12px; color: var(--muted); font-weight: 700; }
  .je-text { margin: 0; font-size: 15px; line-height: 1.85; overflow-wrap: anywhere; }
  .je-text .qno { margin-right: 4px; }
  .je-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
  .je-h { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .jr { display: grid; grid-template-columns: minmax(0, 1fr) 7.5em; gap: 6px; margin-bottom: 6px; }
  .jr select, .jr input { width: 100%; min-width: 0; padding: 8px; font: inherit; font-size: 16px; line-height: 1.4; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
  .jr input { text-align: right; font-variant-numeric: tabular-nums; }
  .jr select:focus-visible, .jr input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .journal { border-top: 1px solid var(--rule); padding-top: 12px; }
  @media (max-width: 620px) { .je-grid { grid-template-columns: minmax(0, 1fr); } }

  @media (prefers-reduced-motion: no-preference) {
    .result:not([hidden]) { animation: rise 0.25s ease-out; }
    @keyframes rise { from { transform: translateY(6px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  }

  .j-side { display: flex; flex-direction: column; min-width: 0; }
  .j-acct { min-width: 0; overflow-wrap: anywhere; }
  .progress { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; margin-top: 6px; }
  .unit-h { font-size: 18px; margin: 10px 0 0; padding-bottom: 4px; border-bottom: 2px solid var(--line); color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
  a.tcard { text-decoration: none; color: inherit; gap: 8px; }
  a.tcard:hover { border-color: var(--accent); }
  .it-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .it-head h3 { margin: 0; font-size: 16.5px; }
  .tname { margin: 0; font-size: clamp(19px, 4vw, 23px); }
  .stars { color: var(--accent); letter-spacing: 1px; font-size: 13px; }
  .st-off { opacity: .25; }
  .tlead { margin: 0; font-size: 14px; color: var(--fg-soft); line-height: 1.75; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11.5px; padding: 1px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--fg-soft); }
  .tag.ok { background: var(--good-soft); color: var(--fg); font-weight: 700; }
  .back { color: var(--accent); font-weight: 700; text-decoration: none; font-size: 14px; }
  .thead { gap: 10px; }
  .seg a { font-size: 13.5px; line-height: 1.4; padding: 8px 14px; color: var(--fg-soft); text-decoration: none; }
  .seg a[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  [hidden] { display: none !important; }
  .thead .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; max-width: 480px; border-radius: 12px; }
  .thead .seg a { text-align: center; padding: 9px 6px; font-size: 13px; }
  .sec-h { margin: 6px 0 0; font-size: 15px; color: var(--accent); }
  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 8px; }
  ol.steps li { counter-increment: st; display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--rule); }
  ol.steps li::before { content: counter(st); grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  ol.steps li b { font-size: 14.5px; }
  ol.steps li span { font-size: 13.5px; color: var(--fg-soft); line-height: 1.7; }
  ol.steps li.blank { opacity: .45; border-style: dashed; }
  ol.steps li.is-ok { border-color: var(--good); background: var(--good-soft); }
  ol.steps li.is-ng { border-color: var(--bad); background: var(--bad-soft); }
  .traps, .facts, .calc { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.8; }
  .facts li { margin-bottom: 4px; }
  .ent { display: flex; flex-direction: column; gap: 4px; }
  .ent-n { font-size: 13px; font-weight: 700; color: var(--fg-soft); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn { text-decoration: none; display: inline-block; }
  .ask { margin: 0; font-size: 14px; color: var(--muted); }
  .pool { display: flex; flex-direction: column; gap: 8px; }
  .pcard { font: inherit; font-size: 14.5px; text-align: left; padding: 11px 14px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .pcard:hover { border-color: var(--accent); }
  .verdict { margin: 0; font-weight: 700; font-size: 16px; color: var(--bad); }
  .verdict.all { color: var(--good); }
  .stp { gap: 10px; }
  .stp.past { opacity: .82; }
  .stp-no { font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .stp-t { margin: 0; font-size: 16.5px; }
  .stp-d { margin: 0; font-size: 14px; color: var(--fg-soft); }
  .part { border-top: 1px solid var(--rule); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .p-l { font-weight: 700; font-size: 14.5px; }
  .p-ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .p-ctrl input { font: inherit; font-size: 16px; width: 11em; max-width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); text-align: right; }
  .p-ctrl select { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
  .unit { font-size: 13px; color: var(--muted); }
  .part.is-ok input, .part.is-ok select { border-color: var(--good); background: var(--good-soft); }
  .part.is-ng input, .part.is-ng select { border-color: var(--bad); background: var(--bad-soft); }

"105\" rx=\"25\" ry=\"11\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf1)\" stroke-linecap=\"round\"/><text x=\"10\" y=\"136\" font-size=\"11\" fill=\"#6a6a6a\">(借)<\/text><text x=\"170\" y=\"136\" font-size=\"11\" fill=\"#6a6a6a\">(貸)<\/text><line x1=\"160\" y1=\"126\" x2=\"160\" y2=\"212\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf1)\" stroke-linecap=\"round\"/><text x=\"14\" y=\"154\" font-size=\"13\" fill=\"#262626\">累計額<\/text><text x=\"154\" y=\"154\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">360,000<\/text><text x=\"14\" y=\"172\" font-size=\"13\" fill=\"#262626\">減価償却費<\/text><text x=\"154\" y=\"172\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">60,000<\/text><text x=\"14\" y=\"190\" font-size=\"13\" fill=\"#262626\">未収入金<\/text><text x=\"154\" y=\"190\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">500,000<\/text><text x=\"14\" y=\"208\" font-size=\"13\" fill=\"#c2410c\">売却損<\/text><text x=\"154\" y=\"208\" font-size=\"13\" fill=\"#c2410c\" text-anchor=\"end\">40,000<\/text><text x=\"176\" y=\"154\" font-size=\"13\" fill=\"#262626\">備品<\/text><text x=\"310\" y=\"154\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">960,000<\/text><text x=\"68\" y=\"208\" font-size=\"10\" fill=\"#c2410c\">差額<\/text><line x1=\"14\" y1=\"214\" x2=\"154\" y2=\"214\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf1)\" stroke-linecap=\"round\"/><line x1=\"176\" y1=\"214\" x2=\"312\" y2=\"214\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf1)\" stroke-linecap=\"round\"/><rect x=\"100\" y=\"220\" width=\"56\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf1)\" stroke-linecap=\"round\"/><rect x=\"256\" y=\"220\" width=\"56\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf1)\" stroke-linecap=\"round\"/><text x=\"154\" y=\"234\" font-size=\"14\" fill=\"#262626\" text-anchor=\"end\">960,000<\/text><text x=\"310\" y=\"234\" font-size=\"14\" fill=\"#262626\" text-anchor=\"end\">960,000<\/text><text x=\"166\" y=\"234\" font-size=\"15\" fill=\"#c2410c\" text-anchor=\"middle\">=<\/text><\/svg>","notes":[["期首から売却日までの線を引き、当期の月数(6か月)を数える","rgba(255,205,0,0.55)"],["○を付けた60,000円が当期分の減価償却費","rgba(230,80,60,0.35)"],["売却損は最後に貸借の差額で出す。合計が960,000円で一致すれば完成",null]]}},{"id":"q2r","qno":"第2問","name":"連結会計","star":3,"time":"20分","lead":"タイムテーブルで資本とのれんを整理してから、連結修正を順番に積み上げます。","steps":[{"t":"タイムテーブルを書く","d":"支配獲得日、前期末、当期末の子会社の資本金・利益剰余金と、のれんを時系列に並べる。"},{"t":"のれんと非支配株主持分を出す","d":"支配獲得日に、親会社の投資と子会社の資本を相殺する。差額がのれん。"},{"t":"開始仕訳をまとめる","d":"前期までの利益の按分とのれん償却を、純資産の項目は「当期首残高」で引き継ぐ。"},{"t":"当期の連結修正をする","d":"のれん償却、子会社の利益の按分、子会社の配当の修正。"},{"t":"内部取引と未実現利益を消す","d":"売上と仕入、債権と債務、期首・期末の未実現利益。売り手が子会社なら非支配株主にも按分。"},{"t":"答案の金額を集計する","d":"個別財務諸表の合計に、連結修正を足し引きする。"}],"traps":["期首の未実現利益は、売上原価から引く(足すと向きが逆)","売り手が親会社(ダウンストリーム)なら、未実現利益は非支配株主に按分しない","子会社の配当のうち親会社の受取分は、受取配当金を消す"],"entries":[["開始仕訳",[["資本金当期首残高",30000],["利益剰余金当期首残高",21100],["のれん",2700]],[["S社株式",43000],["非支配株主持分当期首残高",10800]]],["期首の未実現利益",[["利益剰余金当期首残高",600]],[["売上原価",600]]],["期末の未実現利益",[["売上原価",1000]],[["商品",1000]]]],"facts":["金額の単位は千円である。P社は×1年3月31日にS社の発行済株式の80%を43,000千円で取得し、支配を獲得した。当期は×2年4月1日から×3年3月31日までである。","支配獲得時のS社の資本金は30,000千円、利益剰余金は20,000千円である。のれんは10年で定額法により償却する。","前期のS社の当期純利益は5,000千円、配当は1,000千円である。当期のS社の配当2,000千円のうち、P社の受取配当金は1,600千円である。","P社はS社に商品を販売している。当期の販売額は20,000千円、売上総利益率は20%である。S社の期末商品のうちP社から仕入れた分は5,000千円、期首商品のうちP社から仕入れた分は3,000千円である。","P社:売上高100,000、売上原価70,000、当期純利益15,000、利益剰余金の当期首残高30,000、配当5,000、当期末残高40,000","S社:売上高50,000、売上原価35,000、当期純利益6,000、利益剰余金の当期首残高24,000、配当2,000、当期末残高28,000"],"parts":[{"step":1,"label":"支配獲得時ののれん","ans":3000,"calc":["43,000 − (30,000 + 20,000) × 80% = 3,000"],"unit":"千円","dirs":null,"dir":null},{"step":2,"label":"非支配株主持分の当期首残高","ans":10800,"calc":["(30,000 + 24,000) × 20% = 10,800"],"unit":"千円","dirs":null,"dir":null},{"step":3,"label":"非支配株主に帰属する当期純利益","ans":1200,"calc":["6,000 × 20% = 1,200"],"unit":"千円","dirs":null,"dir":null},{"step":3,"label":"のれんの当期末残高","ans":2400,"calc":["3,000 − 300 × 2年 = 2,400"],"unit":"千円","dirs":null,"dir":null},{"step":4,"label":"連結損益計算書の売上原価","ans":85400,"calc":["70,000 + 35,000 − 20,000(内部取引) + 1,000(期末) − 600(期首) = 85,400"],"unit":"千円","dirs":null,"dir":null},{"step":5,"label":"親会社株主に帰属する当期純利益","ans":17500,"calc":["15,000 + 6,000 − 300 − 1,600 + 600 − 1,000 − 1,200 = 17,500"],"unit":"千円","dirs":null,"dir":null},{"step":5,"label":"連結貸借対照表の利益剰余金","ans":44800,"calc":["40,000 + 28,000 − 20,000 − 1,600 − 600 − 1,000 = 44,800","1,600は子会社の増加分8,000の20%、600はのれん償却2年分"],"unit":"千円","dirs":null,"dir":null}],"mfacts":["金額の単位は千円である。P社は{1|×1年3月31日}にS社の発行済株式の{2|80%を43,000千円で取得}し、支配を獲得した。当期は{1|×2年4月1日から×3年3月31日まで}である。","支配獲得時の{2|S社の資本金は30,000千円、利益剰余金は20,000千円}である。{3|のれんは10年で定額法により償却}する。","{3|前期のS社の当期純利益は5,000千円、配当は1,000千円}である。{4|当期のS社の配当2,000千円のうち、P社の受取配当金は1,600千円}である。","P社はS社に商品を販売している。{5|当期の販売額は20,000千円}、{5|売上総利益率は20%}である。{5|S社の期末商品のうちP社から仕入れた分は5,000千円}、{5|期首商品のうちP社から仕入れた分は3,000千円}である。","{6|P社:売上高100,000、売上原価70,000、当期純利益15,000、利益剰余金の当期首残高30,000、配当5,000、当期末残高40,000}","S社:売上高50,000、売上原価35,000、{4|当期純利益6,000}、{3|利益剰余金の当期首残高24,000}、配当2,000、当期末残高28,000"],"mnotes":["支配獲得日(×1/3/31)、前期末(×2/3/31)、当期末(×3/3/31)の3つの時点を並べる","のれん 43,000 − 50,000 × 80% = 3,000、非支配株主持分 50,000 × 20% = 10,000","前期の増加4,000の20%と、のれん償却300を当期首残高で引き継ぐ。非支配株主持分は 54,000 × 20% = 10,800","のれん償却300、利益の按分 6,000 × 20% = 1,200。配当は受取配当金1,600と非支配株主持分400を消す","売上と売上原価20,000を消す。未実現利益は期末 5,000 × 20% = 1,000、期首 3,000 × 20% = 600","P社とS社の金額を足し、連結修正を足し引きする"],"fig":{"title":"タイムテーブルで、子会社の資本とのれんを時点ごとに並べる","svg":"<svg viewBox=\"0 0 320 214\" role=\"img\" aria-label=\"連結会計のタイムテーブル\"><defs><marker id=\"ahf2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf2\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"234\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"2\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"120\" y=\"16\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">×1/3/31<\/text><text x=\"120\" y=\"34\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">支配獲得<\/text><text x=\"200\" y=\"16\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">×2/3/31<\/text><text x=\"200\" y=\"34\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">前期末<\/text><text x=\"280\" y=\"16\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">×3/3/31<\/text><text x=\"280\" y=\"34\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">当期末<\/text><line x1=\"8\" y1=\"42\" x2=\"312\" y2=\"42\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf2)\" stroke-linecap=\"round\"/><line x1=\"160\" y1=\"22\" x2=\"160\" y2=\"160\" stroke=\"#6a6a6a\" stroke-width=\"1\" stroke-dasharray=\"4 3\" filter=\"url(#rgf2)\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"22\" x2=\"240\" y2=\"160\" stroke=\"#6a6a6a\" stroke-width=\"1\" stroke-dasharray=\"4 3\" filter=\"url(#rgf2)\" stroke-linecap=\"round\"/><rect x=\"70\" y=\"118\" width=\"246\" height=\"18\" rx=\"3\" fill=\"rgba(90,150,255,0.38)\" filter=\"url(#rgf2)\" stroke-linecap=\"round\"/><rect x=\"70\" y=\"138\" width=\"246\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf2)\" stroke-linecap=\"round\"/><text x=\"8\" y=\"60\" font-size=\"12\" fill=\"#262626\">資本金<\/text><text x=\"142\" y=\"60\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">30,000<\/text><text x=\"222\" y=\"60\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">30,000<\/text><text x=\"302\" y=\"60\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">30,000<\/text><text x=\"8\" y=\"80\" font-size=\"12\" fill=\"#262626\">利益剰余金<\/text><text x=\"142\" y=\"80\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">20,000<\/text><text x=\"222\" y=\"80\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">24,000<\/text><text x=\"302\" y=\"80\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">28,000<\/text><text x=\"8\" y=\"108\" font-size=\"12\" fill=\"#262626\">合計<\/text><text x=\"142\" y=\"108\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">50,000<\/text><text x=\"222\" y=\"108\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">54,000<\/text><text x=\"302\" y=\"108\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">58,000<\/text><text x=\"8\" y=\"132\" font-size=\"12\" fill=\"#2554a8\">非支配20%<\/text><text x=\"142\" y=\"132\" font-size=\"13\" fill=\"#2554a8\" text-anchor=\"end\">10,000<\/text><text x=\"222\" y=\"132\" font-size=\"13\" fill=\"#2554a8\" text-anchor=\"end\">10,800<\/text><text x=\"302\" y=\"132\" font-size=\"13\" fill=\"#2554a8\" text-anchor=\"end\">11,600<\/text><text x=\"8\" y=\"152\" font-size=\"12\" fill=\"#c2410c\">のれん<\/text><text x=\"142\" y=\"152\" font-size=\"13\" fill=\"#c2410c\" text-anchor=\"end\">3,000<\/text><text x=\"222\" y=\"152\" font-size=\"13\" fill=\"#c2410c\" text-anchor=\"end\">2,700<\/text><text x=\"302\" y=\"152\" font-size=\"13\" fill=\"#c2410c\" text-anchor=\"end\">2,400<\/text><line x1=\"70\" y1=\"90\" x2=\"312\" y2=\"90\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf2)\" stroke-linecap=\"round\"/><text x=\"160\" y=\"176\" font-size=\"11\" fill=\"#c2410c\" text-anchor=\"middle\">−300<\/text><text x=\"240\" y=\"176\" font-size=\"11\" fill=\"#c2410c\" text-anchor=\"middle\">−300<\/text><text x=\"8\" y=\"202\" font-size=\"12\" fill=\"#262626\">43,000 − 50,000 × 80% =<\/text><text x=\"158\" y=\"202\" font-size=\"13\" fill=\"#c2410c\">3,000<\/text><ellipse cx=\"173\" cy=\"198\" rx=\"20\" ry=\"10\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf2)\" stroke-linecap=\"round\"/><\/svg>","notes":[["支配獲得日・前期末・当期末の3つの時点で、S社の資本金と利益剰余金を縦に書く",null],["資本の合計に20%を掛けたものが、その時点の非支配株主持分","rgba(90,150,255,0.38)"],["のれんは毎年300ずつ償却して減っていく","rgba(255,205,0,0.55)"],["支配獲得時ののれん:投資43,000 − 資本50,000 × 80% = 3,000","rgba(230,80,60,0.35)"]]}},{"id":"q2s","qno":"第2問","name":"株主資本等変動計算書","star":2,"time":"20分","lead":"取引を日付の順に仕訳し、列ごとに増減を書き込んでから縦に合計します。","steps":[{"t":"当期首残高を確かめる","d":"答案用紙の当期首残高の行を読み、どの列があるかを確認する。"},{"t":"取引を日付の順に仕訳する","d":"配当、増資、合併、振替などを1つずつ仕訳にする。"},{"t":"配当の準備金の積立額を出す","d":"「配当の10分の1」と「資本金の4分の1までの不足」の少ないほう。配当の時点の資本金で計算する。"},{"t":"列ごとに増減を書き込む","d":"減少は△をつける。積立や振替は純資産の中の移動なので合計は変わらない。"},{"t":"株主資本以外の項目を純額で書く","d":"その他有価証券評価差額金は「当期末 − 当期首」を税効果のあとで書く。"},{"t":"縦に合計して当期末残高を出す","d":"株主資本合計は、増資・合併・配当・利益だけで検算できる。"}],"traps":["増資の前の資本金で準備金の上限を計算する","合併で増える株主資本は、交付した株式の時価","評価差額金の欄に、差額の税効果前の金額を書かない"],"entries":[["配当と積立",[["繰越利益剰余金",1800000]],[["未払配当金",1500000],["利益準備金",100000],["別途積立金",200000]]],["吸収合併",[["諸資産",12000000],["のれん",1000000]],[["諸負債",7000000],["資本金",3000000],["資本準備金",1000000],["その他資本剰余金",2000000]]]],"facts":["当期首残高:資本金30,000,000円、資本準備金4,500,000円、その他資本剰余金800,000円、利益準備金2,900,000円、別途積立金600,000円、繰越利益剰余金5,000,000円、その他有価証券評価差額金140,000円","6月25日:繰越利益剰余金を財源とする配当1,500,000円を決議し、会社法に定める利益準備金を積み立て、別途積立金200,000円を積み立てる。","8月1日:新株500株を1株20,000円で発行し、資本金は会社法が認める最低額とした。","10月1日:Y社を吸収合併した。Y社の諸資産の時価は12,000,000円、諸負債の時価は7,000,000円。新株300株(時価1株20,000円)を交付し、資本金3,000,000円、資本準備金1,000,000円、残額をその他資本剰余金とした。","2月10日:資本準備金1,000,000円を取り崩し、その他資本剰余金に振り替えた。","3月31日:当期純利益2,800,000円を計上した。その他有価証券の時価は、当期首1,200,000円、当期末1,300,000円(取得原価1,000,000円、税率30%)である。"],"parts":[{"step":2,"label":"利益準備金の積立額","ans":100000,"calc":["配当の10分の1 = 150,000","30,000,000 × 1/4 − (4,500,000 + 2,900,000) = 100,000","少ないほうの100,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"新株の発行による資本金の増加","ans":5000000,"calc":["500株 × 20,000 = 10,000,000の2分の1"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"吸収合併によるその他資本剰余金の増加","ans":2000000,"calc":["300株 × 20,000 − 3,000,000 − 1,000,000 = 2,000,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"その他有価証券評価差額金の当期変動額","ans":70000,"calc":["当期末 300,000 × 70% = 210,000","当期首 200,000 × 70% = 140,000","210,000 − 140,000 = 70,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"繰越利益剰余金の当期末残高","ans":6000000,"calc":["5,000,000 − 1,600,000 − 200,000 + 2,800,000 = 6,000,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"純資産合計の当期末残高","ans":61310000,"calc":["株主資本 43,800,000 + 10,000,000 + 6,000,000 − 1,500,000 + 2,800,000 = 61,100,000","評価差額金 210,000 を足して 61,310,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["{1|当期首残高}:{3|資本金30,000,000円、資本準備金4,500,000円}、その他資本剰余金800,000円、{3|利益準備金2,900,000円}、別途積立金600,000円、繰越利益剰余金5,000,000円、{5|その他有価証券評価差額金140,000円}","{2|6月25日}:繰越利益剰余金を財源とする{3|配当1,500,000円}を決議し、{3|会社法に定める利益準備金を積み立て}、別途積立金200,000円を積み立てる。","{2|8月1日}:新株500株を1株20,000円で発行し、{4|資本金は会社法が認める最低額}とした。","{2|10月1日}:Y社を吸収合併した。Y社の諸資産の時価は12,000,000円、諸負債の時価は7,000,000円。新株300株(時価1株20,000円)を交付し、{4|資本金3,000,000円、資本準備金1,000,000円、残額をその他資本剰余金}とした。","{2|2月10日}:{4|資本準備金1,000,000円を取り崩し、その他資本剰余金に振り替えた}。","{2|3月31日}:{4|当期純利益2,800,000円}を計上した。{5|その他有価証券の時価は、当期首1,200,000円、当期末1,300,000円(取得原価1,000,000円、税率30%)}である。"],"mnotes":["当期首残高の行から、どの列があるかを確かめる","日付の順に、1つずつ仕訳にする","配当の10分の1(150,000)と、30,000,000 × 1/4 − (4,500,000 + 2,900,000) = 100,000 の少ないほう","増資は資本金と資本準備金に半分ずつ。合併の残額2,000,000はその他資本剰余金。振替は列の間の移動","当期末 300,000 × 70% = 210,000 と当期首140,000の差70,000を、1行で書く","列ごとに縦に足す。繰越利益剰余金は 5,000,000 − 1,800,000 + 2,800,000 = 6,000,000"],"fig":{"title":"列ごとに増減を書き込み、最後に縦に合計する","svg":"<svg viewBox=\"0 0 320 222\" role=\"img\" aria-label=\"株主資本等変動計算書の下書き\"><defs><marker id=\"ahf3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf3\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"242\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"3\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"4\" y=\"14\" font-size=\"10\" fill=\"#6a6a6a\">(千円)<\/text><text x=\"76\" y=\"30\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middl を記入する","d":"利払日には6か月分の利息を受け取り、有価証券利息の貸方に書く。"},{"t":"決算で未収の利息を計上する","d":"最後の利払日の翌日から決算日までの分を、未収有価証券利息にする。"},{"t":"償却原価法で帳簿価額を調整する","d":"額面と取得原価の差を、取得から満期までの月数で月割して当期分を足す。"},{"t":"利息の合計と期末の帳簿価額を出す","d":"有価証券利息は、端数利息の支払いを引いて、受取・未収・償却額を足す。"},{"t":"勘定を締め切る","d":"満期保有目的債券は次期繰越、有価証券利息は損益に振り替える。"}],"traps":["購入時の端数利息は、有価証券利息の借方(取得原価に含めない)","償却原価法は、取得した月から月割で計算する","満期保有目的債券は時価に評価替えしない"],"entries":[["購入",[["満期保有目的債券",970000],["有価証券利息",5000]],[["当座預金",975000]]],["決算(未収と償却)",[["未収有価証券利息",7500],["満期保有目的債券",3500]],[["有価証券利息",11000]]]],"facts":["会計期間は×1年4月1日から×2年3月31日までである。","×1年9月1日に、満期まで保有する目的で、A社社債(額面1,000,000円、満期は×6年8月31日)を額面100円につき97円で購入し、端数利息とともに当座預金で支払った。","社債の利率は年3%、利払日は6月30日と12月31日(各6か月分)である。利息は月割で計算する。","額面と取得原価の差は金利の調整と認められ、償却原価法(定額法)を適用する。"],"parts":[{"step":0,"label":"取得原価","ans":970000,"calc":["1,000,000 × 97 ÷ 100 = 970,000"],"unit":"円","dirs":null,"dir":null},{"step":0,"label":"購入時の端数利息","ans":5000,"calc":["7月1日〜8月31日の2か月分 = 1,000,000 × 3% × 2 ÷ 12 = 5,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"12月31日に受け取る利息","ans":15000,"calc":["1,000,000 × 3% × 6 ÷ 12 = 15,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"決算で計上する未収の利息","ans":7500,"calc":["1月1日〜3月31日の3か月分 = 1,000,000 × 3% × 3 ÷ 12 = 7,500"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"当期の償却額","ans":3500,"calc":["差額 30,000 ÷ 60か月 × 7か月(9月〜3月) = 3,500"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"当期の有価証券利息","ans":21000,"calc":["−5,000 + 15,000 + 7,500 + 3,500 = 21,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"満期保有目的債券の期末の帳簿価額","ans":973500,"calc":["970,000 + 3,500 = 973,500"],"unit":"円","dirs":null,"dir":null}],"mfacts":["会計期間は×1年4月1日から{3|×2年3月31日まで}である。","{1|×1年9月1日}に、満期まで保有する目的で、A社社債({1|額面1,000,000円}、{4|満期は×6年8月31日})を{1|額面100円につき97円で購入し、端数利息とともに}当座預金で支払った。","社債の{2|利率は年3%}、{2|利払日は6月30日と12月31日}(各6か月分)である。利息は月割で計算する。","額面と取得原価の差は金利の調整と認められ、{4|償却原価法(定額法)}を適用する。"],"mnotes":["取得原価は970,000。端数利息は7月1日〜8月31日の2か月分で5,000","12月31日に6か月分の15,000を受け取る","1月1日〜3月31日の3か月分7,500を、未収有価証券利息にする","差額30,000を、取得から満期までの60か月で割り、当期の7か月分で3,500","有価証券利息は −5,000 + 15,000 + 7,500 + 3,500 = 21,000","有価証券利息は損益へ、満期保有目的債券は次期繰越で締め切る"],"fig":{"title":"購入日・利払日・決算日を線に書き、月数を数える","svg":"<svg viewBox=\"0 0 320 248\" role=\"img\" aria-label=\"満期保有目的債券の時系列\"><defs><marker id=\"ahf4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf4\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"268\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"4\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><line x1=\"14\" y1=\"60\" x2=\"312\" y2=\"60\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><line x1=\"20\" y1=\"52\" x2=\"20\" y2=\"68\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><text x=\"20\" y=\"26\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">4/1<\/text><text x=\"20\" y=\"44\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">期首<\/text><line x1=\"92\" y1=\"52\" x2=\"92\" y2=\"68\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><text x=\"92\" y=\"26\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">6/30<\/text><text x=\"92\" y=\"44\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">利払<\/text><line x1=\"140\" y1=\"52\" x2=\"140\" y2=\"68\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><text x=\"140\" y=\"26\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">9/1<\/text><text x=\"140\" y=\"44\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">購入<\/text><line x1=\"236\" y1=\"52\" x2=\"236\" y2=\"68\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><text x=\"236\" y=\"26\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">12/31<\/text><text x=\"236\" y=\"44\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">利払<\/text><line x1=\"308\" y1=\"52\" x2=\"308\" y2=\"68\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><text x=\"300\" y=\"26\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">3/31<\/text><text x=\"300\" y=\"44\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">決算<\/text><rect x=\"92\" y=\"76\" width=\"48\" height=\"14\" rx=\"3\" fill=\"rgba(255,140,60,0.45)\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><text x=\"146\" y=\"88\" font-size=\"12\" fill=\"#c2410c\">端数 2か月 −5,000<\/text><rect x=\"92\" y=\"96\" width=\"144\" height=\"14\" rx=\"3\" fill=\"rgba(90,150,255,0.38)\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><text x=\"96\" y=\"108\" font-size=\"12\" fill=\"#2554a8\">受取 6か月 +15,000<\/text><rect x=\"236\" y=\"116\" width=\"72\" height=\"14\" rx=\"3\" fill=\"rgba(60,190,120,0.42)\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><text x=\"230\" y=\"128\" font-size=\"12\" fill=\"#16803c\" text-anchor=\"end\">未収 3か月 +7,500<\/text><rect x=\"140\" y=\"136\" width=\"168\" height=\"14\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><text x=\"146\" y=\"148\" font-size=\"12\" fill=\"#a8550a\">償却 7か月 +3,500<\/text><text x=\"160\" y=\"176\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">有価証券利息<\/text><line x1=\"40.0\" y1=\"183\" x2=\"280.0\" y2=\"183\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><line x1=\"160\" y1=\"183\" x2=\"160\" y2=\"236\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><text x=\"48\" y=\"202\" font-size=\"11\" fill=\"#6a6a6a\">端数<\/text><text x=\"154\" y=\"202\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">5,000<\/text><text x=\"166\" y=\"202\" font-size=\"11\" fill=\"#6a6a6a\">利払<\/text><text x=\"276\" y=\"202\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">15,000<\/text><text x=\"166\" y=\"219\" font-size=\"11\" fill=\"#6a6a6a\">未収<\/text><text x=\"276\" y=\"219\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">7,500<\/text><text x=\"166\" y=\"236\" font-size=\"11\" fill=\"#6a6a6a\">償却<\/text><text x=\"276\" y=\"236\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">3,500<\/text><text x=\"48\" y=\"236\" font-size=\"11\" fill=\"#c2410c\">残<\/text><text x=\"154\" y=\"236\" font-size=\"13\" fill=\"#c2410c\" text-anchor=\"end\">21,000<\/text><ellipse cx=\"134\" cy=\"231\" rx=\"26\" ry=\"11\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf4)\" stroke-linecap=\"round\"/><\/svg>","notes":[["端数利息は、前の利払日から購入日までの2か月分。買うときに払うので、有価証券利息の借方","rgba(255,140,60,0.45)"],["12月31日に6か月分を受け取り、決算で1月〜3月の3か月分を未収にする","rgba(90,150,255,0.38)"],["償却額は、差額30,000円を60か月で割り、当期の7か月分","rgba(255,205,0,0.55)"],["T字の差額21,000円が、当期の有価証券利息","rgba(230,80,60,0.35)"]]}},{"id":"q3p","qno":"第3問","name":"損益計算書・貸借対照表","star":3,"time":"25分","lead":"決算整理事項を決まった順番で処理し、法人税等は必ず最後に計算します。","steps":[{"t":"未処理事項を先に片付ける","d":"売掛金の入金もれなど、残高そのものを変える事項を最初に処理する。"},{"t":"貸倒引当金を設定する","d":"修正したあとの売掛金で計算する。差額補充法なら残高を引く。"},{"t":"売上原価と棚卸減耗・評価損を出す","d":"減耗は原価で、評価損は実地数量で計算する。問題文の指示で表示場所を決める。"},{"t":"減価償却をする","d":"定率法は期首の帳簿価額に償却率を掛ける。期中取得は月割。"},{"t":"経過勘定を処理する","d":"次期の分は前払、当期の未払分は未払。問題用紙の試算表の横に増減をメモする。"},{"t":"税引前当期純利益を出し、最後に法人税等を計算する","d":"法人税等は、ほかの処理がすべて終わってから。"}],"traps":["未処理の入金を処理する前の売掛金で、貸倒引当金を計算しない","商品評価損を帳簿数量で計算しない","法人税等を先に計算すると、ほかの修正で金額が変わってしまう"],"entries":[["未処理事項",[["現金預金",50000]],[["売掛金",50000]]],["貸倒引当金",[["貸倒引当金繰入",10000]],[["貸倒引当金",10000]]],["法人税等",[["法人税、住民税及び事業税",151320]],[["仮払法人税等",30000],["未払法人税等",121320]]]],"facts":["会計期間は×1年4月1日から×2年3月31日までである。営業外損益と特別損益はない。","決算整理前の主な残高:現金預金500,000、売掛金800,000、繰越商品200,000、備品600,000、備品減価償却累計額150,000、貸倒引当金5,000、売上3,000,000、仕入1,800,000、給料500,000、保険料36,000、仮払法人税等30,000(単位:円)","1. 売掛金50,000円が当座預金に入金されていたが、未処理である。","2. 売掛金の期末残高に2%の貸倒引当金を差額補充法で設定する。","3. 期末商品の帳簿数量は400個(原価@600円)、実地数量は390個、正味売却価額は@560円である。棚卸減耗損は販売費及び一般管理費、商品評価損は売上原価に含める。","4. 備品は200%定率法(耐用年数5年、償却率40%)で減価償却する。","5. 保険料のうち12,000円は次期の分である。","6. 法人税等は税引前当期純利益の30%とする。"],"parts":[{"step":0,"label":"修正後の売掛金","ans":750000,"calc":["800,000 − 50,000 = 750,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"貸倒引当金繰入","ans":10000,"calc":["750,000 × 2% = 15,000","15,000 − 5,000 = 10,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"売上原価","ans":1775600,"calc":["200,000 + 1,800,000 − 240,000 + 15,600 = 1,775,600","商品評価損 = 390個 × (600 − 560) = 15,600"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"減価償却費","ans":180000,"calc":["(600,000 − 150,000) × 40% = 180,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"損益計算書の保険料","ans":24000,"calc":["36,000 − 12,000 = 24,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"営業利益","ans":504400,"calc":["売上総利益 3,000,000 − 1,775,600 = 1,224,400","販売費及び一般管理費 500,000 + 24,000 + 10,000 + 6,000 + 180,000 = 720,000","1,224,400 − 720,000 = 504,400"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"法人税、住民税及び事業税","ans":151320,"calc":["504,400 × 30% = 151,320"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"当期純利益","ans":353080,"calc":["504,400 − 151,320 = 353,080"],"unit":"円","dirs":null,"dir":null}],"mfacts":["会計期間は×1年4月1日から×2年3月31日までである。営業外損益と特別損益はない。","決算整理前の主な残高:現金預金500,000、売掛金800,000、繰越商品200,000、備品600,000、備品減価償却累計額150,000、貸倒引当金5,000、売上3,000,000、仕入1,800,000、給料500,000、保険料36,000、仮払法人税等30,000(単位:円)","1. {1|売掛金50,000円が当座預金に入金されていたが、未処理である。}","2. {2|売掛金の期末残高に2%の貸倒引当金を差額補充法で設定する。}","3. {3|期末商品の帳簿数量は400個(原価@600円)、実地数量は390個、正味売却価額は@560円である。棚卸減耗損は販売費及び一般管理費、商品評価損は売上原価に含める。}","4. {4|備品は200%定率法(耐用年数5年、償却率40%)で減価償却する。}","5. {5|保険料のうち12,000円は次期の分である。}","6. {6|法人税等は税引前当期純利益の30%とする。}"],"mnotes":["売掛金が 800,000 − 50,000 = 750,000 になる。2.より先に処理する","750,000 × 2% = 15,000、繰入は 15,000 − 5,000 = 10,000","棚卸減耗損 10個 × 600 = 6,000、商品評価損 390個 × 40 = 15,600","(600,000 − 150,000) × 40% = 180,000","前払保険料12,000。損益計算書の保険料は24,000","ほかをすべて処理したあとの 504,400 × 30% = 151,320"],"fig":{"title":"期末商品は、横が数量・縦が単価の箱を書く","svg":"<svg viewBox=\"0 0 320 244\" role=\"img\" aria-label=\"期末商品の評価の箱\"><defs><marker id=\"ahf5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf5\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"264\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"5\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><rect x=\"40\" y=\"70\" width=\"200\" height=\"80\" rx=\"3\" fill=\"rgba(60,190,120,0.42)\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><rect x=\"40\" y=\"40\" width=\"200\" height=\"30\" rx=\"3\" fill=\"rgba(255,120,165,0.42)\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><rect x=\"240\" y=\"40\" width=\"20\" height=\"110\" rx=\"3\" fill=\"rgba(90,150,255,0.38)\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><rect x=\"40\" y=\"40\" width=\"220\" height=\"110\" fill=\"none\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><line x1=\"40\" y1=\"70\" x2=\"240\" y2=\"70\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"40\" x2=\"240\" y2=\"150\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf5)\" stroke-linecap=\"round\"/><text x=\"36\" y=\"45\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"end\">@600<\/text><text x=\"36\" y=\"75\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"end\">@560<\/text><text x=\"240\" y=\"166\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">実地390個<\/text><text x=\"262\" y=\"32\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">帳簿400個<\/text><text x=\"140\" y=\"60\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"middle\">評価損 15,600<\/text><text x=\"140\" y=\"108 000円は次期の分である。"],"parts":[{"step":1,"label":"仕入の行の修正記入(借方の合計)","ans":215600,"calc":["期首商品 200,000 + 商品評価損 15,600 = 215,600"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"繰越商品の貸借対照表欄","ans":218400,"calc":["240,000 − 6,000 − 15,600 = 218,400"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"仕入の損益計算書欄","ans":1775600,"calc":["1,800,000 + 215,600 − 240,000 = 1,775,600"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"貸倒引当金の貸借対照表欄","ans":15000,"calc":["5,000 + 10,000 = 15,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"備品減価償却累計額の貸借対照表欄","ans":330000,"calc":["150,000 + 180,000 = 330,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"当期純利益","ans":504400,"calc":["収益 3,000,000 − 費用(1,775,600 + 500,000 + 24,000 + 10,000 + 6,000 + 180,000) = 504,400"],"unit":"円","dirs":null,"dir":null}],"mfacts":["会計期間は×1年4月1日から×2年3月31日までである。営業外損益と特別損益はなく、{5|法人税等は考えない}。","{1|決算整理前の主な残高:現金預金500,000、売掛金800,000、繰越商品200,000、備品600,000、備品減価償却累計額150,000、貸倒引当金5,000、売上3,000,000、仕入1,800,000、給料500,000、保険料36,000(単位:円)}","1. {2|売掛金50,000円が当座預金に入金されていたが、未処理である。}","2. {2|売掛金の期末残高に2%の貸倒引当金を差額補充法で設定する。}","3. {2|期末商品の帳簿数量は400個(原価@600円)、実地数量は390個、正味売却価額は@560円である。}{3|棚卸減耗損は販売費及び一般管理費}、{4|商品評価損は仕入の行で売上原価に含める。}","4. {2|備品は200%定率法(耐用年数5年、償却率40%)で減価償却する。}","5. {2|保険料のうち12,000円は次期の分である。}"],"mnotes":["試算表欄の借方と貸方の合計が一致しているかを見る","1.〜5.の決算整理仕訳を、行ごとに修正記入欄へ書く","棚卸減耗損・前払保険料・貸倒引当金繰入・減価償却費は、下の空いている行に書き足す","仕入の行は 1,800,000 + 215,600 − 240,000 = 1,775,600 を損益計算書欄へ","法人税等はないので、損益計算書欄の貸方 − 借方 = 504,400","4つの欄で、左右の合計を確かめる"],"fig":{"title":"仕入の行で売上原価を作り、各行を左右の欄に移す","svg":"<svg viewBox=\"0 0 320 232\" role=\"img\" aria-label=\"精算表の下書き\"><defs><marker id=\"ahf6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf6\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"252\"><feTurbulence type=\"fractalNoise\" baseFrequency=\ calc":["400,000 + 150,000 + 50,000 = 600,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"合併後の売掛金","ans":770000,"calc":["500,000 − 30,000 + 300,000 = 770,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"合併後の仕入","ans":1420000,"calc":["1,000,000 + 400,000 + 20,000 = 1,420,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["本店の残高:{5|現金400,000、売掛金500,000}、{2|支店(借方残高)340,000}、{5|仕入1,000,000}","支店の残高:{5|現金150,000、売掛金300,000}、{2|本店(貸方残高)300,000}、{5|仕入400,000}","{1|未達事項1}:本店は支店に現金50,000円を送金したが、{1|支店に届いていない}。","{1|未達事項2}:本店は支店に商品20,000円(原価)を送付したが、{1|支店に届いていない}。","{1|未達事項3}:支店は本店の得意先の売掛金30,000円を現金で回収したが、{1|その連絡が本店に届いていない}。"],"mnotes":["届いていない側(未達1・2は支店、未達3は本店)に仕訳を追加する","支店勘定 340,000 + 30,000 = 370,000、本店勘定 300,000 + 50,000 + 20,000 = 370,000","一致した370,000どうしを消す。合併財務諸表には出てこない","この問題には決算整理の資料はない","同じ科目を足す。現金600,000、売掛金770,000、仕入1,420,000"],"fig":{"title":"本店勘定と支店勘定をT字で書き、未達を足して一致させる","svg":"<svg viewBox=\"0 0 320 212\" role=\"img\" aria-label=\"本店勘定と支店勘定のT字\"><defs><marker id=\"ahf7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf7\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"232\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"7\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"80\" y=\"22\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">支店(本店の帳簿)<\/text><line x1=\"10.0\" y1=\"29\" x2=\"150.0\" y2=\"29\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf7)\" stroke-linecap=\"round\"/><line x1=\"80\" y1=\"29\" x2=\"80\" y2=\"120\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf7)\" stroke-linecap=\"round\"/><text x=\"240\" y=\"22\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">本店(支店の帳簿)<\/text><line x1=\"170.0\" y1=\"29\" x2=\"310.0\" y2=\"29\" stroke=\"#262626\ t":"勘定の流れを思い浮かべる","d":"材料・賃金・経費 → 仕掛品・製造間接費 → 製品 → 売上原価。"},{"t":"直接費か間接費かを分ける","d":"特定の製品にかかる分は仕掛品、それ以外は製造間接費。"},{"t":"予定か実際かを確かめる","d":"予定価格・予定賃率・予定配賦率なら、実際との差が差異になる。"},{"t":"金額を計算する","d":"時間 × 賃率、数量 × 単価を計算する。"},{"t":"差異を振り替える","d":"実際が予定より多ければ不利差異(借方)、少なければ有利差異(貸方)。"}],"traps":["直接工でも、間接作業と手待時間の分は製造間接費","間接工の賃金は、支払額ではなく当月の要支払額","工場会計を独立させているとき、工場にない勘定は「本社」"],"entries":[["賃金の消費",[["仕掛品",960000],["製造間接費",72000]],[["賃金",1032000]]],["賃率差異",[["賃率差異",18000]],[["賃金",18000]]]],"facts":["直接工の当月の作業時間は、直接作業800時間、間接作業50時間、手待時間10時間である。","予定賃率は1時間1,200円である。","直接工の賃金の実際消費額は1,050,000円だった。"],"parts":[{"step":1,"label":"仕掛品に振り替える金額","ans":960000,"calc":["800時間 × 1,200 = 960,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"製造間接費に振り替える金額","ans":72000,"calc":["(50 + 10)時間 × 1,200 = 72,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"賃率差異","ans":18000,"calc":["予定 1,032,000 − 実際 1,050,000 = −18,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"}],"mfacts":["{1|直接工}の当月の作業時間は、{2|直接作業800時間}、{2|間接作業50時間、手待時間10時間}である。","{3|予定賃率}は{4|1時間1,200円}である。","直接工の賃金の{5|実際消費額は1,050,000円}だった。"],"mnotes":["賃金 → 仕掛品(直接)と製造間接費(間接)へ流れる","直接作業だけが直接労務費。間接作業と手待時間は間接労務費","予定賃率で消費額を計算し、実際との差を賃率差異にする","仕掛品 800 × 1,200 = 960,000、製造間接費 60 × 1,200 = 72,000","予定 1,032,000 − 実際 1,050,000 = −18,000 で不利"],"fig":{"title":"作業時間を線で分け、賃金のT字に振り替えを書く","svg":"<svg viewBox=\"0 0 320 222\" role=\"img\" aria-label=\"賃金の消費の下書き\"><defs><marker id=\"ahf8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf8\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"242\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"8\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><rect x=\"20\" y=\"22\" width=\"200\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf8)\" stroke-  font-size=\"13\" fill=\"#2554a8\" text-anchor=\"end\">72,000<\/text><text x=\"166\" y=\"156\" font-size=\"12\" fill=\"#c2410c\">賃率差異<\/text><text x=\"296\" y=\"156\" font-size=\"13\" fill=\"#c2410c\" text-anchor=\"end\">18,000<\/text><ellipse cx=\"276\" cy=\"151\" rx=\"26\" ry=\"11\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf8)\" stroke-linecap=\"round\"/><text x=\"8\" y=\"194\" font-size=\"12\" fill=\"#262626\">予定 1,032,000 − 実際 1,050,000<\/text><text x=\"312\" y=\"212\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"end\">= △18,000 不利<\/text><\/svg>","notes":[["直接作業の時間だけが仕掛品(直接労務費)","rgba(255,205,0,0.55)"],["間接作業と手待時間は、直接工でも製造間接費","rgba(90,150,255,0.38)"],["予定賃率で振り替えた残りが賃率差異。賃金の貸方に出るので不利","rgba(230,80,60,0.35)"]]}},{"id":"q4d","qno":"第4問","name":"部門別計算","star":2,"time":"15分","lead":"補助部門費を製造部門に配賦してから、予定配賦額と比べて差異を出します。","steps":[{"t":"部門費を集計する","d":"部門個別費はその部門へ、部門共通費は配賦基準で各部門へ。"},{"t":"補助部門費を製造部門に配賦する","d":"直接配賦法では、補助部門どうしの配賦はせず、製造部門だけに配る。"},{"t":"製造部門費の合計を出す","d":"第1次集計額に、補助部門から配賦された額を足す。"},{"t":"予定配賦額を計算する","d":"予定配賦率 × 実際の作業時間。"},{"t":"配賦差異を出す","d":"予定配賦額 − 実際の製造部門費。マイナスなら不利差異。"}],"traps":["直接配賦法で、補助部門どうしに配賦しない","予定配賦額は、予定の時間ではなく実際の時間で計算する","差異は部門ごとに出す"],"entries":[["補助部門費の配賦",[["切削部門費",112000],["組立部門費",88000]],[["修繕部門費",120000],["動力部門費",80000]]],["予定配賦",[["仕掛品",1000000]],[["切削部門費",550000],["組立部門費",450000]]]],"facts":["部門費の第1次集計額:切削部450,000円、組立部350,000円、修繕部120,000円、動力部80,000円","修繕部費は切削部60%・組立部40%、動力部費は切削部50%・組立部50%の割合で、直接配賦法により配賦する。","予定配賦率は、切削部・組立部とも直接作業時間1時間あたり500円である。","当月の直接作業時間は、切削部1,100時間、組立部900時間である。"],"parts":[{"step":1,"label":"修繕部費のうち切削部への配賦額","ans":72000,"calc":["120,000 × 60% = 72,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"動力部費のうち切削部への配賦額","ans":40000,"calc":["80,000 × 50% = 40,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"切削部門費の合計","ans":562000,"calc":["450,000 + 72,000 + 40,000 = 562,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"組立部門費の合計","ans":438000,"calc":["350,000 + 48,000 + 40,000 = 438,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"切削部の配賦差異","ans":12000,"calc":["1,100時間 × 500 = 550,000","550,000 − 562,000 = −12,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"},{"step":4,"label":"組立部の配賦差異","ans":12000,"calc":["900時間 × 500 = 450,000","450,000 − 438,000 = +12,000"],"unit":"円","dirs":["有利","不利"],"dir":"有利"}],"mfacts":["{1|部門費の第1次集計額:切削部450,000円、組立部350,000円、修繕部120,000円、動力部80,000円}","{2|修繕部費は切削部60%・組立部40%、動力部費は切削部50%・組立部50%}の割合で、{2|直接配賦法}により配賦する。","{4|予定配賦率は、切削部・組立部とも直接作業時間1時間あたり500円}である。","{4|当月の直接作業時間は、切削部1,100時間、組立部900時間}である。"],"mnotes":["4つの部門の第1次集計額を、部門費配賦表の1行目に書く","直接配賦法なので、補助部門どうしには配賦しない。修繕部 72,000 と 48,000、動力部 40,000 と 40,000","切削部 562,000、組立部 438,000","切削部 1,100 × 500 = 550,000、組立部 900 × 500 = 450,000","予定 − 実際。切削部 −12,000(不利)、組立部 +12,000(有利)"],"fig":{"title":"部門費配賦表の形で書き、製造部門に集める","svg":"<svg viewBox=\"0 0 320 202\" role=\"img\" aria-label=\"部門費配賦表の下書き\"><defs><marker id=\"ahf9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf9\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"222\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"9\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"82\" y=\"20\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">切削<\/text><text x=\"150\" y=\"20\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">組立<\/text><text x=\"218\" y=\"20\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">修繕<\/text><text x=\"286\" y=\"20\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">動力<\/text><line x1=\"4\" y1=\"28\" x2=\"316\" y2=\"28\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf9)\" stroke-linecap=\"round\"/><line x1=\"48\" y1=\"8\" x2=\"48\" y2=\"190\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf9)\" stroke-linecap=\"round\"/><line x1=\"116\" y1=\"8\" x2=\"116\" y2=\"190\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf9)\" stroke-linecap=\"round\"/><line x1=\"184\" y1=\"8\" x2=\"184\" y2=\"190\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf9)\" stroke-linecap=\"round\"/><line x1=\"252\" y1=\"8\" x2=\"252\" y2=\"190\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf9)\" stroke-linecap=\"round\"/><rect x=\"50\" y=\"98\" width=\"132\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf9)\" stroke-linecap=\"round\"/><text x=\"6\" y=\"46\" font-size=\"12\" fill=\"#6a6a6a\">1次<\/text><text x=\"108\" y=\"46\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">450,000<\/text><text x=\"176\" y=\"46\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">350,000<\/text><text x=\"244\" y=\"46\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">120,000<\/text><text x=\"312\" y=\"46\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">80,000<\/text><text x=\"6\" y=\"66\" font-size=\"12\" fill=\"#6a6a6a\">修繕<\/text><text x=\"108\" y=\"66\" font-size=\"13\" fill=\"#a8550a\" text-anchor=\"end\">72,000<\/text><text x=\"176\" y=\"66\" font-size=\"13\" fill=\"#a8550a\" text-anchor=\"end\">48,000<\/text><text x=\"244\" y=\"66\" font-size=\"12\" fill=\"#a8550a\" text-anchor=\"end\">6:4<\/text><text x=\"6\" y=\"86\" font-size=\"12\" fill=\"#6a6a6a\">動力<\/text><text x=\"108\" y=\"86\" font-size=\"13\" fill=\"#2554a8\" text-anchor=\"end\">40,000<\/text><text x=\"176\" y=\"86\" font-size=\"13\" fill=\"#2554a8\" text-anchor=\"end\">40,000<\/text><text x=\"312\" y=\"86\" font-size=\"12\" fill=\"#2554a8\" text-anchor=\"end\">5:5<\/text><line x1=\"48\" y1=\"94\" x2=\"184\" y2=\"94\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf9)\" stroke-linecap=\"round\"/><text x=\"6\" y=\"112\" font-size=\"12\" fill=\"#6a6a6a\">合計<\/text><text x=\"108\" y=\"112\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">562,000<\/text><text x=\"176\" y=\"112\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">438,000<\/text><text x=\"6\" y=\"138\" font-size=\"12\" fill=\"#6a6a6a\">予定<\/text><text x=\"108\" y=\"138\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">550,000<\/text><text x=\"176\" y=\"138\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">450,000<\/text><text x=\"82\" y=\"152\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">1,100h×500<\/text><text x=\"150\" y=\"152\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">900h×500<\/text><text x=\"6\" y=\"176\" font-size=\"12\" fill=\"#6a6a6a\">差異<\/text><text x=\"108\" y=\"176\" font-size=\"13\" fill=\"#c2410c\" text-anchor=\"end\">△12,000<\/text><text x=\"176\" y=\"176\" font-size=\"13\" fill=\"#16803c\" text-anchor=\"end\">+12,000<\/text><text x=\"82\" y=\"192\" font-size=\"11\" fill=\"#c2410c\" text-anchor=\"middle\">不利<\/text><text x=\"150\" y=\"192\" font-size=\"11\" fill=\"#16803c\" text-anchor=\"middle\">有利<\/text><text x=\"190\" y=\"176\" font-size=\"11\" fill=\"#6a6a6a\">予定 − 実際<\/text><\/svg>","notes":[["直接配賦法なので、修繕部と動力部の費用は、切削部と組立部だけに分ける","rgba(255,140,60,0.45)"],["製造部門の合計が、実際の部門費","rgba(255,205,0,0.55)"],["予定配賦額 − 実際。マイナスは不利、プラスは有利","rgba(230,80,60,0.35)"]]}},{"id":"q4s","qno":"第4問","name":"総合原価計算","star":3,"time":"15分","lead":"数量の箱を書き、仕損の負担を決めてから、材料費と加工費を別々に配分します。","steps":[{"t":"数量の箱を書く","d":"月初・当月投入・完成・月末・仕損を、材料用と加工費用(換算量)の2つの箱に書く。"},{"t":"仕損の負担を決める","d":"月末仕掛品が仕損の発生点を通過していなければ完成品のみ負担、通過していれば両者負担。"},{"t":"材料費を配分する","d":"材料を始点で投入するなら、月末の数量そのまま。先入先出法なら当月投入分の単価で。"},{"t":"加工費を配分する","d":"月末仕掛品は「数量 × 進捗度」の換算量で。先入先出法は月初の換算量を引く。"},{"t":"完成品原価を出す","d":"月初と当月の合計から、月末仕掛品原価を引く。"},{"t":"単位原価を出す","d":"完成品原価 ÷ 完成品の数量。"}],"traps":["完成品のみ負担なら、仕損の数量も分母に入れる","先入先出法では、月初仕掛品の換算量を引く","月末仕掛品の加工費は、進捗度を掛けた換算量で計算する"],"entries":[["完成",[["製品",521000]],[["仕掛品",521000]]]],"facts":["単純総合原価計算、先入先出法。材料は工程の始点で投入する。","月初仕掛品200個(加工進捗度50%):直接材料費38,000円、加工費28,000円","当月投入1,050個:直接材料費210,000円、加工費321,000円","完成品1,000個、月末仕掛品200個(加工進捗度60%)、正常仕損50個(工程の終点で発生、評価額なし、度外視法)。仕損は当月投入分から発生した。"],"parts":[{"step":2,"label":"材料費の単価(当月投入分)","ans":200,"calc":["210,000 ÷ (1,000 − 200 + 200 + 50) = 200","終点発生で月末は通過していないので完成品のみ負担。仕損も分母に入れる"],"unit":"円/個","dirs":null,"dir":null},{"step":2,"label":"月末仕掛品の直接材料費","ans":40000,"calc":["200個 × 200 = 40,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"当月の加工費の換算量","ans":1070,"calc":["1,000 − 100(月初200個 × 50%) + 120(月末200個 × 60%) + 50 = 1,070"],"unit":"個","dirs":null,"dir":null},{"step":3,"label":"月末仕掛品の加工費","ans":36000,"calc":["321,000 ÷ 1,070 = 300","120個 × 300 = 36,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"完成品総合原価","ans":521000,"calc":["38,000 + 28,000 + 210,000 + 321,000 − 40,000 − 36,000 = 521,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"完成品単位原価","ans":521,"calc":["521,000 ÷ 1,000個 = 521"],"unit":"円/個","dirs":null,"dir":null}],"mfacts":["単純総合原価計算、{3|先入先出法}。{3|材料は工程の始点で投入する}。","{1|月初仕掛品200個(加工進捗度50%)}:{5|直接材料費38,000円、加工費28,000円}","{1|当月投入1,050個}:{3|直接材料費210,000円}、{4|加工費321,000円}","{1|完成品1,000個、月末仕掛品200個(加工進捗度60%)}、{2|正常仕損50個(工程の終点で発生、評価額なし、度外視法)}。仕損は当月投入分から発生した。"],"mnotes":["材料の箱と加工費の箱を書く。加工費は月初100個、月末120個(換算量)","終点で発生した仕損は、終点を通過した完成品だけが負担する","当月投入分の単価 210,000 ÷ 1,050 = 200。月末 200個 × 200 = 40,000","換算量 1,000 − 100 + 120 + 50 = 1,070、単価300。月末 120個 × 300 = 36,000","月初 + 当月 − 月末 = 521,000","521,000 ÷ 1,000個 = 521"],"fig":{"title":"材料と加工費で、数量の箱を2つ書く","svg":"<svg viewBox=\"0 0 320 246\" role=\"img\" aria-label=\"総合原価計算の数量の箱\"><defs><marker id=\"ahf10\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf10\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"266\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"10\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"80\" y=\"18\" font-size=\"13\" =\"206\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">210,000 ÷ 1,050 = @200<\/text><text x=\"240\" y=\"18\" font-size=\"13\" fill=\"#a8550a\" text-anchor=\"middle\">加工費<\/text><rect x=\"240\" y=\"128\" width=\"70\" height=\"22\" rx=\"3\" fill=\"rgba(255,120,165,0.42)\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><rect x=\"240\" y=\"150\" width=\"70\" height=\"38\" rx=\"3\" fill=\"rgba(60,190,120,0.42)\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><rect x=\"170\" y=\"28\" width=\"140\" height=\"160\" fill=\"none\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"28\" x2=\"240\" y2=\"188\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><line x1=\"170\" y1=\"68\" x2=\"240\" y2=\"68\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"128\" x2=\"310\" y2=\"128\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"150\" x2=\"310\" y2=\"150\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><text x=\"205\" y=\"45\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">月初100<\/text><text x=\"205\" y=\"61\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">28,000<\/text><text x=\"205\" y=\"112\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">当月<\/text><text x=\"205\" y=\"128\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">1,070<\/text><text x=\"205\" y=\"146\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">321,000<\/text><text x=\"275\" y=\"74\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">完成<\/text><text x=\"275\" y=\"90\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">1,000<\/text><text x=\"275\" y=\"143\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">仕損50<\/text><text x=\"275\" y=\"165\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">月末120<\/text><text x=\"275\" y=\"181\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"middle\">36,000<\/text><text x=\"240\" y=\"206\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">321,000 ÷ 1,070 = @300<\/text><text x=\"8\" y=\"236\" font-size=\"12\" fill=\"#262626\">完成品 = 合計597,000 − 月末76,000 = 521,000<\/text><\/svg>","notes":[["加工費の箱は換算量(数量 × 進捗度)で書く。月初は100個、月末は120個",null],["先入先出法なので、月末仕掛品は当月投入分の単価で計算する","rgba(60,190,120,0.42)"],["終点で発生した仕損は完成品だけが負担する。単価の分母には入れる","rgba(255,120,165,0.42)"]]}},{"id":"q4r","qno":"第4問","name":"製造原価報告書","star":3,"time":"15分","lead":"資料を直接費と間接費に分け、予定配賦との差異を調整して、仕掛品と製品の流れで計算します。","steps":[{"t":"材料費を直接と間接に分ける","d":"消費額は「月初 + 当月仕入 − 月末」。主要材料は直接、補助材料は間接。"},{"t":"労務費を直接と間接に分ける","d":"要支払額は「支払 − 月初未払 + 月末未払」。直接工の直接作業分が直接労務費。"},{"t":"経費を集めて製造間接費の実際発生額を出す","d":"工場の経費だけ。本社の費用は販売費及び一般管理費。"},{"t":"配賦差異を出す","d":"予定配賦額 − 実際発生額。プラスは有利、マイナスは不利。"},{"t":"当月製品製造原価を出す","d":"当月総製造費用 + 月初仕掛品 − 月末仕掛品。"},{"t":"売上原価と営業利益を出す","d":"月初製品 + 当月製品製造原価 − 月末製品に、配賦差異を加減する。"}],"traps":["本社の減価償却費や水道光熱費を製造間接費に入れない","有利差異は報告書では足し、売上原価からは引く","未払賃金の足し引きを逆にしない"],"entries":[["予定配賦",[["仕掛品",1020000]],[["製造間接費",1020000]]],["差異の振替",[["製造間接費",30000]],[["製造間接費配賦差異",30000]]],["差異を売上原価へ",[["製造間接費配賦差異",30000]],[["売上原価",30000]]]],"facts":["製造間接費は直接労務費の100%を予定配賦し、配賦差異は売上原価に加減する。","主要材料(直接):月初100,000、当月仕入1,200,000、月末120,000","補助材料(間接):月初20,000、当月仕入180,000、月末30,000","直接工(すべて直接労務費):支払1,000,000、月初未払150,000、月末未払170,000","間接工:支払300,000、月初未払40,000、月末未払30,000。工場事務員の給料150,000","工場の経費:減価償却費240,000、水道光熱費80,000、保険料60,000。本社の減価償却費60,000、水道光熱費20,000","月初仕掛品300,000、月末仕掛品400,000、月初製品500,000、月末製品420,000。売上高5,000,000、販売費及び一般管理費1,300,000(単位:円)"],"parts":[{"step":0,"label":"直接材料費","ans":1180000,"calc":["100,000 + 1,200,000 − 120,000 = 1,180,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"直接労務費","ans":1020000,"calc":["1,000,000 − 150,000 + 170,000 = 1,020,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"製造間接費の実際発生額","ans":990000,"calc":["補助材料 170,000 + 間接工 290,000 + 給料 150,000 + 経費 380,000 = 990,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"製造間接費配賦差異","ans":30000,"calc":["予定 1,020,000 − 実際 990,000 = +30,000"],"unit":"円","dirs":["有利","不利"],"dir":"有利"},{"step":4,"label":"当月製品製造原価","ans":3120000,"calc":["当月総製造費用 1,180,000 + 1,020,000 + 1,020,000 = 3,220,000","300,000 + 3,220,000 − 400,000 = 3,120,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"売上原価","ans":3170000,"calc":["500,000 + 3,120,000 − 420,000 − 30,000 = 3,170,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"営業利益","ans":530000,"calc":["5,000,000 − 3,170,000 − 1,300,000 = 530,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["{4|製造間接費は直接労務費の100%を予定配賦し}、{6|配賦差異は売上原価に加減する}。","{1|主要材料(直接):月初100,000、当月仕入1,200,000、月末120,000}","{1|補助材料(間接):月初20,000、当月仕入180,000、月末30,000}","{2|直接工(すべて直接労務費):支払1,000,000、月初未払150,000、月末未払170,000}","{2|間接工:支払300,000、月初未払40,000、月末未払30,000}。{2|工場事務員の給料150,000}","{3|工場の経費:減価償却費240,000、水道光熱費80,000、保険料60,000}。本社の減価償却費60,000、水道光熱費20,000","{5|月初仕掛品300,000、月末仕掛品400,000}、{6|月初製品500,000、月末製品420,000。売上高5,000,000、販売費及び一般管理費1,300,000}(単位:円)"],"mnotes":["直接材料費1,180,000。補助材料の消費170,000は製造間接費へ","直接労務費 1,000,000 − 150,000 + 170,000 = 1,020,000。間接工290,000と給料150,000は製造間接費へ","工場の経費380,000だけを集める。本社の分は販売費及び一般管理費","予定配賦額 1,020,000 − 実際 990,000 = +30,000(有利)","月初仕掛品 + 当月総製造費用3,220,000 − 月末仕掛品 = 3,120,000","売上原価 500,000 + 3,120,000 − 420,000 − 30,000 = 3,170,000、営業利益530,000"],"fig":{"title":"仕掛品と製造間接費のT字を書き、差額で完成品原価を出す","svg":"<svg viewBox=\"0 0 320 244\" role=\"img\" aria-label=\"仕掛品と製造間接費のT字\"><defs><marker id=\"ahf11\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf11\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"264\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"11\"/><feDisplacementMap in=\"So <line x1=\"160\" y1=\"133\" x2=\"160\" y2=\"188\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf11)\" stroke-linecap=\"round\"/><text x=\"24\" y=\"152\" font-size=\"11\" fill=\"#6a6a6a\">実際<\/text><text x=\"154\" y=\"152\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">990,000<\/text><text x=\"24\" y=\"172\" font-size=\"11\" fill=\"#16803c\">差異<\/text><text x=\"154\" y=\"172\" font-size=\"13\" fill=\"#16803c\" text-anchor=\"end\">30,000<\/text><text x=\"60\" y=\"172\" font-size=\"10\" fill=\"#16803c\">有利<\/text><rect x=\"222\" y=\"139\" width=\"76\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf11)\" stroke-linecap=\"round\"/><text x=\"166\" y=\"152\" font-size=\"11\" fill=\"#6a6a6a\">予定<\/text><text x=\"296\" y=\"152\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">1,020,000<\/text><text x=\"8\" y=\"214\" font-size=\"12\" fill=\"#262626\">売上原価 = 製品の差額 3,200,000<\/text><text x=\"312\" y=\"232\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">− 有利差異 30,000 = 3,170,000<\/text><\/svg>","notes":[["製造間接費は、予定配賦額1,020,000円で仕掛品に入れる","rgba(255,205,0,0.55)"],["仕掛品のT字の貸方の差額が、当月製品製造原価","rgba(230,80,60,0.35)"],["予定 > 実際なので有利差異。売上原価から引く","rgba(60,190,120,0.42)"]]}},{"id":"q5m","qno":"第5問","name":"標準原価計算(材料・労務)","star":3,"time":"10分","lead":"当月投入量から標準原価を出し、価格と数量(賃率と時間)の差異に分けます。","steps":[{"t":"当月投入量を出す","d":"材料は当月投入の数量、加工費(労務費)は換算量で考える。"},{"t":"標準原価を計算する","d":"標準単価 × 標準消費量(当月投入量 × 1個あたりの標準)。"},{"t":"総差異を出す","d":"標準原価 − 実際原価。"},{"t":"価格差異と数量差異に分ける","d":"価格(賃率)差異は (標準単価 − 実際単価) × 実際数量、数量(時間)差異は (標準数量 − 実際数量) × 標準単価。"},{"t":"有利か不利かを判断する","d":"マイナスなら不利、プラスなら有利。2つの差異の合計が総差異と一致するか確かめる。"}],"traps":["労務費の標準時間は、完成品数ではなく当月投入の換算量で計算する","価格差異には実際数量を、数量差異には標準価格を掛ける","差異は「標準 − 実際」で向きをそろえる"],"entries":[["パーシャル・プランの差異の振替",[["材料価格差異",10250],["材料数量差異",10000],["時間差異",10000]],[["仕掛品",22550],["賃率差異",7700]]]],"facts":["製品1個あたりの標準:直接材料費 1kg 200円 × 5kg、直接労務費 1時間 1,000円 × 2時間","当月投入量:材料は400個分、加工費の換算量は380個分","実際:直接材料 2,050kg(1kg 205円)、直接作業 770時間(1時間 990円)"],"parts":[{"step":1,"label":"直接材料費の標準原価","ans":400000,"calc":["400個 × 5kg × 200 = 400,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"材料価格差異","ans":10250,"calc":["(200 − 205) × 2,050kg = −10,250"],"unit":"円","dirs":["有利","不利"],"dir":"不利"},{"step":3,"label":"材料数量差異","ans":10000,"calc":["(2,000kg − 2,050kg) × 200 = −10,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"},{"step":3,"label":"賃率差異","ans":7700,"calc":["(1,000 − 990) × 770時間 = +7,700"],"unit":"円","dirs":["有利","不利"],"dir":"有利"},{"step":3,"label":"時間差異","ans":10000,"calc":["(760時間 − 770時間) × 1,000 = −10,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"}],"mfacts":["{2|製品1個あたりの標準:直接材料費 1kg 200円 × 5kg、直接労務費 1時間 1,000円 × 2時間}","{1|当月投入量:材料は400個分、加工費の換算量は380個分}","{4|実際:直接材料 2,050kg(1kg 205円)、直接作業 770時間(1時間 990円)}"],"mnotes":["材料は400個分、労務費は換算量の380個分で標準を出す","材料 400 × 5kg × 200 = 400,000、労務 380 × 2時間 × 1,000 = 760,000","実際の材料費 2,050kg × 205 = 420,250。標準400,000との差は −20,250","ボックス図の外側に実際、内側に標準を書いて、価格差異と数量差異に分ける","標準 − 実際がマイナスなら不利、プラスなら有利"],"fig":{"title":"ボックス図を書き、価格と数量の差異に分ける","svg":"<svg viewBox=\"0 0 320 234\" role=\"img\" aria-label=\"標準原価計算のボックス図\"><defs><marker id=\"ahf12\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf12\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"254\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"12\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"96.0\" y=\"18\" font-size=\"13\" fill=\"#a8550a\" text-anchor=\"middle\">材料<\/text><rect x=\"44\" y=\"40\" width=\"104\" height=\"16\" rx=\"3\" fill=\"rgba(255,120,165,0.42)\" filter=\"url(#rgf12)\" stroke-linecap=\"round\"/><rect x=\"110\" y=\"56\" width=\"38\" height=\"114\" rx=\"3\" fill=\"rgba(90,150,255,0.38)\" filter=\"url(#rgf12)\" stroke-linecap=\"round\"/><rect x=\"44\" y 000]],[["製造間接費",1470000],["予算差異",10000]]]],"facts":["当月の標準直接作業時間は2,800時間、実際直接作業時間は2,900時間である。","公式法変動予算:変動費率1時間200円、月間固定費予算900,000円、基準操業度3,000時間。標準配賦率は1時間500円。","製造間接費の実際発生額は1,470,000円である。能率差異は標準配賦率で計算する。"],"parts":[{"step":0,"label":"予算許容額","ans":1480000,"calc":["200 × 2,900 + 900,000 = 1,480,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"予算差異","ans":10000,"calc":["1,480,000 − 1,470,000 = +10,000"],"unit":"円","dirs":["有利","不利"],"dir":"有利"},{"step":2,"label":"能率差異","ans":50000,"calc":["500 × (2,800 − 2,900) = −50,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"},{"step":3,"label":"操業度差異","ans":30000,"calc":["固定費率 900,000 ÷ 3,000 = 300","300 × (2,900 − 3,000) = −30,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"},{"step":4,"label":"総差異","ans":70000,"calc":["標準配賦額 2,800 × 500 = 1,400,000","1,400,000 − 1,470,000 = −70,000 = 10,000 − 50,000 − 30,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"}],"mfacts":["当月の{3|標準直接作業時間は2,800時間}、{1|実際直接作業時間は2,900時間}である。","公式法変動予算:{1|変動費率1時間200円、月間固定費予算900,000円}、{4|基準操業度3,000時間}。{3|標準配賦率は1時間500円}。","製造間接費の{2|実際発生額は1,470,000円}である。{3|能率差異は標準配賦率で計算する}。"],"mnotes":["200 × 2,900 + 900,000 = 1,480,000","1,480,000 − 1,470,000 = +10,000(有利)","500 × (2,800 − 2,900) = −50,000(不利)","固定費率300 × (2,900 − 3,000) = −30,000(不利)","標準配賦額 1,400,000 − 実際 1,470,000 = −70,000。3つの差異の合計と一致"],"fig":{"title":"横に作業時間、縦に配賦率の図を書き、差異の帯を読む","svg":"<svg viewBox=\"0 0 320 232\" role=\"img\" aria-label=\"製造間接費の差異分析の図\"><defs><marker id=\"ahf13\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf13\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"252\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"13\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"8\" y=\"18\" font-size=\"11\" fill=\"#262626\">予算許容額 200 × 2,900 +
