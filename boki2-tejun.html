#262626\">−<\/text><text x=\"256\" y=\"96\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">21,600<\/text><text x=\"262\" y=\"96\" font-size=\"10\" fill=\"#6a6a6a\">減耗・評価損<\/text><line x1=\"14\" y1=\"104\" x2=\"150\" y2=\"104\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf6)\" stroke-linecap=\"round\"/><line x1=\"176\" y1=\"104\" x2=\"312\" y2=\"104\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf6)\" stroke-linecap=\"round\"/><rect x=\"34\" y=\"110\" width=\"68\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf6)\" stroke-linecap=\"round\"/><text x=\"98\" y=\"124\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">1,775,600<\/text><text x=\"106\" y=\"124\" font-size=\"11\" fill=\"#c2410c\">→P/L借<\/text><rect x=\"196\" y=\"110\" width=\"64\" height=\"18\" rx=\"3\" fill=\"rgba(60,190,120,0.42)\" filter=\"url(#rgf6)\" stroke-linecap=\"round\"/><text x=\"256\" y=\"124\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">218,400<\/text><text x=\"264\" y=\"124\" font-size=\"11\" fill=\"#c2410c\">→B/S借<\/text><text x=\"108\" y=\"160\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">P/L借<\/text><text x=\"166\" y=\"160\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">P/L貸<\/text><text x=\"224\" y=\"160\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">B/S借<\/text><text x=\"282\" y=\"160\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">B/S貸<\/text><line x1=\"78\" y1=\"166\" x2=\"312\" y2=\"166\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf6)\" stroke-linecap=\"round\"/><line x1=\"137\" y1=\"150\" x2=\"137\" y2=\"196\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf6)\" stroke-linecap=\"round\"/><line x1=\"195\" y1=\"150\" x2=\"195\" y2=\"196\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf6)\" stroke-linecap=\"round\"/><line x1=\"253\" y1=\"150\" x2=\"253\" y2=\"196\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf6)\" stroke-linecap=\"round\"/><text x=\"8\" y=\"186\" font-size=\"12\" fill=\"#262626\">当期純利益<\/text><text x=\"108\" y=\"186\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"middle\">504,400<\/text><text x=\"282\" y=\"186\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"middle\">504,400<\/text><ellipse cx=\"108\" cy=\"182\" rx=\"28\" ry=\"11\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf6)\" stroke-linecap=\"round\"/><ellipse cx=\"282\" cy=\"182\" rx=\"28\" ry=\"11\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf6)\" stroke-linecap=\"round\"/><text x=\"8\" y=\"220\" font-size=\"12\" fill=\"#6a6a6a\">同じ金額を2か所に書いて、各欄の合計をそろえる<\/text><\/svg>","notes":[["仕入の行は「しーくり・くりしー」と商品評価損を足し引きして、損益計算書欄へ","rgba(255,205,0,0.55)"],["繰越商品の行は、期末商品から減耗損と評価損を引いた額を貸借対照表欄へ","rgba(60,190,120,0.42)"],["当期純利益は、損益計算書欄の借方と貸借対照表欄の貸方の2か所に書く","rgba(230,80,60,0.35)"]]}},{"id":"q3t","qno":"第3問","name":"決算整理後残高試算表","star":2,"time":"20分","lead":"決算整理仕訳を試算表の横に増減でメモし、新しい科目を書き足して、最後に貸借の合計を確かめます。","steps":[{"t":"試算表の科目と金額を確かめる","d":"決算整理前の試算表を読み、どの科目に整理が入るかに印を付ける。"},{"t":"決算整理仕訳を1つずつ書く","d":"現金過不足・貸倒引当金・売上原価・減価償却・経過勘定の順に処理する。"},{"t":"増減を試算表の横にメモする","d":"科目の横に「+5,000」のように書き、最後にまとめて計算する。"},{"t":"新しく出てくる科目を書き足す","d":"雑損・前払家賃・未収利息・減価償却費などは、試算表にない行を追加する。"},{"t":"繰越利益剰余金は整理前のまま書く","d":"決算整理後残高試算表には、当期純利益はまだ足さない。"},{"t":"借方と貸方の合計を確かめる","d":"合計が一致しなければ、仕訳の片側の書きもれを探す。"}],"traps":["繰越利益剰余金に当期純利益を足さない(足すのは貸借対照表)","売上原価を仕入の行で計算するときは、繰越商品も期末の金額に直す","前払・未収の科目を書き足し忘れると、合計が一致しない"],"entries":[["現金の不足",[["雑損",3000]],[["現金",3000]]],["家賃の前払",[["前払家賃",6000]],[["支払家賃",6000]]],["利息の未収",[["未収利息",3000]],[["受取利息",3000]]]],"facts":["決算整理前残高試算表(単位:円):現金120,000、売掛金400,000、繰越商品150,000、建物1,000,000、仕入900,000、給料300,000、支払家賃66,000、貸倒引当金3,000、建物減価償却累計額300,000、資本金800,000、繰越利益剰余金500,000、売上1,324,000、受取利息9,000","1. 現金の実際有高は117,000円で、不足の原因はわからない。","2. 売掛金の期末残高に2%の貸倒引当金を差額補充法で設定する。","3. 期末商品棚卸高は170,000円である。売上原価は仕入の行で計算する。","4. 建物は定額法(耐用年数25年、残存価額ゼロ)で減価償却する。","5. 支払家賃のうち6,000円は翌期の分である。","6. 受取利息の未収分が3,000円ある。"],"parts":[{"step":1,"label":"雑損","ans":3000,"calc":["120,000 − 117,000 = 3,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"仕入","ans":880000,"calc":["900,000 + 150,000 − 170,000 = 880,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"建物減価償却累計額","ans":340000,"calc":["1,000,000 ÷ 25 = 40,000","300,000 + 40,000 = 340,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"支払家賃","ans":60000,"calc":["66,000 − 6,000 = 60,000(前払家賃6,000を追加)"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"受取利息","ans":12000,"calc":["9,000 + 3,000 = 12,000(未収利息3,000を追加)"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"繰越利益剰余金","ans":500000,"calc":["整理前の500,000のまま"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"借方・貸方の合計","ans":2984000,"calc":["整理前の合計 2,936,000","借方は 前払家賃6,000・未収利息3,000・繰入5,000・減価償却費40,000・雑損3,000 が増え、繰越商品が20,000増え、仕入が20,000・現金が3,000・支払家賃が6,000減る","2,984,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["{1|決算整理前残高試算表}(単位:円):現金120,000、売掛金400,000、繰越商品150,000、建物1,000,000、仕入900,000、給料300,000、支払家賃66,000、貸倒引当金3,000、建物減価償却累計額300,000、資本金800,000、{5|繰越利益剰余金500,000}、売上1,324,000、受取利息9,000","1. 現金の{2|実際有高は117,000円}で、不足の原因はわからない。","2. 売掛金の期末残高に{2|2%の貸倒引当金を差額補充法}で設定する。","3. {2|期末商品棚卸高は170,000円}である。売上原価は{3|仕入の行で計算}する。","4. 建物は{2|定額法(耐用年数25年、残存価額ゼロ)}で減価償却する。","5. 支払家賃のうち{4|6,000円は翌期の分}である。","6. 受取利息の{4|未収分が3,000円}ある。"],"mnotes":["どの科目に整理が入るかに印を付ける","雑損3,000、繰入5,000、減価償却費40,000を仕訳する","仕入は 900,000 + 150,000 − 170,000 = 880,000。繰越商品は170,000に直す","前払家賃6,000と未収利息3,000の行を書き足す","繰越利益剰余金は500,000のまま","借方・貸方とも2,984,000"],"fig":{"title":"試算表の横に増減をメモし、新しい科目を下に書き足す","svg":"<svg viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"決算整理後残高試算表の下書き\"><defs><marker id=\"ahf23\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf23\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"260\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"23\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"4\" y=\"16\" font-size=\"11\" fill=\"#6a6a6a\">試算表の横に増減をメモする<\/text><text x=\"4\" y=\"40\" font-size=\"11\" fill=\"#6a6a6a\">現金<\/text><text x=\"118\" y=\"40\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">120,000<\/text><text x=\"124\" y=\"40\" font-size=\"10\" fill=\"#c2410c\">−3,000<\/text><text x=\"316\" y=\"40\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">117,000<\/text><text x=\"4\" y=\"62\" font-size=\"11\" fill=\"#6a6a6a\">繰越商品<\/text><text x=\"118\" y=\"62\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">150,000<\/text><text x=\"124\" y=\"62\" font-size=\"10\" fill=\"#c2410c\">−150,000 +170,000<\/text><text x=\"316\" y=\"62\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">170,000<\/text><text x=\"4\" y=\"84\" font-size=\"11\" fill=\"#6a6a6a\">仕入<\/text><text x=\"118\" y=\"84\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">900,000<\/text><text x=\"124\" y=\"84\" font-size=\"10\" fill=\"#c2410c\">+150,000 −170,000<\/text><text x=\"316\" y=\"84\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">880,000<\/text><text x=\"4\" y=\"106\" font-size=\"11\" fill=\"#6a6a6a\">支払家賃<\/text><text x=\"118\" y=\"106\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">66,000<\/text><text x=\"124\" y=\"106\" font-size=\"10\" fill=\"#c2410c\">−6,000<\/text><text x=\"316\" y=\"106\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">60,000<\/text><text x=\"4\" y=\"128\" font-size=\"11\" fill=\"#6a6a6a\">受取利息<\/text><text x=\"118\" y=\"128\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">9,000<\/text><text x=\"124\" y=\"128\" font-size=\"10\" fill=\"#c2410c\">+3,000<\/text><text x=\"316\" y=\"128\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">12,000<\/text><text x=\"4\" y=\"150\" font-size=\"11\" fill=\"#6a6a6a\">繰越利益<\/text><text x=\"118\" y=\"150\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">500,000<\/text><text x=\"124\" y=\"150\" font-size=\"10\" fill=\"#2554a8\">そのまま<\/text><text x=\"316\" y=\"150\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">500,000<\/text><rect x=\"4\" y=\"168\" width=\"150\" height=\"40\" rx=\"3\" fill=\"rgba(60,190,120,0.42)\" filter=\"url(#rgf23)\" stroke-linecap=\"round\"/><text x=\"8\" y=\"182\" font-size=\"11\" fill=\"#16803c\">追加 前払家賃 6,000<\/text><text x=\"8\" y=\"200\" font-size=\"11\" fill=\"#16803c\">追加 未収利息 3,000<\/text><text x=\"170\" y=\"182\" font-size=\"11\" fill=\"#16803c\">雑損 3,000<\/text><text x=\"170\" y=\"200\" font-size=\"11\" fill=\"#16803c\">減価償却費 40,000<\/text><text x=\"4\" y=\"230\" font-size=\"13\" fill=\"#262626\">借方・貸方とも<\/text><text x=\"110\" y=\"230\" font-size=\"13\" fill=\"#c2410c\">2,984,000<\/text><ellipse cx=\"144\" cy=\"225\" rx=\"42\" ry=\"12\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf23)\" stroke-linecap=\"round\"/><\/svg>","notes":[["整理前の金額の横に増減を書き、最後に計算する",null],["前払家賃・未収利息・雑損などの新しい科目は、下の行に書き足す","rgba(60,190,120,0.42)"],["繰越利益剰余金は整理前のまま。合計が一致するかを最後に確かめる","rgba(230,80,60,0.35)"]]}},{"id":"q3m","qno":"第3問","name":"製造業の財務諸表","star":2,"time":"20分","lead":"材料・仕掛品・製品の流れを確かめ、工場の費用は製造原価、本社の費用は販売費及び一般管理費に分けます。","steps":[{"t":"勘定の流れを確かめる","d":"材料 → 仕掛品 → 製品 → 売上原価。月次決算か年次決算かも確かめる。"},{"t":"材料と製品の減耗を処理する","d":"材料の正常な減耗は製造間接費。製品の減耗は指示に従う。"},{"t":"原価差異を売上原価に加減する","d":"不利差異(借方残高)は売上原価に足し、有利差異は引く。"},{"t":"工場と本社の費用を分ける","d":"本社の減価償却費などは販売費及び一般管理費。"},{"t":"営業利益と法人税等を出す","d":"売上総利益 − 販売費及び一般管理費。法人税等は最後。"},{"t":"貸借対照表の棚卸資産をまとめる","d":"材料・仕掛品・製品の期末の金額を書く。"}],"traps":["製造間接費配賦差異の借方残高は不利差異なので、売上原価に足す","工場の費用と本社の費用を混ぜない","材料の減耗を製造原価に入れたら、売上原価にも反映させる"],"entries":[["材料の棚卸減耗",[["製造間接費",2000]],[["材料",2000]]],["原価差異の振替",[["売上原価",10000]],[["製造間接費配賦差異",8000],["製造間接費",2000]]],["製品の棚卸減耗",[["棚卸減耗損",3000]],[["製品",3000]]]],"facts":["決算整理前の主な残高(単位:円):材料50,000、仕掛品70,000、製品90,000、売上2,000,000、売上原価1,300,000、製造間接費配賦差異8,000(借方残高)、販売費及び一般管理費400,000","1. 材料の期末の実地有高は48,000円である。減耗は正常なもので、製造間接費とし、そのまま売上原価に賦課する。","2. 製造間接費配賦差異は、売上原価に賦課する。","3. 製品の期末の実地有高は87,000円である。減耗は販売費及び一般管理費とする。","4. 本社建物の減価償却費30,000円を計上する。","5. 法人税等は税引前当期純利益の30%とする。営業外損益と特別損益はない。"],"parts":[{"step":1,"label":"材料の棚卸減耗","ans":2000,"calc":["50,000 − 48,000 = 2,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"売上原価","ans":1310000,"calc":["1,300,000 + 8,000(不利差異) + 2,000(材料の減耗) = 1,310,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"販売費及び一般管理費","ans":433000,"calc":["400,000 + 3,000(製品の減耗) + 30,000(本社の減価償却) = 433,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"営業利益","ans":257000,"calc":["2,000,000 − 1,310,000 − 433,000 = 257,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"当期純利益","ans":179900,"calc":["法人税等 257,000 × 30% = 77,100","257,000 − 77,100 = 179,900"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"貸借対照表の棚卸資産の合計","ans":205000,"calc":["材料48,000 + 仕掛品70,000 + 製品87,000 = 205,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["決算整理前の主な残高(単位:円):{1|材料50,000、仕掛品70,000、製品90,000}、売上2,000,000、売上原価1,300,000、{3|製造間接費配賦差異8,000(借方残高)}、販売費及び一般管理費400,000","1. 材料の期末の{2|実地有高は48,000円}である。減耗は正常なもので、{2|製造間接費とし}、{3|そのまま売上原価に賦課}する。","2. 製造間接費配賦差異は、{3|売上原価に賦課}する。","3. 製品の期末の{2|実地有高は87,000円}である。減耗は{4|販売費及び一般管理費とする}。","4. {4|本社建物}の減価償却費30,000円を計上する。","5. 法人税等は{5|税引前当期純利益の30%}とする。営業外損益と特別損益はない。"],"mnotes":["材料 → 仕掛品 → 製品 → 売上原価の流れで、どこに整理が入るかを見る","材料の減耗2,000は製造間接費、製品の減耗3,000は販売費及び一般管理費","借方残高は不利差異なので、売上原価に 8,000 + 2,000 を足す","本社の減価償却費30,000は販売費及び一般管理費","営業利益257,000、法人税等77,100、当期純利益179,900","材料48,000 + 仕掛品70,000 + 製品87,000 = 205,000"],"fig":{"title":"材料から売上原価までの流れを箱で書き、整理の行き先を決める","svg":"<svg viewBox=\"0 0 320 232\" role=\"img\" aria-label=\"製造業の勘定の流れ\"><defs><marker id=\"ahf24\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf24\" filterUnits=\"userSpaceOnUse\" x=\"-10\ ["直接工の当月の作業時間は、直接作業800時間、間接作業50時間、手待時間10時間である。","予定賃率は1時間1,200円である。","直接工の賃金の実際消費額は1,050,000円だった。"],"parts":[{"step":1,"label":"仕掛品に振り替える金額","ans":960000,"calc":["800時間 × 1,200 = 960,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"製造間接費に振り替える金額","ans":72000,"calc":["(50 + 10)時間 × 1,200 = 72,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"賃率差異","ans":18000,"calc":["予定 1,032,000 − 実際 1,050,000 = −18,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"}],"mfacts":["{1|直接工}の当月の作業時間は、{2|直接作業800時間}、{2|間接作業50時間、手待時間10時間}である。","{3|予定賃率}は{4|1時間1,200円}である。","直接工の賃金の{5|実際消費額は1,050,000円}だった。"],"mnotes":["賃金 → 仕掛品(直接)と製造間接費(間接)へ流れる","直接作業だけが直接労務費。間接作業と手待時間は間接労務費","予定賃率で消費額を計算し、実際との差を賃率差異にする","仕掛品 800 × 1,200 = 960,000、製造間接費 60 × 1,200 = 72,000","予定 1,032,000 − 実際 1,050,000 = −18,000 で不利"],"fig":{"title":"作業時間を線で分け、賃金のT字に振り替えを書く","svg":"<svg viewBox=\"0 0 320 222\" role=\"img\" aria-label=\"賃金の消費の下書き\"><defs><marker id=\"ahf8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf8\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"242\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"8\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><rect x=\"20\" y=\"22\" width=\"200\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf8)\" stroke-linecap=\"round\"/><rect x=\"220\" y=\"22\" width=\"50\" height=\"18\" rx=\"3\" fill=\"rgba(90,150,255,0.38)\" filter=\"url(#rgf8)\" stroke-linecap=\"round\"/><rect x=\"270\" y=\"22\" width=\"36\" height=\"18\" rx=\"3\" fill=\"rgba(90,150,255,0.38)\" filter=\"url(#rgf8)\" stroke-linecap=\"round\"/><rect x=\"20\" y=\"22\" width=\"286\" height=\"18\" fill=\"none\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf8)\" stroke-linecap=\"round\"/><line x1=\"220\" y1=\"22\" x2=\" t x=\"312\" y=\"212\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"end\">= △18,000 不利<\/text><\/svg>","notes":[["直接作業の時間だけが仕掛品(直接労務費)","rgba(255,205,0,0.55)"],["間接作業と手待時間は、直接工でも製造間接費","rgba(90,150,255,0.38)"],["予定賃率で振り替えた残りが賃率差異。賃金の貸方に出るので不利","rgba(230,80,60,0.35)"]]}},{"id":"q4k","qno":"第4問","name":"個別原価計算","star":3,"time":"20分","lead":"製造指図書ごとに原価を集計し、指図書の状態(完成・引渡し・仕掛中)で、仕掛品・製品・売上原価に振り分けます。","steps":[{"t":"指図書ごとに原価計算表の列を作る","d":"指図書の番号を横に並べ、月初・材料・労務・間接の行を作る。"},{"t":"直接材料費と直接労務費を集計する","d":"直接作業時間 × 賃率で、指図書ごとの直接労務費を出す。"},{"t":"製造間接費を予定配賦する","d":"予定配賦率 × 指図書ごとの直接作業時間。"},{"t":"指図書の状態を確かめる","d":"前月から続くもの、当月完成、引渡し済み、未完成を分ける。"},{"t":"仕掛品・製品・売上原価に振り分ける","d":"完成なら製品、引き渡したら売上原価、未完成なら月末仕掛品。"},{"t":"配賦差異を出す","d":"予定配賦額 − 実際発生額。マイナスは不利差異。"}],"traps":["前月から続く指図書は、月初仕掛品の原価を足す","完成しても引き渡していなければ、売上原価ではなく製品","配賦差異は、予定配賦額の合計と実際発生額で計算する"],"entries":[["完成",[["製品",655000]],[["仕掛品",655000]]],["引渡し",[["売上原価",275000]],[["製品",275000]]],["配賦差異",[["製造間接費配賦差異",5000]],[["製造間接費",5000]]]],"facts":["実際個別原価計算を行っている。製造間接費は直接作業時間を基準に、予定配賦率1時間1,500円で配賦する。賃率は1時間1,000円である。","#101:前月から仕掛中(月初仕掛品原価120,000円)。当月の直接材料費30,000円、直接作業50時間。当月完成し、引き渡した。","#102:当月着手。直接材料費80,000円、直接作業120時間。当月完成したが、まだ引き渡していない。","#103:当月着手。直接材料費60,000円、直接作業80時間。月末に未完成である。","製造間接費の当月の実際発生額は380,000円である。"],"parts":[{"step":1,"label":"直接労務費の合計","ans":250000,"calc":["(50 + 120 + 80)時間 × 1,000 = 250,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"#102の製造間接費","ans":180000,"calc":["120時間 × 1,500 = 180,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"完成品原価(#101と#102)","ans":655000,"calc":["#101 120,000 + 30,000 + 50,000 + 75,000 = 275,000","#102 80,000 + 120,000 + 180,000 = 380,000","合計 655,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"月末仕掛品原価(#103)","ans":260000,"calc":["60,000 + 80,000 + 120,000 = 260,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"売上原価(#101)","ans":275000,"calc":["引き渡したのは#101だけ"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"製造間接費配賦差異","ans":5000,"calc":["予定 250時間 × 1,500 = 375,000","375,000 − 380,000 = −5,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"}],"mfacts":["実際個別原価計算を行っている。製造間接費は直接作業時間を基準に、{3|予定配賦率1時間1,500円}で配賦する。{2|賃率は1時間1,000円}である。","{1|#101}:前月から仕掛中({4|月初仕掛品原価120,000円})。当月の直接材料費30,000円、{2|直接作業50時間}。{4|当月完成し、引き渡した}。","{1|#102}:当月着手。直接材料費80,000円、{2|直接作業120時間}。当月完成したが、{4|まだ引き渡していない}。","{1|#103}:当月着手。直接材料費60,000円、{2|直接作業80時間}。{4|月末に未完成}である。","製造間接費の当月の{6|実際発生額は380,000円}である。"],"mnotes":["#101・#102・#103の列を作る","直接労務費は 50,000・120,000・80,000","製造間接費は 75,000・180,000・120,000","#101は引渡し済み、#102は完成のみ、#103は仕掛中","売上原価275,000、製品380,000、月末仕掛品260,000","予定375,000 − 実際380,000 = −5,000(不利)"],"fig":{"title":"原価計算表を書き、指図書の状態で行き先を決める","svg":"<svg viewBox=\"0 0 320 230\" role=\"img\" aria-label=\"個別原価計算の原価計算表\"><defs><marker id=\"ahf26\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf26\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"250\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"26\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"104\" y=\"16\" font-size=\"13\" fill=\"#a8550a\" text-anchor=\"middle\">#101<\/text><text x=\"192\" y=\"16\" font-size=\"13\" fill=\"#a8550a\" text-anchor=\"middle\">#102<\/text><text x=\"276\" y=\"16\" font-size=\"13\" fill=\"#a8550a\" text-anchor=\"middle\">#103<\/text><line x1=\"4\" y1=\"24\" x2=\"316\" y2=\"24\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf26)\" stroke-linecap=\"round\"/><line x1=\"52\" y1=\"6\" x2=\"52\" y2=\"196\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf26)\" stroke-linecap=\"round\"/><line x1=\"144\" y1=\"6\" x2=\"144\" y2=\"196\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf26)\" stroke-linecap=\"round\"/><line x1=\"232\" y1=\"6\" x2=\"232\" y2=\"196\" stroke=\"#6a6a6a\" stroke-width=\"1\" filter=\"url(#rgf26)\" stroke-linecap=\"round\"/><text x=\"6\" y=\"42\" font-size=\"11\" fill=\"#6a6a6a\">月初<\/text><text x=\"140\" y=\"42\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">120,000<\/text><text x=\"6\" y=\"62\" font-size=\"11\" fill=\"#6a6a6a\">材料<\/text><text x=\"140\" y=\"62\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">30,000<\/text><text x=\"228\" y=\"62\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">80,000<\/text><text x=\"312\" y=\"62\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">60,000<\/text><text x=\"6\" y=\"82\" font-size=\"11\" fill=\"#6a6a6a\">労務<\/text><text x=\"140\" y=\"82\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">50,000<\/text><text x=\"228\" y=\"82\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">120,000<\/text><text x=\"312\" y=\"82\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">80,000<\/text><text x=\"6\" y=\"102\" font-size=\"11\" fill=\"#6a6a6a\">間接<\/text><text x=\"140\" y=\"102\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">75,000<\/text><text x=\"228\" y=\"102\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">180,000<\/text><text x=\"312\" y=\"102\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">120,000<\/text><line x1=\"52\" y1=\"110\" x2=\"316\" y2=\"110\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf26)\" stroke-linecap=\"round\"/><rect x=\"54\" y=\"116\" width=\"88\" height=\"18\" rx=\"3\" fill=\"rgba(255,120,165,0.42)\" filter=\"url(#rgf26)\" stroke-linecap=\"round\"/><rect x=\"146\" y=\"116\" width=\"84\" height=\"18\" rx=\"3\" fill=\"rgba(255,140,60,0.45)\" filter=\"url(#rgf26)\" stroke-linecap=\"round\"/><rect x=\"234\" y=\"116\" width=\"82\" height=\"18\" rx=\"3\" fill=\"rgba(90,150,255,0.38)\" filter=\"url(#rgf26)\" stroke-linecap=\"round\"/><text x=\"6\" y=\"130\" font-size=\"11\" fill=\"#6a6a6a\">合計<\/text><text x=\"140\" y=\"130\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">275,000<\/text><text x=\"228\" y=\"130\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">380,000<\/text><text x=\"312\" y=\"130\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">260,000<\/text><text x=\"98\" y=\"156\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">完成・引渡し<\/text><text x=\"98\" y=\"178\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"middle\">→ 売上原価<\/text><text x=\"188\" y=\"156\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">完成<\/text><text x=\"188\" y=\"178\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"middle\">→ 製品<\/text><text x=\"274\" y=\"156\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">未完成<\/text><text x=\"274\" y=\"178\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"middle\">→ 仕掛品<\/text><text x=\"4\" y=\"220\" font-size=\"12\" fill=\"#262626\">予定 375,000 − 実際 380,000 = △5,000 不利<\/text><\/svg>","notes":[["前月から続く#101は、月初仕掛品原価から書き始める",null],["引き渡した指図書は売上原価、完成しただけなら製品","rgba(255,120,165,0.42)"],["未完成の指図書は、月末仕掛品","rgba(90,150,255,0.38)"]]}},{"id":"q4d","qno":"第4問","name":"部門別計算","star":2,"time":"15分","lead":"補助部門費を製造部門に配賦してから、予定配賦額と比べて差異を出します。","steps":[{"t":"部門費を集計する","d":"部門個別費はその部門へ、部門共通費は配賦基準で各部門へ。"},{"t":"補助部門費を製造部門に配賦する","d":"直接配賦法では、補助部門どうしの配賦はせず、製造部門だけに配る。"},{"t":"製造部門費の合計を出す","d":"第1次集計額に、補助部門から配賦された額を足す。"},{"t":"予定配賦額を計算する","d":"予定配賦率 × 実際の作業時間。"},{"t":"配賦差異を出す","d":"予定配賦額 − 実際の製造部門費。マイナスなら不利差異。"}],"traps":["直接配賦法で、補助部門どうしに配賦しない","予定配賦額は、予定の時間ではなく実際の時間で計算する","差異は部門ごとに出す"],"entries":[["補助部門費の配賦",[["切削部門費",112000],["組立部門費",88000]],[["修繕部門費",120000],["動力部門費",80000]]],["予定配賦",[["仕掛品",1000000]],[["切削部門費",550000],["組立部門費",450000]]]],"facts":["部門費の第1次集計額:切削部450,000円、組立部350,000円、修繕部120,000円、動力部80,000円","修繕部費は切削部60%・組立部40%、動力部費は切削部50%・組立部50%の割合で、直接配賦法により配賦する。","予定配賦率は、切削部・組立部とも直接作業時間1時間あたり500円である。","当月の直接作業時間は、切削部1,100時間、組立部900時間である。"],"parts":[{"step":1,"label":"修繕部費のうち切削部への配賦額","ans":72000,"calc":["120,000 × 60% = 72,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"動力部費のうち切削部への配賦額","ans":40000,"calc":["80,000 × 50% = 40,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"切削部門費の合計","ans":562000,"calc":["450,000 + 72,000 + 40,000 = 562,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"組立部門費の合計","ans":438000,"calc":["350,000 + 48,000 + 40,000 = 438,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"切削部の配賦差異","ans":12000,"calc":["1,100時間 × 500 = 550,000","550,000 − 562,000 = −12,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"},{"step":4,"label":"組立部の配賦差異","ans":12000,"calc":["900時間 × 500 = 450,000","450,000 − 438,000 = +12,000"],"unit":"円","dirs":["有利","不利"],"dir":"有利"}],"mfacts":["{1|部門費の第1次集計額:切削部450,000円、組立部350,000円、修繕部120,000円、動力部80,000円}","{2|修繕部費は切削部60%・組立部40%、動力部費は切削部50%・組立部50%}の割合で、{2|直接配賦法}により配賦する。","{4|予定配賦率は、切削部・組立部とも直接作業時間1時間あたり500円}である。","{4|当月の直接作業時間は、切削部1,100時間、組立部900時間}である。"],"mnotes":["4つの部門の第1次集計額を、部門費配賦表の1行目に書く","直接配賦法なので、補助部門どうしには配賦しない。修繕部 72,000 と 48,000、動力部 40,000 と 40,000","切削部 562,000、組立部 438,000","切削部 1,100 × 500 = 550,000、組立部 900 × 500 = 450,000","予定 − 実際。切削部 −12,000(不利)、組立部 +12,000(有利)"],"fig":{"title":"部門費配賦表の形で書き、製造部門に集める","svg":"<svg viewBox=\"0 0 320 202\" role=\"img\" aria-label=\"部門費配賦表の下書き\"><defs><marker id=\"ahf9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf9\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"222\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"9\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"82\" y=\"20\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">切削<\/text><text x=\"150\" y=\"20\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">組立<\/text><text x=\"218\" y=\"20\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">修繕<\/text><text x=\"286\" y=\"20\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">動力<\/text><line の加工費は、進捗度を掛けた換算量で計算する"],"entries":[["完成",[["製品",521000]],[["仕掛品",521000]]]],"facts":["単純総合原価計算、先入先出法。材料は工程の始点で投入する。","月初仕掛品200個(加工進捗度50%):直接材料費38,000円、加工費28,000円","当月投入1,050個:直接材料費210,000円、加工費321,000円","完成品1,000個、月末仕掛品200個(加工進捗度60%)、正常仕損50個(工程の終点で発生、評価額なし、度外視法)。仕損は当月投入分から発生した。"],"parts":[{"step":2,"label":"材料費の単価(当月投入分)","ans":200,"calc":["210,000 ÷ (1,000 − 200 + 200 + 50) = 200","終点発生で月末は通過していないので完成品のみ負担。仕損も分母に入れる"],"unit":"円/個","dirs":null,"dir":null},{"step":2,"label":"月末仕掛品の直接材料費","ans":40000,"calc":["200個 × 200 = 40,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"当月の加工費の換算量","ans":1070,"calc":["1,000 − 100(月初200個 × 50%) + 120(月末200個 × 60%) + 50 = 1,070"],"unit":"個","dirs":null,"dir":null},{"step":3,"label":"月末仕掛品の加工費","ans":36000,"calc":["321,000 ÷ 1,070 = 300","120個 × 300 = 36,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"完成品総合原価","ans":521000,"calc":["38,000 + 28,000 + 210,000 + 321,000 − 40,000 − 36,000 = 521,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"完成品単位原価","ans":521,"calc":["521,000 ÷ 1,000個 = 521"],"unit":"円/個","dirs":null,"dir":null}],"mfacts":["単純総合原価計算、{3|先入先出法}。{3|材料は工程の始点で投入する}。","{1|月初仕掛品200個(加工進捗度50%)}:{5|直接材料費38,000円、加工費28,000円}","{1|当月投入1,050個}:{3|直接材料費210,000円}、{4|加工費321,000円}","{1|完成品1,000個、月末仕掛品200個(加工進捗度60%)}、{2|正常仕損50個(工程の終点で発生、評価額なし、度外視法)}。仕損は当月投入分から発生した。"],"mnotes":["材料の箱と加工費の箱を書く。加工費は月初100個、月末120個(換算量)","終点で発生した仕損は、終点を通過した完成品だけが負担する","当月投入分の単価 210,000 ÷ 1,050 = 200。月末 200個 × 200 = 40,000","換算量 1,000 − 100 + 120 + 50 = 1,070、単価300。月末 120個 × 300 = 36,000","月初 + 当月 − 月末 = 521,000","521,000 ÷ 1,000個 = 521"],"fig":{"title":"材料と加工費で、数量の箱を2つ書く","svg":"<svg viewBox=\"0 0 320 246\" role=\"img\" aria-label=\"総合原価計算の数量の箱\"><defs><marker id=\"ahf10\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf10\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" =\"middle\">仕損50<\/text><text x=\"115\" y=\"165\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">月末200<\/text><text x=\"115\" y=\"181\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"middle\">40,000<\/text><text x=\"80\" y=\"206\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">210,000 ÷ 1,050 = @200<\/text><text x=\"240\" y=\"18\" font-size=\"13\" fill=\"#a8550a\" text-anchor=\"middle\">加工費<\/text><rect x=\"240\" y=\"128\" width=\"70\" height=\"22\" rx=\"3\" fill=\"rgba(255,120,165,0.42)\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><rect x=\"240\" y=\"150\" width=\"70\" height=\"38\" rx=\"3\" fill=\"rgba(60,190,120,0.42)\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><rect x=\"170\" y=\"28\" width=\"140\" height=\"160\" fill=\"none\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"28\" x2=\"240\" y2=\"188\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><line x1=\"170\" y1=\"68\" x2=\"240\" y2=\"68\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"128\" x2=\"310\" y2=\"128\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"150\" x2=\"310\" y2=\"150\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf10)\" stroke-linecap=\"round\"/><text x=\"205\" y=\"45\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">月初100<\/text><text x=\"205\" y=\"61\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">28,000<\/text><text x=\"205\" y=\"112\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">当月<\/text><text x=\"205\" y=\"128\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">1,070<\/text><text x=\"205\" y=\"146\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"middle\">321,000<\/text><text x=\"275\" y=\"74\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">完成<\/text><text x=\"275\" y=\"90\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">1,000<\/text><text x=\"275\" y=\"143\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">仕損50<\/text><text x=\"275\" y=\"165\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">月末120<\/text><text x=\"275\" y=\"181\" font-size=\"12\" fill=\"#c2410c\" text-anchor=\"middle\">36,000<\/text><text x=\"240\" y=\"206\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">321,000 ÷ 1,070 = @300<\/text><text x=\"8\" y=\"236\" font-size=\"12\" fill=\"#262626\">完成品 = 合計597,000 − 月末76,000 = 521,000<\/text><\/svg>","notes":[["加工費の箱は換算量(数量 × 進捗度)で書く。月初は100個、月末は120個",null],["先入先出法なので、月末仕掛品は当月投入分の単価で計算する","rgba(60,190,120,0.42)"],["終点で発生した仕損は完成品だけが負担する。単価の分母には入れる","rgba(255,120,165,0.42)"]]}},{"id":"q4p","qno":"第4問","name":"工程別総合原価計算","star":2,"time":"20分","lead":"第1工程の完成品原価を出し、それを第2工程の前工程費として、材料と同じように配分します。","steps":[{"t":"第1工程の数量の箱を書く","d":"材料の箱と加工費の箱。加工費は換算量で書く。"},{"t":"第1工程の完成品原価を出す","d":"月初 + 当月 − 月末。"},{"t":"第2工程へ前工程費として振り替える","d":"第1工程の完成品は、第2工程の始点で投入される材料と同じ扱い。"},{"t":"第2工程の前工程費を配分する","d":"前工程費は始点投入なので、月末仕掛品も完成品も同じ数量で配分する。"},{"t":"第2工程の加工費を配分する","d":"換算量で配分する。先入先出法なら月初の換算量を引く。"},{"t":"最終完成品の原価を出す","d":"第2工程の月初 + 当月 − 月末。"}],"traps":["前工程費は、第2工程の加工進捗度に関係なく、数量のまま配分する","第2工程の月初仕掛品にも前工程費が含まれている","先入先出法の換算量は、完成品 − 月初 + 月末"],"entries":[["第1工程の完成",[["第2工程仕掛品",540000]],[["第1工程仕掛品",540000]]],["最終の完成",[["製品",986000]],[["第2工程仕掛品",986000]]]],"facts":["累加法による工程別総合原価計算を行っている。材料は第1工程の始点で投入する。第2工程は先入先出法による。","第1工程:月初仕掛品なし。当月投入1,000個(直接材料費300,000円、加工費285,000円)。完成900個、月末仕掛品100個(加工進捗度50%)。","第2工程:月初仕掛品200個(加工進捗度40%、前工程費118,000円、加工費20,000円)。当月の加工費388,000円。","第2工程:完成1,000個、月末仕掛品100個(加工進捗度50%)。"],"parts":[{"step":0,"label":"第1工程の月末仕掛品原価","ans":45000,"calc":["材料 300,000 ÷ 1,000 = 300、100個 × 300 = 30,000","加工費 285,000 ÷ (900 + 50) = 300、50個 × 300 = 15,000","合計 45,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"第1工程の完成品原価","ans":540000,"calc":["300,000 + 285,000 − 45,000 = 540,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"第2工程の月末仕掛品の前工程費","ans":60000,"calc":["540,000 ÷ 900個 = 600","100個 × 600 = 60,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"第2工程の加工費の換算量(当月)","ans":970,"calc":["1,000 − 80(月初200個 × 40%) + 50(月末100個 × 50%) = 970"],"unit":"個","dirs":null,"dir":null},{"step":4,"label":"第2工程の月末仕掛品の加工費","ans":20000,"calc":["388,000 ÷ 970 = 400","50個 × 400 = 20,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"最終完成品の原価","ans":986000,"calc":["118,000 + 20,000 + 540,000 + 388,000 − 60,000 − 20,000 = 986,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["{3|累加法}による工程別総合原価計算を行っている。材料は第1工程の始点で投入する。第2工程は{5|先入先出法}による。","第1工程:{1|月初仕掛品なし}。当月投入1,000個({2|直接材料費300,000円、加工費285,000円})。{1|完成900個、月末仕掛品100個(加工進捗度50%)}。","第2工程:月初仕掛品200個(加工進捗度40%、{4|前工程費118,000円}、{5|加工費20,000円})。{5|当月の加工費388,000円}。","第2工程:{6|完成1,000個}、{4|月末仕掛品100個}(加工進捗度50%)。"],"mnotes":["第1工程の材料の箱と加工費の箱を書く","300,000 + 285,000 − 45,000 = 540,000","540,000を、第2工程の前工程費(当月投入900個)として書く","前工程費の単価 540,000 ÷ 900 = 600、月末100個で60,000","換算量970、単価400、月末50個で20,000","月初138,000 + 当月928,000 − 月末80,000 = 986,000"],"fig":{"title":"第1工程の完成品を、第2工程の箱に前工程費として入れる","svg":"<svg viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"工程別総合原価計算の箱\"><defs><marker id=\"ahf27\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf27\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"260\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"27\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"76\" y=\"16\" font-size=\"12\" fill=\"#a8550a\" text-anchor=\"middle\">第1工程<\/text><rect x=\"6\" y=\"24\" width=\"140\" height=\"130\" fill=\"none\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf27)\" stroke-linecap=\"round\"/><line x1=\"76\" y1=\"24\" x2=\"76\" y2=\"154\" stroke= 掛品なし。"],"parts":[{"step":1,"label":"A組への組間接費の配賦額","ans":150000,"calc":["350,000 ÷ (300 + 400)時間 = 500","300時間 × 500 = 150,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"A組の月末仕掛品原価","ans":100000,"calc":["材料 300,000 ÷ 1,000 = 300、200個 × 300 = 60,000","加工費 (210,000 + 150,000) ÷ (800 + 100) = 400、100個 × 400 = 40,000","合計 100,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"A組の完成品原価","ans":560000,"calc":["300,000 + 210,000 + 150,000 − 100,000 = 560,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"B組の完成品原価","ans":750000,"calc":["400,000 + 150,000 + 200,000 = 750,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["組別総合原価計算を行っている。{2|組間接費350,000円}は、{2|機械作業時間(A組300時間、B組400時間)}で各組に配賦する。材料は工程の始点で投入する。","A組:組直接費は{1|直接材料費300,000円、加工費210,000円}。{3|当月投入1,000個、完成800個、月末仕掛品200個(加工進捗度50%)}。月初仕掛品なし。","B組:組直接費は{1|直接材料費400,000円、加工費150,000円}。{5|当月投入500個がすべて完成}した。月初・月末の仕掛品なし。"],"mnotes":["A組とB組の組直接費をそれぞれに集める","350,000 ÷ 700時間 = 500。A組150,000、B組200,000","A組の箱:材料は1,000個、加工費は換算量900個","A組の月末 60,000 + 40,000 = 100,000","A組560,000、B組750,000"],"fig":{"title":"組間接費を各組に配ってから、組ごとに計算する","svg":"<svg viewBox=\"0 0 320 232\" role=\"img\" aria-label=\"組別総合原価計算の下書き\"><defs><marker id=\"ahf28\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf28\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"252\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"28\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"4\" y=\"18\" font-size=\"12\" fill=\"#262626\">組間接費 350,000 ÷ 700時間 = @500<\/text><rect x=\"110\" y=\"30\" width=\"100\" height=\"30\" fill=\"none\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf28)\" stroke-linecap=\"round\"/><text x=\"160\" y=\"50\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">組間接費<\/text  rx=\"3\" fill=\"rgba(90,150,255,0.38)\" filter=\"url(#rgf28)\" stroke-linecap=\"round\"/><text x=\"176\" y=\"134\" font-size=\"11\" fill=\"#6a6a6a\">材料<\/text><text x=\"308\" y=\"134\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">400,000<\/text><text x=\"176\" y=\"154\" font-size=\"11\" fill=\"#6a6a6a\">加工<\/text><text x=\"308\" y=\"154\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">150,000<\/text><text x=\"176\" y=\"174\" font-size=\"11\" fill=\"#a8550a\">間接<\/text><text x=\"308\" y=\"174\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">200,000<\/text><text x=\"176\" y=\"194\" font-size=\"11\" fill=\"#6a6a6a\">月末<\/text><text x=\"308\" y=\"194\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">なし<\/text><text x=\"176\" y=\"214\" font-size=\"11\" fill=\"#6a6a6a\">完成<\/text><text x=\"308\" y=\"214\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">750,000<\/text><\/svg>","notes":[["組間接費は、機械作業時間の比で各組に配る","rgba(255,140,60,0.45)"],["配った組間接費は加工費に含め、組ごとに月末仕掛品を出す","rgba(255,205,0,0.55)"],["組ごとに、月初 + 当月 − 月末で完成品原価を出す","rgba(90,150,255,0.38)"]]}},{"id":"q4e","qno":"第4問","name":"等級別総合原価計算","star":1,"time":"15分","lead":"まとめて完成品総合原価を出し、等価係数を掛けた積数の比で、等級ごとに按分します。","steps":[{"t":"完成品総合原価をまとめて出す","d":"等級を区別せず、1つの総合原価計算として月初 + 当月 − 月末で出す。"},{"t":"等価係数を掛けて積数を出す","d":"完成品の数量 × 等価係数 = 積数。"},{"t":"積数の比で完成品原価を按分する","d":"完成品総合原価 ÷ 積数の合計 × 各等級の積数。"},{"t":"単位原価を出す","d":"各等級の完成品原価 ÷ 実際の数量。積数で割らない。"},{"t":"等級ごとの製品勘定へ振り替える","d":"1級製品・2級製品などに分けて振り替える。"}],"traps":["単位原価は、積数ではなく実際の完成品の数量で割る","等価係数は、問題の基準(重量・面積など)をそのまま使う","月末仕掛品は、等級に分ける前にまとめて計算する"],"entries":[["完成",[["A製品",480000],["B製品",640000]],[["仕掛品",1120000]]]],"facts":["等級別総合原価計算を行っている。等級製品はA製品とB製品で、等価係数はA製品1.0、B製品0.8である。","月初仕掛品原価80,000円、当月製造費用1,200,000円、月末仕掛品原価160,000円(計算済み)である。","当月の完成品は、A製品600個、B製品1,000個である。"],"parts":[{"step":0,"label":"完成品総合原価","ans":1120000,"calc":["80,000 + 1,200,000 − 160,000 = 1,120,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"B製品の積数","ans":800,"calc":["1,000個 × 0.8 = 800"],"unit":"個","dirs":null,"dir":null},{"step":2,"label":"A製品の完成品原価","ans":480000,"calc":["1,120,000 ÷ (600 + 800) = 800","600 × 800 = 480,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"B製品の完成品原価","ans":640000,"calc":["800 × 800 = 640,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"B製品の単位原価","ans":640,"calc":["640,000 ÷ 1,000個 = 640"],"unit":"円","dirs":null,"dir":null}],"mfacts":["等級別総合原価計算を行っている。等級製品はA製品とB製品で、{2|等価係数はA製品1.0、B製品0.8}である。","{1|月初仕掛品原価80,000円、当月製造費用1,200,000円、月末仕掛品原価160,000円}(計算済み)である。","当月の完成品は、{2|A製品600個、B製品1,000個}である。"],"mnotes":["80,000 + 1,200,000 − 160,000 = 1,120,000","積数 A 600 × 1.0 = 600、B 1,000 × 0.8 = 800","1,120,000 ÷ 1,400 = 800。A 480,000、B 640,000","B 640,000 ÷ 1,000個 = 640",""],"fig":{"title":"数量 × 等価係数 = 積数の表を書き、積数の比で按分する","svg":"<svg viewBox=\"0 0 320 232\" role=\"img\" aria-label=\"等級別総合原価計算の積数の表\"><defs><marker id=\"ahf29\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf29\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"252\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"29\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"4\" y=\"18\" font-size=\"11\" fill=\"#262626\">完成品 80,000 + 1,200,000 − 160,000 = 1,120,000<\/text><text x=\"120\" y=\"46\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"end\">数量<\/text><text x=\"190\" y=\"46\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"end\">係数<\/text><text x=\"260\" y=\"46\" font-size=\"11\" fill=\"#6a6a6a\" text-anchor=\"end\">積数<\/text><line x1=\"4\" y1=\"54\" x2=\"316\" y2=\"54\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf29)\" stroke-linecap=\"round\"/><text x=\"8\" y=\"76\" font-size=\"12\" fill=\"#262626\">A製品<\/text><text x=\"120\" y=\"76\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">600<\/text><text x=\"190\" y=\"76\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">1.0<\/text><text x=\"260\" y=\"76\" font-size=\"12\" fill=\"#2554a8\" text-anchor=\"end\">600<\/text><text x=\"8\" y=\"98\" font-size=\"12\" fill=\"#262626\">B製品<\/text><text x=\"120\" y=\"98\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">1,000<\/text><text x=\"190\" y=\"98\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">0.8<\/text><text x=\"260\" y=\"98\" font-size=\"12\" fill=\"#2554a8\" text-anchor=\"end\">800<\/text><line x1=\"200\" y1=\"106\" x2=\"266\" y2=\"106\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf29)\" stroke-linecap=\"round\"/><text x=\"260\" y=\"124\" font-size=\"13\" fill=\"#2554a8\" text-anchor=\"end\">1,400<\/text><rect x=\"4\" y=\"136\" width=\"312\" height=\"18\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf29)\" stroke-linecap=\"round\"/><text x=\"8\" y=\"150\" font-size=\"12\" fill=\"#262626\">1,120,000 ÷ 1,400 = @800(積数あたり)<\/text><text x=\"8\" y=\"176\" font-size=\"12\" fill=\"#262626\">A 600 × 800 = 480,000<\/text><text x=\"8\" y=\"196\" font-size=\"12\" fill=\"#262626\">B 800 × 800 = 640,000<\/text><text x=\"8\" y=\"222\" font-size=\"12\" fill=\"#c2410c\">B の単位原価 640,000 ÷ 1,000個 = 640<\/text><ellipse cx=\"268\" cy=\"217\" rx=\"20\" ry=\"11\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"1.5\" filter=\"url(#rgf29)\" stroke-linecap=\"round\"/><\/svg>","notes":[["完成品総合原価は、等級に分ける前にまとめて出す",null],["積数の合計で割った単価(@800)で、各等級に按分する","rgba(255,205,0,0.55)"],["単位原価は、積数ではなく実際の数量(1,000個)で割る","rgba(230,80,60,0.35)"]]}},{"id":"q4r","qno":"第4問","name":"製造原価報告書","star":3,"time":"15分","lead":"資料を直接費と間接費に分け、予定配賦との差異を調整して、仕掛品と製品の流れで計算します。","steps":[{"t":"材料費を直接と間接に分ける","d":"消費額は「月初 + 当月仕入 − 月末」。主要材料は直接、補助材料は間接。"},{"t":"労務費を直接と間接に分ける","d":"要支払額は「支払 − 月初未払 + 月末未払」。直接工の直接作業分が直接労務費。"},{"t":"経費を集めて製造間接費の実際発生額を出す","d":"工場の経費だけ。本社の費用は販売費及び一般管理費。"},{"t":"配賦差異を出す","d":"予定配賦額 − 実際発生額。プラスは有利、マイナスは不利。"},{"t":"当月製品製造原価を出す","d":"当月総製造費用 + 月初仕掛品 − 月末仕掛品。"},{"t":"売上原価と営業利益を出す","d":"月初製品 + 当月製品製造原価 − 月末製品に、配賦差異を加減する。"}],"traps":["本社の減価償却費や水道光熱費を製造間接費に入れない","有利差異は報告書では足し、売上原価からは引く","未払賃金の足し引きを逆にしない"],"entries":[["予定配賦",[["仕掛品",1020000]],[["製造間接費",1020000]]],["差異の振替",[["製造間接費",30000]],[["製造間接費配賦差異",30000]]],["差異を売上原価へ",[["製造間接費配賦差異",30000]],[["売上原価",30000]]]],"facts":["製造間接費は直接労務費の100%を予定配賦し、配賦差異は売上原価に加減する。","主要材料(直接):月初100,000、当月仕入1,200,000、月末120,000","補助材料(間接):月初20,000、当月仕入180,000、月末30,000","直接工(すべて直接労務費):支払1,000,000、月初未払150,000、月末未払170,000","間接工:支払300,000、月初未払40,000、月末未払30,000。工場事務員の給料150,000","工場の経費:減価償却費240,000、水道光熱費80,000、保険料60,000。本社の減価償却費60,000、水道光熱費20,000","月初仕掛品300,000、月末仕掛品400,000、月初製品500,000、月末製品420,000。売上高5,000,000、販売費及び一般管理費1,300,000(単位:円)"],"parts":[{"step":0,"label":"直接材料費","ans":1180000,"calc":["100,000 + 1,200,000 − 120,000 = 1,180,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"直接労務費","ans":1020000,"calc":["1,000,000 − 150,000 + 170,000 = 1,020,000"],"unit":"円","dirs":null,"dir":null},{"step":2,"label":"製造間接費の実際発生額","ans":990000,"calc":["補助材料 170,000 + 間接工 290,000 + 給料 150,000 + 経費 380,000 = 990,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"製造間接費配賦差異","ans":30000,"calc":["予定 1,020,000 − 実際 990,000 = +30,000"],"unit":"円","dirs":["有利","不利"],"dir":"有利"},{"step":4,"label":"当月製品製造原価","ans":3120000,"calc":["当月総製造費用 1,180,000 + 1,020,000 + 1,020,000 = 3,220,000","300,000 + 3,220,000 − 400,000 = 3,120,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"売上原価","ans":3170000,"calc":["500,000 + 3,120,000 − 420,000 − 30,000 = 3,170,000"],"unit":"円","dirs":null,"dir":null},{"step":5,"label":"営業利益","ans":530000,"calc":["5,000,000 − 3,170,000 − 1,300,000 = 530,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["{4|製造間接費は直接労務費の100%を予定配賦し}、{6|配賦差異は売上原価に加減する}。","{1|主要材料(直接):月初100,000、当月仕入1,200,000、月末120,000}","{1|補助材料(間接):月初20,000、当月仕入180,000、月末30,000}","{2|直接工(すべて直接労務費):支払1,000,000、月初未払150,000、月末未払170,000}","{2|間接工:支払300,000、月初未払40,000、月末未払30,000}。{2|工場事務員の給料150,000}","{3|工場の経費:減価償却費240,000、水道光熱費80,000、保険料60,000}。本社の減価償却費60,000、水道光熱費20,000","{5|月初仕掛品300,000、月末仕掛品400,000}、{6|月初製品500,000、月末製品420,000。売上高5,000,000、販売費及び一般管理費1,300,000}(単位:円)"],"mnotes":["直接材料費1,180,000。補助材料の消費170,000は製造間接費へ","直接労務費 1,000,000 − 150,000 + 170,000 = 1,020,000。間接工290,000と給料150,000は製造間接費へ","工場の経費380,000だけを集める。本社の分は販売費及び一般管理費","予定配賦額 1,020,000 − 実際 990,000 = +30,000(有利)","月初仕掛品 + 当月総製造費用3,220,000 − 月末仕掛品 = 3,120,000","売上原価 500,000 + 3,120,000 − 420,000 − 30,000 = 3,170,000、営業利益530,000"],"fig":{"title":"仕掛品と製造間接費のT字を書き、差額で完成品原価を出す","svg":"<svg viewBox=\"0 0 320 244\" role=\"img\" aria-label=\"仕掛品と製造間接費のT字\"><defs><marker id=\"ahf11\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf11\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"264\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"11\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"160\" y=\"18\" font-size=\"13\" fill=\"#262626\" text-anchor=\"middle\">仕掛品<\/text><line x1=\"20.0\" y1=\"25\" x2=\"300.0\" y2=\"25\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf11)\" stroke-linecap=\"round\"/><line x1=\"160\" y1=\"25\" x2=\"160\" y2=\"102\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf11)\" stroke-linecap=\"round\"/><text x=\"24\" y=\"44\" font-size=\"11\" fill=\"#6a6a6a\">月初<\/text><text x=\"154\" y=\"44\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">300,000<\/text><text x=\"24\" y=\"62\" font-size=\"11\" fill=\"#6a6a6a\">材料<\/text><text x=\"154\" y=\"62\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">1,180,000<\/text><text x=\"24\" y=\"80\" font-size=\"11\" fill=\"#6a6a6a\">労務<\/text><text x=\"154\" y=\"80\" font-size=\"13\" fill=\"#262626\" text-anchor=\"end\">1,020,000<\/text><rect x=\"84\" y=\"81\" width=\"7 ,"パーシャル・プランなら実際の780,000"],"unit":"円","dirs":null,"dir":null}],"mfacts":["標準原価計算を行っている。製品1個あたりの標準原価は、{1|直接材料費1,000円、直接労務費800円、製造間接費1,200円}で、合計3,000円である。{3|材料は工程の始点で投入}する。","{3|月初仕掛品100個(加工進捗度50%)}、{2|完成品900個、月末仕掛品200個(加工進捗度50%)}","当月の実際発生額:{5|直接材料費1,030,000円、直接労務費780,000円、製造間接費1,150,000円}","{4|パーシャル・プランとシングル・プラン}で、仕掛品勘定がどう違うかを考える。"],"mnotes":["1個3,000円。加工費(労務費 + 製造間接費)は2,000円","完成品 2,700,000、月末仕掛品 200,000 + 200,000 = 400,000","材料1,000個分 1,000,000、加工費950個分 1,900,000","パーシャルは仕掛品の借方が実際、シングルは標準","2,900,000 − 2,960,000 = −60,000(不利)","シングルの直接労務費は 950個 × 800 = 760,000"],"fig":{"title":"2つのプランの仕掛品勘定を並べ、実際と標準の書く場所を比べる","svg":"<svg viewBox=\"0 0 320 232\" role=\"img\" aria-label=\"パーシャル・プランとシングル・プラン\"><defs><marker id=\"ahf30\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf30\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"252\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"30\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"4\" y=\"16\" font-size=\"13\" fill=\"#a8550a\">パーシャル<\/text><text x=\"168\" y=\"16\" font-size=\"13\" fill=\"#a8550a\">シングル<\/text><line x1=\"4\" y1=\"26\" x2=\"152\" y2=\"26\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf30)\" stroke-linecap=\"round\"/><text x=\"8\" y=\"46\" font-size=\"11\" fill=\"#6a6a6a\">月初<\/text><text x=\"148\" y=\"46\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">200,000<\/text><rect x=\"66\" y=\"53\" width=\"84\" height=\"17\" rx=\"3\" fill=\"rgba(255,120,165,0.42)\" filter=\"url(#rgf30)\" stroke-linecap=\"round\"/><text x=\"8\" y=\"66\" font-size=\"11\" fill=\"#6a6a6a\">材料<\/text><text x=\"148\" y=\"66\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">1,030,000<\/text><rect x=\"66\" y=\"73\" width=\"84\" height=\"17\" rx=\"3\" fill=\"rgba(255,120,165,0.42)\" filter=\"url(#rgf30)\" stroke-linecap=\"round\"/><text x=\"8\" y=\"86\" font-size=\"11\" fill=\"#6a6a6a\">労務<\/text><text x=\"148\" y=\"86\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">780,000<\/text><rect x=\"66\" y=\"93\" width=\"84\" height=\"17\" rx=\"3\" fill=\"rgba(255,120,165,0.42)\" filter=\"url(#rgf30)\" stroke-linecap=\"round\"/><text x=\"8\" y=\"106\" font-size=\"11\" fill=\"#6a6a6a\">間接<\/text><text x=\"148\" y=\"106\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">1,150,000<\/text><line x1=\"168\" y1=\"26\" x2=\"316\" y2=\"26\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf30)\" stroke-linecap=\"round\"/><text x=\"172\" y=\"46\" font-size=\"11\" fill=\"#6a6a6a\">月初<\/text><text x=\"312\" y=\"46\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">200,000<\/text><rect x=\"230\" y=\"53\" width=\"84\" height=\"17\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf30)\" stroke-linecap=\"round\"/><text x=\"172\" y=\"66\" font-size=\"11\" fill=\"#6a6a6a\">材料<\/text><text x=\"312\" y=\"66\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">1,000,000<\/text><rect x=\"230\" y=\"73\" width=\"84\" height=\"17\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf30)\" stroke-linecap=\"round\"/><text x=\"172\" y=\"86\" font-size=\"11\" fill=\"#6a6a6a\">労務<\/text><text x=\"312\" y=\"86\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">760,000<\/text><rect x=\"230\" y=\"93\" width=\"84\" height=\"17\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf30)\" stroke-linecap=\"round\"/><text x=\"172\" y=\"106\" font-size=\"11\" fill=\"#6a6a6a\">間接<\/text><text x=\"312\" y=\"106\" font-size=\"12\" fill=\"#262626\" text-anchor=\"end\">1,140,000<\/text><text x=\"86\" y=\"134\" font-size=\"11\" fill=\"#c2410c\" text-anchor=\"middle\">借方 = 実際<\/text><text x=\"242\" y=\"134\" font-size=\"11\" fill=\"#a8550a\" text-anchor=\"middle\">借方 = 標準<\/text><text x=\"4\" y=\"162\" font-size=\"12\" fill=\"#262626\">貸方はどちらも標準<\/text><text x=\"8\" y=\"182\" font-size=\"12\" fill=\"#262626\">完成 900 × 3,000 = 2,700,000<\/text><text x=\"8\" y=\"200\" font-size=\"12\" fill=\"#262626\">月末 200,000 + 200,000 = 400,000<\/text><text x=\"8\" y=\"222\" font-size=\"12\" fill=\"#c2410c\">パーシャルは貸方に 差異 60,000<\/text><\/svg>","notes":[["パーシャル・プランは、仕掛品の借方に実際の金額を書く","rgba(255,120,165,0.42)"],["シングル・プランは、仕掛品の借方も標準。差異は材料・賃金などの勘定に出る","rgba(255,205,0,0.55)"],["完成品と月末仕掛品は、どちらのプランでも標準原価",null]]}},{"id":"q5m","qno":"第5問","name":"標準原価計算(材料・労務)","star":3,"time":"10分","lead":"当月投入量から標準原価を出し、価格と数量(賃率と時間)の差異に分けます。","steps":[{"t":"当月投入量を出す","d":"材料は当月投入の数量、加工費(労務費)は換算量で考える。"},{"t":"標準原価を計算する","d":"標準単価 × 標準消費量(当月投入量 × 1個あたりの標準)。"},{"t":"総差異を出す","d":"標準原価 − 実際原価。"},{"t":"価格差異と数量差異に分ける","d":"価格(賃率)差異は (標準単価 − 実際単価) × 実際数量、数量(時間)差異は (標準数量 − 実際数量) × 標準単価。"},{"t":"有利か不利かを判断する","d":"マイナスなら不利、プラスなら有利。2つの差異の合計が総差異と一致するか確かめる。"}],"traps":["労務費の標準時間は、完成品数ではなく当月投入の換算量で計算する","価格差異には実際数量を、数量差異には標準価格を掛ける","差異は「標準 − 実際」で向きをそろえる"],"entries":[["パーシャル・プランの差異の振替",[["材料価格差異",10250],["材料数量差異",10000],["時間差異",10000]],[["仕掛品",22550],["賃率差異",7700]]]],"facts":["製品1個あたりの標準:直接材料費 1kg 200円 × 5kg、直接労務費 1時間 1,000円 × 2時間","当月投入量:材料は400個分、加工費の換算量は380個分","実際:直接材料 2,050kg(1kg 205円)、直接作業 770時間(1時間 990円)"],"parts":[{"step":1,"label":"直接材料費の標準原価","ans":400000,"calc":["400個 × 5kg × 200 = 400,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"材料価格差異","ans":10250,"calc":["(200 − 205) × 2,050kg = −10,250"],"unit":"円","dirs":["有利","不利"],"dir":"不利"},{"step":3,"label":"材料数量差異","ans":10000,"calc":["(2,000kg − 2,050kg) × 200 = −10,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"},{"step":3,"label":"賃率差異","ans":7700,"calc":["(1,000 − 990) × 770時間 = +7,700"],"unit":"円","dirs":["有利","不利"],"dir":"有利"},{"step":3,"label":"時間差異","ans":10000,"calc":["(760時間 − 770時間) × 1,000 = −10,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"}],"mfacts":["{2|製品1個あたりの標準:直接材料費 1kg 200円 × 5kg、直接労務費 1時間 1,000円 × 2時間}","{1|当月投入量:材料は400個分、加工費の換算量は380個分}","{4|実際:直接材料 2,050kg(1kg 205円)、直接作業 770時間(1時間 990円)}"],"mnotes":["材料は400個分、労務費は換算量の380個分で標準を出す","材料 400 × 5kg × 200 = 400,000、労務 380 × 2時間 × 1,000 = 760,000","実際の材料費 2,050kg × 205 = 420,250。標準400,000との差は −20,250","ボックス図の外側に実際、内側に標準を書いて、価格差異と数量差異に分ける","標準 − 実際がマイナスなら不利、プラスなら有利"],"fig":{"title":"ボックス図を書き、価格と数量の差異に分ける","svg":"<svg viewBox=\"0 0 320 234\" role=\"img\" aria-label=\"標準原価計算のボックス図\"><defs><marker id=\"ahf12\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf12\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"254\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"12\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"96.0\" y=\"18\" font-size=\"13\" fill=\"#a8550a\" text-anchor=\"middle\">材料<\/text><rect x=\"44\" y=\"40\" width=\"104\" height=\"16\" rx=\"3\" fill=\"rgba(255,120,165,0.42)\" filter=\"url(#rgf12)\" stroke-linecap=\"round\"/><rect x=\"110\" y=\"56\" width=\"38\" height=\"114\" rx=\"3\" fill=\"rgba(90,150,255,0.38)\" filter=\"url(#rgf12)\" stroke-linecap=\"round\"/><rect x=\"44\" y=\"56\" width=\"66\" height=\"114\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf12)\" stroke-linecap=\"round\"/><rect x=\"44\" y=\"40\" width=\"104\" height=\"130\" fill=\"none\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf12)\" stroke-linecap=\"round\"/><line x1=\"44\" y1=\"56\" x2=\"148\" y2=\"56\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf12)\" stroke-linecap=\"round\"/><line x1=\"110\" y1=\"56\" x2=\"110\" y2=\"170\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf12)\" stroke-linecap=\"round\"/><text x=\"40\" y=\"44\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"end\">205<\/text><text x=\"40\" y=\"62\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"end\">200<\/text><text x=\"96.0\" y=\"52\" font-s y=\"124\" font-size=\"11\" fill=\"#262626\" text-anchor=\"middle\">760,000<\/text><text x=\"289.0\" y=\"108\" font-size=\"10\" fill=\"#262626\" text-anchor=\"middle\">時間<\/text><text x=\"289.0\" y=\"124\" font-size=\"9\" fill=\"#c2410c\" text-anchor=\"middle\">△10,000<\/text><text x=\"270\" y=\"184\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">760h<\/text><text x=\"308\" y=\"198\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">770h<\/text><text x=\"8\" y=\"224\" font-size=\"12\" fill=\"#262626\">外側 = 実際、内側 = 標準。(標準 − 実際)で計算<\/text><\/svg>","notes":[["ボックス図は、外側の線に実際、内側の線に標準を書く",null],["上の帯が価格差異(賃率差異)、右の帯が数量差異(時間差異)","rgba(255,120,165,0.42)"],["標準 − 実際がマイナスなら不利、プラスなら有利",null]]}},{"id":"q5o","qno":"第5問","name":"製造間接費の差異分析","star":3,"time":"10分","lead":"予算許容額を先に出し、予算・能率・操業度の3つに分けます。","steps":[{"t":"予算許容額を出す","d":"変動費率 × 実際時間 + 固定費予算。"},{"t":"予算差異を出す","d":"予算許容額 − 実際発生額。"},{"t":"能率差異を出す","d":"(標準時間 − 実際時間) × 標準配賦率(または変動費率。問題の指示に従う)。"},{"t":"操業度差異を出す","d":"(実際時間 − 基準操業度) × 固定費率。"},{"t":"合計を総差異と照らし合わせる","d":"標準配賦額 − 実際発生額 と、3つの差異の合計が一致するか確かめる。"}],"traps":["能率差異は「標準と実際」、操業度差異は「実際と基準」を比べる","操業度差異には固定費率を掛ける","能率差異に使う配賦率は、問題の指示を必ず確認する"],"entries":[["シングル・プランの場合",[["仕掛品",1400000],["能率差異",50000],["操業度差異",30000]],[["製造間接費",1470000],["予算差異",10000]]]],"facts":["当月の標準直接作業時間は2,800時間、実際直接作業時間は2,900時間である。","公式法変動予算:変動費率1時間200円、月間固定費予算900,000円、基準操業度3,000時間。標準配賦率は1時間500円。","製造間接費の実際発生額は1,470,000円である。能率差異は標準配賦率で計算する。"],"parts":[{"step":0,"label":"予算許容額","ans":1480000,"calc":["200 × 2,900 + 900,000 = 1,480,000"],"unit":"円","dirs":null,"dir":null},{"step":1,"label":"予算差異","ans":10000,"calc":["1,480,000 − 1,470,000 = +10,000"],"unit":"円","dirs":["有利","不利"],"dir":"有利"},{"step":2,"label":"能率差異","ans":50000,"calc":["500 × (2,800 − 2,900) = −50,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"},{"step":3,"label":"操業度差異","ans":30000,"calc":["固定費率 900,000 ÷ 3,000 = 300","300 × (2,900 − 3,000) = −30,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"},{"step":4,"label":"総差異","ans":70000,"calc":["標準配賦額 2,800 × 500 = 1,400,000","1,400,000 − 1,470,000 = −70,000 = 10,000 − 50,000 − 30,000"],"unit":"円","dirs":["有利","不利"],"dir":"不利"}],"mfacts":["当月の{3|標準直接作業時間は2,800時間}、{1|実際直接作業時間は2,900時間}である。","公式法変動予算:{1|変動費率1時間200円、月間固定費予算900,000円}、{4|基準操業度3,000時間}。{3|標準配賦率は1時間500円}。","製造間接費の{2|実際発生額は1,470,000円}である。{3|能率差異は標準配賦率で計算する}。"],"mnotes":["200 × 2,900 + 900,000 = 1,480,000","1,480,000 − 1,470,000 = +10,000(有利)","500 × (2,800 − 2,900) = −50,000(不利)","固定費率300 × (2,900 − 3,000) = −30,000(不利)","標準配賦額 1,400,000 − 実際 1,470,000 = −70,000。3つの差異の合計と一致"],"fig":{"title":"横に作業時間、縦に配賦率の図を書き、差異の帯を読む","svg":"<svg viewBox=\"0 0 320 232\" role=\"img\" aria-label=\"製造間接費の差異分析の図\"><defs><marker id=\"ahf13\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 1 L10 5 L0 9\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.6\"/><\/marker><filter id=\"rgf13\" filterUnits=\"userSpaceOnUse\" x=\"-10\" y=\"-10\" width=\"340\" height=\"252\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"13\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"2.4\"/><\/filter><\/defs><text x=\"8\" y=\"18\" font-size=\"11\" fill=\"#262626\">予算許容額 200 × 2,900 + 900,000 = 1,480,000<\/text><text x=\"210\" y=\"44\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">標準<\/text><text x=\"250\" y=\"44\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">実際<\/text><text x=\"290\" y=\"44\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">基準<\/text><rect x=\"30\" y=\"50\" width=\"180\" height=\"100\" rx=\"3\" fill=\"rgba(255,205,0,0.55)\" filter=\"url(#rgf13)\" stroke-linecap=\"round\"/><rect x=\"210\" y=\"50\" width=\"40\" height=\"100\" rx=\"3\" fill=\"rgba(255,120,165,0.42)\" filter=\"url(#rgf13)\" stroke-linecap=\"round\"/><rect x=\"250\" y=\"50\" width=\"40\" height=\"60\" rx=\"3\" fill=\"rgba(90,150,255,0.38)\" filter=\"url(#rgf13)\" stroke-linecap=\"round\"/><rect x=\"30\" y=\"50\" width=\"260\" height=\"100\" fill=\"none\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf13)\" stroke-linecap=\"round\"/><line x1=\"30\" y1=\"110\" x2=\"290\" y2=\"110\" stroke=\"#262626\" stroke-width=\"1.4\" filter=\"url(#rgf13)\" stroke-linecap=\"round\"/><line x1=\"210\" y1=\"50\" x2=\"210\" y2=\"150\" stroke=\"#262626\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\" filter=\"url(#rgf13)\" stroke-linecap=\"round\"/><line x1=\"250\" y1=\"50\" x2=\"250\" y2=\"150\" stroke=\"#262626\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\" filter=\"url(#rgf13)\" stroke-linecap=\"round\"/><text x=\"26\" y=\"84\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"end\">固定<\/text><text x=\"26\" y=\"96\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"end\">300<\/text><text x=\"26\" y=\"130\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"end\">変動<\/text><text x=\"26\" y=\"142\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"end\">200<\/text><text x=\"120\" y=\"82\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">標準配賦額<\/text><text x=\"120\" y=\"100\" font-size=\"12\" fill=\"#262626\" text-anchor=\"middle\">1,400,000<\/text><text x=\"230\" y=\"104\" font-size=\"11\" fill=\"#c2410c\" text-anchor=\"middle\">能率<\/text><text x=\"270\" y=\"84\" font-size=\"10\" fill=\"#2554a8\" text-anchor=\"middle\">操業<\/text><text x=\"270\" y=\"96\" font-size=\"10\" fill=\"#2554a8\" text-anchor=\"middle\">度<\/text><text x=\"210\" y=\"164\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">2,800<\/text><text x=\"250\" y=\"164\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">2,900<\/text><text x=\"290\" y=\"164\" font-size=\"10\" fill=\"#6a6a6a\" text-anchor=\"middle\">3,000<\/text><text x=\"8\" y=\"186\" font-size=\"12\" fill=\"#c2410c\">能率 500 × (2,800 − 2,900) = △50,000<\/text><text x=\"8\" y=\"204\" font-size=\"12\" fill=\"#2554a8\">操業度 300 × (2,900 − 3,000) = △30,000<\/text><text x=\"8\" y=\"222\" font-size=\"12\" fill=\"#16803c\">予算 1,480,000 − 1,470,000 = +10,000<\/text><\/svg>","notes":[["横軸に標準・実際・基準の作業時間、縦に変動費率と固定費率を書く",null],["標準と実際の間の帯が能率差異(標準配賦率500で計算)","rgba(255,120,165,0.42)"],["実際と基準の間の、固定費の部分が操業度差異","rgba(90,150,255,0.38)"],["予算差異は、予算許容額 − 実際発生額",null]]}},{"id":"q5c","qno":"第5問","name":"直接原価計算とCVP分析","star":3,"time":"10分","lead":"変動費と固定費に分けて貢献利益を出し、それを使って損益分岐点や目標販売量を求めます。","steps":[{"t":"変動費と固定費に分ける","d":"変動製造原価・変動販売費と、固定製造原価・固定販売費及び一般管理費。"},{"t":"1個の貢献利益を出す","d":"販売単価 − 変動費(製造と販売の両方)。"},{"t":"直接原価計算の営業利益を出す","d":"貢献利益の合計 − 固定費の全額。"},{"t":"全部原価計算の営業利益と比べる","d":"差は、期末在庫に含まれる固定製造原価。"},{"t":"損益分岐点を出す","d":"固定費 ÷ 1個の貢献利益。売上高は × 販売単価。"},{"t":"安全余裕率と目標の販売量を出す","d":"安全余裕率 = (売上高 − 損益分岐点売上高) ÷ 売上高。目標販売量 = (固定費 + 目標利益) ÷ 1個の貢献利益。"}],"traps":["貢献利益から変動販売費を引き忘れない","全部原価計算の固定製造原価は、作った個数で割る","安全余裕率の分母は、損益分岐点ではなく当期の売上高"],"entries":[["全部原価計算の完成",[["製品",3600000]],[["仕掛品",3600000]]],["直接原価計算の完成",[["製品",2400000]],[["仕掛品",2400000]]]],"facts":["生産量3,000個、販売量2,500個。期首・期末の仕掛品と期首の製品はない。","販売単価2,000円。変動製造原価1個800円、固定製造原価1,200,000円。","変動販売費1個200円、固定販売費及び一般管理費600,000円。目標営業利益は1,000,000円とする。"],"parts":[{"step":1,"label":"1個の貢献利益","ans":1000,"calc":["2,000 − 800 − 200 = 1,000"],"unit":"円/個","dirs":null,"dir":null},{"step":2,"label":"直接原価計算の営業利益","ans":700000,"calc":["2,500個 × 1,000 − (1,200,000 + 600,000) = 700,000"],"unit":"円","dirs":null,"dir":null},{"step":3,"label":"全部原価計算の営業利益","ans":900000,"calc":["製造原価 1個 800 + 1,200,000 ÷ 3,000 = 1,200","5,000,000 − 2,500 × 1,200 − (500,000 + 600,000) = 900,000"],"unit":"円","dirs":null,"dir":null},{"step":4,"label":"損益分岐点の販売量","ans":1800,"calc":["1,800,000 ÷ 1,000 = 1,800"],"unit":"個","dirs":null,"dir":null},{"step":5,"label":"安全余裕率","ans":28,"calc":["損益分岐点売上高 1,800 × 2,000 = 3,600,000","(5,000,000 − 3,600,000) ÷ 5,000,000 = 28%"],"unit":"%","dirs":null,"dir":null},{"step":5,"label":"目標営業利益を達成する販売量","ans":2800,"calc":["(1,800,000 + 1,000,000) ÷ 1,000 = 2,800"],"unit":"個","dirs":null,"dir":null}],"mfacts":["{4|生産量3,000個}、{3|販売量2,500個}。期首・期末の仕掛品と期首の製品はない。","{2|販売単価2,000円}。{1|変動製造原価1個800円}、{1|固定製造原価1,200,000円}。",     } else {
      var right = cur.order.filter(function (i, k) { return i === k; }).length;
      h += '<p class="verdict' + (right === n ? ' all' : '') + '">' + n + 'つ中 ' + right + 'つが正しい位置です' + (right === n ? '。全部正解です' : '') + '</p>' +
        '<h3 class="sec-h">正しい順番</h3><ol class="steps">' + t.steps.map(function (s) { return '<li><b>' + esc(s.t) + '</b><span>' + esc(s.d) + '</span></li>'; }).join('') + '</ol>' +
        '<div class="actions"><button type="button" class="btn btn-primary" data-act="reorder">もう一度並べる</button><a class="btn btn-ghost" href="#' + t.id + '/solve">練習問題を解く</a></div>';
    }
    return h + '</section>';
  }
  function startSolve() { cur.step = 0; cur.marks = {}; }
  function partHtml(t, p, idx) {
    var m = cur.marks[idx], dis = m ? ' disabled' : '';
    return '<div class="part' + (m ? (m.ok ? ' is-ok' : ' is-ng') : '') + '"><label class="p-l" for="p-' + idx + '">' + esc(p.label) + '</label><div class="p-ctrl">' +
      (p.dirs ? '<select id="d-' + idx + '" aria-label="' + esc(p.label) + (p.ans === null ? '' : 'の向き') + '"' + dis + '><option value="">選ぶ</option>' + p.dirs.map(function (d) { return '<option' + (m && m.dir === d ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select>' : '') +
      (p.ans === null ? '' : '<input id="p-' + idx + '" type="text" inputmode="decimal" autocomplete="off" value="' + (m ? esc(m.raw) : '') + '"' + dis + '><span class="unit">' + esc(p.unit) + '</span>') + '</div>' +
      (m ? '<div class="p-fb">' + (m.ok ? '○ 正解' : '× 正解は ' + (p.ans === null ? p.dir : fmt(p.ans) + esc(p.unit) + (p.dir ? ' ' + p.dir : ''))) + '</div><ul class="calc">' + p.calc.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
  }
  function renderSolve(t) {
    var fin = cur.step >= t.steps.length - 1 && t.parts.every(function (p, idx) { return cur.marks[idx]; });
    var h = '<section class="paper"><h3 class="sec-h">問題の資料</h3>' + exBox(t, fin ? 0 : cur.step + 1, false) + '<p class="ask">' + (fin ? 'すべての手順のマーカーを表示しています。' : '今の手順(' + circ(cur.step + 1) + ')のマーカーを太く、ほかの手順のマーカーを細い線で表示しています。') + '</p></section>';
    for (var i = 0; i <= Math.min(cur.step, t.steps.length - 1); i++) {
      var s = t.steps[i], ps = [];
      t.parts.forEach(function (p, idx) { if (p.step === i) ps.push(idx); });
      var checked = ps.every(function (idx) { return cur.marks[idx]; });
      h += '<section class="paper stp' + (i < cur.step ? ' past' : '') + '"><div class="stp-no">手順' + (i + 1) + ' / ' + t.steps.length + '</div><h3 class="stp-t"><span class="exn k' + (i + 1) + '">' + circ(i + 1) + '</span>' + esc(s.t) + '</h3><p class="stp-d">' + esc(s.d) + '</p>' + lookHtml(t, i) +
        ps.map(function (idx) { return partHtml(t, t.parts[idx], idx); }).join('');
      if (i === cur.step) {
        if (ps.length && !checked) h += '<div class="actions"><button type="button" class="btn btn-primary" data-act="check" data-step="' + i + '">確かめる</button><button type="button" class="btn btn-quiet" data-act="giveup" data-step="' + i + '">答えを見る</button></div>';
        else if (i < t.steps.length - 1) h += '<div class="actions"><button type="button" class="btn btn-primary" data-act="next">次の手順へ</button></div>';
      }
      h += '</section>';
    }
    if (fin) {
      var ok = t.parts.filter(function (p, idx) { return cur.marks[idx].ok; }).length;
      h += '<section class="paper"><p class="verdict' + (ok === t.parts.length ? ' all' : '') + '">' + t.parts.length + '問中 ' + ok + '問正解' + (ok === t.parts.length ? '。全問正解です' : '') + '</p>' +
        '<h3 class="sec-h">本番で書く下書き</h3>' + figHtml(t) + '<h3 class="sec-h">この問題の仕訳</h3>' + entriesHtml(t) +
        '<div class="actions"><button type="button" class="btn btn-primary" data-act="resolve">最初から解き直す</button><a class="btn btn-ghost" href="#">ほかの形式を選ぶ</a></div></section>';
    }
    return h;
  }
  function renderType() {
    var t = cur.t;
    var body = cur.tab === 'order' ? renderOrder(t) : cur.tab === 'solve' ? renderSolve(t) : renderRead(t);
    el('view').innerHTML = head(t) + body;
  }
  function route() {
    var m = location.hash.replace('#', '').split('/'), t = find(m[0]);
    if (!t) { cur.t = null; el('home').hidden = false; renderHome(); return; }
    var tab = ['read', 'order', 'solve'].indexOf(m[1]) >= 0 ? m[1] : 'read';
    var changed = cur.t !== t || cur.tab !== tab;
    if (cur.t !== t || tab !== cur.tab) {
      if (tab === 'order') startOrder(t);
      if (tab === 'solve') startSolve();
    }
    cur.t = t; cur.tab = tab;
    el('home').hidden = true;
    renderType();
    if (changed) window.scrollTo(0, 0);
  }
  function mark(t, idx) {
    var p = t.parts[idx], d = p.dirs ? el('d-' + idx).value : null;
    if (p.ans === null) { cur.marks[idx] = { raw: '', dir: d, ok: d === p.dir }; return; }
    var raw = el('p-' + idx).value, v = parseNum(raw);
    cur.marks[idx] = { raw: raw, dir: d, ok: Math.abs(v - p.ans) < 1e-9 && (!p.dir || d === p.dir) };
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || !cur.t) return;
    var t = cur.t, d = b.dataset;
    if (d.pick !== undefined) {
      cur.order.push(Number(d.pick));
      if (cur.order.length === t.steps.length) {
        cur.checked = true;
        if (cur.order.every(function (i, k) { return i === k; })) { rec[t.id] = rec[t.id] || {}; rec[t.id].order = true; save(); }
      }
      renderType(); return;
    }
    if (d.act === 'undo') { cur.order.pop(); renderType(); return; }
    if (d.act === 'reorder') { startOrder(t); renderType(); return; }
    if (d.act === 'check' || d.act === 'giveup') {
      var st = Number(d.step);
      t.parts.forEach(function (p, idx) {
        if (p.step !== st) return;
        if (d.act === 'check') mark(t, idx); else cur.marks[idx] = { raw: '', dir: null, ok: false };
      });
      if (t.parts.every(function (p, idx) { return cur.marks[idx]; })) {
        var all = t.parts.every(function (p, idx) { return cur.marks[idx].ok; });
        if (all) { rec[t.id] = rec[t.id] || {}; rec[t.id].solved = true; save(); }
      }
      renderType(); return;
    }
    if (d.act === 'next') {
      cur.step++;
      renderType();
      var secs = document.querySelectorAll('.stp');
      if (secs.length) secs[secs.length - 1].scrollIntoView({ block: 'start' });
      return;
    }
    if (d.act === 'resolve') { startSolve(); renderType(); window.scrollTo(0, 0); }
  });
  window.addEventListener('hashchange', route);
  el('resetBtn').addEventListener('click', function () {
    if (window.confirm('「できた」の記録をすべて消します。よろしいですか?')) { rec = {}; save(); route(); }
  });
  route();
})();
</script>
</body>
</html>
