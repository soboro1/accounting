<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資本連結 ランダム問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #101b2d;
    color: #f6f1e6;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .kicker { font-size: 13px; letter-spacing: 3px; color: #d4a24c; font-weight: 700; }
  h1 { font-size: 26px; font-weight: 700; margin: 4px 0 0 0; }
  .score-label { font-size: 13px; color: #9aa5b1; text-align: right; }
  .score-value { font-size: 22px; font-weight: 700; color: #d4a24c; text-align: right; }

  .topic-badge {
    display: inline-flex; align-self: flex-start;
    padding: 6px 16px; border-radius: 999px;
    background: rgba(212,162,76,0.18); border: 1px solid #d4a24c;
    font-size: 13px; font-weight: 700; color: #d4a24c; letter-spacing: 1px;
  }

  .problem-card {
    padding: 20px 24px; border: 1px solid rgba(212,162,76,0.35); border-radius: 12px;
    background: rgba(255,255,255,0.03); display: flex; flex-direction: column; gap: 6px;
  }
  .problem-line { font-size: 16px; line-height: 1.9; color: #e8e3d8; }
  .problem-line b { color: #f6f1e6; }

  .inputs-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .input-group { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 14px; color: #c7c0b0; }
  .input-group input {
    padding: 10px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid rgba(212,162,76,0.4); background: #0e1726; color: #f6f1e6; font-family: inherit;
  }
  .input-group input::placeholder { color: #6b7688; }
  .input-group input:focus { outline: none; border-color: #d4a24c; }

  .hint { font-size: 12px; color: #8b93a1; }
  .error { font-size: 13px; color: #f0997b; display: none; }

  .buttons-row { display: flex; gap: 12px; flex-wrap: wrap; }
  button { font-family: inherit; cursor: pointer; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 700; border: none; }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.95); }
  .btn-primary { color: #101b2d; background: #d4a24c; }
  .btn-secondary { color: #d4a24c; background: transparent; border: 1px solid #d4a24c; }

  .result-card { padding: 18px 22px; border-radius: 12px; border: 2px solid; display: none; flex-direction: column; gap: 8px; }
  .result-card.show { display: flex; }
  .result-title { font-size: 17px; font-weight: 700; }
  .result-explanation { font-size: 14px; line-height: 1.8; color: #e8e3d8; white-space: pre-line; }

  .footer-note { font-size: 12px; color: #6b7688; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">

  <div class="header-row">
    <div>
      <div class="kicker">BOOKKEEPING 連結会計 資本連結</div>
      <h1>資本連結 ランダム問題</h1>
    </div>
    <div>
      <div class="score-label">スコア</div>
      <div class="score-value"><span id="score">0</span> / <span id="total">0</span></div>
    </div>
  </div>

  <div class="topic-badge" id="topicBadge"></div>

  <div class="problem-card" id="problemCard"></div>

  <div class="inputs-row">
    <div class="input-group">
      <label id="label1"></label>
      <input type="text" id="input1" autocomplete="off">
    </div>
    <div class="input-group">
      <label id="label2"></label>
      <input type="text" id="input2" autocomplete="off">
    </div>
  </div>
  <div class="hint">半角数字、カンマなしで入力(単位は千円)。マイナスは先頭に「-」。税効果は考えない。解説に仕訳も出ます。</div>
  <div class="error" id="errorText"></div>

  <div class="buttons-row">
    <button class="btn-primary" id="checkBtn">解答する</button>
    <button class="btn-secondary" id="nextBtn">次の問題へ</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-explanation" id="resultExplanation"></div>
  </div>

  <div class="footer-note">連結会計 資本連結(投資と資本の相殺消去)の練習用アプリ(自己採点)</div>

</div>

<script>
(function () {
  var state = { problem: null, score: 0, total: 0 };

  function randMultiple(min, max, step) {
    var n = Math.floor(Math.random() * ((max - min) / step + 1));
    return min + n * step;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fmt(n) {
    var s = Math.abs(Math.round(n)).toLocaleString('ja-JP');
    return (n < 0 ? '−' : '') + s;
  }
  function sg(n) { return (n > 0 ? '+' : '') + fmt(n); }
  function je(dr, cr) {
    // dr, cr: [[科目, 金額], ...](金額0の行は省く)
    dr = dr.filter(function (x) { return x[1] !== 0; });
    cr = cr.filter(function (x) { return x[1] !== 0; });
    return dr.map(function (x) { return '(借)' + x[0] + ' ' + fmt(x[1]); }).join('\n') + '\n' +
           cr.map(function (x) { return '(貸)' + x[0] + ' ' + fmt(x[1]); }).join('\n');
  }

  // 支配獲得日の共通データ(X1年3月31日に取得)
  function acqData(opt) {
    opt = opt || {};
    var p = opt.allowFull && Math.random() < 0.15 ? 100 : pick([60, 70, 75, 80, 90]);
    var n = 100 - p;
    var C = randMultiple(20, 80, 1) * 1000;
    var R0 = randMultiple(5, 40, 1) * 1000;
    var hasD = Math.random() < 0.6;
    var LB = randMultiple(10, 30, 1) * 1000;
    var D = hasD ? randMultiple(1, 10, 1) * 1000 : 0;
    var NA0 = C + R0 + D;
    var G = opt.allowNeg && Math.random() < 0.2 ? -randMultiple(1, 5, 1) * 1000 : randMultiple(1, 20, 1) * 1000;
    var Y = pick([10, 20]);
    return {
      p: p, n: n, C: C, R0: R0, D: D, LB: LB, NA0: NA0, G: G, Y: Y,
      a: G > 0 ? G / Y : 0,
      cost: NA0 * p / 100 + G,
      nci0: NA0 * n / 100
    };
  }
  function acqLines(d, noAmort) {
    return [
      'P社はX1年3月31日に、S社の発行済株式の<b>' + d.p + '%</b>を<b>' + fmt(d.cost) + '千円</b>で取得し、支配を獲得した。',
      '同日のS社の純資産は、資本金<b>' + fmt(d.C) + '千円</b>、利益剰余金<b>' + fmt(d.R0) + '千円</b>である。',
      d.D > 0
        ? '同日、S社の土地(帳簿価額<b>' + fmt(d.LB) + '千円</b>)の時価は<b>' + fmt(d.LB + d.D) + '千円</b>であった。それ以外の資産・負債は時価と帳簿価額が同じ。'
        : 'S社の資産・負債の時価は、帳簿価額と同じである。',
      (noAmort ? '' : 'のれんは<b>' + d.Y + '年</b>で定額法により償却する。') + '税効果は考えない。会計期間は4月1日〜3月31日。'
    ];
  }
  // 支配獲得日の計算(タイムテーブルの起点)
  function acqCalc(d) {
    return (d.D > 0 ? '評価差額 = 時価 ' + fmt(d.LB + d.D) + ' − 帳簿価額 ' + fmt(d.LB) + ' = ' + fmt(d.D) + '\n' : '') +
      '支配獲得日の純資産 = 資本金 ' + fmt(d.C) + ' + 利益剰余金 ' + fmt(d.R0) + (d.D > 0 ? ' + 評価差額 ' + fmt(d.D) : '') + ' = ' + fmt(d.NA0) + '\n' +
      'P社持分 = ' + fmt(d.NA0) + ' × ' + d.p + '% = ' + fmt(d.NA0 * d.p / 100) + '\n' +
      (d.n > 0 ? '非支配株主持分 = ' + fmt(d.NA0) + ' × ' + d.n + '% = ' + fmt(d.nci0) + '\n' : '') +
      'のれん = 取得原価 ' + fmt(d.cost) + ' − P社持分 ' + fmt(d.NA0 * d.p / 100) + ' = ' + fmt(d.G) + '\n';
  }
  function revalJE(d) {
    return d.D > 0 ? '子会社の資産の時価評価:\n' + je([['土地', d.D]], [['評価差額', d.D]]) + '\n' : '';
  }

  // ① 支配獲得日の資本連結
  function genAcq() {
    var d = acqData({ allowFull: true, allowNeg: true });
    var neg = d.G < 0;
    return {
      badge: '支配獲得日の資本連結' + (d.D > 0 ? '(時価評価あり)' : ''),
      lines: acqLines(d, true).concat(['支配獲得日の連結財務諸表を作成する。']),
      label1: 'のれん(負ののれんは−で入力、千円)',
      label2: '非支配株主持分(千円)',
      ph1: '例: 8000 / -2000', ph2: '例: 24000',
      answers: [d.G, d.nci0],
      explanation:
        '子会社の資産・負債は支配獲得日の時価で評価してから、投資と資本を相殺する。\n' +
        acqCalc(d) +
        (neg ? '取得原価がP社持分を下回るので、差額 ' + fmt(-d.G) + ' は負ののれん発生益(特別利益)になる。\n' : '') +
        (d.n === 0 ? '100%子会社なので、非支配株主持分は0。\n' : '') +
        '【仕訳】\n' + revalJE(d) +
        '投資と資本の相殺消去:\n' +
        je([['資本金', d.C], ['利益剰余金', d.R0], ['評価差額', d.D], ['のれん', neg ? 0 : d.G]],
           [['S社株式', d.cost], ['非支配株主持分', d.nci0], ['負ののれん発生益', neg ? -d.G : 0]])
    };
  }

  // ② 支配獲得後1年目(のれん償却・利益の按分・配当金の修正)
  function genYear1() {
    var d = acqData();
    var NI = randMultiple(4, 20, 1) * 1000;
    var Div = Math.random() < 0.75 ? randMultiple(1, NI / 1000 - 1, 1) * 1000 : 0;
    var PNI = randMultiple(20, 80, 1) * 1000;
    var nciNI = NI * d.n / 100, divP = Div * d.p / 100, divN = Div * d.n / 100;
    var nciEnd = d.nci0 + nciNI - divN;
    var parentNI = PNI + NI - d.a - divP - nciNI;
    return {
      badge: '支配獲得後1年目(のれん償却・利益の按分・配当金)',
      lines: acqLines(d).concat([
        'X2年3月期のS社の当期純利益は<b>' + fmt(NI) + '千円</b>、' +
          (Div > 0 ? '配当金は<b>' + fmt(Div) + '千円</b>である。' : '配当は行っていない。'),
        'P社の個別P/Lの当期純利益は<b>' + fmt(PNI) + '千円</b>' + (Div > 0 ? '(S社からの受取配当金を含む)' : '') + 'である。'
      ]),
      label1: 'X2年3月31日の非支配株主持分(千円)',
      label2: '連結P/Lの親会社株主に帰属する当期純利益(千円)',
      ph1: '例: 25000', ph2: '例: 52000',
      answers: [nciEnd, parentNI],
      explanation:
        acqCalc(d) +
        'のれん償却 = ' + fmt(d.G) + ' ÷ ' + d.Y + '年 = ' + fmt(d.a) + '\n' +
        '利益の按分:非支配株主へ ' + fmt(NI) + ' × ' + d.n + '% = ' + fmt(nciNI) + '\n' +
        (Div > 0 ? '配当金の修正:P社の受取配当金 ' + fmt(Div) + ' × ' + d.p + '% = ' + fmt(divP) + ' を消去、非支配株主の分 ' + fmt(divN) + ' は非支配株主持分を減らす\n' : '') +
        '期末の非支配株主持分 = ' + fmt(d.nci0) + ' + ' + fmt(nciNI) + (Div > 0 ? ' − ' + fmt(divN) : '') + ' = ' + fmt(nciEnd) + '\n' +
        '(検算)期末のS社純資産 ' + fmt(d.NA0 + NI - Div) + ' × ' + d.n + '% = ' + fmt((d.NA0 + NI - Div) * d.n / 100) + '\n' +
        '親会社株主に帰属する当期純利益 = P社 ' + fmt(PNI) + ' + S社 ' + fmt(NI) + ' − のれん償却 ' + fmt(d.a) +
          (Div > 0 ? ' − 受取配当金 ' + fmt(divP) : '') + ' − 非支配株主の分 ' + fmt(nciNI) + ' = ' + fmt(parentNI) + '\n' +
        '【仕訳】\n' + revalJE(d) +
        '開始仕訳(支配獲得日の相殺消去):\n' +
        je([['資本金当期首残高', d.C], ['利益剰余金当期首残高', d.R0], ['評価差額', d.D], ['のれん', d.G]],
           [['S社株式', d.cost], ['非支配株主持分当期首残高', d.nci0]]) + '\n' +
        'のれんの償却:\n' + je([['のれん償却', d.a]], [['のれん', d.a]]) + '\n' +
        '子会社の当期純利益の按分:\n' + je([['非支配株主に帰属する当期純利益', nciNI]], [['非支配株主持分当期変動額', nciNI]]) +
        (Div > 0 ? '\n配当金の修正:\n' + je([['受取配当金', divP], ['非支配株主持分当期変動額', divN]], [['剰余金の配当', Div]]) : '')
    };
  }

  // ③ n年目の開始仕訳
  function genOpening() {
    var d = acqData();
    var k = pick([1, 2, 3, 4]);
    var inc = randMultiple(2, 25, 1) * 1000;
    var R1 = d.R0 + inc;
    var reN = inc * d.n / 100, amCum = d.a * k;
    var reDr = d.R0 + reN + amCum;
    var nci1 = (d.C + R1 + d.D) * d.n / 100;
    var y0 = 1 + k, y1 = 2 + k;
    return {
      badge: '支配獲得後' + (k + 1) + '年目の開始仕訳',
      lines: acqLines(d).concat([
        'X' + y0 + '年3月31日(前期末)のS社の純資産は、資本金<b>' + fmt(d.C) + '千円</b>、利益剰余金<b>' + fmt(R1) + '千円</b>である。',
        '当期(X' + y0 + '年4月1日〜X' + y1 + '年3月31日)の連結財務諸表を作成するための開始仕訳について答えなさい。'
      ]),
      label1: '開始仕訳の利益剰余金当期首残高(借方、千円)',
      label2: '開始仕訳の非支配株主持分当期首残高(千円)',
      ph1: '例: 23500', ph2: '例: 26000',
      answers: [reDr, nci1],
      explanation:
        '開始仕訳 = 支配獲得日の相殺消去 + 前期までの連結修正(利益の按分・のれん償却)を、利益剰余金当期首残高でまとめたもの。\n' +
        '【タイムテーブル】\n' +
        '・X1年3月31日(支配獲得日)\n' + acqCalc(d).replace(/^(?=.)/gm, '　') +
        '・X1年4月1日〜X' + y0 + '年3月31日(' + k + '年間)\n' +
        '　利益剰余金の増加 = ' + fmt(R1) + ' − ' + fmt(d.R0) + ' = ' + fmt(inc) + '\n' +
        '　うち非支配株主へ振り替えた分 = ' + fmt(inc) + ' × ' + d.n + '% = ' + fmt(reN) + '\n' +
        '　のれん償却の累計 = ' + fmt(d.a) + ' × ' + k + '年 = ' + fmt(amCum) + '\n' +
        '利益剰余金当期首残高(借方)= 取得時 ' + fmt(d.R0) + ' + 非支配株主へ ' + fmt(reN) + ' + のれん償却 ' + fmt(amCum) + ' = ' + fmt(reDr) + '\n' +
        '非支配株主持分当期首残高 =(' + fmt(d.C) + ' + ' + fmt(R1) + (d.D > 0 ? ' + ' + fmt(d.D) : '') + ')× ' + d.n + '% = ' + fmt(nci1) + '\n' +
        'のれん(未償却残高)= ' + fmt(d.G) + ' − ' + fmt(amCum) + ' = ' + fmt(d.G - amCum) + '\n' +
        '【仕訳】\n' + revalJE(d) +
        '開始仕訳:\n' +
        je([['資本金当期首残高', d.C], ['利益剰余金当期首残高', reDr], ['評価差額', d.D], ['のれん', d.G - amCum]],
           [['S社株式', d.cost], ['非支配株主持分当期首残高', nci1]]) + '\n' +
        '(内訳:支配獲得日の相殺消去)\n' +
        je([['資本金当期首残高', d.C], ['利益剰余金当期首残高', d.R0], ['評価差額', d.D], ['のれん', d.G]],
           [['S社株式', d.cost], ['非支配株主持分当期首残高', d.nci0]]) + '\n' +
        '(内訳:前期までの利益の按分)\n' + je([['利益剰余金当期首残高', reN]], [['非支配株主持分当期首残高', reN]]) + '\n' +
        '(内訳:前期までののれん償却)\n' + je([['利益剰余金当期首残高', amCum]], [['のれん', amCum]])
    };
  }

  // ④ 連結B/Sの利益剰余金と非支配株主持分
  function genConsBS() {
    var d = acqData();
    var k = pick([1, 2, 3, 4, 5]);
    var inc = randMultiple(2, 30, 1) * 1000;
    var R2 = d.R0 + inc;
    var PR = randMultiple(60, 200, 1) * 1000;
    var amCum = d.a * k;
    var consRE = PR + inc * d.p / 100 - amCum;
    var nci = (d.C + R2 + d.D) * d.n / 100;
    var yE = 1 + k;
    return {
      badge: '連結B/Sの利益剰余金と非支配株主持分',
      lines: acqLines(d).concat([
        'X' + yE + '年3月31日の個別B/Sの利益剰余金は、P社<b>' + fmt(PR) + '千円</b>、S社<b>' + fmt(R2) + '千円</b>である(S社の資本金は変わっていない)。',
        'X' + yE + '年3月31日の連結B/Sについて答えなさい。'
      ]),
      label1: '連結B/Sの利益剰余金(千円)',
      label2: '連結B/Sの非支配株主持分(千円)',
      ph1: '例: 128000', ph2: '例: 27000',
      answers: [consRE, nci],
      explanation:
        '連結の利益剰余金 = 親会社の利益剰余金 + 子会社の「取得後」利益剰余金のうち親会社の持分 − のれん償却の累計。\n' +
        '取得時の利益剰余金は投資と相殺されるので含めない。配当金は親子双方の残高に反映済みなので、この式で調整は不要。\n' +
        acqCalc(d) +
        '取得後の利益剰余金の増加 = ' + fmt(R2) + ' − ' + fmt(d.R0) + ' = ' + fmt(inc) + '\n' +
        'P社の持分 = ' + fmt(inc) + ' × ' + d.p + '% = ' + fmt(inc * d.p / 100) + '\n' +
        'のれん償却の累計 = ' + fmt(d.a) + ' × ' + k + '年 = ' + fmt(amCum) + '\n' +
        '連結B/Sの利益剰余金 = ' + fmt(PR) + ' + ' + fmt(inc * d.p / 100) + ' − ' + fmt(amCum) + ' = ' + fmt(consRE) + '\n' +
        '非支配株主持分 = 期末のS社純資産(' + fmt(d.C) + ' + ' + fmt(R2) + (d.D > 0 ? ' + 評価差額 ' + fmt(d.D) : '') + ')× ' + d.n + '% = ' + fmt(nci) + '\n' +
        'のれん(連結B/S)= ' + fmt(d.G) + ' − ' + fmt(amCum) + ' = ' + fmt(d.G - amCum) + '\n' +
        '【仕訳】(期末時点の累計をまとめた形)\n' + revalJE(d) +
        je([['資本金', d.C], ['利益剰余金', d.R0 + inc * d.n / 100 + amCum], ['評価差額', d.D], ['のれん', d.G - amCum]],
           [['S社株式', d.cost], ['非支配株主持分', nci]]) + '\n' +
        '→ 連結の利益剰余金 = P社 ' + fmt(PR) + ' + S社 ' + fmt(R2) + ' − 消去 ' + fmt(d.R0 + inc * d.n / 100 + amCum) + ' = ' + fmt(consRE)
    };
  }

  function generateProblem() {
    for (var i = 0; i < 50; i++) {
      var y = Math.random(), p;
      if (y < 0.25) p = genAcq();
      else if (y < 0.5) p = genYear1();
      else if (y < 0.75) p = genOpening();
      else p = genConsBS();
      if (p.answers.every(Number.isInteger)) return p;
    }
    return genAcq();
  }

  function renderProblem() {
    var p = state.problem;
    document.getElementById('topicBadge').textContent = '【 ' + p.badge + ' 】';
    document.getElementById('problemCard').innerHTML = p.lines.map(function (l) {
      return '<div class="problem-line">' + l + '</div>';
    }).join('');
    document.getElementById('label1').textContent = p.label1;
    document.getElementById('label2').textContent = p.label2;
    var i1 = document.getElementById('input1');
    var i2 = document.getElementById('input2');
    i1.placeholder = p.ph1;
    i2.placeholder = p.ph2;
    i1.value = '';
    i2.value = '';
    document.getElementById('errorText').style.display = 'none';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;
  }

  function parseSigned(s) {
    if (s === undefined || s === null) return NaN;
    var t = String(s).trim().replace(/,/g, '').replace(/千円/g, '').replace(/円/g, '').replace(/[−▲△]/g, '-');
    if (t === '' || t === '-' || t === '+') return NaN;
    return Number(t);
  }

  function handleCheck() {
    var u1 = parseSigned(document.getElementById('input1').value);
    var u2 = parseSigned(document.getElementById('input2').value);
    var errEl = document.getElementById('errorText');
    if (isNaN(u1) || isNaN(u2)) {
      errEl.textContent = '両方の欄に数値を入力してください';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    var p = state.problem;
    var isCorrect = u1 === p.answers[0] && u2 === p.answers[1];
    state.total += 1;
    if (isCorrect) state.score += 1;
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;

    var resultCard = document.getElementById('resultCard');
    var resultTitle = document.getElementById('resultTitle');
    resultTitle.textContent = isCorrect ? '正解です!' : '不正解です。正解は ' + fmt(p.answers[0]) + ' / ' + fmt(p.answers[1]) + '(千円)';
    resultTitle.style.color = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.borderColor = isCorrect ? '#639922' : '#D85A30';
    resultCard.style.background = isCorrect ? 'rgba(99,153,34,0.14)' : 'rgba(216,90,48,0.14)';
    document.getElementById('resultExplanation').textContent = p.explanation;
    resultCard.classList.add('show');
  }

  function handleNext() {
    state.problem = generateProblem();
    renderProblem();
  }

  document.getElementById('checkBtn').addEventListener('click', handleCheck);
  document.getElementById('nextBtn').addEventListener('click', handleNext);
  document.getElementById('input1').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });
  document.getElementById('input2').addEventListener('keydown', function (e) { if (e.key === 'Enter') handleCheck(); });

  state.problem = generateProblem();
  renderProblem();
})();
</script>
</body>
</html>
