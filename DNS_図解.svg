<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <defs>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1F6FEB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#4A5D78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F5F8FC"/>

  <!-- Title -->
  <text x="800" y="80" text-anchor="middle" font-size="52" font-weight="800" fill="#1F3A5F">DNSのしくみ</text>
  <text x="800" y="125" text-anchor="middle" font-size="26" fill="#4A5D78">「localhost」の代わりに「www.example.com」へアクセスするとき</text>

  <!-- ===== Client card ===== -->
  <rect x="60" y="165" width="400" height="445" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="90" y="215" font-size="36" font-weight="800" fill="#1F3A5F">クライアント</text>
  <text x="315" y="213" font-size="22" fill="#4A5D78">（頼む側）</text>

  <!-- browser -->
  <rect x="90" y="240" width="340" height="180" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M90 252 a12 12 0 0 1 12 -12 h316 a12 12 0 0 1 12 12 v28 h-340 z" fill="#E2E8F0"/>
  <line x1="90" y1="280" x2="430" y2="280" stroke="#1F3A5F" stroke-width="2"/>
  <circle cx="108" cy="260" r="5" fill="#F87171"/>
  <circle cx="124" cy="260" r="5" fill="#FBBF24"/>
  <circle cx="140" cy="260" r="5" fill="#34D399"/>
  <rect x="155" y="249" width="265" height="22" rx="11" fill="#FFFFFF"/>
  <text x="287" y="265" text-anchor="middle" font-size="14" font-family="Menlo,monospace" fill="#1F3A5F">www.example.com/index.html</text>
  <text x="260" y="325" text-anchor="middle" font-size="26" font-weight="800" fill="#1F3A5F">Webページ</text>
  <rect x="140" y="342" width="240" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="170" y="362" width="180" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="160" y="380" width="200" height="30" rx="15" fill="#16A34A"/>
  <text x="260" y="401" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">⑤ 画面に表示</text>

  <!-- what the client knows -->
  <rect x="90" y="445" width="340" height="140" rx="14" fill="#FFF8E6" stroke="#E8B04A" stroke-width="2"/>
  <text x="110" y="482" font-size="20" font-weight="800" fill="#1F3A5F">最初に知っているのは…</text>
  <text x="110" y="520" font-size="20" fill="#1F3A5F">名前 <tspan font-family="Menlo,monospace" font-weight="700">www.example.com</tspan></text>
  <text x="110" y="552" font-size="20" fill="#1F3A5F">住所（IP）は<tspan font-weight="800" fill="#B91C1C">まだ知らない</tspan></text>

  <!-- ===== DNS server card ===== -->
  <rect x="1100" y="165" width="440" height="210" rx="24" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1130" y="212" font-size="34" font-weight="800" fill="#7C3AED">DNSサーバ</text>
  <text x="1328" y="210" font-size="20" fill="#4A5D78">（住所を教える係）</text>
  <rect x="1130" y="230" width="380" height="122" rx="12" fill="#F1E8FF"/>
  <rect x="1140" y="242" width="360" height="30" rx="6" fill="#DDD0FB"/>
  <g font-family="Menlo,monospace" font-size="17" fill="#1F3A5F">
    <text x="1152" y="263" font-weight="700">www.example.com  → 203.0.113.10</text>
    <text x="1152" y="296">mail.example.com → 203.0.113.25</text>
    <text x="1152" y="329">……</text>
  </g>

  <!-- ===== Web server card ===== -->
  <rect x="1100" y="400" width="440" height="210" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="1130" y="447" font-size="34" font-weight="800" fill="#1F3A5F">Webサーバ</text>
  <text x="1340" y="445" font-size="20" font-family="Menlo,monospace" fill="#4A5D78">203.0.113.10</text>
  <rect x="1130" y="465" width="380" height="122" rx="12" fill="#F5F8FC" stroke="#C9D6E8" stroke-width="2"/>
  <text x="1150" y="500" font-size="20" font-weight="800" fill="#1F3A5F">前回のMacと同じ役割</text>
  <text x="1150" y="533" font-size="18" fill="#4A5D78">リクエストされたファイルを返す</text>
  <rect x="1146" y="546" width="160" height="28" rx="6" fill="#FDE68A"/>
  <text x="1156" y="566" font-size="16" font-family="Menlo,monospace" font-weight="700" fill="#1F3A5F">index.html</text>

  <!-- ===== Middle arrows ===== -->
  <!-- ① ask -->
  <text x="780" y="225" text-anchor="middle" font-size="22" fill="#1F3A5F"><tspan font-weight="800" fill="#7C3AED">① 住所を質問</tspan>　「<tspan font-family="Menlo,monospace" font-weight="700">www.example.com</tspan> はどこ？」</text>
  <line x1="475" y1="245" x2="1080" y2="245" stroke="#7C3AED" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <!-- ② answer -->
  <line x1="1085" y1="292" x2="480" y2="292" stroke="#7C3AED" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 9" marker-end="url(#arrowPurple)"/>
  <text x="780" y="330" text-anchor="middle" font-size="22" fill="#1F3A5F"><tspan font-weight="800" fill="#7C3AED">② 住所を回答</tspan>　「<tspan font-family="Menlo,monospace" font-weight="700">203.0.113.10</tspan> です」</text>

  <!-- transition -->
  <rect x="560" y="370" width="440" height="40" rx="20" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="780" y="397" text-anchor="middle" font-size="19" fill="#4A5D78">住所がわかったので、ここから本番の通信</text>

  <!-- ③ request -->
  <text x="780" y="462" text-anchor="middle" font-size="20" fill="#1F3A5F"><tspan font-weight="800" fill="#1F6FEB">③ リクエスト</tspan>　<tspan font-family="Menlo,monospace" font-weight="700">GET /index.html</tspan>（宛先 <tspan font-family="Menlo,monospace">203.0.113.10</tspan>）</text>
  <line x1="475" y1="482" x2="1080" y2="482" stroke="#1F6FEB" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <!-- ④ response -->
  <line x1="1085" y1="529" x2="480" y2="529" stroke="#16A34A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <text x="780" y="567" text-anchor="middle" font-size="22" fill="#1F3A5F"><tspan font-weight="800" fill="#16A34A">④ レスポンス</tspan>　<tspan font-family="Menlo,monospace" font-weight="700">200 OK</tspan> ＋ HTML本体</text>
  <text x="780" y="600" text-anchor="middle" font-size="18" fill="#4A5D78">③④は前回の図とまったく同じ流れ</text>

  <!-- ===== Bottom A: phonebook ===== -->
  <rect x="60" y="640" width="500" height="230" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="90" y="688" font-size="28" font-weight="800" fill="#1F3A5F">DNS＝ネットの電話帳</text>
  <rect x="90" y="710" width="230" height="56" rx="12" fill="#F1E8FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="205" y="745" text-anchor="middle" font-size="20" font-family="Menlo,monospace" font-weight="700" fill="#7C3AED">www.example.com</text>
  <line x1="328" y1="738" x2="360" y2="738" stroke="#4A5D78" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGray)"/>
  <rect x="370" y="710" width="160" height="56" rx="12" fill="#FFF1E6" stroke="#E8833A" stroke-width="2"/>
  <text x="450" y="745" text-anchor="middle" font-size="20" font-family="Menlo,monospace" font-weight="700" fill="#C2620F">203.0.113.10</text>
  <g text-anchor="middle">
    <text x="205" y="798" font-size="20" font-weight="800" fill="#1F3A5F">ドメイン名</text>
    <text x="205" y="824" font-size="17" fill="#4A5D78">（人が覚える名前）</text>
    <text x="450" y="798" font-size="20" font-weight="800" fill="#1F3A5F">IPアドレス</text>
    <text x="450" y="824" font-size="17" fill="#4A5D78">（機械が使う番号）</text>
  </g>
  <text x="310" y="856" text-anchor="middle" font-size="18" fill="#1F3A5F">名前から電話番号を調べるのと同じ</text>

  <!-- ===== Bottom B: localhost ===== -->
  <rect x="590" y="640" width="470" height="230" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="620" y="688" font-size="28" font-weight="800" fill="#1F3A5F">前回の <tspan font-family="Menlo,monospace">localhost</tspan> は？</text>
  <rect x="620" y="710" width="410" height="56" rx="12" fill="#F5F8FC" stroke="#C9D6E8" stroke-width="2"/>
  <text x="825" y="745" text-anchor="middle" font-size="20" font-family="Menlo,monospace" font-weight="700" fill="#1F3A5F">localhost → 127.0.0.1</text>
  <text x="620" y="800" font-size="20" fill="#1F3A5F">Macの中のメモ（hostsファイル）に</text>
  <text x="620" y="828" font-size="20" fill="#1F3A5F">最初から書いてあるので</text>
  <text x="620" y="856" font-size="20" font-weight="800" fill="#1F3A5F">DNSに聞かなくてよい</text>

  <!-- ===== Bottom C: try ===== -->
  <rect x="1090" y="640" width="450" height="230" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="1120" y="688" font-size="28" font-weight="800" fill="#1F3A5F">自分で試す</text>
  <rect x="1120" y="706" width="390" height="112" rx="12" fill="#1E293B"/>
  <g font-family="Menlo,monospace" font-size="17">
    <text x="1138" y="740" fill="#A5F3C4">$ nslookup example.com</text>
    <text x="1138" y="770" fill="#CBD5E1">Name:    example.com</text>
    <text x="1138" y="798" fill="#FDE68A">Address: （IPアドレス）</text>
  </g>
  <text x="1120" y="852" font-size="20" fill="#1F3A5F">ターミナルからDNSサーバに聞ける</text>
</svg>
