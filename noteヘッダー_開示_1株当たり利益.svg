<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="160" fill="#2F7DE1" opacity="0.16"/>
  <circle cx="1250" cy="660" r="210" fill="#E8543F" opacity="0.14"/>
  <circle cx="680" cy="700" r="110" fill="#0FA18D" opacity="0.12"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="86" width="280" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="220" y="119" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">簿記1級 | 会計学</text>

  <text x="80" y="226" class="dg" font-size="66" fill="#5BA2FF">開示・1株当たり利益</text>
  <text x="80" y="318" class="dg" font-size="56" fill="#FFC94A">の</text>
  <text x="150" y="318" class="dg" font-size="68" fill="#FF7A66">出る論点</text>

  <text x="80" y="398" font-size="28" font-weight="700" fill="#fff" opacity="0.95">株式分割・後発事象・セグメントを図と仕訳で</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="432" width="190" height="50" rx="25" fill="#fff"/>
    <text x="175" y="465" fill="#1D5DB3">3つのパート</text>
    <rect x="284" y="432" width="164" height="50" rx="25" fill="#fff"/>
    <text x="366" y="465" fill="#8A6000">計算問題3問</text>
    <rect x="462" y="432" width="150" height="50" rx="25" fill="#fff"/>
    <text x="537" y="465" fill="#A8205C">○×54問</text>
  </g>

  <text x="80" y="556" font-size="20" font-weight="500" fill="#fff" opacity="0.8">図解つき・登録不要の無料Webページ</text>

  <!-- 右:3つのパート -->
  <text x="1000" y="112" text-anchor="middle" class="dg" font-size="26" fill="#fff">数字だけでは分からないことを補う</text>

  <g filter="url(#shadow)">
    <rect x="790" y="146" width="420" height="88" rx="16" fill="#2F7DE1"/>
    <rect x="790" y="246" width="420" height="88" rx="16" fill="#E8543F"/>
    <rect x="790" y="346" width="420" height="88" rx="16" fill="#0FA18D"/>
  </g>
  <g font-weight="900" fill="#fff">
    <text x="812" y="182" font-size="21">1株当たり利益</text>
    <text x="812" y="214" font-size="15" font-weight="700" opacity="0.92">期中平均株式数・株式分割・潜在株式</text>
    <text x="1190" y="200" font-size="19" text-anchor="end">→ 株式数</text>
    <text x="812" y="282" font-size="21">後発事象</text>
    <text x="812" y="314" font-size="15" font-weight="700" opacity="0.92">原因が決算日にあれば当期を修正</text>
    <text x="1190" y="300" font-size="19" text-anchor="end">→ 決算日後</text>
    <text x="812" y="382" font-size="21">セグメント・関連当事者</text>
    <text x="812" y="414" font-size="15" font-weight="700" opacity="0.92">マネジメント・アプローチ、10%と75%</text>
    <text x="1190" y="400" font-size="19" text-anchor="end">→ 内訳</text>
  </g>

  <rect x="790" y="460" width="420" height="50" rx="25" fill="#fff" fill-opacity="0.10" stroke="#FFC94A" stroke-width="2"/>
  <text x="1000" y="492" text-anchor="middle" font-size="19" font-weight="900" fill="#fff">株式分割は期首に行われたと仮定</text>

  <text x="1000" y="584" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">主要株主は議決権10%以上</text>
  <text x="1000" y="616" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="2">役員報酬・一般競争入札は対象外</text>
</svg>
