<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <rect width="1600" height="900" fill="#F5F8FC"/>

  <!-- Title -->
  <text x="800" y="80" text-anchor="middle" font-size="52" font-weight="800" fill="#1F3A5F">プログラムの実行に必要なもの</text>
  <text x="800" y="125" text-anchor="middle" font-size="26" fill="#4A5D78">「CPU・OS・python3」だけでは足りない。メモリ・ストレージ・コードも必要</text>

  <!-- ===== Hardware ===== -->
  <rect x="60" y="155" width="1480" height="270" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="90" y="203" font-size="30" font-weight="800" fill="#1F3A5F">ハードウェア（機械）</text>
  <g>
    <rect x="90" y="225" width="332" height="175" rx="14" fill="#E9F9EF" stroke="#16A34A" stroke-width="2"/>
    <text x="108" y="253" font-size="16" font-weight="800" fill="#166534">✓ 質問で挙げたもの</text>
    <text x="256" y="293" text-anchor="middle" font-size="26" font-weight="800" fill="#1F3A5F">CPU</text>
    <text x="256" y="327" text-anchor="middle" font-size="19" fill="#1F3A5F">機械語を実行する</text>
    <text x="256" y="353" text-anchor="middle" font-size="19" fill="#1F3A5F">（計算の本体）</text>
    <text x="256" y="384" text-anchor="middle" font-size="17" fill="#4A5D78">たとえ：料理人の手</text>
  </g>
  <g>
    <rect x="452" y="225" width="332" height="175" rx="14" fill="#F3EEFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="470" y="253" font-size="16" font-weight="800" fill="#5B21B6">＋ 追加で必要</text>
    <text x="618" y="293" text-anchor="middle" font-size="26" font-weight="800" fill="#1F3A5F">メモリ（RAM）</text>
    <text x="618" y="327" text-anchor="middle" font-size="19" fill="#1F3A5F">実行中のプログラムと</text>
    <text x="618" y="353" text-anchor="middle" font-size="19" fill="#1F3A5F">データを置く場所</text>
    <text x="618" y="384" text-anchor="middle" font-size="17" fill="#4A5D78">たとえ：調理台</text>
  </g>
  <g>
    <rect x="814" y="225" width="332" height="175" rx="14" fill="#F3EEFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="832" y="253" font-size="16" font-weight="800" fill="#5B21B6">＋ 追加で必要</text>
    <text x="980" y="293" text-anchor="middle" font-size="26" font-weight="800" fill="#1F3A5F">ストレージ（SSD）</text>
    <text x="980" y="327" text-anchor="middle" font-size="19" fill="#1F3A5F">コードや python3 本体を</text>
    <text x="980" y="353" text-anchor="middle" font-size="19" fill="#1F3A5F">保存しておく場所</text>
    <text x="980" y="384" text-anchor="middle" font-size="17" fill="#4A5D78">たとえ：冷蔵庫と本棚</text>
  </g>
  <g>
    <rect x="1176" y="225" width="332" height="175" rx="14" fill="#F5F8FC" stroke="#C9D6E8" stroke-width="2"/>
    <text x="1194" y="253" font-size="16" font-weight="800" fill="#4A5D78">あると便利</text>
    <text x="1342" y="293" text-anchor="middle" font-size="26" font-weight="800" fill="#1F3A5F">入出力装置</text>
    <text x="1342" y="327" text-anchor="middle" font-size="19" fill="#1F3A5F">キーボード・画面など</text>
    <text x="1342" y="353" text-anchor="middle" font-size="19" fill="#1F3A5F">無いと結果が見えない</text>
    <text x="1342" y="384" text-anchor="middle" font-size="17" fill="#4A5D78">たとえ：注文と配膳の窓口</text>
  </g>

  <!-- ===== Software ===== -->
  <rect x="60" y="445" width="1480" height="270" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="90" y="493" font-size="30" font-weight="800" fill="#1F3A5F">ソフトウェア</text>
  <g>
    <rect x="90" y="515" width="332" height="175" rx="14" fill="#E9F9EF" stroke="#16A34A" stroke-width="2"/>
    <text x="108" y="543" font-size="16" font-weight="800" fill="#166534">✓ 質問で挙げたもの</text>
    <text x="256" y="583" text-anchor="middle" font-size="26" font-weight="800" fill="#1F3A5F">OS（macOS）</text>
    <text x="256" y="617" text-anchor="middle" font-size="19" fill="#1F3A5F">メモリやCPUを割り当て</text>
    <text x="256" y="643" text-anchor="middle" font-size="19" fill="#1F3A5F">画面・ファイルを仲介する</text>
    <text x="256" y="674" text-anchor="middle" font-size="17" fill="#4A5D78">たとえ：厨房の責任者</text>
  </g>
  <g>
    <rect x="452" y="515" width="332" height="175" rx="14" fill="#E9F9EF" stroke="#16A34A" stroke-width="2"/>
    <text x="470" y="543" font-size="16" font-weight="800" fill="#166534">✓ 質問で挙げたもの</text>
    <text x="618" y="583" text-anchor="middle" font-size="26" font-weight="800" fill="#1F3A5F">python3</text>
    <text x="618" y="617" text-anchor="middle" font-size="19" fill="#1F3A5F">コードを読んで</text>
    <text x="618" y="643" text-anchor="middle" font-size="19" fill="#1F3A5F">代わりに動く</text>
    <text x="618" y="674" text-anchor="middle" font-size="17" fill="#4A5D78">たとえ：レシピを読める頭</text>
  </g>
  <g>
    <rect x="814" y="515" width="332" height="175" rx="14" fill="#F3EEFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="832" y="543" font-size="16" font-weight="800" fill="#5B21B6">＋ 追加で必要</text>
    <text x="980" y="583" text-anchor="middle" font-size="26" font-weight="800" fill="#1F3A5F">あなたのコード</text>
    <text x="980" y="617" text-anchor="middle" font-size="19" fill="#1F3A5F">hello.py など</text>
    <text x="980" y="643" text-anchor="middle" font-size="19" fill="#1F3A5F">何をするかの指示書</text>
    <text x="980" y="674" text-anchor="middle" font-size="17" fill="#4A5D78">たとえ：レシピ</text>
  </g>
  <g>
    <rect x="1176" y="515" width="332" height="175" rx="14" fill="#F5F8FC" stroke="#C9D6E8" stroke-width="2"/>
    <text x="1194" y="543" font-size="16" font-weight="800" fill="#4A5D78">python3 に同梱</text>
    <text x="1342" y="583" text-anchor="middle" font-size="26" font-weight="800" fill="#1F3A5F">ライブラリ</text>
    <text x="1342" y="617" text-anchor="middle" font-size="19" fill="#1F3A5F">print などの部品集</text>
    <text x="1342" y="643" text-anchor="middle" font-size="19" fill="#1F3A5F">普段は意識しなくてよい</text>
    <text x="1342" y="674" text-anchor="middle" font-size="17" fill="#4A5D78">たとえ：調理器具</text>
  </g>

  <!-- ===== Minimum set ===== -->
  <rect x="60" y="735" width="1480" height="130" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="800" y="770" text-anchor="middle" font-size="20" fill="#4A5D78">プログラムを動かす最小構成</text>
  <text x="800" y="812" text-anchor="middle" font-size="34" font-weight="800" fill="#1F3A5F">CPU ＋ メモリ ＋ ストレージ ＋ OS ＋ python3 ＋ コード</text>
  <text x="800" y="846" text-anchor="middle" font-size="18" fill="#4A5D78">※ ターミナル（zsh）や Dock は「起動を頼む窓口」。OSに伝える手段が何かあれば、必須ではない</text>
</svg>
