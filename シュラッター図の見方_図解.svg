<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1600" height="900" fill="#F5F8FC"/>
<text x="800" y="60" font-size="44" font-weight="800" fill="#1F3A5F" text-anchor="middle">シュラッター図の見方</text>
<text x="800" y="98" font-size="22" font-weight="400" fill="#4A5D78" text-anchor="middle">横は時間、たては金額。かたむきが「率」で、たての差が「差異」(※ 横軸の間隔は比率どおりではありません)</text>
<rect x="40" y="120" width="500" height="652" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
<rect x="64" y="140" width="88" height="34" rx="17" fill="#E9EEF6"/>
<text x="108" y="164" font-size="17" font-weight="800" fill="#1F3A5F" text-anchor="middle">STEP 1</text>
<text x="166" y="165" font-size="23" font-weight="800" fill="#1F3A5F" text-anchor="start">図の骨組みを知る</text>
<polygon points="90,385 480,385 480,235" fill="#E8F1FE"/>
<rect x="90" y="385" width="390" height="150" fill="#E6F6EC"/>
<rect x="90" y="385" width="390" height="150" fill="none" stroke="#1F3A5F" stroke-width="2.5"/>
<line x1="90" y1="235" x2="90" y2="385" stroke="#1F3A5F" stroke-width="2.5"/>
<line x1="90" y1="385" x2="510" y2="385" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="90" y1="385" x2="480" y2="235" stroke="#1F3A5F" stroke-width="3"/>
<line x1="90" y1="385" x2="480" y2="535" stroke="#1F3A5F" stroke-width="3"/>
<line x1="480" y1="235" x2="480" y2="385" stroke="#9DB0C9" stroke-width="2" stroke-dasharray="6 6"/>
<text x="348" y="350" font-size="19" font-weight="800" fill="#1F6FEB" text-anchor="start">変動費</text>
<text x="102" y="283" font-size="15" font-weight="700" fill="#1F6FEB" text-anchor="start">かたむき = 変動費率 @900</text>
<text x="348" y="425" font-size="19" font-weight="800" fill="#16A34A" text-anchor="start">固定費</text>
<text x="104" y="492" font-size="15" font-weight="700" fill="#16A34A" text-anchor="start">かたむき = 固定費率 @600</text>
<text x="104" y="518" font-size="15" font-weight="700" fill="#16A34A" text-anchor="start">高さ = 固定費予算 3,600,000円</text>
<circle cx="480" cy="385" r="6" fill="#1F3A5F"/>
<text x="480" y="558" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">基準操業度</text>
<text x="480" y="578" font-size="16" font-weight="800" fill="#1F3A5F" text-anchor="middle">6,000h</text>
<text x="90" y="558" font-size="15" font-weight="700" fill="#4A5D78" text-anchor="middle">0</text>
<text x="68" y="624" font-size="16" font-weight="400" fill="#1F3A5F" text-anchor="start">横軸は操業度(時間)。右端が基準操業度 6,000h</text>
<text x="68" y="652" font-size="16" font-weight="400" fill="#1F3A5F" text-anchor="start">上の三角形 = 変動費。かたむきが変動費率 @900</text>
<text x="68" y="680" font-size="16" font-weight="400" fill="#1F3A5F" text-anchor="start">下の長方形 = 固定費予算 3,600,000円(高さは一定)</text>
<text x="68" y="708" font-size="16" font-weight="400" fill="#1F3A5F" text-anchor="start">下の斜線 = 固定費の配賦額。かたむきが固定費率 @600</text>
<text x="68" y="736" font-size="16" font-weight="400" fill="#4A5D78" text-anchor="start">固定費率 = 3,600,000 ÷ 6,000h(右端で予算と一致)</text>
<rect x="550" y="120" width="500" height="652" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
<rect x="574" y="140" width="88" height="34" rx="17" fill="#E9EEF6"/>
<text x="618" y="164" font-size="17" font-weight="800" fill="#1F3A5F" text-anchor="middle">STEP 2</text>
<text x="676" y="165" font-size="23" font-weight="800" fill="#1F3A5F" text-anchor="start">たて線で金額を読む</text>
<rect x="600" y="385" width="390" height="150" fill="none" stroke="#1F3A5F" stroke-width="2.5"/>
<line x1="600" y1="235" x2="600" y2="385" stroke="#1F3A5F" stroke-width="2.5"/>
<line x1="600" y1="385" x2="1020" y2="385" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="600" y1="385" x2="990" y2="235" stroke="#1F3A5F" stroke-width="3"/>
<line x1="600" y1="385" x2="990" y2="535" stroke="#1F3A5F" stroke-width="3"/>
<line x1="990" y1="235" x2="990" y2="385" stroke="#9DB0C9" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="800" y1="308.0769230769231" x2="800" y2="461.9230769230769" stroke="#1F3A5F" stroke-width="6" stroke-linecap="round"/><line x1="791" y1="308.0769230769231" x2="809" y2="308.0769230769231" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round"/><line x1="791" y1="461.9230769230769" x2="809" y2="461.9230769230769" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round"/>
<line x1="890" y1="273.46153846153845" x2="890" y2="535" stroke="#1F6FEB" stroke-width="6" stroke-linecap="round"/><line x1="881" y1="273.46153846153845" x2="899" y2="273.46153846153845" stroke="#1F6FEB" stroke-width="4" stroke-linecap="round"/><line x1="881" y1="535" x2="899" y2="535" stroke="#1F6FEB" stroke-width="4" stroke-linecap="round"/>
<circle cx="776" cy="350" r="11" fill="#1F3A5F"/><text x="776" y="355" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="914" cy="440" r="11" fill="#1F6FEB"/><text x="914" y="445" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="800" cy="385" r="6" fill="#1F3A5F"/>
<text x="800" y="558" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">標準操業度</text>
<text x="800" y="578" font-size="16" font-weight="800" fill="#1F3A5F" text-anchor="middle">5,100h</text>
<circle cx="890" cy="385" r="6" fill="#1F3A5F"/>
<text x="890" y="558" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">実際操業度</text>
<text x="890" y="578" font-size="16" font-weight="800" fill="#1F3A5F" text-anchor="middle">5,350h</text>
<circle cx="990" cy="385" r="6" fill="#1F3A5F"/>
<text x="990" y="558" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">基準操業度</text>
<text x="990" y="578" font-size="16" font-weight="800" fill="#1F3A5F" text-anchor="middle">6,000h</text>
<circle cx="589" cy="618" r="11" fill="#1F3A5F"/><text x="589" y="623" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="608" y="624" font-size="16" font-weight="700" fill="#1F3A5F" text-anchor="start">標準配賦額 = 7,650,000</text>
<text x="608" y="650" font-size="15" font-weight="400" fill="#4A5D78" text-anchor="start">@1,500 × 5,100h(上の線から下の斜線まで)</text>
<circle cx="589" cy="674" r="11" fill="#1F6FEB"/><text x="589" y="679" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="608" y="680" font-size="16" font-weight="700" fill="#1F6FEB" text-anchor="start">予算許容額 = 8,415,000</text>
<text x="608" y="706" font-size="15" font-weight="400" fill="#4A5D78" text-anchor="start">@900 × 5,350h + 3,600,000(上の線から長方形の底まで)</text>
<text x="578" y="736" font-size="15" font-weight="400" fill="#4A5D78" text-anchor="start">実際発生額 8,390,000 は図に出ないので、横にメモしておく</text>
<rect x="1060" y="120" width="500" height="652" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
<rect x="1084" y="140" width="88" height="34" rx="17" fill="#E9EEF6"/>
<text x="1128" y="164" font-size="17" font-weight="800" fill="#1F3A5F" text-anchor="middle">STEP 3</text>
<text x="1186" y="165" font-size="23" font-weight="800" fill="#1F3A5F" text-anchor="start">たての差が差異になる</text>
<polygon points="1310,308.0769230769231 1400,308.0769230769231 1400,273.46153846153845" fill="#F1E9FE"/>
<polygon points="1310,461.9230769230769 1400,461.9230769230769 1400,496.53846153846155" fill="#F1E9FE"/>
<polygon points="1400,496.53846153846155 1500,535 1400,535" fill="#FDEDE3"/>
<rect x="1110" y="385" width="390" height="150" fill="none" stroke="#1F3A5F" stroke-width="2.5"/>
<line x1="1110" y1="235" x2="1110" y2="385" stroke="#1F3A5F" stroke-width="2.5"/>
<line x1="1110" y1="385" x2="1530" y2="385" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="1110" y1="385" x2="1500" y2="235" stroke="#1F3A5F" stroke-width="3"/>
<line x1="1110" y1="385" x2="1500" y2="535" stroke="#1F3A5F" stroke-width="3"/>
<line x1="1500" y1="235" x2="1500" y2="385" stroke="#9DB0C9" stroke-width="2" stroke-dasharray="6 6"/>
<g stroke="#9DB0C9" stroke-width="2" stroke-dasharray="6 6"><line x1="1310" y1="308.0769230769231" x2="1310" y2="535"/><line x1="1400" y1="308.0769230769231" x2="1400" y2="461.9230769230769"/><line x1="1310" y1="308.0769230769231" x2="1400" y2="308.0769230769231"/><line x1="1310" y1="461.9230769230769" x2="1400" y2="461.9230769230769"/></g>
<line x1="1400" y1="273.46153846153845" x2="1400" y2="308.0769230769231" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
<line x1="1400" y1="461.9230769230769" x2="1400" y2="496.53846153846155" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
<line x1="1400" y1="496.53846153846155" x2="1400" y2="535" stroke="#C2410C" stroke-width="6" stroke-linecap="round"/>
<line x1="1400" y1="265.46153846153845" x2="1400" y2="247.46153846153845" stroke="#1F6FEB" stroke-width="2"/>
<circle cx="1400" cy="237.46153846153845" r="11" fill="#1F6FEB"/><text x="1400" y="242.46153846153845" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="1422" cy="290.7692307692308" r="11" fill="#7C3AED"/><text x="1422" y="295.7692307692308" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="1422" cy="477.2307692307692" r="11" fill="#7C3AED"/><text x="1422" y="482.2307692307692" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="1422" cy="519.7692307692307" r="11" fill="#C2410C"/><text x="1422" y="524.7692307692307" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="1310" cy="385" r="6" fill="#1F3A5F"/>
<text x="1310" y="558" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">標準操業度</text>
<text x="1310" y="578" font-size="16" font-weight="800" fill="#1F3A5F" text-anchor="middle">5,100h</text>
<circle cx="1400" cy="385" r="6" fill="#1F3A5F"/>
<text x="1400" y="558" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">実際操業度</text>
<text x="1400" y="578" font-size="16" font-weight="800" fill="#1F3A5F" text-anchor="middle">5,350h</text>
<circle cx="1500" cy="385" r="6" fill="#1F3A5F"/>
<text x="1500" y="558" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">基準操業度</text>
<text x="1500" y="578" font-size="16" font-weight="800" fill="#1F3A5F" text-anchor="middle">6,000h</text>
<circle cx="1099" cy="618" r="11" fill="#1F6FEB"/><text x="1099" y="623" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="1118" y="624" font-size="15" font-weight="800" fill="#1F6FEB" text-anchor="start">予算差異</text>
<text x="1232" y="624" font-size="15" font-weight="400" fill="#1F3A5F" text-anchor="start">予算許容額 − 実際発生額</text>
<text x="1538" y="624" font-size="16" font-weight="800" fill="#1F6FEB" text-anchor="end">+25,000</text>
<circle cx="1099" cy="646" r="11" fill="#7C3AED"/><text x="1099" y="651" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="1118" y="652" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="start">変動費能率差異</text>
<text x="1232" y="652" font-size="15" font-weight="400" fill="#1F3A5F" text-anchor="start">@900 ×(5,100h − 5,350h)</text>
<text x="1538" y="652" font-size="16" font-weight="800" fill="#7C3AED" text-anchor="end">△225,000</text>
<circle cx="1099" cy="674" r="11" fill="#7C3AED"/><text x="1099" y="679" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1118" y="680" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="start">固定費能率差異</text>
<text x="1232" y="680" font-size="15" font-weight="400" fill="#1F3A5F" text-anchor="start">@600 ×(5,100h − 5,350h)</text>
<text x="1538" y="680" font-size="16" font-weight="800" fill="#7C3AED" text-anchor="end">△150,000</text>
<circle cx="1099" cy="702" r="11" fill="#C2410C"/><text x="1099" y="707" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1118" y="708" font-size="15" font-weight="800" fill="#C2410C" text-anchor="start">操業度差異</text>
<text x="1232" y="708" font-size="15" font-weight="400" fill="#1F3A5F" text-anchor="start">@600 ×(5,350h − 6,000h)</text>
<text x="1538" y="708" font-size="16" font-weight="800" fill="#C2410C" text-anchor="end">△390,000</text>
<line x1="1088" y1="722" x2="1538" y2="722" stroke="#C9D6E8" stroke-width="1.5"/>
<text x="1088" y="748" font-size="15" font-weight="400" fill="#4A5D78" text-anchor="start">合計 = 標準配賦額 − 実際発生額</text>
<text x="1538" y="748" font-size="16" font-weight="800" fill="#1F3A5F" text-anchor="end">△740,000</text>
<rect x="40" y="786" width="1520" height="88" rx="24" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"/>
<rect x="68" y="811" width="180" height="38" rx="19" fill="#E9EEF6"/>
<text x="158" y="837" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle">4分法とのつながり</text>
<text x="270" y="824" font-size="20" font-weight="500" fill="#1F3A5F" text-anchor="start">②と③を合わせたものが能率差異 △375,000(標準配賦率 @1,500 でまとめて計算できる)。</text>
<text x="270" y="856" font-size="20" font-weight="400" fill="#4A5D78" text-anchor="start">④を予算操業度 5,200h で分けると、予算操業度差異 +90,000 と予想遊休能力差異 △480,000 になる。</text>
</svg>
