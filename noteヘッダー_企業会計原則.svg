<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif">
  <!-- 書き出し:Chromeヘッドレスでこのファイルを開き、1280×670・倍率2で撮る(フォントはGoogle Fontsから読み込む) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=block');
    .dg{font-family:'Dela Gothic One','Hiragino Sans',sans-serif}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#252B52"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A66"/>
      <stop offset="0.2" stop-color="#FF9F4A"/>
      <stop offset="0.38" stop-color="#FFC94A"/>
      <stop offset="0.56" stop-color="#5FCB6D"/>
      <stop offset="0.72" stop-color="#3DC4F0"/>
      <stop offset="0.86" stop-color="#9A85FF"/>
      <stop offset="1" stop-color="#FF66A8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="670" fill="url(#bg)"/>
  <circle cx="60" cy="30" r="150" fill="#E3A300" opacity="0.10"/>
  <circle cx="1250" cy="660" r="200" fill="#6B50DA" opacity="0.16"/>
  <circle cx="700" cy="700" r="110" fill="#0FA18D" opacity="0.12"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="640" cy="90" r="4"/><circle cx="664" cy="90" r="4"/><circle cx="688" cy="90" r="4"/>
    <circle cx="640" cy="114" r="4"/><circle cx="664" cy="114" r="4"/><circle cx="688" cy="114" r="4"/>
  </g>

  <!-- 左:テキスト -->
  <rect x="80" y="96" width="280" height="48" rx="24" fill="#fff" fill-opacity="0.14"/>
  <text x="220" y="129" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">簿記1級 | 会計学</text>

  <text x="80" y="252" class="dg" font-size="82" fill="#fff">企業会計原則</text>
  <text x="80" y="362" class="dg" font-size="100" fill="url(#rainbow)">出題マップ</text>

  <text x="80" y="428" font-size="28" font-weight="700" fill="#fff" opacity="0.95">一般原則7つと注解・表示を、図と仕訳で</text>

  <g font-size="22" font-weight="900" text-anchor="middle">
    <rect x="80" y="462" width="172" height="50" rx="25" fill="#fff"/>
    <text x="166" y="495" fill="#AE560C">穴埋めモード</text>
    <rect x="266" y="462" width="196" height="50" rx="25" fill="#fff"/>
    <text x="364" y="495" fill="#1D5DB3">ミニテスト33問</text>
    <rect x="476" y="462" width="150" height="50" rx="25" fill="#fff"/>
    <text x="551" y="495" fill="#287534">○×70問</text>
  </g>

  <text x="80" y="582" font-size="20" font-weight="500" fill="#fff" opacity="0.8">図解つき・登録不要の無料Webページ</text>

  <!-- 右:一般原則の体系(色と番号) -->
  <path d="M985 214 V240 M841 240 H1129 M841 240 V262 M985 240 V262 M1129 240 V262" stroke="#fff" stroke-opacity="0.35" stroke-width="3" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="855" y="96" width="260" height="118" rx="24" fill="#E3A300"/>
  </g>
  <text x="922" y="178" text-anchor="middle" class="dg" font-size="60" fill="#fff">一</text>
  <text x="1036" y="150" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">真実性</text>
  <text x="1036" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" opacity="0.9">最高規範</text>

  <g filter="url(#shadow)">
    <rect x="776" y="262" width="130" height="130" rx="22" fill="#0FA18D"/>
    <rect x="920" y="262" width="130" height="130" rx="22" fill="#E8543F"/>
    <rect x="1064" y="262" width="130" height="130" rx="22" fill="#2F7DE1"/>
    <rect x="776" y="406" width="130" height="130" rx="22" fill="#3FA34D"/>
    <rect x="920" y="406" width="130" height="130" rx="22" fill="#6B50DA"/>
    <rect x="1064" y="406" width="130" height="130" rx="22" fill="#D9367D"/>
  </g>
  <g text-anchor="middle" fill="#fff">
    <text x="841" y="334" class="dg" font-size="52">二</text>
    <text x="841" y="370" font-size="18" font-weight="900">正規の簿記</text>
    <text x="985" y="334" class="dg" font-size="52">三</text>
    <text x="985" y="370" font-size="18" font-weight="900">資本・損益</text>
    <text x="1129" y="334" class="dg" font-size="52">四</text>
    <text x="1129" y="370" font-size="18" font-weight="900">明瞭性</text>
    <text x="841" y="478" class="dg" font-size="52">五</text>
    <text x="841" y="514" font-size="18" font-weight="900">継続性</text>
    <text x="985" y="478" class="dg" font-size="52">六</text>
    <text x="985" y="514" font-size="18" font-weight="900">保守主義</text>
    <text x="1129" y="478" class="dg" font-size="52">七</text>
    <text x="1129" y="514" font-size="18" font-weight="900">単一性</text>
  </g>

  <text x="985" y="590" text-anchor="middle" font-size="24" font-weight="700" fill="#fff" opacity="0.85" letter-spacing="6">真・正・資・明・継・保・単</text>
</svg>
